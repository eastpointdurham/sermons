ranscript\n\nGood morning, church. My name's Jimmy. Please join me in reading aloud this prayer for illumination. The words will be on the screen.\n\nYou promised mercy. You promised never to break your covenant with us. In the midst of the multitude of words in our daily lives, speak your eternal word to us that we may respond to your gracious promises with faithfulness, service, and love. Amen.\n\nPlease remain standing as you are able for the reading of God's word from Isaiah chapter 40, verses 9 through 11 and 27 through 31.\n\nYou who bring good news to Zion, go up on a high mountain. You who bring good news to Jerusalem, lift up your voice with a shout. Lift it up, do not be afraid. Say to the towns of Judah, \"Here is your God. See, the sovereign Lord comes with power, and he rules with a mighty arm. See, his reward is with him, and his recompense accompanies him. He tends his flock like a shepherd. He gathers the lambs in his arms and carries them close to his heart. He gently leads those that have young.\n\nWhy do you complain, Jacob? Why do you say, \"Israel, my way is hidden from the Lord. My cause is disregarded by my God.\" Do you not know? Have you not heard? The Lord is the everlasting God, the creator of the ends of the earth. He will not grow tired or weary, and his understanding no one can fathom. He gives strength to the weary and increases the power of the weak.\n\nEven young men grow tired and weary, and young men stumble and fall, but those who hope in the Lord will renew their strength. They will soar on wings like eagles. They will run and not grow weary. They will walk and not faint.\n\nThis is the word of the Lord. Thanks be to God. At this time, we'll dismiss the kids in the Adventurers class. Amen. You may be seated.\n\nGood morning, Eastpoint Church. If I haven't gotten the chance to meet you yet, my name is Peter. I have the joy of serving as lead pastor here, and what a joy it is to worship together this morning. If you're new, when you walked in, you should have received a welcome bag. In that welcome bag is a little connect card. We would love to connect with you, welcome you, and help you get connected into the life of our church. We're a new church plant here in East Durham, and it is our heartbeat to point a hurting world to hope in Jesus. We are grateful you're here because we want to invite you into that.\n\nIt was the summer of 2013. Mary and I were living on the North Shore of Boston on the campus of Gordon-Conwell Theological Seminary. It's a beautiful campus, formerly a Catholic retreat center, built on a tall hill. The main building sits at the top, and apartments spread through the vast forest that surrounded the foot of the hill. Between where we lived and the main campus was a vast open field. It was here that I found myself taking an evening walk. The New England summer night was crisp and cool.\n\nAs I walked slowly and aimlessly through the open field, my heart was racing and my chest felt tight. Anxiety rushed through my veins. Tears poured down my face. I vividly remember pausing in the middle of the field, staring at the canvas of darkness above me, feeling as if the space between my tear-filled eyes and the star-filled sky somehow captured the distance I felt that night between me and God.\n\nThe words of Israel in Isaiah 40:27 were on my mind, but they could have come out of my lips that night: \"My way is hidden from the Lord. My cause is disregarded by God.\" It was the first season of my marriage where the decline of Mary's health because of her cystic fibrosis felt like too much to handle. Weary would be the best word to describe what I felt that night.\n\nI wonder if you've been there. A moment or season of life where God felt distant or your heart felt weary. Have you ever felt invisible to God? Some of you this morning are going through health challenges of your own. Some of you are facing the health challenges of loved ones. Some of you are navigating broken relationships. Some of you are navigating the loneliness of lost relationships. Some of you have longings in your soul, and they're good longings in line with God's good design. If you're honest, it feels like God is disregarding those longings.\n\nThat's what we're told in Isaiah 40:27—that the nation of Israel was feeling exactly this. I can only imagine their experience. They've been invaded by a foreign army. The temple, the center of their religious identity, has been destroyed. They're taken to another country where foreign gods are boasted as more powerful than their God. As the years went on in exile, God felt more distant and his people felt more and more weary.\n\nThe question I have for us this morning, and I believe it's the question embedded in this chapter of scripture—in Isaiah chapter 40—and I believe the Spirit of God wants to speak to us through this text is this: What does hope look like when we can't see God and it feels like God doesn't see us?\n\nThis is a pivotal moment in the book of Isaiah. We're in a sermon series called \"Good News in Uncertain Times,\" where we're exploring this theme of hope throughout the book of Isaiah. In the first 39 chapters, Isaiah communicates that sin has consequences. There's an overarching theme of judgment throughout chapters 1 through 39. But chapter 40 is a decisive turning point. As we looked at last week in Isaiah chapter 30, God's grace will always outrun his people's rebellion. He will never leave his people without hope. Chapter 40 marks the turning point in the book of Isaiah where the theme shifts from judgment to hope. In fact, Isaiah 40 begins with the words, \"Comfort, comfort my people.\" That is the turning point.\n\nAs we think about what hope looks like when we cannot see God and when it feels like God can't see us, Isaiah 40 tells us this morning that hope is an act of remembering. The invitation of this passage is: when you can't see God, recall who God is.\n\nLook at verse 28, which Jimmy just read for us: \"Do you not know? Have you not heard? The Lord is the everlasting God, the creator of the heavens and the earth. He will not grow tired or weary, and his understanding no one can fathom.\" These questions—\"Do you not know? Have you not heard?\"—are the same questions we see back in verse 21: \"Do you not know? Have you not heard? Has it not been told to you from the beginning? Have you not understood since the earth was founded?\"\n\nIn other words, the message of Isaiah 40 is that holding on to hope when it feels like we can't see God and it feels like God can't see us is nothing new. As I sat with this passage this week and asked, \"What is the word that God has for our people today?\" I was reflecting on how this is much like what I do with my four-year-old. I'm always saying to him, \"What have I told you about keeping your hands to yourself? What have I told you about getting your pee in the toilet?\" There are all these things where I'm not trying to tell him something new. I'm trying to jog his memory of what he already knows.\n\nHope is an act of remembrance. It's an act of recalling what we know is true of God even when we can't see it.\n\nSo what does Isaiah 40 tell us about who God is? First, God is inexhaustibly powerful. Notice verse 28 again: \"He will not grow tired or weary.\" My four-year-old doesn't seem to grow tired or weary. He wants to play baseball all day long. He wants to play catch. Often I'll say to him, \"Buddy, I have to sit down,\" and he asks, \"Why, Dad?\" The reality is that even my four-year-old gets tired by the end of the day. He grows weary. But God does not.\n\nCan I encourage you with something this morning? Some of you feel weary with God. You feel weary of God. I want to encourage you with this: He is not wearied by your weariness. You cannot exhaust our God. Even when you feel exhausted and weary, He is inexhaustibly powerful.\n\nLook at verse 10: \"The sovereign Lord comes with power. He rules with a mighty arm.\" Verse 26 says, \"Lift up your eyes and look to the heavens. Who created all of these? He who brings out the starry host one by one and calls forth each of them by name because of his great power and mighty strength. Not one of them is missing.\"\n\nThe message of Isaiah 40 is that holding on to hope looks like remembering what you know is true. Sometimes you need to be reminded. I remember that night in 2013, standing in that grassy field, feeling those emotions. It would take me years before I could identify it as anxiety—this visceral reaction to the tension I feel in this broken world. I remember looking at the stars and feeling like God was distant. But something reminded me that night that not one of those stars is missing because of God's great power. There is something about hope that is an act of remembrance, of recalling what we know is true of God: that he is inexhaustibly powerful and not only that, he's incomparably great.\n\nLook at verses 12 through 14. Verse 12 says, \"Who has measured the waters in the hollow of his hand? Or with the breadth of his hand marked off the heavens? Who has held the dust of the earth in a basket or weighed the mountains on the scales and the hills in a balance? Who can fathom the spirit of the Lord or instruct the Lord as his counselor? Whom did the Lord consult to enlighten him? And who taught him the right way? Who was it that taught him knowledge and who showed him the path of understanding?\"\n\nA few verses later, verse 18 asks, \"With whom then will you compare God?\" God is incomparably great. Hope, when we can't see God, is reminding ourselves: this is who our God is. The implication to the people of Israel in Isaiah 40 is that you know this. And when you don't see it, what do you have to do? You recall it. You tell yourself again and again.\n\nWhy do we sing together on Sunday mornings? Why do we sing these lyrics? \"You will always be holy. Your name is the greatest. Your name is the highest. Your name stands above them all.\" Worship is an act of remembrance. When we do that corporately, there's something really powerful about it. You could go in your car on the way home and put on Spotify the songs that we sang this morning and sing them yourself. But if you're like me, there are many Sundays I show up in this space and I don't feel that. I need a community of people around me who can speak an act of remembrance into my own soul. That is why we sing corporately as a church.\n\nAs we see in Isaiah 40, hope is an act of remembrance. God is inexhaustibly powerful and incomparably great. But there's more, because that often feels really distant. In theological terms, we talk about the transcendence of God—that he is higher than our thoughts can comprehend, that he existed before time began, that he has always existed. Our heads start to hurt and the transcendence of God often makes God feel distant.\n\nBut here's what Isaiah 40 tells us: God is not only inexhaustibly powerful and incomparably great, but he is intimately relational. Look at how this chapter starts: \"Comfort, comfort my people.\" Notice the pronouns. Not \"y'all,\" but \"my people.\" Who says this? Not just God. Not just some distant God. Not some far away deity to whom you pray as if he is some genie in a bottle. Your God. God is intimately relational.\n\nLook at verse 11: \"He tends his flock like a shepherd. He gathers the lambs into his arms and carries them close to his heart. He gently leads those who have young.\"\n\nThis is what hope is. It is an act of remembrance that not only is God inexhaustibly powerful and incomparably great, but he is intimately relational and he holds you close. Even when you don't see it. That's what hope is. It is holding on to that even when you don't see it and it feels like he does not see you. God is intimately relational.\n\nBut hope is not only an act of remembrance. Hope is also an act of recalibrating—realizing our limitedness. I do grow weary. I do feel weak. Look at verse 6.\n\n# Sermon Transcript\n\nIsaiah says, \"Here am I, send me.\" He receives a new commission in verse 6. A voice says, \"Cry out.\" When Isaiah asks, \"What shall I cry?\" he is told to speak this message to the people: \"All people are like grass. All their faithfulness is like the flowers of the field. The grass withers, the flowers fall, but the breath of the Lord blows on them. Surely, the people are grass. The grass withers, the flowers fall, but the word of our God endures forever.\"\n\nHope is an act of remembering who God is—that he is inexhaustibly powerful, incomparably great, and intimately relational. When we behold a holy, glorious, inexhaustibly powerful, and incomparably great God, something recalibrates within us. We say, \"Oh, surely we are grass. We are limited.\" I thought I was something significant, but when we encounter the true greatness of God, our perspective shifts entirely.\n\nLast week we hosted an introduction to who we are as a church, and about twelve people joined us. As we went around the room sharing interesting facts about ourselves, I mentioned that I was a state champion pole vaulter—a fact I'll proudly carry on my resume till the day I die. But it's a useless skill for life. I'll never forget the high of winning the state championship my senior year of high school, and then the next week realizing I would never pole vault again. What I thought was the top of the world in that moment simply vanished. It's just a trivia fact to share in a group, but it illustrates something important: we tend to think we're great. We think we can control life and put the pieces together ourselves.\n\nI'm honest about this—even this week, when Mary's health has been struggling a bit, I feel that tension again. I find myself asking, \"What do I need to do to hold this together?\" But hope is a recalibrating. It asks: what can I compare myself to? The answer is simple: I am like grass. I am here today, gone tomorrow. Some of you know this truth intimately if you've tried to maintain a yard here in North Carolina. Come August, that grass is brown. That is us. Here today, gone tomorrow. In our limitedness, God holds out to us our greatest comfort.\n\nIsaiah begins with these words: \"Comfort, comfort my people.\" The comfort is this: you are not God. You are not inexhaustibly powerful or incomparably great. You are like a lamb that I hold close to my heart, and I will gently lead you. This is the good news of the gospel, church. You are not God. But we have a God who is not only greater than we can imagine—he is also nearer than we realize, even when we don't see it. Recalibrate your perspective.\n\nHope is an act of recalibrating because circumstances so often dictate how I see God. But what does hope do? It reverses that equation. It says, \"Let your view of God dictate how you see your circumstances.\" So often I think, \"Life is out of control. God must be distant and he must not care.\" But hope becomes this act of remembrance: He is not distant. He is inexhaustibly powerful. He is incomparably great, and he is intimately pursuing me, even when I don't see it. That recalibrates me to say, \"My view of God is going to shape how I view these circumstances.\"\n\nAt the end of this chapter, we have an incredible promise. Those who hope in the Lord will renew their strength. In Isaiah 40:31, we read: \"Those who hope in the Lord will renew their strength. They will soar on wings like eagles. They will run and not grow weary. They will walk and not be faint.\" In many ways, this final verse is an act of remembrance. We don't catch it in our common reading, but the language \"soar on wings like eagles\" is the same language God used in Exodus when he delivered his people out of Egypt. God is saying, \"Remember what I did. I'm going to do it again.\" We have a God who is faithful, and hope is holding on to that even when we don't see it.\n\nThe word for hope in Isaiah 40 is the Hebrew word *kava*, which comes from a root word *kav*—a rope. It's an interesting word because it offers a tangible picture of what hope is. Hope is holding on in the tension between what we see and what we believe. It's holding on in the tension between what we see and what we believe. How do we do that? We remember and we recalibrate. Remember and recalibrate.\n\nChurch, this is something we must do daily. When we talk about hope in the church, sometimes we speak of it in abstract terms—\"we have hope.\" But this word for hope is like a rope, and for many of us, when life is easy, we say, \"I've got hope. This is cool. This is who we are as Christians.\" But I want to suggest to us that there is a grace, an incredible gift, a comfort offered to you. There is an aspect of who God is that is only experienced when there is tension in the rope. When the storms come, when the winds blow, when there is a prayer or a longing in your heart—some of you longing for a spouse with a deep, good longing—and you ask, will that ever come? Does God see me? Is my way disregarded by my God? It is in the tension between what we see in life and what we know of God that we experience the true meaning of hope. It's holding on in the tension. That is the literal picture of this word in Hebrew.\n\nThere is grace in that. There is comfort in that. There is a gift of Jesus to you in that. Paul says it this way in Romans 5: \"We rejoice in our sufferings because suffering produces perseverance.\" What is perseverance? It is holding on when there's tension. What does perseverance produce? Perseverance produces character. And what comes next? Hope. Hope does not put us to shame because God's love has been poured into our hearts through the Holy Spirit.\n\nThe message of the gospel is found in the opening verses of Isaiah 40, perhaps the most beautiful part of the chapter. A voice cries in the wilderness: \"Prepare the way of the Lord.\" John the Baptist steps onto the scene in the gospels and declares those same words: \"Prepare the way of the Lord.\" As Isaiah continues: \"Every mountain will be made low, every valley will be raised up, and the glory of the Lord will be revealed, and all flesh will see it together.\" Here is the good news of the gospel: God breaks into the wilderness of our weariness to show us himself.\n\nWhen you can't see him, hold on. Remember. Remember that we have a God who is inexhaustibly powerful. He is not wearied by your weariness. He can handle it. He can handle your doubts. Hold on to that. Remember it. Recall it. And when you can't show up, come so that we can tell you, and we can sing those words over you. Church, this is who we are as a people. We're a people who remember the good news of Jesus and hold onto hope. Then we recalibrate accordingly.\n\nAs I stood in a field one night, I remember asking God, \"Where are you?\" In an overwhelming and really mundane way, he reminded me. I saw the stars and reflected on the greatness of the God who names them all, and by his power, not one of them is missing. I was reminded that he is here. He is here, even when I can't see him. That's what hope is. It's holding on to what we know is true even when we can't see it. Why? Because he's faithful.\n\nHere we are in Oak Grove Elementary School in 2026, and we have a risen Savior. Because the tomb is empty, we can hold on to these words: Those who hope in the Lord will renew their strength. They will mount up on wings like eagles. They will run and not grow weary. They will walk and not be faint. This is good news for us today.\n\nLet's pray together. Father, we thank you that you are inexhaustibly powerful. O Lord, I pray for any in this room this morning who feel weary. God, I pray that even as we sing, you would cause us to remember who you are and recalibrate our view of ourselves and our view of our circumstances. Lord, help us to see our circumstances in light of who you are. God, recalibrate our hearts even as we worship. We ask in Jesus' precious name. Amen.","url":"https://www.youtube.com/watch?v=JyydXvRRAhU"},{"id":"jA4QZ4C33WA","date":"2026-04-21","title":"The Empty Hope of Self-Sufficiency","scripture":"Isaiah 30","preacher":"Peter Frey","series":"Isaiah","desc":"In Isaiah 30, God warns against trusting in our own strength instead of Him. Join Pastor Peter Frey as he reveals the emptiness of self-sufficiency and the invitation to find true hope in God. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# A Sermon on Faith and Self-Sufficiency\n\nJoin me in reading aloud this prayer for illumination. The words will be on the screen. Startle us, O God, with your truth and open our hearts and minds to your wondrous love. Speak your word to us. Silence in us any voice but your own. And be with us now as we turn our attention, our minds, and our hearts to you. In Jesus Christ our Lord. Amen.\n\nPlease remain standing as you are able for the reading of God's word from Isaiah 30:15-18. This is what the sovereign Lord, the holy one of Israel, says: \"In repentance and rest is your salvation, and quietness and trust is your strength. But you would have none of it. You said, 'No, no, we will flee on horses.' Therefore, you will flee. You said, 'We will ride off on swift horses.' Therefore, your pursuers will be swift. A thousand will flee at the threat of one. At the threat of five, you will all flee away till you are left like a flagstaff on a mountaintop, like a banner on a hill. Yet the Lord longs to be gracious to you. Therefore, he will rise up to show you compassion. The Lord is a God of justice. Blessed are all who wait for him.\" This is the word of the Lord. Thanks be to God. Please be seated.\n\n---\n\nGood morning, Eastpoint Church. If I haven't had the chance to meet you, my name is Peter, and I have the joy of serving as lead pastor here. I love a good project, and a couple of weeks ago, my car presented me with one that needed attention. For about nine months, my driver door would not unlock. I could manually use the lock inside the door, but the button on my key fob wouldn't work, so I had to use the key—living in the twenty-first century with a key, no less.\n\nI was determined to figure out how to fix this door lock. I watched many YouTube videos, ordered a thirty-dollar motor on Amazon, and took my car door apart. I quickly discovered I was in over my head, but I was determined to see it through. I figured out how to replace the motor and put everything back together. I tested the lock before reassembling it, and it worked perfectly. I closed the door and discovered the handle wouldn't work. I had forgotten to reattach the handle. So I took the car door apart again, reattached the handle, and for about a day I didn't have time to complete that task. Anywhere you would see me, I was crawling through my passenger door to get into my driver seat.\n\nOver the years, I've discovered that the part of me that loves projects like this is the part that likes research and control. I like to know I have all the information before I make a decision. I like to be able to fix a problem on my own. When I'm traveling, I like to know I chose the best hotel. I like the satisfaction of fixing my own broken locks with a little help from YouTube. I like to find my own solutions to life's problems. I like to be self-sufficient.\n\nNow, you may not have the same personality as me or attempt to take a car door apart, but I think each of us can identify with the craving for self-sufficiency. This isn't just my propensity or yours. It is the story of mankind ever since the sufficiency of God was called into question in the Garden of Eden. It's the craving within each of us that wants to find security, significance, and meaning in what we can control. And that is what makes faith so stinking hard. Because faith is a relinquishing of my control. It's a laying down of my self-sufficiency. It's an acknowledgement that my security does not reside in my people, my possessions, or my productivity, but in the one who created me and calls me beloved.\n\nThat's easier said than done, because we live in a day and age of same-day shipping, next-day Netflix originals, and constant newsfeeds. It's easier than ever to unconsciously find our security, our hope, and our meaning in the clutter of immediacy, believing that what I can put my hands on is more secure than what God holds in his hands. That's where we find the kingdom of Judah in Isaiah chapter thirty.\n\nWe're walking through a series in the book of Isaiah that we've called \"Hope in Uncertain Times.\" As we walk through Isaiah, one thing we will see is that hope is an interesting thing. We all have hopes—things we put our confidence in to bring us security, significance, and meaning. But when uncertainty comes, many of those hopes reveal themselves to be empty and powerless to give us the security and significance we long for.\n\nHere in Isaiah chapter thirty, we find the people of God, the nation of Israel, to whom God made promises: \"I will bless you and make you a great nation. Here's how you follow me.\" The story of the Old Testament, repeated over and over, is God pursuing his people and saying, \"I created you to experience the goodness of who I am.\" And repeatedly, the people of God respond, \"No, I'm good. I'm going to rest in self-sufficiency.\" The book of Isaiah is no different, except it records a pinnacle moment in God's redemptive plan where God reveals to his people that their choices have consequences and judgment is coming.\n\nIn Isaiah chapter thirty, the nation of Assyria is advancing and surrounding the kingdom of Judah. Isaiah writes to this kingdom at the moment of invasion, when the people must decide where to place their hope. Repeatedly, God's message to his people has been, \"Don't put your hope in earthly powers or political alliances. Put your hope in the Lord your God.\" But we read God's words in Isaiah 30:1: \"Woe to the obstinate children, declares the Lord, to those who carry out plans that are not mine, forming an alliance but not by my spirit, heaping sin upon sin, who go down to Egypt without consulting me, who look to Pharaoh's protection, to Egypt's shade for refuge.\"\n\nIn Isaiah 30 and 31, God warns Judah about the empty hope and false security of turning to Egypt for salvation from the Assyrians. Throughout the book of Isaiah, we see something crucial: this prophecy isn't so much concerned with what the people of Israel are turning to, but rather who they are turning from. We see this picture throughout the prophets—empty cisterns and lifeless idols. It doesn't matter what the object is. If it displaces Christ as the center of my significance, meaning, and security, it's not the thing itself, but the value I'm putting on it that makes it grievous.\n\nNotice in verse one of chapter thirty that God's words to his children start not with \"Woe to obstinate children, you turn to Egypt,\" but rather \"You carry out plans that are not mine, forming an alliance but not with my spirit.\" In parallel poetic fashion, verse two fills in the blanks of Egypt and Pharaoh. But the point that this poetic parallelism highlights is crucial: Egypt was not the heart of their idolatry. Control was. The belief that what I can put my hands on is more secure than what God holds in his hand. That is the heart of idolatry—the underlying belief, or we might say hope, that what I can grasp is more secure than what God holds.\n\nAs chapter thirty unfolds, God peels back the layers of his children's trust in Egypt. And I suggest that the spirit of God wants to do in us what he does in them—peel back the layers of our own idolatry, the false hopes that so easily displace Christ at the center of our lives.\n\nIn Isaiah 30:8-17, God reveals what lies at the heart of Judah's rebellion—what lies at the heart of every child's rebellion. I'm the parent of two toddlers, and what we see God reveal here is the same thing that applies to parenting them: a refusal to listen and a refusal to rest. Any parents in this room can affirm that these two things are at the heart of most of the problems we find our children in. A refusal to listen and a refusal to rest. That's exactly what Isaiah thirty identifies as at the heart of this idolatry of control.\n\nLet's look at verses nine and ten. Isaiah 30:9-10 says: \"For these are rebellious people, deceitful children, children unwilling to listen to the Lord's instruction. They say to the seers, 'See no more visions,' and to the prophets, 'Give us no more visions of what is right. Tell us pleasant things. Prophesy illusions. Leave this way, get off the path, and stop confronting us with the holy one of Israel.'\"\n\nAs I read these words, I'm reminded of what Paul says in 2 Timothy 4: \"A time will come when people won't put up with sound doctrine. Instead, to suit their own desires, they will gather around them a great number of teachers to say what their itching ears want to hear. They will turn their ears away from the truth and turn aside to myths.\"\n\nThe people of God sought their own solutions, even from spiritual sources. Notice they go to spiritual sources and yet refuse to listen to the spirit of God himself. They sought smooth words of flattery rather than true words of freedom. How often do I do that? How often do I approach God's word the same way? I say I'm hearing, but I'm not actually listening. I seek solutions but remain unwilling to listen for answers. I say, \"God, give me self-worth, but don't make me grapple with yours. God, change the situation, but don't make me part of the solution. God, show me your glory, but don't mess with mine.\"\n\nIn the words of Mark Sayers, Australian pastor and author of \"The Disappearing Church\": \"We want the kingdom but not the king.\" Prophecy passages like this put plainly what often happens subtly and implicitly in our lives.\n\nVerse eleven reads as a quote from the people of Israel: \"Leave this way. Get off this path. Stop confronting us with the holy one of Israel.\" I wonder—is that actually what Israel said to God? Are those the exact words that came out of their mouths? Maybe. But I imagine that God is pointing out not what they actually said when they turned to Egypt, but what their actions said of their hearts.\n\nMy son Elijah, when he was little, was mesmerized by peekaboo. But when he played, he would put his hands over his ears and say \"peekaboo.\" Every time I saw him with his hands over his ears, I realized he was painting a picture of what Isaiah describes. You're saying, \"God, give us deliverance. Make our lives easier. Show us the path of life.\" But I don't actually want to hear what that is. I don't want that to confront me.\n\nNotice what verse eleven says: \"Stop confronting us with the Holy One of Israel.\" As you read through Isaiah, notice that this is the title that keeps coming up again and again—the Holy One of Israel. Last week we looked at Isaiah chapter six, where Isaiah gets a vision of the holiness of God. It's important to look back on that moment throughout Isaiah, because it grounds us in the reality that a clear vision of who God is confronts our self-sufficiency. We feel confronted by that, and notice the words of Israel: \"Stop confronting us with the Holy One of Israel.\"\n\nThe heart of rebellion—the heart of all of us, if we're honest—is this: a clear vision of the holiness of God confronts our self-sufficiency, and we don't like it.\n\n# Isaiah 30: The Invitation to Rest\n\nWe have a propensity for self-sufficiency, and behind that is a refusal to listen. But it's also a refusal to rest. This brings us to what I think is the heart of this passage in verse 15: \"This is what the sovereign Lord, the holy one of Israel says, 'In repentance and rest is your salvation. In quietness and trust is your strength. But you would have none of it.'\" As Assyria was at the doorstep of the kingdom of Judah, God's word of invitation to his people was simple: trust me. Repentance and rest, quietness and trust.\n\nThose words—rest and quiet—probably land with sweetness to your ears this morning. In our hurried and noisy lives, if you're like me, you read this verse and underline those words. You screenshot it, write it in your journal. That's good stuff. Rest and quiet are just what we need. But if rest and quiet are something our hearts long for, why were God's people so unwilling? Why are we so unwilling as well?\n\nI think it's because true rest and quietness are not simply the absence of hurry and noise. They're found in the presence of the Holy One. They're found in the presence of Jesus. Rest and quiet are not simply found by carving out space. They're found in repentance and trust. These two acts—repentance and trust—are inseparably paired to the quietness and rest that our souls long for.\n\nGod's invitation in this passage is to forsake the empty hopes of this world through a continual act of repentance. In repentance, we take a posture of trust. Trust, in definition, is the relinquishing of control. It's laying down our self-sufficiency and reorienting my life around the reality that Jesus is more powerful, more valuable, and more all-sufficient to satisfy my deepest longing for rest and life.\n\nThis is why this beautiful invitation of verse 15 is followed by the heavy words: \"But you would have none of it. You said, 'No, we'll flee on horses. Therefore, you will flee. You said, \"We will ride off on swift horses.\"'\" I like control. I like to be self-sufficient. I like to have the securities of what I can see. I like to see a certain number in my bank account. I like to tether my hope to things that I can hold onto or work toward. The enticement for safety for us today is not Egypt or the horses of Egypt, but the hustle of everyday life. It's almost never a sudden rejection of Jesus and running to other hopes, but it's usually the subtle and unintentional tethering of our hearts to anything and everything that the culture around us says will bring immediate help.\n\nBut the invitation of God this morning is repentance and rest, quietness and trust. Believing that my hope for security, significance, and meaning—and my source of strength—are not what I hold in my hands or put my hands to, but what God holds in his hands. What he puts his hands to.\n\nIn the midst of God's proclamation of judgment on Judah's plans that would fail and Egypt would be no help, we hear a word of hope. Verse 18 says, \"Yet the Lord longs to be gracious to you. Therefore, he will rise up and show you compassion. For the Lord is a God of justice. Blessed are all who wait for him.\" Though his people are stubborn and unwilling, rebellious and running to empty hopes, he waits. He longs. He earnestly desires to shower you with his grace. He goes out of his way for you to experience mercy. And just as we see woven throughout the book of Isaiah, the pronouncement of God's just judgment comes with a word of hope. God's grace will outrun his people's rebellion day after day, time after time, and his mercy will not leave his people without hope.\n\nVerse 19 says, \"People of Zion who live in Jerusalem, you will weep no more. How gracious he will be when you cry for help. And as soon as he hears, he will answer you. Although the Lord gives you the bread of adversity and the water of affliction, your teachers will be hidden no more, and your own eyes will see them. Whether you turn to the right or to the left, your ears will hear a voice behind you saying, 'This is the way, walk in it.'\"\n\nHere in Isaiah, we hear echoes of the gospel. The God who earnestly desires to show you his grace will not hide himself forever. The word would become flesh and dwell among us, and we would see our teacher. And he would say to his apprentices and disciples, \"Come to me, all you who are weary and burdened, and I will give you rest. Take my yoke upon you and learn from me, for I am gentle and humble in heart, and you will find rest for your souls. For my yoke is easy and my burden is light.\" This is the invitation of Jesus in Matthew 11, and it is simply the invitation of God in Isaiah 30: Repent from the hustle. Rest in Jesus. Quiet the noise and trust that he is our only hope for security, significance, and meaning in life.\n\nAnd he waits. He longs. He earnestly desires to shower you with his grace. He goes out of his way for you to experience his mercy. Because while we were yet sinners, Christ died for us. Justice and mercy intermingled in his final breath at the cross. So this word in Isaiah 30 is not just good news for the Israelites. It's good news for each of us today. It's not just good news for unbelievers. It's good news for you and me in the face of empty hopes, hurried lives, and constant noise.\n\nVerse 18 ends with a word of wisdom: \"Blessed are all who wait for him.\" The message of God to the Israelites is a message we all need to hear today. God is waiting for you to wait on him. He is longing to become your greatest longing. His grace and mercy are not experienced in the hurried pace of hustle, but in the slow, quiet place of waiting on God.\n\nWhat is waiting on God? That's the heart of hope. Real hope is believing that what God holds in his hands and puts his hands to is more secure than what I hold in my hands and what I put my hands to. Church, this is the invitation of hope all throughout the scriptures: God is sufficient. He is all we need. In a world surrounded by the chaotic noise of hustle, the invitation of Jesus is come and rest. In repentance and rest, in quietness and trust, will be your salvation. What is that about? It's about letting go of self-sufficiency and embracing the God, the Holy One of Israel—Jesus, who says, \"My grace is sufficient for you. I am all that you need.\"\n\nChurch, I want to encourage you. What God is inviting us to here is not just crossing the threshold of repentance and trust once. For some of you this morning, that might be the invitation. You've thought all your life that self-sufficiency is the ultimate goal of life. Maybe Jesus is confronting you this morning with the message that maybe that's not true. But for all others of you who have had that moment of repentance and trust where you said, \"Jesus is my everything,\" I want to suggest something.\n\nJust as we see woven throughout the story of God in the scriptures, it is the story in your life and mine that we need to have a daily practice of waiting on God, of repenting of our self-sufficiency and embracing the all-sufficient merit of Christ. Waiting on God is a discipline that we need for our souls. Maybe for you it looks like taking a few minutes each day to have quiet, to not fill your time with Jesus with simply what you say to him, but to listen to what he wants to say to you.\n\nThere is an invitation of Jesus here in Isaiah 30, and Jesus echoes it in Matthew 11: \"My yoke is easy and my burden is light.\" I want you to experience rest for your soul, and that rest is found in the daily grind of waiting on God, of relinquishing our power, our desire for control, and saying that what God holds in his hands and what he puts his hands to is more secure than what I hold in my hands and what I put my hands to.\n\n---\n\nJesus, we thank you that you invite us to experience your mercy and grace. Lord, I can only imagine that there are some here this morning whom you are confronting in their hearts—places of control, places of self-sufficiency—and places where your grace is reaching into the depths of weariness from that self-sufficiency. Lord, you long to show us your grace this morning. You are waiting for us to wait on you. So Lord, I pray for anyone in this room whom the Spirit of God is stirring, that they would be ready to experience your mercy and grace, to experience the quiet and rest through repentance and trust.\n\nWe confess our idolatry of control, and we confess that you are Lord. That you are worthy of it all. God, we want to quiet ourselves and wait upon you even as we respond this morning. Would you meet us in this place? Shower us with your grace. Show us the blessing of waiting on you. We pray in Jesus' name. Amen.","url":"https://www.youtube.com/watch?v=jA4QZ4C33WA"},{"id":"u-wmJo0G2WY","date":"2026-04-09","title":"Resurrection Sunday","scripture":"Luke 24:1–8","preacher":"Peter Frey","series":"Special","desc":"In Luke 24, the tomb is empty and Jesus is risen! Celebrate the resurrection and the victory over sin and death with Pastor Peter Frey as he shares the hope of new life in Christ. Experience real hope for real life this Easter at Eastpoint Church in Durham, NC.","transcript":"# Easter Morning Sermon\n\nGood morning, East Point Church. If I haven't had the chance to meet you yet, my name is Peter, and I have the joy of serving as lead pastor here at East Point. I am overjoyed and humbled that we have the opportunity to celebrate Jesus's resurrection here on our first Easter morning as a new church body.\n\nThere is a small town on the eastern shore of Maryland called Cambridge. When you cross the Chop Tank River, there's a bridge that overlooks the shore of this small town. The speed limit quickly reduces from fifty to thirty, which is emblematic of the town because every time I arrive there, it feels as if time slows down. As a child, I had the impression that everyone who lived in this small town was over the age of eighty—probably because my grandparents lived there. And to be clear, my grandparents weren't that old, but when you're six years old, anyone over sixty seems like they're living on borrowed time. Everyone over sixty this morning, you all are looking great.\n\nMary and I try to spend some time in Cambridge every summer, mostly to relive memories and connect with family. There are always a few spots in that town that I like to visit. There's a fried chicken place called Cool Ice—the place that sells ice has the best fried chicken. They also have a dog wash where you can take your dog to bathe. Talk about diversifying your business. But there's one stop that I always make on my way out of town. Right along the cobblestone street is an old Episcopal church. Behind the Episcopal church is a large cemetery. I turn onto a side street past the cemetery, and there, right behind it, is a daycare run by the church. I pull into the driveway of the daycare, go along to the back of the building, and park in the parking lot. As I get out of the car, I listen to the squeals of toddlers emerging from the bustling daycare.\n\nBehind the daycare is an oddly situated sidewalk that leads to a grassy lot, which serves as overflow for the cemetery. It's here I stop and find myself standing in front of my dad's gravestone. Fourteen years ago, I lost my dad to cancer. For fourteen years, I've made a visit to this oddly situated cemetery. Every single time I think to myself, what am I doing here? I know why I showed up, but there's an overwhelming feeling of what do I do now that I'm here? There's a feeling of helplessness and powerlessness that we all feel in the face of death. I find myself grasping for something to do, something to busy my helpless heart. I clean the bird droppings off the stone. I pull a few weeds. I take a picture on my phone—the same exact picture as the year before. And honestly, I didn't expect it to look any different.\n\nI imagine the women who visited Jesus's tomb on the third day after his death would have said the same thing: I didn't expect it to look or feel any different. Luke 24:1 tells us, \"On the first day of the week, very early in the morning, the women took spices they had prepared and went to the tomb.\" Jesus's body was laid in a tomb after his death, likely without proper preparation, because bodies decay when they die. Right after the Sabbath, the women waited for daybreak to come with their spices. They didn't have our modern embalming techniques. They would use spices to cover up the stench of death. You bring spices to a tomb to make death more tolerable. In some ways, it's the equivalent of bringing flowers to a grave. What else do you do in the face of death? Spices do two things: they make the appearance of death feel more tolerable and our powerlessness in the face of death feel more manageable.\n\nWhen we are faced with the reality of our humanity, most of us at some point feel helpless and powerless. Just this week, a new exhibit launched at a museum in London called the Welcome Collection—a museum focused on science, medicine, and the arts. The exhibit is called the Coming of Age, and it's centered around the human obsession with aging and death. The New York Times wrote this week that the notion \"we do not stay young forever has never sat right.\" But the objections seem to be getting more aggrieved, and there is a growing conviction that we can probably buy our way out of the whole thing sometime soon. The most visible spokesperson for this belief is Brian Johnson, a tech millionaire who views the aging process as an infringement on bodily autonomy. Johnson is the founder of the Don't Die movement and has a documentary on Netflix. He has publicly dedicated himself to achieving immortality or, at the very least, a quest to take his \"speed of aging to the lowest possible number.\" He says that through a rigid diet and exercise program, relentless monitoring, experimental medical interventions, and a single-minded focus on bedtime, his gospel is this: don't die. Manage it. Delay it. Avoid it. Optimize it. Make death tolerable.\n\nBut you can spend millions as he's doing, take hundreds of pills a day, track every biomarker, and still your entire hope is just \"not yet.\" When I'm confronted with the sight of a cemetery, I'm reminded that all of us are human and we live in a world marked by the painful and bitter sting of death. Sometimes we approach religion like this. We have the idea that maybe Jesus came to make death a little more tolerable. When we show up to a graveside or a funeral, maybe we could feel some comfort in that moment, almost like a band-aid does for a child. I've got a three-year-old and a four-year-old, and there is something psychologically beneficial to the band-aid company because kids are convinced that band-aids will cure anything.\n\nUsha Lee McFarland, a Pulitzer Prize-winning science and medical writer in Los Angeles, wrote about this. She says, \"Band-aids don't only contain blood and scrapes. They also seem to contain fear to the very young. They make boo-boos literally disappear.\" She goes on: \"Sorry, Johnson and Johnson. It's not the band-aids you've manufactured since the 1920s that makes cuts and scrapes feel so much better. It's the closeness, the attention, the hugs and kisses kids get when the strips are applied. You have to get close to put on a band-aid. Laps are the best. Often tears stop before the band-aid is even out of a sterile wrapper.\"\n\nI think many of us are much like my four-year-old. We sometimes mistake the band-aid for the cure. Many of us approach religion like this: \"If I can just do some things that make me feel better about life and maybe make death a little more tolerable.\" When Jesus arrived on the scene, many of the religious teachers had that mindset. If we could create a religious structure, if we do the right things, say the right things, pray the right amount of time, then maybe death would be a little more tolerable. Church, I have one message for you this morning, and it's based on the empty tomb: Jesus did not come to make death tolerable. He rose to make life possible.\n\nThis is the message of Easter. Jesus didn't come so that you can stand at a graveside and say, \"Oh, it'll be better on the other side.\" He came so that the life of heaven could break into the death and hell we feel on earth. When Jesus rose from the dead, he didn't want to offer a band-aid for your hurting heart or mine. He wanted to offer a cure. It is the love of a father who says, \"I love you so much that I will die in your place. I will take your sin, your brokenness upon myself, and I will rise three days later so that life can be possible—not so that death could be tolerable.\"\n\nSometimes in the church—and I was raised with this mentality—Easter is about where we go when we die. Because Jesus rose from the dead, your funeral can have a few fewer tears. But Jesus did not come to make death tolerable. He came and rose to make life possible. And he wants you to experience that today. This is the message of Easter.\n\nAs this passage unfolds in Luke 24, these women bring their spices and their attempts, and they are simply mourning their hope. This man had healed the sick, cleansed the leper. He had spoken to women in a way that no Middle Eastern man in that day would speak to them. They found dignity and worth in the eyes of that savior. He was dead and laid in a tomb. They were grieving, feeling that helplessness and powerlessness that we all feel in the face of death.\n\nBut notice the words that the angels say to the women in Luke 24:5. They say, \"Why do you look for the living among the dead?\" They could have said it's resurrection day. He is risen. He is risen indeed. They could have led with the good news. But they asked a question, and I think this is important because the angels are causing these women to confront something that all of us do: we try to find life in dead places. Many of us try to find life in the dead and lifeless pursuit of the praise of people, the comforts of this world, the security that a little more money in the bank account can bring. Many of us try to find life in dead religion, thinking that if I just do more things for God, I can feel better. Maybe the brokenness that I feel in this broken world will be a band-aid to my hurting heart.\n\nBut the angel said to them, \"Why do you look for the living among the dead?\" Because we have to embrace and be confronted with the reality that we are powerless. We are confronted with the reality that in the face of death, in the face of our attempts to find life, there are dead places we could turn to. And the invitation then is this: he's not here. He has risen. There is another category.\n\nI don't know what your story is this morning or what you bring in here with you. Maybe you have some religious baggage and you're thinking, \"You're telling me that a Middle Eastern peasant in the first century rose from the dead and that's supposed to mean something to me today?\" If that's you this morning, I want you to hear this. Throughout Luke 24, there are a multitude of responses to Jesus. Peter goes to the tomb. The women go first and tell everybody that Jesus rose from the dead. But it tells us that most didn't believe them. Why? Because it's nonsense. If that's you this morning and this sounds like nonsense, I'd like for you to entertain me with one thing. If it's true that Jesus is God and he rose from the dead, this changes everything.\n\nSo I'd like for you to follow this logic with me for a moment. When you are faced with the helplessness and powerlessness of death and the brokenness and hurt that we feel in this world, anything and everything that we can turn to apart from a risen savior is simply looking for the living among the dead. And the angel invites these women at the tomb to hear the words, \"He is not here. He is risen.\" The resurrection of Jesus changes everything.\n\nHere's what I want to suggest to us this morning: Religion says, \"Do this to manage your human condition.\" Jesus says, \"You can't manage it. You need me to resurrect it.\" In verses 6 through 8, Jesus invites us to realize that the promises of God are made reliable. They give the good news that Jesus rose from the dead. Then listen to what they said: \"Remember how he told you while he was still with you in Galilee. The Son of Man must be delivered over to the hands of sinners, be crucified, and on the third day be raised again.\" Then they remembered his words.\n\nHere's what Jesus is holding out to you this morning. He wants all of us to see that the promises of God are trustworthy.\n\n# Sermon Transcript\n\nHe has power to bring life from dead places. And he also wants us to hear and remember that his promises hold up. Notice that they are pointed to what Jesus had already said about his death and resurrection. This is what I believe the message throughout the scriptures is pointing us to—that the resurrection is meant to not only show us God's power over death, but that his promises are true.\n\nSo here's what I want to suggest this morning. If the idea that Jesus rose from the dead seems crazy to you and you wonder how it could make any difference in your life, consider this: if it is true that Jesus rose from the dead, then we have two thousand years of church history—a multitude of men and women, even the most ragtag group of disciples—who could have never sustained this narrative unless it was valid. We have thousands of years of people who have tasted and seen that the resurrected Jesus changes lives. And we are here this morning to sit in that reality, that he brings life from dead places.\n\nIf that is true, you can trust his promises. That's what hope is in many ways. Today is all about hope. Hope is the confidence that we have in promises that transform the present. You see, the resurrection of Jesus is a historical reality. Jesus rose from the dead. That points us to a future reality: whoever believes in him—Jesus said in John chapter eight, \"I am the resurrection and the life. Whoever believes in me will live even though they die.\"\n\nHear me again. Jesus didn't come to make death tolerable. He came to make life possible. That is future life. But the resurrection is a historical reality that points us to a future hope that we don't have to fear the grave any longer. But it also transforms the present. Jesus is breaking into the darkness of our world today. Notice that through the resurrection, he invites us into that. I often marvel at how the story unfolds after Jesus's resurrection, at all these different moments where people get the news in different ways. He tells the women to go tell the disciples. Jesus could have simply shown up and shown everybody. \"Guys, check it out. The scars. I'm risen. It happened.\" But notice this: Jesus invites the women to be part of it. He tells them, \"Go tell the disciples.\"\n\nLet me tell you this. Our deepest longing when we are confronted with the hopelessness and powerlessness of death is that our life matters. We are longing that we are loved, that we are known, and that we matter. And I want to suggest that the resurrection offers to you all of those things. There is a God who sees you in all of your messiness, all of your brokenness. He stepped into it and took it on himself and said, \"I will rise.\" That you too can rise. That by faith in me, you can experience the resurrection power. And he wants that for you this morning.\n\nThe invitation of the resurrection is to look to his power, realize his power, and remember his promises. Next week as a church, we're going to start a sermon series called \"Good News in Uncertain Times,\" where we're going to walk through the promises of God in the book of Isaiah. And we're going to look at promises that hold weight—not just because they're written in a book from long ago and far away, but because Jesus rose from the dead. Because Jesus rose from the dead, we can look back to those promises made hundreds of years before he came. Why? Because it holds weight. They're about a savior who rose from the dead. And this changes everything.\n\nThroughout Luke 24, Jesus meets two men on a road. They don't recognize him, and as he walks with them, they're grieving. They say to him, \"Have you not heard what happened? Jesus, he died. All of us were putting our hope in him,\" and they're not recognizing him. He comes and sits and has a meal with them. And it's there at that meal that it says their eyes are opened and they saw Jesus. I want to suggest to you this morning, if you are here and you've never experienced the moment where you're like, \"Oh, this whole thing about Jesus rising from the dead is not just platitudes that we recite at a funeral. This means something for me. Jesus actually loves me. He cares for me. He wants a relationship with me, and he rose to make that possible.\" Jesus is inviting you to eat with him today to experience his love, to hear his words: because I rise, you can rise too.\n\nIn 1 Corinthians 15, verse 54, it says this: \"The saying that is written will come true. Death has been swallowed up in victory. Where, O death, is your victory? Where, O death, is your sting?\"\n\nI want to share something with you. Mary and I now have two cats. It started with one that we rescued. Harry is the one we adopted when he was seven, and when we got him, he had a slew of health problems. One of which we discovered is that his gums were allergic to his teeth. So we spent significant resources to get his teeth taken out. Harry was declawed before we got him, so he has no claws and no teeth. Then Zion came into our family a couple of months ago. These two are learning to get along, but there's a lot of hissing happening as they get to know each other. Zion has teeth and claws, but he still doesn't have hair. They hiss at each other, and I just laugh whenever Harry hisses at Zion because it's this sound he makes, but it's like he can't do anything.\n\nChurch, I want you to hear this. That passage we just looked at in 1 Corinthians 15—we still have death. We still have brokenness. We still have the ripples of sin in our world today. But when we put our faith in Jesus, death loses its teeth. Jesus didn't just come to make it tolerable. He came to make life possible. And that's not a platitude we say at a funeral. It's a truth we proclaim here on Easter Sunday.\n\nChurch, we have the joy this morning of celebrating the picture of what Jesus does in our lives when we put our faith in him. I'm going to invite Bambi to come up and share her story with us. What baptism is, is a visual picture when we as followers of Jesus say, \"You know what? This changes everything. Jesus changes everything,\" and we identify with Jesus through baptism. So if you're new to the church, it might seem unusual. We are going to dunk her down into the water and bring her back out, but it's a picture for us of what Jesus has done in Bambi's life.\n\n*Bambi's testimony:*\n\nI just have a quick story about how I came to be here. I have recently left Jehovah's Witness religion. I was in it for about twenty years. The last few years, I've been feeling really tired and really burdened down by the religion. I was feeling spiritually hungry and felt a need to find Jesus and know Jesus. So I started going to local churches' websites and looking at their services on YouTube, trying to find somewhere I thought I might feel comfortable. I didn't really find anything.\n\nOne Sunday morning, I was riding past Oak Grove School and I saw Peter putting up signs for East Point Church, and something said, \"Turn around and go talk to him.\" I didn't. I kept on going. But a few days later, I was on Facebook and I saw an advertisement for East Point Church, an invitation with Peter and Mary. I thought, \"That's the guy I saw.\" So I listened to the video of the invitation, went to the East Point Church website, read their vision and story, and watched all the services on YouTube. I just started feeling really excited about Jesus and felt really drawn to come to launch day. So I asked my mother and my son if they'd be interested in checking out this new church with me.\n\nWe came to launch day and I was so nervous coming in, but everybody was so nice and so friendly and made me feel very welcomed. They have the best cookies in the little welcome bags. We have been attending ever since. I got invited to one of their weekly community groups, and going to that, I've gotten to know so many other people. Just being in that small group, able to talk about Jesus and ask questions and learn about Jesus, has been such a great environment. Now I really feel like East Point Church is my spiritual home, my spiritual family. I really feel now I understand what Matthew 11:30 means when Jesus said, \"My yoke is easy and my burden is light.\"\n\nI know now is the time I need to give my life to Jesus, and I'm doing it today as a symbol of what Jesus has done for me. He died for my sins, and he has risen so that I can live my new life. Thank you all. Praise God.\n\nI met with Bambi a few weeks ago, and part of what she shared with me—and I think you just shared it so eloquently—was, \"I was looking for life in dead places, and then I found Jesus.\" And we're going to celebrate that this morning.","url":"https://www.youtube.com/watch?v=u-wmJo0G2WY"},{"id":"jB_pE3e_gBk","date":"2026-03-31","title":"Palm Sunday","scripture":"Luke 19:28–42","preacher":"Peter Frey","series":"Special","desc":"On Palm Sunday in Luke 19, Jesus enters Jerusalem as King, welcomed with praise yet moving toward the cross. Join Pastor Peter Frey as he shares the significance of this moment and how it points to real hope for real life at Eastpoint Church in Durham, NC.","transcript":"Let's remain standing as we prepare our hearts for the reading of God's word. Join me in reading aloud this prayer for illumination. The words will be on the screen.\n\nGod, our helper, by your Holy Spirit, open our minds that as the scriptures are read and your word is proclaimed, we may be led into your truth and taught your will for the sake of Jesus Christ, our Lord. Amen.\n\nPlease remain standing as you're able for the reading of God's word from the Gospel of Luke, chapter 19, verses 28 through 42.\n\nAfter Jesus had said this, he went on ahead, going up to Jerusalem. As he approached Bethphage and Bethany at the hill he called the Mount of Olives, he sent two of his disciples, saying to them, \"Go to the village ahead of you, and as you enter it, you will find a colt tied there, which no one has ever ridden. Untie it and bring it here. If anyone asks you, 'Why are you untying it?' say, 'The Lord needs it.'\"\n\nThose who were sent ahead went and found it just as he had told them. As they were untying the colt, its owners asked them, \"Why are you untying the colt?\" They replied, \"The Lord needs it.\" They brought it to Jesus, threw their cloaks on the colt, and put Jesus on it. As he went along, people spread their cloaks on the road.\n\nWhen he came near the place where the road goes down the Mount of Olives, the whole crowd of disciples began joyfully to praise God in loud voices for all the miracles they had seen. \"Blessed is the king who comes in the name of the Lord. Peace in heaven and glory in the highest.\"\n\nSome of the Pharisees in the crowd said to Jesus, \"Teacher, rebuke your disciples.\" \"I tell you,\" he replied, \"if they keep quiet, the stones will cry out.\"\n\nAs he approached Jerusalem and saw the city, he wept over it and said, \"If you, even you, had only known on this day what would bring you peace. But now it is hidden from your eyes.\"\n\nThis is the word of the Lord. Amen.\n\nChurch, you may be seated.\n\nIt's good to be back with you, East Point Church. Last week I had the joy of preaching at one of our partner churches in Cary, The Point Church. They send their love and greetings. As our volunteers huddled this morning, I shared this with them, and I'll share it with all of you: multiple times over the course of the morning, somebody came up to me and said, \"It's so good to put a face to your name. We've been praying for you.\" It's such a beautiful picture. As we celebrate our first Holy Week as a church, we're reminded of this reality that it's so much bigger than us. We aren't here for East Point Church. We aren't here to build our kingdom. We are here because Jesus is king across Durham, across the triangle, and across the globe.\n\nThere is something rich about celebrating and joining together in our first Holy Week as a church. Each year as we come to Holy Week, there's something sobering about it: we are joining with followers of Jesus throughout generations and across the globe in celebrating these events that change everything. Jesus' life, death, and resurrection changes everything. So as we journey this week to sit in the significance of Jesus' journey to the cross and anticipate with sobering expectation the celebration and meaning of Resurrection Sunday, we turn this morning to Luke chapter 19, the passage that Meg just read for us, verses 28 through 42.\n\nAdventures kids, you can head to your Adventures classes now.\n\nHere in Luke chapter 19, we meet Jesus on his way to Jerusalem. As we read the gospel narratives, it can be easy to get lost in the journey from one city or village to another. I've been reading through the Gospel of Luke in my daily Bible reading, and sometimes it can feel like Jesus and his disciples travel from one place to another as if they're just going wherever the road might lead. But in Luke's gospel, he makes it clear that the journey Jesus takes through his earthly ministry is not an aimless wandering. It's a purposeful path with a destination and timing that was determined long before the moment when Jesus enters Jerusalem in Luke 19.\n\nIf we rewind back to Luke chapter 9, verse 51, we read, \"As the time approached for him to be taken up to heaven, Jesus resolutely set out for Jerusalem.\" This is ten chapters before, earlier in Jesus' ministry. We find this decisive moment where Jesus resolutely set out for Jerusalem. This phrase is literally translated, \"He set his face toward Jerusalem.\" This is an idiom, a figure of speech, but it speaks for itself.\n\nMy three-year-old son, Gabe, when he wakes up in the morning, often has one thing on his mind. He's very into what he calls bars—these are granola bars. When he comes downstairs, he bee-lines it for the pantry. He goes straight for it and just refuses to look away. He goes, \"Bar, bar, bar.\" The image here of setting his face—I can see Gabe doing this—literally not looking away from the pantry. That figure of speech is saying there is a mission, a goal that he's setting his mind on. That's what we're told Jesus is doing in Luke chapter 9, verse 51. He resolutely sets his gaze on Jerusalem. It's describing Jesus' determination and resolution to accomplish the purpose for which he came to earth. That purpose would be accomplished in a certain place at a certain time—in Jerusalem during the week of Passover.\n\nThroughout Luke's gospel from chapter 9 to chapter 19, which we're looking at this morning, we see this repeated comment. Luke 13:22 says, \"Jesus made his way to Jerusalem.\" Luke 17:11 says, \"Jesus on his way to Jerusalem.\" Luke 18:31 says, \"He tells his disciples, we are going to Jerusalem.\" So we come to Luke chapter 19, and we find the words that open our passage in verse 28: \"And when he had said these things, he went on ahead, going up to Jerusalem.\" It's as if Luke is hinting at something throughout the gospel narrative—that something big is going to happen in Jerusalem. So as we read about Jesus healing the blind man, raising the sick girl, resurrecting the dead man, just wait till Jesus gets to Jerusalem.\n\nI'm guessing that Jesus' disciples and those who were following him didn't question Jesus' talk about Jerusalem. By this point in Jesus' earthly ministry, they were putting the pieces together that Jesus isn't just another religious teacher. He is not just a revolutionary who talks a big talk. He's the expected Messiah, the king like David whom God had promised would establish an eternal kingdom of peace and justice. Of course he would go to Jerusalem, the center of Israel's religious identity. Perhaps from within its walls, Jesus would show his power and overthrow the reign of Roman oppression. What better moment than the present for Jesus to make his platform for power? At the Passover feast, when Jerusalem, a city of approximately 40,000, would swell to crowds of hundreds of thousands as Jewish families flocked to the city for the Passover celebration.\n\nImagine the scene with me. Jesus, on his way to Jerusalem, arrives at the Mount of Olives, near the village of Bethany, the place where Jesus—as we're told in John chapter 11—had raised his friend Lazarus from the dead. You can imagine the fanfare that would have accompanied Jesus' arrival in the area. I can hear the small-town chatter now: \"Did you hear about Lazarus? He was dead. They put him in the tomb. And now he's alive. All because of Jesus. And Jesus is here. He's headed to Jerusalem.\"\n\nI can see the crowds of disciples, followers, and fans of Jesus surrounding the streets as he makes his way to Jerusalem. Each person had a different reason for being there, but all in agreement that this man, this moment, was a sight to see.\n\nIt's important for us to note that there was a custom in the ancient world. When a king would enter a city like Jerusalem, he didn't simply enter it. He would make an entry—full of pomp and circumstance, with horses and chariots, dignitaries, and displays of power.\n\nDuring my time in seminary on the North Shore of Boston, I worked at a wedding venue on the weekends. Most Friday and Saturday nights, I was working at weddings in an old town hall on a historic New England green—picture Gilmore Girls with a gazebo in the middle. This town hall was converted into a wedding venue. Pretty much every Friday and Saturday night, we ran the same play: same wedding, just different colors. My role was a server, but working at an all-in-house wedding venue, you do a little bit of everything. One of the roles I really enjoyed—and had the opportunity to do most Friday and Saturday nights—was greeting people at the front door. One of the things we did to make it extra special was rolling out the red carpet as guests arrived. These weddings were often over the top, with a cocktail hour downstairs and then upstairs for fine dining. We saw all kinds of weddings—people who came in on horses down the green and then entered on the red carpet.\n\nThe wedding coordinator, who was the general manager of the venue, got engaged during my time working there. Obviously, she was planning her wedding. The question became: how does the wedding planner of wedding planners want to make an entry for her wedding? There was a lot of buzz leading up to it. I had the opportunity to work her wedding. It was the wedding of all weddings. As we seated the guests in the side garden next to the building, they were waiting for the ceremony when all of a sudden you heard a helicopter coming down. We as the servers knew this was coming, so we had an extra-long red carpet that day, rolled out to the middle of the green where the helicopter came down. What we didn't know was that the helicopter would blow the red carpet away, so we had to lay it twice. The helicopter landed, she got out, it played \"This Girl Is on Fire,\" and she made her entry into the wedding.\n\nI tell you the story because in many ways she had seen it all. Every Friday and Saturday night, she had done this for brides. She wanted to make something special. The question was: how does the bride of all brides make an entry? And the question surrounding this moment here in Luke chapter 19 is how does the king of all kings make an entry into Jerusalem?\n\nBut Jesus isn't another king. He's the king of kings. Jesus isn't another political leader; he's the Lord of all. Jesus isn't just another popular force of influence; he's the one who holds the universe together by the words of his power.\n\nSo the question surrounding this moment here in Luke 19 is: how does Jesus, the king of kings, make an entry into Jerusalem?\n\nWe read in verses 30 and 31 that Jesus tells two of his disciples, \"Go to the village ahead of you. And as you enter it, you'll find a colt tied there, which no one has ever ridden. Untie it and bring it here. If anyone asks you, 'Why are you untying it?' say, 'The Lord needs it.'\"\n\nThe disciples find it just as Jesus said. They find an unbroken colt, a young donkey, in a nearby village. It's an unusual choice for a king's vehicle to make an entry. Rather than a warhorse that would raise Jesus above the crowds, he chose a young donkey, likely too small for a grown man to respectably ride. Imagine the scene as the disciples lay their clothes on the donkey as a saddle and set Jesus on it, perhaps holding his feet off the ground so they don't drag. It's not the picture of military might that most kings would have chosen. It's a humble image of a categorically different kind of king. As one commentator observes, Jesus does not arrive on his royal highness, but his royal lowness.\n\nBut Jesus entering Jerusalem on the colt of a donkey is more than a picture of humility. It's a proclamation of his prophetic purpose. In Zechariah 9:9, five hundred years before this moment, we find this prophecy: \"Rejoice greatly, daughter of Zion. Shout, daughter of Jerusalem. See, your king comes to you, righteous and victorious, lowly, and riding on a donkey, on a colt, the foal of a donkey.\"\n\nSo Jesus comes as a categorically different kind of king. Not just any king, but the king—the long-awaited Messiah who would bring salvation, righteousness, and peace to his people. Even though we're told in John 12 that Jesus' disciples didn't understand everything that was happening on the road to Jerusalem, they did understand that even without the pomp and circumstance, Jesus was worthy of praise. They had seen the mighty works Jesus had done. I imagine that Lazarus, the\n\n# Palm Sunday Sermon\n\nA dead man now walking was in the crowd that day. No matter how Jesus made his entry to Jerusalem, there was no denying that he was a king worthy of praise. They laid their clothes on the road in front of the donkey as Jesus made his somewhat untriumphant entry. It was their way of rolling out the red carpet—a tangible way of expressing that this king, who chooses humility over honor, is worthy to have all things under his feet.\n\nThey shouted in a loud voice, \"Blessed is the king who comes in the name of the Lord. Peace in heaven and glory in the highest.\" These cheers echoed Psalm 118:26: \"Blessed is he who comes in the name of the Lord.\" But their cries made it clear that this was not just anyone coming in the name of the Lord—this was the king, the Lord himself. Our hope for peace had come down from heaven, and so our highest praises rose up to heaven.\n\nThe other gospel writers—Matthew, Mark, and John—add details to this moment. Some cried out, \"Hosanna! Hosanna in the highest!\" Hosanna is a Hebrew word that literally means \"save us\"—God save us. Salvation is here. I don't know what everyone in the crowd understood that day. Tangled in the praises of the people were nationalistic hopes and superficial pictures of peace. But the crowd got one thing right that day: Jesus is king, and there is great joy at the coming of the king.\n\nThe Pharisees and religious leaders apparently made their way through the crowds to confront Jesus about the implications of this parade of praise. They said, \"Teacher, rebuke your disciples.\" They found the praises of the crowds misplaced and problematic. But Jesus responded for all to hear: \"I tell you, if they keep quiet, the stones will cry out.\"\n\nHere is a truth that we need to let sink in this morning: Jesus is king regardless of our response to him. If they were silent, the rocks would cry out. His reign is cosmic. The rocks of Colorado, the sequoias of California, the coastlines of Carolina—they all declare that Jesus is worthy of praise. The sun's rising and setting, the expanse of the stars above, the depths of the ocean below—it's all part of his right to reign. While earthly kings find their worth in the praises of their people, Jesus is worthy whether we praise him or not.\n\nLet me make a point of application as we head into Easter week, and I suspect it may challenge some of your cultural assumptions. Jesus doesn't need your worship. The story of the gospel is not primarily about you—it's about Jesus, who is worthy of all worship. Jesus will reign as king regardless of our response to him. But don't miss this: even so, he weeps for us to experience his reign of peace.\n\nWe're told that as Jesus approached Jerusalem, he wept over it. \"If you, even you, had only known on this day what would bring you peace. But now it is hidden from your eyes.\" In deep sorrow and sobbing, we hear the merciful heart of God, our king—a king who longs for us to know the things that make for peace.\n\nLittle did the crowds know that day that the one they were hailing as king wasn't arriving in Jerusalem to start a crusade, but to suffer a crucifixion. Paul writes in Colossians: \"For God was pleased to have all his fullness dwell in him. And through him to reconcile to himself all things, whether things on earth or things in heaven, by making peace through his blood shed on the cross.\" Peace by the blood of his cross. Oh, that you would know the things that make for peace. Do you see his tears of mercy? Do you hear his heart of love for you this morning?\n\nAs an old hymn exclaims: \"The Son of God in tears, the wondering angels see. Be thou astonished, oh my soul. He shed those tears for thee.\" Jesus will reign as king regardless of our response to him. In many ways, that's the message of Palm Sunday. But the overarching theme of Holy Week is that he weeps for us—he weeps for us to experience the things that make for peace.\n\nRather than close this sermon with a proposition for you to ponder, I'd like to hold out to you this morning two emotions. These are two emotions we find in this text, and I believe they are meant to guide us through Holy Week: tears of joy and tears of sorrow.\n\nWe rejoice because our king has come. We rejoice because our sins are forgiven. We rejoice because peace is possible by the blood of his cross. And we weep because our world is broken. We weep because our sin is weighty. We weep that we, even us, would know in our day, in our hearts, in our homes, in our city the things that make for peace. We weep that the eyes of men and women and boys and girls would be open to the glory of the gospel. And we rejoice because our king has promised that one day we will weep no more.\n\n---\n\nJesus, we sit in these two emotions. We rejoice because you are worthy, and we weep because our world is broken. We feel the ripples of it in our own hearts, in our own lives, our families, our communities. And we cry out, \"Hosanna. God, save us.\" We're thankful that even though the stones would cry out, you longed for us to experience your reign of peace. You didn't merely long for it—you stepped into our brokenness. You took on our sin. You took our death and rose that we might have life.\n\nWe gather here this holy week as a people of hope—real hope, hope that weeps and hope that holds joy. As we respond and worship this morning, turn our eyes to you, the King of Kings, the Lord of Lords, who loves us, who weeps for us, and is here with us this morning. We pray this in Jesus' name. Amen.\n\n---\n\nChurch, as we respond this morning, we respond in multiple ways each Sunday. We sing together, we pray together. In a moment, there will be some people with green lanyards on the edges of the room who would love to pray with you. Perhaps you're feeling the weight of the brokenness of our world this morning and would love someone to pray for you. This is a time where we want to respond by coming to Jesus together.\n\nWe also respond as a church family by being a people of generosity. There are multiple ways you can give to the mission of
