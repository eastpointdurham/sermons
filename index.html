to us now. Help us to hear your voice clearly. Enlighten our hearts and minds that we might be transformed from the inside out by your precious word. Amen.\n\nPlease remain standing as you're able for the reading of God's word from the book of Colossians 1:15-20. The Son is the image of the invisible God, the firstborn over all creation. For in him all things were created, things in heaven and on earth, visible and invisible, whether thrones or powers or rulers or authorities. All things have been created through him and for him. He is before all things, and in him all things hold together. And he is the head of the body, the church. He is the beginning and the firstborn from among the dead, so that in everything he might have the supremacy. For God was pleased to have all his fullness dwell in him, and through him to reconcile to himself all things, whether things on earth or things in heaven, by making peace through his blood shed on the cross. This is the word of the Lord.\n\n---\n\nGood morning, East Point Church. It is such a joy to be worshiping with you here on our launch day. Something you should know about me is that I do not follow sports. In fact, it was during my sermon preparation that I realized I should probably Google who is in the Super Bowl tonight. Apparently, the New England Patriots are playing the Seattle Seahawks. While I'm not a diehard follower of any sports teams, a few months ago I introduced my oldest son, Elijah, to one of my childhood favorite movies, *Cool Runnings*. With the Olympics starting this week, Elijah has taken to bobsledding.\n\n*Cool Runnings* is the unlikely story of the first Jamaican bobsled team competing in the Winter Olympics despite having never seen snow. There's an iconic moment in the movie when this ragtag group of athletes convince a washed-out former bobsledder to be their coach. He stands in front of them with a makeshift bobsled on wheels and says, \"Gentlemen, this is a bobsled.\" It's actually a borrowed line from an iconic moment in 1961 when Vince Lombardi was coach of the Green Bay Packers—a football team. He walked out on the first day of training camp after they had lost late in the game the season before in the last quarter of the Super Bowl. He walks out at training camp with a pigskin in his right hand, holds it out, and says, \"Gentlemen, this is a football.\"\n\nIt's an iconic moment because the point was simple: if you want to win, you start with the fundamentals and keep coming back to them. In Colossians chapter 1, the passage we just read, it's as if the Apostle Paul is walking out onto the field of the church, holding these poetic verses out to us and saying, \"Church, this is Jesus.\"\n\n---\n\nAs we've been planning and preparing for our official launch as a church, it's our heartbeat that we would be a church centered on Jesus. Our mission as East Point Church, which you'll hear us say often, is to point a hurting world to hope in Jesus. In order for us to live out that mission and win, we need a clear vision for who Jesus is and what difference that makes in our lives.\n\nOver the next few weeks, we're walking through Colossians in a series called First Things First. It's an invitation to focus on what matters most in life. First things first—that's what I say to myself when I sit down on Monday morning and feel overwhelmed by the tasks of the week. First things first—that's what I say to myself after the kids get in bed and I feel overwhelmed by the chaos of the house. I think those are the words that God invites us to utter to ourselves this morning as we embark on the overwhelming mission of pointing a broken and hurting world to hope in Jesus.\n\nWhat God wants to show us here in Colossians chapter 1 is that a clear vision of Jesus and his greatness will bring clarity to life's biggest questions: Where did we come from? Why are we here? And how do we find peace? The Spirit of God wants to address these questions through these six verses in Colossians 1, verses 15 through 20.\n\n---\n\nMany of us know the Sunday school answer to where did we come from? Genesis 1:1, the first verse in the Bible: In the beginning, God created the heavens and the earth. But if you're like me, the idea of God as creator feels a bit like a fairy tale from long ago and far away. The world that we see, created by an eternal invisible spirit, feels like a fairy tale.\n\nBut Colossians 1:15 tells us that Jesus is the image of the invisible God. In other words, Jesus is what makes the invisible God visible. He's what makes the creator God credible. He turns what feels like a fairy tale into flesh and blood. Verse 19 tells us, \"For God was pleased to have all his fullness dwell in him.\" So if you want to see the greatness of God the creator, you can get glimpses of it at the Grand Canyon. You can get glimmers of it when you watch a sunrise over the Atlantic. But if you want to see the fullness of God's greatness, Colossians tells us to look at Jesus.\n\nDo you want to know what the invisible God is like? Look at Jesus. The Gospels tell the story of a God who became a man and pursued those the world had rejected. He healed the sick, cleansed the lepers, ate with sinners, and stopped to let strangers know he cared. He calmed the wind and the waves. He felt grief. He mourned death. He turned water into wine. He turned sorrow into joy. He turned what felt like a fairy tale into flesh and blood.\n\n---\n\nSo if you want to know what the creator is like, Colossians tells us to look at Jesus. Jesus is the source of everything good. Paul wants us to see in these verses a clear vision of Jesus and his greatness—that he is the source of everything good. But not only that. If we read verse 16, it says: \"In him all things were created, things in heaven and on earth, visible and invisible, whether thrones or powers or rulers or authorities. All things have been created through him.\" Jesus is the source of everything good, but the end of the verse says, \"and for him.\" Jesus is not only the source of everything good. He is the meaning of everything made.\n\nHe holds the universe together. The molecules in your body, the breath in your lungs—Jesus is greater than your mind can comprehend, and he is nearer than we could ever imagine. The meaning of life, why are we here, is answered in Jesus. God's making and sustaining of life is for one purpose: that we would know the greatness of his power, the depths of his love, the strength of his justice, and the magnitude of his mercy.\n\nWhat Paul is saying in these verses—that all things were created through him and for him—means that if you want to experience life as it was meant to be lived, it is only experienced when Jesus is first in our lives.\n\n---\n\nMary and I have a parenting hack. Whenever our kids are given a gift that requires batteries, we try to convince them as long as possible that it doesn't take batteries. They're usually pretty good at that. They make it work. They pretend it makes noises. They imagine it lights up. They push it with their own strength. I imagine some of you this morning are trying to do that with life. You're trying to find meaning in life by pretending that your life sounds good and lights up, imagining that the approval of others or the success of your career or the future of your family will bring you fulfillment.\n\nBut it is only when Jesus is what defines greatness in your life that you find the meaning that you were made for. Here's what I don't want you to miss this morning: the greatness of Jesus is not simply that he's the source of everything good and he's the meaning of everything made. He is the hope of everything broken.\n\n---\n\nLook at verses 19 and 20: \"For God was pleased to have all his fullness dwell in him, and through him to reconcile to himself all things, whether things on earth or things in heaven, by making peace through his blood shed on the cross.\"\n\nYou might be saying this morning, \"Yeah, Jesus as the source of everything good and the meaning of everything made—that sounds good and spiritual. But what about my life that feels really broken? When I look at my life and the world around me, there's hurt, there's pain, there's brokenness.\" And Jesus does not ignore that. In fact, he took on flesh so that he might experience it—the brokenness of our world that is a result of our rebellion against God. The Bible calls this sin. And the heart of sin is you and me and every person who ever lived trying to define our lives by anything and everything except Jesus.\n\nBut Jesus does not leave us there. He doesn't leave us in our brokenness and sin. He took it upon himself. He lived a life we could not live and died the death that we owe because of our sin. Why? Verse 19 tells us: to reconcile us to God, to make peace possible. You see, Jesus is the hope of everything broken.\n\n---\n\nI intentionally skipped over a verse in this passage so that we could return to it now. Verse 18 says: \"Christ is also the head of the church, which is his body. He's the beginning supreme over all who rise from the dead. So he is first in everything.\"\n\nI come back to where we started, church. This is Jesus. He's not only the source of everything good and the meaning of everything made, but he lived, died, and rose from the dead so that he would be the hope of everything broken. He was first. He is first. And he wants to be first in your life. He wants to be first in our church.\n\nThe invitation is faith: to believe that Jesus is who he says he is and trust to rely on what he accomplished at the cross—that by his death and resurrection we have forgiveness of sins and hope beyond the grave. What is this hope that's at the heart of our mission? Hope is a promise that transforms the present. What is that promise? Jesus says, \"I am making all things new.\" And that hope transforms our present.\n\nIt brings us back to those big questions of life. Where did we come from? Jesus—he's the source of everything good. Why are we here? Jesus—he's the meaning of everything made. And how do we find peace? Jesus—he's the hope of everything broken. I hold out to you this morning this truth: This is Jesus.\n\n---\n\nNot to suggest that Jesus is a simplistic fix or answer to all life's questions. The brokenness of sin runs deep in our lives, in our community, in our world. Jesus is not a band-aid to the bruises. The solution is not simple, but it is a Savior—a crucified and resurrected King who is still at work in our world today, changing lives and communities when ordinary people like you and me make him and his kingdom first in our lives.\n\nEast Point, this is Jesus. And here we are in East Durham to join Jesus in his work of bringing renewal to our city, to point a hurting world to the one who is the hope of everything broken. This is Jesus.\n\n---\n\nMary and I lived in the Boston area for nearly a decade. As I mentioned, I'm not a sports fanatic, but people from Boston care deeply about sports. It sort of rubbed off on me because I was surrounded by it. And it was in that context that I learned what the GOAT was—not the bleating animal that yells at you, but the GOAT: the greatest of all time. Everybody loves Tom Brady. Greatest of all time.\n\nI want to suggest for us this morning that here in Colossians 1, Paul is holding out for us that Jesus is the GOAT. He is the greatest of all time. And when you put him first in your life, it reorders everything because of a promise that transforms the present. We call that hope. And that hope reaches into the depths of our brokenness and transforms how we see the present—that the brokenness that we see and feel in our community isn't something that we retreat from, but something we step into because Jesus stepped into it.\n\nHe taught us to pray these words: \"Your kingdom come. Your will be done here on earth, here in East Durham, as it is in heaven.\" And that is our prayer as a church.\n\n# Sermon Transcript\n\nChurch, we are so glad you are here worshiping with us this morning. We believe—and you'll see it in our hallway on a big banner—that it's our core value: we expect God to change lives. We believe he's still changing lives, and he wants to do that in yours.\n\nThe big questions of life bring us back to one fundamental question this morning: What's first in your life? Because what you put first is what you put your hope in. And what you put your hope in transforms your present. If your hope is in anything outside of Jesus, it will leave you disappointed, still broken, and longing for a solution. But Jesus says, \"I am first. I always was. I am now, and I will be even beyond the grave.\" He invites us to make him first—not as some Lord calling you to moral reformation, but inviting you to receive a gift of grace. His free gift says: you don't have to earn my favor. You don't have to earn my love. You are simply loved. I meet you in your brokenness and your mess, and I want to give you hope that transforms your present and your future.\n\nThis church, this is Jesus. This morning we have the opportunity to celebrate a couple of individuals who are taking a step we call baptism. It's a step of identifying with Jesus through a visible picture of what Jesus does in our lives. When we go down into the water of baptism and rise up out of the water, we are symbolizing that because of Jesus, we are buried with Christ and raised to newness of life. There's nothing magical about this horse trough we're going to use this morning, and there's nothing magical about the water. It is a sign and a symbol of the work that Jesus has already done in their lives. I'm going to invite Morgan and Ruby to come up and share their stories.\n\n---\n\nGood morning. For those of you who don't know me, my name is Morgan, and I'm super excited for baptism today. I was born and raised in Massachusetts and moved down here about a year and a half ago for a fresh start and new opportunities. I just started a cardiac sonography program at Duke School of Medicine.\n\nGrowing up had its challenges for me. I was baptized as a baby, but today is more symbolic because I'm actually aware of what's going on and choosing to love Jesus. My parents brought my brother and me to church when we were babies all the way up until they got divorced when we were about six years old. I don't have a lot of memories from that time, but I do remember how much I loved Sunday school and our talks about Jesus. From then on, my brother and I often spent Sundays with my dad. I loved spending time with him because we were no longer seeing each other during the week, and that was really hard. Weekends were everything we had, so we wanted to make the most of it.\n\nWe would only go to church on Christmas Eve. As someone who didn't know Jesus growing up, I found myself focusing on the wrong things in life. I was always worried about what other people thought of me, what I looked like, what I was wearing, how many friends I had. I also didn't trust many people because of certain life circumstances surrounding my parents' divorce.\n\nIt wasn't until 2016 when I began rediscovering church life thanks to a lovely couple I found on YouTube one day after learning about cystic fibrosis in my biology class. This couple is Mary and Peter Fry. I reached out to them after realizing we lived only a few towns over from each other. I noticed some shopping plazas in their videos that I recognized, so I was like, \"They live very close to where I live.\" Long story short, Mary invited me to their church. I was really nervous. I didn't know what to wear or how to act, but I went. I started attending Bible studies at their house just to see what it was all about.\n\nOne night, I can't remember exactly what we were reading in the Bible, but I got an overwhelming feeling of something going on inside me. I fully attribute this moment to the beginning of my relationship with Jesus. He came to me, and I got scared. I wanted to run. I went upstairs with Mary and cried my eyes out. I didn't even know why, but I just felt very anxious.\n\nSince that day, I've been on a long ten-year faith journey with a lot of questions, and that's been my biggest struggle. I kept thinking: What if I'm not good enough for Jesus's acceptance? I've made a few poor decisions in life. There's no way he would accept me. A lot of other people seem to know way more about the Bible than I do, which was my biggest hang-up. How could he accept me? It just didn't seem possible. I was very slow in wanting to learn more about Jesus.\n\nBut then I heard the good news. I learned that Jesus accepts me for who I am and that I can put all my trust in him. Although at times this has not been easy for me, I'm ready to give my life fully to Christ. I don't know what he has in store, but one verse that sticks with me is from Proverbs 3:5 and 6: \"Trust in the Lord with all your heart. Do not depend on your own understanding. Seek his will in all you do, and he will show you which path to take.\" To finish, I would just like to say I acknowledge that Jesus is the GOAT and not Tom Brady.\n\n---\n\nGood morning. My name is Ruby for those of you I've not met yet. I am very excited and very happy to be standing up here and sharing my story with you this morning. My childhood from the outside looked quite standard—mom, dad, brother. What I would consider your typical nuclear family, although I didn't go to church. It was relatively normal, but I ended up hiding a lot of things from them. Not necessarily bad things, but one of them was that I started to have questions about what it would mean to be a Christian.\n\nThankfully I found a group of people that showed me what it means to have unconditional love in my life. They showed me what a relationship with Jesus could look like and what it feels like to be supported in something. I was very hesitant at first, lying to myself and saying, \"I don't need this, and this is silly. I know better than to rely on religion.\" But boy, was I wrong.\n\nI have one friend that I attribute a lot of my faith journey to. Suddenly a Bible verse kept showing up everywhere—all over Facebook, Instagram, Twitter, whatever social media platform you can think of, it was there. It was the strangest thing. I remember telling my friend Marley, \"This is ridiculous. Why does this keep showing up?\" She asked me what the verse was, and it was from the book of Romans, chapter 8, verse 18. The version I kept seeing was: \"Fear not, for the pain that you have been feeling cannot compare to the joy that is coming.\"\n\nWhat I've yet to mention is that during this time I was really struggling with depression. I thought that I would be better off without existing, that people would be better off without knowing me. So there I was sitting in my friend's living room trying to understand why I of all people was worthy of God's love and attention. Why he was trying to tell me that he is the savior.\n\nThe actual ESV version of this verse says: \"For I consider that the sufferings of this present time are not worth comparing with the glory that is to be revealed to us.\" I latched onto that word revealed. Not because I knew what it was he was trying to reveal to me, but because regardless of what I did, what I said, what I looked like, he was going to be revealing his glory to me.\n\nI started going to church at first reluctantly. I found myself asking more questions. I found a small group, a church community, some friends that supported me in my journey. I learned what it meant to have a church community and began understanding what it means to have a firm foundation in Christ.\n\nOnce I was comfortable with my church community, I decided I wanted more from my work and my career. I started looking into a particularly specialized area of nursing and found Duke University Hospital 1,300 miles away from where I was currently living. I packed up my life and moved without knowing a single soul. There I was diving into work, really enjoying my unit and my career and the life that I had started to make here. Before I realized it, two years had passed, and I had made every excuse in the book to not find a church here in Durham.\n\nThen came the very weird story of how I met Mary and Peter in Sam's Club. So I started coming to East Point and quickly learned how important community was here. I started connecting with people outside of my work and outside of what I had made, and was finding fellowship where I needed it the most.\n\nI still have so much to learn, so many ways to grow, and so many opportunities that I know God is preparing for me. Baptism to me means taking this final step. I'll never stop learning, asking questions, or sharing the love that I have for Jesus and the ultimate sacrifice that he made. I used to think that I wasn't good enough to be standing up here in front of you all today, but someone, my good friend, once told me: \"The ground is level at the foot of the cross.\" Whenever I feel less than or that I'm not good enough to be standing in front of you today, I remind myself of that. I remind myself that there's no agenda according to God. His ultimate sacrifice saved me, and I get to spend the rest of my earthly life sharing the good news of the gospel.\n\n---\n\nWe will have the opportunity to witness and participate in seeing them baptized in just a little bit as we continue in worship. Each week here at East Point, we respond in three ways. The first is we sing together. This is the climax of our service where we come to say Jesus alone is our hope. He is worthy of all worship. We pray together in a moment as we sing these next three songs. There will be people on the sides of the room wearing green lanyards, and they would love to pray with you.\n\nIf you're here this morning and the spirit of God is stirring in your heart, and you're thinking, \"I don't know if I've ever experienced this hope that you're talking about, this promise that transforms the present, that reaches into our brokenness and pain,\" we would love to pray with you this morning. Jesus's offer of grace is for you.\n\nEach week here at East Point, we do something called the Lord's Supper. We remember the good news of Jesus. We come back to the message of the cross—that there is nothing, as Ruby said, there is nothing that we bring to the foot of the cross to earn God's favor. But it is only through Jesus's death and resurrection that we have hope and life.\n\nWe come back to a meal that Jesus gave his disciples on the night he was betrayed. He took the bread and he broke it and he said, \"This is my body which is broken for you.\" And he took the cup and he said, \"This cup is a new covenant in my blood, a new relationship that I want with you, my blood poured out for the forgiveness of sins.\" We're told: as often as we eat this bread and we drink this cup, we proclaim the Lord's death until he comes.\n\nSo if you are a follower of Jesus, this table is for you. If you're not a follower of Jesus, we would love to pray with you. Today can be your day to make that decision, to make Jesus first in your life. I want to invite our servers to come forward. We'll have two stations. Here's how this will work: we're going to begin singing in a moment. If you're a follower of Jesus, we invite you to come to one of these two stations, whatever side of the room you're on. You can come down the center aisle and receive the elements. You can take the bread, dip it in the cup, and eat and remember the good news of Jesus for you.\n\nLet's stand and sing together and come to the table as you are led.\n\n# Baptism Affirmations\n\nDo you repent of your sins and confess Jesus as Savior and Lord? Yes. And do you commit by the power of the Spirit to love and follow God all the days of your life? I do. It is my joy to baptize you in the name of the Father, Son, and Holy Spirit.\n\nRuby, I'm going to ask you those same two questions. Do you repent of your sins and confess Jesus as Savior and Lord of your life? Yes. And do you commit by the power of the Holy Spirit to love and follow God all the days of your life? I do. It is my joy, based on your profession of faith, to baptize you in the name of the Father, Son, and Holy Spirit.\n\nHallelujah! Hallelujah! Amen. Church, let's celebrate and sing for Him.","url":"https://www.youtube.com/watch?v=Dp1jF4N8Gms"},{"id":"7Qm-3K2buD8","date":"2026-01-26","title":"Embracing Weakness Together","scripture":"2 Corinthians 4:5–10","preacher":"Peter Frey","series":"Together","desc":"Originally preached on January 18, 2026, this message from 2 Corinthians 4 explores how God’s power is revealed through our weakness. Join Pastor Peter Frey as he shares stories of real hope and how Christ shines through fragile vessels at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: \"Treasure in Jars of Clay\"\n\nJoin me in reading aloud this prayer for illumination. The words will be on the screen. Holy Spirit, breathe upon us as we hear scripture. Fill us with your presence, wisdom, and peace so that we may be transformed by your truth. Amen.\n\nPlease remain standing as you are able for the reading of God's word from the book of 2 Corinthians 4, verses 5-10. \"For what we preach is not ourselves but Jesus Christ as Lord and ourselves as your servants for Jesus' sake. For God who said, 'Let light shine out of darkness,' made his light shine in our hearts to give us the light of the knowledge of God's glory displayed in the face of Christ. But we have this treasure in jars of clay to show that this all-surpassing power is from God and not from us. We are hard-pressed on every side but not crushed. Perplexed but not in despair. Persecuted but not abandoned. Struck down but not destroyed. We always carry around in our body the death of Jesus so that the life of Jesus may also be revealed in our body.\" This is the word of the Lord. Thanks be to God.\n\nGood morning, East Point. I want to invite our kids who are in through fifth grade. Our volunteers are in the back. Give it up for East Point Kids. You guys can head on to your class.\n\nHey, good morning, everyone. It is an exciting week because next week is an exciting week. Next Sunday is our official launch as East Point Church. You might be asking what is special about that? Well, next Sunday will be a Sunday full of celebration. We'll kick off a new sermon series in the book of Colossians and we'll have a catered lunch after the service. It's going to be awesome. I also want to say this is an incredible opportunity to invite people to come and join us. When you walked in, there are postcards on the high-top table in the lobby—simple invitations to join us here at East Point Church. I want to encourage you to prayerfully consider this week inviting at least one person to come join us next Sunday. Maybe it's a friend, a neighbor, or a family member. You can tell them about East Point, and then you can bribe them with free lunch. I'm kidding, but seriously, we are wrapping up a three-week sermon series we've called \"Missional: It's Who We Are.\" This series is meant to help us come back to basics at the start of the year and ask why we do what we do. I think it's appropriate that in the week before we launch, we ask this question.\n\nIn many ways, this has intentionally been a back-to-basics series. We started with Jesus's Great Commission in Matthew 28, as he invites us to join him in making disciples of all nations. Last week we considered how our story shapes our identity and how our identity as people who have received mercy shapes our mission to declare and demonstrate that mercy to a hurting world. And here we are the week before our official launch, at the conclusion of our series on what it means to be missional. You'd probably expect at a moment like this an inspirational pep talk—saddle up your horses, muster all your energy, let's storm the gates of hell. But as I sat with Jesus and considered what it means for us as a church to embrace our missional identity, he brought me to an unexpected message for today.\n\nI'd like to focus on one verse this morning, consider its context, and allow the Spirit of God to apply this word in our lives together. 2 Corinthians 4:7: \"But we have this treasure in jars of clay to show that this all-surpassing power belongs to God and not to us.\"\n\nWould you pray with me? God, as we reflect on this word this morning, would you show us the glory of your gospel? Would you show us your all-surpassing power? God, I pray that you would give us this morning as East Point Church a humble reverence that we get to be part of what you are already doing. We pray this in Jesus's name. Amen.\n\nMary and I are not avid movie watchers. We usually fall asleep or get distracted before the plot gets good. But when we do find ourselves watching a movie, she sometimes likes to pause it to have a conversation. Now, to her credit, it's usually about the movie, but it's also inevitably at the most inopportune time—just before the camera reveals who's behind the door or right before the countdown on the bomb hits zero. Mary pauses the movie and asks me to explain who's who and what's what. I love you, babe, but let's be honest: life often feels like a movie. It's fast-moving. There are unexpected turns, complicated relationships, and continual plot twists. And if I'm honest, church planting has felt a lot like that—fast-moving, unexpected turns, complicated relationships, and continual plot twists.\n\nThis morning, on the week before our official launch, I think the Spirit of God is inviting us to press pause and ask the question: \"So, babe, who's who and what's what?\" In many ways, that's what the Apostle Paul is doing for us here in 2 Corinthians chapter 4 when he says, \"But we have this treasure in jars of clay to show that this all-surpassing power belongs to God and not to us.\"\n\nPaul's big concern, if I could sum it up in one phrase, is this: don't confuse the container for the contents. Don't confuse the container for the contents. As we look at this verse in 2 Corinthians chapter 4, Paul wants to name who's who and what's what. Here's what's been happening in the Corinthian church: Paul had planted the church, but he's moved on. God's called him elsewhere. And he is writing letters to the Corinthian church as he hears what's happening. One of the things he's getting feedback on is that they are looking at the landscape of what's happening and noticing that there are some more glamorous preachers out there. There are some people who are not going through the same things that Paul is going through. There are some people whose message is more palatable, and they are confused.\n\nPaul is going through a laundry list of trials. In 2 Corinthians chapter 11, it describes how he's been shipwrecked, beaten, sick, and bitten by a snake. There are all these trials that Paul is walking through. And they're looking at Paul's life and asking the question that you've probably asked too: When the unexpected plot twist comes and suffering enters our lives, does this say something about me? Does this say something about Paul and his message? Is his suffering discrediting the word that he's proclaiming—that God is powerful, that Jesus rose from the dead, that this hope changes everything?\n\nWhen those unexpected plot twists come in life, when you get that call from the doctor, when we look at the brokenness in our country or community and step back asking, \"How is this congruent with the gospel that we proclaim?\" the question underneath this passage emerges: How do we make sense of the brokenness and suffering in the midst of the message that we proclaim—that God is powerful, that he rose from the dead, and defeated sin and death? How do we navigate this?\n\nPaul's concern is that the church in Corinth is confusing the container with the contents. Here's what he says: \"We have this treasure in jars of clay.\" Let's name who's who and what's what.\n\nFirst, we have to ask: what is this treasure? Well, if we back up one verse to verse 6, we see what this treasure is. It says: \"For God who said, 'Let light shine out of darkness,' has made his light shine in our hearts to give us the light of the knowledge of God's glory displayed in the face of Christ.\"\n\nThe treasure is this: the knowledge of God's glory displayed in the face of Christ. The church—East Point Church as we prepare to launch next week—needs to ask an important question in this missional series: What is our win as a church? Any organization, any game that you play, it's important to ask what's the win. I'm convinced that my son Elijah thinks the win of football is tackling. I get that report from his preschool teacher. In fact, I just picked him up on Friday, and I hear Elijah telling his buddy, \"Thanks for the tackles.\" He thinks that's the win. I think he knows there's more to it, but sometimes when you're in the midst of the game, the organization, or the mission, the win gets confusing by the methodology.\n\nFor us this morning, we step back and ask: What is the win? What is our ultimate treasure? It is the light of the glory of God in the face of Jesus. People beholding that glory—if that is our win, everything changes.\n\nIf you're following along in our reading plan through the Gospel of Matthew right now, there's an interesting pattern with the word \"treasure.\" Just moments after Jesus's birth, treasure is brought to Jesus. Then you fast forward to when Jesus is proclaiming the Sermon on the Mount, and he gives this nugget: \"Where your heart is, there your treasure will be also.\" Then he goes on to talk about spiritual practices like fasting and prayer, saying, \"Be careful that you don't lay up your treasure for things on earth but lay up your treasure in heaven.\" And then in Matthew chapter 13, Jesus gives a parable: \"The kingdom of God is like a man who found a treasure in a field. What does he do? He goes and sells everything to buy that field.\"\n\nAs I was reflecting on that this morning, Justin, who played trumpet for us so beautifully and read the scripture for us, posted on our Slack church communication. If you're part of East Point and want to join our Slack channel to stay up to date with what's happening, we'd love to help you get connected. Come see us after the service. But Justin posted this week, \"Does anybody have a handheld vacuum I can borrow?\" I posted back, \"Yeah, sure, you can borrow mine.\" He came to pick it up, and I asked, \"What do you need this for?\" He laughed and told me that he was at the park practicing his trumpet when he dropped a little plastic piece that fits his teeth perfectly in the grass. I started putting the pieces together between the handheld vacuum and this little plastic piece in the grass.\n\nWe started scheming about how he was going to find this piece of plastic. I asked him, \"What is this thing worth?\" He said, \"Oh, it's like pennies of plastic, but it fits my tooth perfectly. I can't replace it.\" He literally told me this morning that he was at the field yesterday at five in the morning. We came up with the idea of using a black light to try to find it in the grass. Apparently that didn't work. He tried for forty-five minutes.\n\nBut this is the parable that Jesus gives. In my mind, I'm thinking Justin, it's a piece of plastic. But in his mind, this changes everything. He plays trumpet every day, and this piece of plastic changes his life. This is what the gospel is for each of us. In the world's eyes, it's like, \"Why would you sell everything? Why would you get a handheld vacuum and go to that field and try to find this thing?\" But when the value you assign to something changes your life, when the treasure becomes your ultimate value, you reorder your life for that.\n\nWhat Jesus and Paul are inviting us into here is the glory of God that we find in the face of Jesus as followers of Jesus. When we make that our ultimate treasure, when we make that our win, we start to see ourselves differently and we start to see how we live our lives differently.\n\nWhat you put on the pedestal of your purpose will reveal what the treasure in your heart is. Let me talk to parents for a moment: What you put on the pedestal of purpose for your kids' lives will show what your treasure is. If it's them exceeding academically—if that is what you put on the pedestal of your purpose—that will show you where your treasure is. Jesus said it: \"Where your heart is, there your treasure will be also.\"\n\nFor those of you who work in the workplace, if the pedestal of your purpose is achieving a certain salary level or level in your company, that will show you where your treasure is. Are these things bad? No. You could totally pursue that, but is that on the pedestal of your purpose in life?\n\nJesus says we have this treasure—the all-surpassing glory of God in the face of Jesus. When we let that sink in, that changes everything.\n\n# Sermon Transcript\n\nEverything comes into focus. We start to see who we are. The treasure is the glory of God in the face of Jesus. Who are we? He says, \"We are jars of clay.\" This image is not far removed from the ancient world to today. It is the picture of a utensil made out of mud. It is ordinary. It is fragile. It is throwaway. Don't take yourself too seriously. In many ways, as Paul is telling us, don't confuse the container for the contents. He wants us to see that our weakness is meant to contrast with God's all-surpassing power. We have this treasure in jars of clay. We are ordinary, fragile, wounded, very human people. And God's designed way of bringing hope to a hurting world is using jars of clay, jugs of mud, cardboard boxes, however you want to see it. This is God's design for showing his all-surpassing power.\n\nHere's what I want us to let sink in this morning. This is not the \"saddle up your horses and storm the gates of hell\" message. What Jesus is inviting us into, I think, as a church is embracing weakness as our greatest strength. We have this as one of our core values. We tell stories of real hope, and part of that is telling the stories of where we are weak, where we are fragile, where we experience suffering and pain in this broken world. We name that. We are not trying to tie Christianity up in a big pretty bow. We are trying to exalt the cross of Jesus, which is offensive and bloody. And in that we embrace the weakness and woundedness we find in ourselves, the fragility of our broken existence.\n\nI can stand up here on Sunday morning and say, \"This is the greatest treasure, the glory of God revealed in the face of Jesus,\" and I go home and I feel discouraged and I feel overwhelmed and the anxieties of the week start to haunt me. That is my fragility. And we are called to embrace that weakness. When we name jars of clay, cracked vessels, as our greatest strength, we see that the all-surpassing power of God can be displayed in our weakness. Henry Nouwen in his great little book on leadership called *In the Name of Jesus* says this: \"The question is not how many people take you seriously. The question is can you dare to be powerless.\" Church, East Point Church, I want to ask that question this morning. The question is not how many people take East Point Church seriously. The question is, can we dare to be powerless and believe that the all-surpassing power of God is able to change lives?\n\nHe also says this: \"Our brokenness is not something to be ashamed of. It is often the place where God's grace most deeply enters our lives.\" Church, I want to encourage you with this. Some of you this morning feel impostor syndrome when you walk into a space like this, and I'm with you. I often feel it when I stand up before you on Sunday mornings, like I am a wounded, fragile, and broken individual in need of Jesus's grace. And it is the world's and Satan's temptation to make us believe that the path to winning is to cover that up. But the invitation of the gospel is to let that be on the pedestal, because it is in our brokenness, our woundedness, and our weakness that the all-surpassing power of God is able to display so brightly.\n\nOver my desk, if you ever visit our office over on Miami Boulevard, I have a prayer from *Every Moment Holy*—a prayer for those who take the stage. I won't read it for you this morning, but the heart of it is: \"God, I am broken. I am cracked. Would you shine through that?\" Each week, I need to remind myself of that. And church, as we step into this new season of embodying who God has called us to be in Easter, we are embracing weakness in our vulnerability, in our woundedness, to say, \"God, would you by your grace and by your all-surpassing power show yourself great?\"\n\nThis is our win: that men and women and boys and girls would see the light of the glory of God in the face of Jesus, and that people would walk away from these gatherings and not say that was a great preacher or that was great music, but rather that they would say, \"I saw the glory of God in the face of Jesus.\" As a church, we do not want to take ourselves too seriously. Don't confuse the container for the contents. Don't mistake the pot for the power. Don't think that your talents are the treasure. Don't mistake good music for the move of the Spirit. We are jars of clay, and the all-surpassing power belongs to God and not to us. That's what Paul wants us to hear this morning.\n\nI think the Spirit of God is inviting us into embracing weakness practically. Part of what that is is that we become a people of radically dependent prayer. We have in our hallway that core value: we expect God to change lives. At the heart of that value is that it is God and not us. So as we step into this coming week, I want to invite you as a church to join us in radically pursuing God's presence. We've been encouraging you over the past three weeks to take Wednesday, if you are able, to fast from food and pursue the presence of God with us. If food's not possible for you, do something else—screen time or whatever. Carve out some time for you to join us as a church to be a people who say, \"You know what? We are jars of clay.\" And part of what that means is it brings us to our knees to be radically dependent upon God to move. This is incredibly freeing when we name who and what we are. We start to see that it's not about us. It's not about how many people take us seriously. It's about whether we can dare to be powerless.\n\nBut here's what Paul does as the passage goes on. He says not only is your fragility and weakness meant to contrast the power of God, but it's also supposed to connect you to the power of God. Look what he says: \"We are hard pressed on every side but not crushed, perplexed but not driven to despair, persecuted but not abandoned, struck down but not destroyed. We always carry around in our body the death of Jesus so that the life of Jesus may also be revealed in our body.\" Here is what he's saying: the suffering that we experience in this broken world, in God's strange economy of redemption, is meant to connect you to the gospel.\n\nSo here's the heart of our gospel. Yes, we have a God who is victorious, but how did victory come? Through the cross. N.T. Wright says this: \"If you want to see resurrection at work in your life here and now, you have to be prepared to see crucifixion at work as well.\" It is in those seasons of suffering and brokenness and weakness where I'll be honest—in my journey of experiencing what feels like a desert—I've heard a preacher describe it like this: it is like a desert that you walk through that you never want to return to, but you would never have it differently, because it is in those seasons where we experience the presence of God's Spirit in ways that we would never experience before. There is something redemptive about God's presence in the midst of suffering. I want to be clear: Jesus is not the author of suffering, but he is the redeemer of it. And he invites us to embrace his gospel purposes.\n\nA few verses later in this chapter, it says: \"So we do not lose heart. Though our outer selves are wasting away, inwardly we are renewed day by day. For this light momentary affliction is preparing for us an eternal weight of glory beyond all comparison. As we look not to what we can see, but what we do not see. For what is seen is transient. It's a jar of clay. It's here today and gone tomorrow. But what is unseen is eternal.\" This is what Jesus invites us into: not only is our weakness meant to contrast us with God's all-surpassing power, but our suffering is meant to connect us with God's all-surpassing power.\n\nI want to give Second Corinthians as a case study that you don't always feel that connection. If I go back to chapter one, notice what Paul says. In verse eight, he says: \"I don't want you to be uninformed, brothers and sisters, about the troubles we experienced in the province of Asia. We were under great pressure far beyond our ability to endure so that we despaired of life itself. Indeed, we felt we had received the sentence of death. But this happened that we might rely not on ourselves, but on God who raises the dead.\" Now hear those words. He said we were in despair such that we despaired of life itself. Two or three chapters later he says: \"We are hard pressed on every side but not crushed. Perplexed but not driven to despair.\" I'm like, which is it, Paul? This is the strange economy of God's redemptive purpose in suffering. You do not always see it or feel it, but he is able to sustain you in the midst of when it feels like you are in despair, when you despair of life itself. God's all-surpassing power, by his redemptive purpose and grace, is able to sustain you such that we carry in our bodies the death of Jesus so that the life of Jesus can be put on the pedestal to show what God can do.\n\nI want to suggest that your most effective witness to a hurting world is your experience of Jesus's presence not in spite of suffering but in the midst of it. This is our calling as a church: to embrace weakness together. Don't confuse the container for the contents. I have given many years of my life to craft the art of preaching. I remember when I was twenty years old, a preacher came to speak in Chicago where I was going to school. I heard him teach preaching at a seminary in Boston. I met him after that service and I said, \"Hey, when I graduate from college, I want to come study under you.\" After I graduated from college, I moved to Boston to study under this preacher. I spent four years there crafting the art of preaching. I remember the first day of seminary. He stood up there and he said, \"I believe that it is a sin to bore people with the word of God. My job is to help you sin less.\" So I studied under him, crafting how to use the gifts that God has given me to help people see the all-surpassing power of God. I went on after that to the University of Edinburgh and wrote a dissertation about how to use imagination in the sermon. All of this has led me to a place where it is easy to stand up before you and confuse the container with the contents.\n\nHere is my appeal to you as I preach this to myself. It's not about me. It's not about us. It is about the all-surpassing power of God revealed in the light of the glory of God in the face of Jesus. May that be what we see and savor week in and week out as a church. I'm going to invite Meg Smiley to come up here as I reflect on what does this look like. We have this core value of we tell stories of real hope, and I want Meg to take a couple of minutes as we close this time and lead into a time of response, to reflect on what does this all-surpassing power look like in real life.\n\nMy name is Meg Smiley. As Peter said, I am the wife of the trumpet guy that he was talking about. No, he did not find it. But he will be okay with God's grace. Peter asked me to share about how God works through brokenness in bodies and circumstances. If you don't know my story, I have a chronic illness called Ehlers-Danlos syndrome, and it's been affecting me for just over nine years now. It's altered my life in some pretty severe and debilitating ways. Because of my dislocating and painful joints, along with many other multi-systemic symptoms, I lost my career and my ability to have children. We lost our financial stability, and we're still living in the tension of that. We're still figuring out some big major health things coming down the road and finances and all of those things. So to the world's eyes, it looks like we've only lost a lot. People have said to me, \"I don't know how you guys are doing that,\" or \"I could never live like you.\" But...\n\n# Sermon Transcript\n\nWhat I think the world doesn't see is God's upside down kingdom. In a nutshell, God has taken both Justin and me from fully depending on ourselves and being rather prideful, unfulfilled workaholics. If you had met us ten or eleven years ago, that's really what our track was. God has shown us his glory shining through our brokenness, and that is so much greater in every way than what we had in mind. It's more meaningful, more fulfilling and joyful to us, and more impactful to God's kingdom.\n\nLike Peter was saying, we didn't always see that. We've questioned it along the way. We've shaken our fists at God at times. But we've come to realize that God allowed my illness not to punish us, but to actually bless us by showing us that his beauty through our brokenness is actually better than what we were planning for our lives. My broken body has been a conduit for God to work that out. Even though it seems like to a lot of people the worst thing, to us it's been the best thing.\n\nDon't get me wrong—it's not that my physical pain is gone. It isn't. I still go home and lament and lay on heating pads. But God has been growing us into a spiritual wholeness that's hard to describe. God has used this physical brokenness to develop our understanding of God's love for us, which is not based on what we can do or produce—something we were very much striving after before. He's shown us what our hearts have really been striving for: peace and purpose and wholeness, not in anything that the world can give. And God can redeem every aspect of our lives through that.\n\nHe's used it to grow and heal our marriage, to give us the joy of knowing him, and to come alongside other people who are struggling to see God work in their lives too. That joy is overwhelming and surpasses understanding—it's not something that's easy to describe. We didn't realize it was possible that our lives could be more fulfilling now as disabled people. We're so much more fulfilled than we were before this set in, and we don't say that lightly.\n\n---\n\nEach week we respond in three ways. This is a space of prayer as we've just reflected on. We want to be a people who are radically dependent upon Jesus. One thing I'm praying into for us is that week after week, when we leave this gymnasium, we'd go out asking ourselves, \"Was that a house of prayer?\" While we worship these next three songs, we're going to have a couple of people on the edges of the room with green lanyards. I invite you to take advantage of this moment to pray with somebody. They're here to pray with you and pray for you.\n\nIf you want to use this rug up here—I think it looks cool—and if you want to come and pray on the rug, this is a place where we want to meet with Jesus. We respond in prayer. We're going to sing together because Jesus is what it's all about: the glory of God in the face of Jesus. It is our hope that through our singing, we might see that more clearly. And then we come to the table each week and we remember that at the heart of who we are as a church is a body that was broken and blood that was poured out.\n\nSuffering is at the heart of the gospel—not in some twisted way that suffering is good, but in the way that through suffering came victory. Jesus didn't stay dead. He said, \"This is my body which is broken for you. This is my blood poured out for the forgiveness of sins.\" He had to pay that debt so that we could experience what he would accomplish three days later. We come back to the table each week to remember this.\n\nTherefore, if we have been justified through faith, we have peace with God through our Lord Jesus Christ, through whom we have obtained access by faith into this grace in which we now stand. We boast in the hope of the glory of God. Not only so, but we also glory in our sufferings because we know that suffering produces perseverance, perseverance produces character, and character produces hope. And hope does not put us to shame because God's love has been poured into our hearts through the Holy Spirit who has been given to us.\n\nDuring these three songs, if you are a follower of Jesus, I invite you to come to this table and take the bread that Jesus offers to you. There's nothing magical about this snack, but it is a way to remember the gospel message for you. Dip it in the blood that was poured out for the forgiveness of sins and take and eat and remember the good news of Jesus for you today. Let's stand and worship.","url":"https://www.youtube.com/watch?v=7Qm-3K2buD8"},{"id":"OmWxXqpmeK4","date":"2026-01-18","title":"Declaring Mercy Together","scripture":"1 Peter 2:9–12","preacher":"Peter Frey","series":"Together","desc":"In 1 Peter 2, believers are called to declare the praises of God through lives shaped by mercy. Join Pastor Peter Frey as he shares how mercy-filled lives reflect Christ to the world. Experience real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript\n\nJoin me in reading aloud this prayer for illumination. The words are up on the screen. \"Oh Lord our God, your word is a lamp to our feet and a light to our path. Give us grace to receive your truth that we may be obedient to your will and live for your glory through Jesus Christ our savior. Amen.\"\n\nPlease remain standing as you're able for the reading of God's word from the book of 1 Peter 2, verses 9-12. \"But you are a chosen people, a royal priesthood, a holy nation, God's special possession, that you may declare the praises of him who called you out of darkness into his wonderful light. Once you were not a people, but now you are the people of God. Once you had not received mercy, but now you have received mercy. Dear friends, I urge you as foreigners and exiles to abstain from sinful desires which wage war against your soul. Live such good lives among the pagans that though they accuse you of doing wrong, they may see your good deeds and glorify God on the day he visits us.\" This is the word of the Lord. Thanks be to God. You may be seated.\n\nI'm going to invite our kids who are in up through fifth grade to head to the back. There will be volunteers back there—Wes and Natalie—who will take you to your class. Thanks for worshiping with us.\n\nIf you are new this morning or if I haven't had the opportunity to meet you, my name is Peter. I have the joy of serving as lead pastor here at East Point. I also want to make you aware that in a couple of weeks—just two weeks from today—is our official launch as a church. In fact, I was noticing up here on the stage that there's some stuff behind those curtains that looks like we're about to birth as a church. January 25th, I want to invite you to invite others to come and join us on that day.\n\nA couple of things to note about that day. It's going to be like our regular Sunday morning worship, but it will be a celebration marking this moment where we are officially launching as a church and fully establishing our rhythms and engaging in the mission that God has called us to—to point a hurting world to hope in Jesus. It's going to be an exciting celebration, and we're going to have lunch afterward, so plan your afternoon accordingly. We will have lunch provided.\n\nIf you are new to jumping into the life of our church, I also want to invite you to the Sunday following our launch, which is February 1st. Yes, it's also Super Bowl Sunday, but the game isn't until later in the day. If you are new to East Point, we are going to have what we're calling Explore East Point that day on February 1st after the service. We'll have lunch together and an opportunity to hear who we are as a church. There's a story behind that question. We want to tell you that story and also give you the next steps of being connected in the life of our church. It is our pathway to membership as a church, and we want to invite you, even if you're checking us out, to stick around on February 1st for Explore East Point.\n\nI was sitting in the driver's seat of my car on the streets of Boston when I heard a question from the back seat: \"What's your story?\" I paused for a moment, trying to figure out how to answer. I was driving as an Uber driver at the time. I had just finished my master of theology from the University of Edinburgh in Scotland, and Mary and I had moved back to Boston, trying to figure out our next steps in life. It was a disorienting season. I felt called into pastoral ministry but wasn't sure what that could look like. Mary's health was struggling, I was applying to jobs, and in the meantime I was driving for Uber. Then this person in the back seat asked, \"What's your story?\"\n\nI paused because there were so many stories I could tell about my life. I could tell the story of being on the path to pastoral ministry and looking for where that was going to be. Or I could tell the story of Mary and me making videos on YouTube that were blowing up and gaining viewers. Or I could tell the story about how Uber offered a $1,000 incentive for someone who drove for 30 days. I tell you this story because the question of who are you and what's your story are interconnected. I want to suggest that your story shapes your identity. The story that you dwell on will be the story that defines you.\n\nWe're walking through a series in these weeks leading up to our launch as a church that we're calling \"Missional.\" I have this tagline: \"It's who we are.\" In many ways, I'm connecting two things—your identity and our mission. But before we get to mission, we have to think about identity. What shapes the question of who are you?\n\nTaylor Swift, in her commencement address at NYU, said this: \"We are so many things all the time. And I know it can be overwhelming figuring out who to be. I have some good news. It's totally up to you. I also have some terrifying news. It's totally up to you.\" The message of our age is that the question of identity—who are you—is answered by our culture, by who you define yourself to be. But for many of us, that is a haunting journey. Your identity is shaped by the story that you tell, and the story that you live is often a broken one.\n\nYou and I, as we engage with the question of who am I, have stories from our childhood, from our current present reality, from our hopes for the future that try to define who we are. We often feel trapped in those stories, longing for approval, longing for meaning. For many of us, the story that shapes our identity is a story of performance. How can I prove myself to be who I hope to be? That is a terrifying and often haunting journey. Your story shapes your identity, but here in 1 Peter chapter 2, verse 9, we find good news.\n\nHe's speaking to the church. They've been scattered because of persecution. He says: \"You are a chosen people, a royal priesthood, a holy nation, God's special possession, that you may declare the praises of him who called you out of darkness into his wonderful light.\" Notice verse 10: \"Once you were not a people, but now you are the people of God. Once you had not received mercy, but now you have received mercy.\"\n\nI want to suggest that Taylor Swift was right in that there is good news and there is terrible news. Our stories shape our identity, and for many of us, if that were left with the story of our own past, we would be hopeless. But the message of Jesus and the message of the church is that your story is not shaped by your past. It's not shaped by your present. It's not even shaped by what you do in the future. It is rewritten by the good news of Jesus for you.\n\nHere's what the message in 1 Peter chapter 2, verse 9 tells us: you can find a new identity. Not by just reinventing yourself, but by understanding yourself in a new story. It is the story of God who created you for a purpose, who loves you dearly, and who invites you into relationship with him. But there is something that prevents that relationship from happening, and it's our own sin and brokenness. Jesus says, \"I am going to take that upon myself.\" He goes to the cross, takes the payment for our sin, and then he says, \"I invite you into my life, death, and resurrection so that you can have this new identity. You are a chosen people, a royal priesthood, a holy nation, God's special possession. Once you were not a people, but now you are the people of God. Once you had not received mercy, but now you have received mercy.\"\n\nThis is the starting point of identity in Christ: Jesus rewrites our story. Those wounds from our past that drive us to performance—whether in our workplace or in our home—drive us to shame because we don't feel like we perform to the identity that we long to be. Even last night, I was sitting in this reality, trying to usher my kids to bedtime, feeling frustrated and angry with them, and then feeling shame. Why am I not a better father? Why am I not a better at whatever? The message of grace, the good news of the gospel, is that you are invited into another story that is not based on your performance but is based on Christ's love and his pursuit of you. He invites you into a new identity apart from what you have done or haven't done.\n\nThis is what starts with identity. He's going to lead us to ask, what does this mean for our mission? Before we get to mission, we have to understand that our story shapes our identity. The call of the gospel is to lay down the story of performance and take on the story of grace. You are loved. You are God's special possession.\n\nMy son Elijah is in the season of discovering he has pockets in some of his clothes. Pockets are really cool for a four-year-old because he found a rock at school. When he came home, you would think he had found a hundred dollar bill. He was putting his hands in his pockets saying, \"I got something to show you.\" He pulled out his rock and said, \"I found this.\" I asked him where he got it, and he said it was on the floor at school. He handed it to me and said, \"Maybe one day you can find a rock.\" It became his special possession.\n\nAt church, I want you to hear this: you are God's special possession, his treasured and valued child. I want you to let that sink in before we get to mission as a church. What we are called to do as East Point Church—I want you to rest in your identity of being treasured by Jesus. You are his treasured possession.\n\nHe gives three descriptions here in verse 9. First, you are chosen. In other words, it is God's initiative, not your achievement. Second, you are a royal priesthood. What is a priest? A priest is someone who mediates God's presence. As we think about our identity, we are invited into a space of being the ones who mediate God's presence to the world around us. A priest is given access to God and dwells among a people. There is this picture that God gives us here in 1 Peter chapter 2 as he describes who the church is. You are a royal priesthood. You have access to the King and you have the opportunity to bring his presence to the people around you.\n\nThen he says, a holy nation. Holy means set apart, having an identity apart from any other identity we have in this world. We are set apart for service, not for withdrawal.\n\nOur story shapes our identity, and then notice this: our identity shapes our mission. Notice verse 11: \"Dear friends, beloved ones, I urge you, as foreigners and exiles, to abstain from sinful desires which wage war against your soul, and live such good lives among the pagans that though they accuse you of doing wrong, they may see your good deeds and glorify God on the day that he visits.\"\n\nWho we are shapes how we live. Our identity shapes our mission. This is so important, church, as we prepare to launch in a couple of weeks and think about what it means to be the church for East Durham. It starts with being grounded in who we are. We don't belong here. We don't belong in this world. That's why he uses the words foreigners and exiles. Some translations use sojourners. I love the picture that word encapsulates—people on a journey.\n\n# Sermon Text\n\nWhen we put our faith in Jesus and receive the story of grace as our own story, our identity is changed. Our outlook on life becomes different. We start to see this world as not our home, as not where we find our primary identity. In some ways, the message of verse 11 is this: don't put your roots down here when you're traveling somewhere. If you're staying at a hotel for a night, you don't unpack your suitcase and put it in the dresser. You know you're not staying there. But here's my point—Peter is not saying to withdraw from the world. Verse 12 is clear about that. You have a mission here. But don't put your roots down here. Don't let your story be defined by your identity in this world. Let your story be defined by who you are in Jesus, that you are a child of the King.\n\nAs we take on that identity, we view our role in this world differently. In verse 9, Peter describes it like this: \"That you may declare the praises of him who called you out of darkness into his wonderful, marvelous light.\" Each of you who has put your faith in Jesus has a story of once being in darkness and being raised to new life, being called into wonderful life. It's the story of Ephesians chapter 2, which describes us: \"You were dead in your trespasses and sins, but God, because of his great love for us, made us alive together with Christ. By grace, you have been saved.\" This is the story of Jesus that we're invited into—that our identity is changed by the story of God.\n\nThe story that you dwell on will be the story that defines you. Why is this important? We're in a cultural moment in our country and in our world where there are all kinds of stories competing for your attention. News outlets and political parties will want you to be defined by a story. But the story of God invites us into something different. Our identity is not aligned with a political party. Our identity as American citizens or citizens of Durham is not our primary identity. Our identity is first and foremost grounded in who we are in Christ.\n\nHow does that change us? Well, it changes how we live. We live as foreigners and exiles, as people who once did not receive mercy but now we have received mercy. So don't put your roots down here, but bear fruit here. That is the message. Peter goes on to say in verse 12: \"Live such good lives among the pagans that though they accuse you of wrongdoing, they may see your good deeds and glorify God on the day he visits us.\" While we don't put our roots down here, there is a war for your soul. In verse 11, it says: \"Abstain from sinful desires which wage war against your soul.\"\n\nI remember distinctly the day—and I'm going to age myself because I was in seventh grade—when the planes hit the World Trade Center. I remember that moment sitting in class. They gathered us in a room, and my brain was still forming. I'll never forget watching my science teacher's face change as they announced this over the intercom. He said the words, \"This is war.\" That sunk in with me and almost haunted me. I want you to hear these words in verse 11: \"I urge you as foreigners and exiles to abstain from sinful desires which wage war against your soul.\" This is war. There is an enemy in this world who is vying for your attention, for you to be defined by a story other than the gospel, other than the truth that you are loved and chosen, a royal priesthood, a holy nation, God's special possession.\n\nThe enemy wants you to find your identity in your performance at work, your performance as a parent, your performance in the relationships of society in which you find yourself. This is what the world is vying for—for you to put your roots down here as your primary identity. That is war. The invitation, then, is this: if you allow the story that you dwell on to be the story of Jesus, we have an incredible mission and opportunity in our world to bear fruit. Peter is inviting us to have lives that are distinctly strange and desirably beautiful. Distinctly strange in that we are foreigners and exiles. We don't belong here. Our lives will look different than those defined by the stories of our world. But he invites us also into desirably beautiful lives.\n\nIn verse 12, when it says \"live such good lives,\" most of us import our idea of moral goodness into that word. But this is a different kind of word. It is often translated as beautiful or honorable. It is the picture of lives that get a double take—when you're driving down the road and something catches your eye, like a sunset or beautiful architecture. That is what he's describing here. In the Gospels, when they laid the stones of the temple, this word is used to describe that awe-inspiring architecture. It is the idea of when you eat food that just rejoices your soul and you say, \"That is good.\" Or if you're a car person and you hear an engine running that is perfectly timed with a bit of a roar, and you say, \"That sounds good.\" This is what Peter is describing—that our lives are worthy of a double take by the way we act in this world. He says this: \"When they accuse you of doing wrong—which is inevitable—they will see your good deeds and glorify God on the day he visits us.\"\n\nNow, what is this day when God visits us? In some ways, the New Testament talks about the day of God's visitation as the day when Jesus will return and make all things new. Peter may be referring to that future day. But I also wonder if Peter is talking about God's visitation as the day that God intervenes in people's lives. In Acts chapter 15, there's a moment where they're describing the time when God came to the Gentiles and changed their lives. It says: \"Brothers, listen to me. Simon has described to us how God first intervened to choose a people for his own name from the Gentiles.\" This word \"intervened\" is the same word that Peter uses here in 1 Peter chapter 2 for \"visit.\" So I wonder if Peter might be casting a vision for us: that the way we live in this world could be a part of God intervening in people's lives. Our presence here would suggest God's presence here. We would live such merciful lives that it would tell the story: \"Once I was nothing, and then Jesus intervened, and he can do that for you too.\"\n\nThis is what we are invited to. The gospel makes us a merciful people declaring and demonstrating what God has done in our lives, believing that he wants to do the same in others. There's a Scottish preacher named Alexander McLaren who says this: \"The world takes its notions of God most of all from the people who say they belong to the family of God. They read us a great deal more than they read the Bible. They see us; they only hear about Jesus Christ.\"\n\nThis is what we are invited into. We would live as those who find our identity in Christ. We would live distinctly strange but desirably beautiful lives. People would see the way we live, the way we love our neighbors, the way we care for the marginalized and the outcasts, the way we fight for justice and stand with the oppressed, the way we find our identity in Christ and not in the squabbles of this world. Just before this passage, at the beginning of chapter 2, Peter says: \"Therefore, rid yourselves of all malice and all deceit, hypocrisy, envy, and slander of every kind.\" If I look at our political landscape, that defines it. What would it look like for us as the church to find our identity in Jesus and live distinctly strange and desirably beautiful? When people see the way we act with mercy, the way we walk humbly, the way we love justice, they would do a double take and say, \"There must be something different there.\"\n\nThis might be part of what our core value means—that we expect God to change lives, that God would intervene, that he would visit his people and change lives. This is our hope. Martin Luther King Jr., in 1963, preached a sermon in which he said: \"If the church does not recapture its prophetic zeal, it will become an irrelevant social club without moral or spiritual authority.\" This is what we are called to be—a prophetic voice in our culture today. But it starts with this: an identity grounded in the story of Jesus. Not your past, not your present condition, but our future hope that gives us a present reality grounded in a historical fact—that Jesus rose from the dead, that he died for us to give us new life.\n\nAs we find our identity in that story, I think we will find that missional is who we are. Missional is what defines how we live, because we want to engage with the people in the world around us in ways that help them see who God is and what he has done. Our vision statement is that we would bring hope to the triangle and the nations as we proclaim and embody the good news of Jesus. Embedded in that statement is, first, the story that redefines us—the good news of Jesus. Second, the mission to bring hope to our situation. We live in the triangle and are surrounded by the nations, and we want to bring hope to both. But how do we do it? Peter describes it here. He says: \"You are God's chosen people, a royal priesthood, a holy nation, God's special possession, that you may declare the praises of him who called you out of darkness and into his wonderful light.\"\n\nNotice what Peter is saying: declaring and proclaiming is simply telling the story of real hope. Once I was here, and now I am here. Once I did not have hope, but now I have hope. Once I did not receive mercy, but now I have mercy. But it doesn't stop with declaring. He says demonstrate it. Live merciful lives because you are a people of mercy. So it is our invitation that we would be a merciful people declaring and demonstrating, proclaiming and embodying what God has done in our lives, believing that he wants to do the same in others.\n\nThe invitation I have for us this morning is this: the story that you dwell on most is the story that will define you. It's easy in our day and age with all these voices—news feeds and things competing for your attention—to let yourself be defined by them. But the invitation of Jesus is this: you are a chosen people, a royal priesthood, a holy nation, God's special possession, that you may declare the praises of him who called you out of darkness into his wonderful light. Once you were not a people, but now you are the people of God. Once you had not received mercy, but now you have received mercy. Each week we return to the table of Jesus to remind ourselves of this story and to awaken our senses.\n\n# Cleaned Transcript\n\nTo the reality that the life, death, and resurrection of Jesus changes everything. As we continue in worship, we are going to respond through singing. We'll have people on the edges of the room with lanyards who would love to pray with you and encourage you. This is a space for responding and recalibrating your heart and mind into the story of God.\n\nAt any point during these three songs, if you are a follower of Jesus, I invite you to come to the table to take the bread that Jesus said, \"This is my body which is broken for you. Do this in remembrance of me.\" He took the cup and said, \"This cup is the new covenant in my blood poured out for the forgiveness of sins. As often as you eat this bread and drink this cup, you proclaim the Lord's death until he comes.\" I invite you at any time during these songs to return to the story where we find our identity. You'll hear me say this often: this isn't a magical snack, but it's more than an object lesson. It is an invitation from Jesus to recalibrate your heart into the story that matters most. If you're a follower of Jesus, this table is for you.\n\nLet's pray together that we would be the mercy-filled people that Jesus invites us to be. God, I come to you this morning thankful that this is the message and text that we planned weeks ago. As I watched the news this week of political tensions with ICE and the loss of life, Lord, we believe that every person is created in your image, and we want to be a church compelled by that reality. There are all kinds of stories and narratives competing for my attention and identity. I want to lay those things down this morning and say I want to be filled with your mercy for all people created in your image.\n\nGod, I want us to be a community shaped by your mercy, transformed by your grace in such good and beautiful ways that people in our community might do a double take and ask what's different. It might lead to lives transformed by your grace, communities transformed by your justice, and homes transformed by you. We ask these things in Jesus' name. Amen.","url":"https://www.youtube.com/watch?v=OmWxXqpmeK4"},{"id":"O9lipVkhWM0","date":"2026-01-05","title":"Multiplying Disciples Together","scripture":"Matthew 28:18–20","preacher":"Peter Frey","series":"Together","desc":"In Matthew 28, Jesus calls His followers to make disciples of all nations. Join Pastor Peter Frey as he shares how God uses His church to multiply disciples and change lives. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Cleaned Transcript\n\nThis morning, join me in reading aloud this prayer for illumination. The words will be on the screen. Guide us, oh God, by your word and holy spirit that in your light we may see light, in your truth find freedom, and in your will discover peace through Christ our Lord. Amen.\n\nPlease remain standing as you are able for the reading of God's word from the Gospel of Matthew 28:18-20. Then Jesus came to them and said, \"All authority in heaven and on earth has been given to me. Therefore go and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, and teaching them to obey everything I have commanded you. And surely I am with you always to the very end of the age.\" This is the word of the Lord.\n\nGood morning, East Point. It is great to be gathered with you. If I haven't had the chance to meet you yet, my name is Peter, and I have the joy of serving as lead pastor here at this new church called East Point. We are at an exciting moment in the life of our church. Since September, we have been in what we've called soft launch mode, where we've been learning our rhythms as a new church, and we are officially launching at the end of this month. If you're new this morning, you're joining us at an exciting moment—the ground floor of what God is doing in the forming of a new community called East Point.\n\nIf you are a child from kindergarten to fifth grade, I want to dismiss you to go to your adventurers classroom. There are a couple of leaders in the back who will meet you and take you to your class. Thanks for worshiping with us. I love the energy here.\n\nAs we anticipate publicly launching as a church, we are taking this opportunity at the ground floor of who we are to dedicate the next three weeks—three weeks from now is January 25th—to a season of radical dependence upon God. One of our core values, which you'll see out in the hall
