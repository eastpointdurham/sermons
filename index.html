ee songs, we'll have some people on the edges of the room wearing a green lanyard. If you want somebody to pray with you, the invitation is there. Jesus said, \"My house shall be a house of prayer.\" This is the house of the Lord.\n\nThen we're going to come to the table together. We do this weekly as a way to remember the good shepherd who laid down his life for us. He says, \"No one takes it from me. I give of myself for you.\" This table is the gift of Jesus for you. If you are a follower of Jesus, at any point during these three songs, I invite you to come to the table and remember Jesus's words on the night he was betrayed: \"This is my body which is broken for you. And this is my blood that is shed for the forgiveness of sins. As often as you eat this bread and drink this cup, you proclaim the Lord's death until he comes.\"\n\nChurch, let's stand together and sing because we have a good shepherd.","url":"https://www.youtube.com/watch?v=6GM81BTH-_E"},{"id":"ltJyyc_2kW0","date":"2025-11-07","title":"Light of the World","scripture":"John 8","preacher":"Peter Frey","series":"John","desc":"In John 8, Jesus declares, “I am the Light of the World.” Join Pastor Peter Frey as he shares how Christ’s light overcomes darkness and brings real hope for real life. Experience it this Sunday at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript\n\nLast night we observed the end of daylight savings time. As of today, you now write EST because daylight savings has ended. We have this weird time change where we observe daylight savings time during the spring and summer months and then return to standard time in the winter. We are now in standard time.\n\nIt is a strange practice, I'll acknowledge that. But every time the clocks change, it settles on us this evening at 5:00 pm—how much we take light for granted. It's amazing what an extra hour of sunlight makes. During the shorter days of fall and winter, it is estimated that at least 17 million people in North America suffer from what is called seasonal affective disorder, which is essentially depression brought on by a number of factors, but one major cause being the reduction of daylight.\n\nWhenever we engage in this practice of changing our clocks, I realize how much I take light for granted. I flip on a switch or ask Google to turn on the lights and with the blink of an eye, lights come on. I'm thankful for these modern conveniences, but if we're not careful, we'll miss the force and meaning of Jesus's words in John 8:12 when he says, \"I am the light of the world. Whoever follows me will never walk in darkness, but will have the light of life.\"\n\nThis is the second of seven \"I am\" statements that we find throughout the Gospel of John. As we looked at last week, the first of these was \"I am the bread of life.\" These revelatory statements that Jesus makes are more than passing metaphors. The grammar that Jesus uses—the Greek words \"ego ami\"—connect Jesus's words to the very words of God to Moses in Exodus. In Exodus 3:14, when God reveals his name to Moses, he says, \"I am the self-existing one, ego ami.\" And so in each of these \"I am\" statements in the Gospel of John, Jesus is not simply telling us what he is like. He is revealing who he is. He is God himself.\n\nWhen Jesus says, \"I am the light of the world,\" our minds are taken back to the very first words that come from the mouth of God: \"Let there be light.\" God speaks light into a world that is formless and void, and light becomes the first visible expression of God's creative presence in the world. It's not surprising then that throughout Scripture, light becomes a picture of God's presence. When the people of Israel wandered in the wilderness, God led them by a pillar of fire by night. It's not surprising that the Old Testament prophets pick up on the theme of light when they prophesy of a day when God will visit the earth and bring salvation to all people.\n\nIsaiah says this: \"The sun will no more be your light by day, nor the brightness of the moon shine on you. For the Lord will be your everlasting light, and your God will be your glory. Your sun will never set again, and your moon will wane no more. The Lord will be your everlasting light and your days of sorrow will end.\" The hope of all of history is wrapped up in the picture of light.\n\nIt's not surprising then that John starts his gospel with the words: \"In him was life and that life was the light of all mankind.\" He puts the whole gospel in the context of Jesus coming to bring light. In verse 9 of John chapter 1, it says, \"The true light that gives light to everyone was coming into the world. He was in the world, and though the world was made through him, the world did not recognize him.\"\n\nJohn is expanding this metaphor of light to help us understand why Jesus came and what his role is in this world. He continues this in a passage we looked at several weeks ago in John chapter 3, where we have the familiar verse John 3:16: \"For God so loved the world that he gave his one and only son that whoever believes in him should not perish but have everlasting life.\" We often stop reading there because that's so good. But a couple verses later, in verse 19, we read this: \"This is the verdict: Light has come into the world, but people loved darkness instead of light because their deeds were evil. Everyone who does evil hates the light and will not come into the light for fear that their deeds will be exposed.\"\n\nAs we see this theme of light unfolding in the Gospel of John, we have to understand what John wants us to see in this metaphor of light. Light exposes darkness and reveals what is life. Light exposes darkness and reveals what is life. We're in a series we've called \"Real Life Jesus,\" where we're walking through moments in the Gospel of John where this is the overarching theme and purpose of John's writing. He wants you to experience real life today, here in Durham in 2025. He wants you to experience real and true life.\n\nAs we unfold and see this theme of light dawning in the Gospel of John, we see that light has in its inherent nature the ability to expose darkness and reveal what is life. From the literary context of John's gospel, when Jesus says, \"I am the light of the world,\" we understand that Jesus is a light that exposes darkness and reveals what is life. But in order for us to fully understand and grasp the force of Jesus's words in John 8:12, we have to understand the setting in which Jesus spoke them.\n\nWe need to go to chapter 7, verse 37. Before we jump back that far, you're probably wondering about the story right before it that we just read. You'll probably see some demarcation in your Bible indicating that this story was not included in some of the early manuscripts—the story with the woman caught in adultery. It's an amazing story, but it's pretty much universally accepted by scholars that this was probably not written by John himself. However, it's almost universally accepted by biblical scholars that this is a historically accurate account of something that happened, and it was probably written by the church.\n\nImagine that the church receives this letter from John describing the real life that is found in Jesus. You know how sometimes you read a story or biography and suddenly your mind inserts knowledge you have, thinking, \"Oh, this would fit right here perfectly\"? I imagine that's what happened with this story in the Gospel of John. As John's gospel began circulating, there was this story of a true event in Jesus's life, and the church recognized, \"This would fit right here and prove this point so well.\" We'll get to that in a moment.\n\nIn John's writing, chapter 7 comes right before verse 12 of chapter 8. So here in chapter 7, verse 37, it says: \"On the last and greatest day of the festival, Jesus stood and said in a loud voice, 'If anyone thirsts, let him come to me and drink. Whoever believes in me, as the scripture said, out of his heart will flow rivers of living water.'\" Earlier in chapter 7, we learned that this festival is called the Feast of Tabernacles, or the Feast of Booths. It's a Jewish practice and celebration.\n\nHere they are at this great feast—a seven-day ceremonial celebration. Jewish history shows us that this is a feast full of joyful celebration. It's a seven-day period where the people of Israel would basically camp out in tents, remembering the time they spent in the wilderness after they left Egypt and before they entered the promised land. Here we have this ceremonial seven-day party of the people of Israel.\n\nJewish literature shows us there's an almost order of service that the people would observe every year. On the last day of the feast, there would be a moment when the priests would go down to the stream, get buckets of water, bring them to the altar, and pour them on the altar. There was a liturgy they would read that goes: \"He who has not seen the joy of the place of water drawing has never in his life seen joy.\" It's almost like when I say, \"If you've never had a crab cake in Maryland, you've never had a crab cake.\" I worked at a wedding venue in Massachusetts during my time in seminary, and during cocktail hour, I got to know the chef really well. He had Maryland crab cakes on his menu. The way it worked for servers was you go into the kitchen, they hand you a tray, and they tell you what to say when you serve this to a guest. He would always hand me a tray and I would refuse to call it a Maryland crab cake. I'd say, \"I'll call it a crab cake, and I'll say you use Maryland crab meat, but that is not a Maryland crab cake.\"\n\nThis statement at the Feast of Tabernacles was: you have never experienced joy if you've never been to this moment where they draw water and pour it on the altar. If you read the history of the Feast of Tabernacles, right after that statement, there was a lighting ceremony with four giant torches in the courts of the temple. After they poured the water on the altar, priests would climb to the top of these poles and light these giant torches. It's said that these four torches would light up the entire city of Jerusalem.\n\nIt's at that moment—in the liturgical moment of the Feast of Tabernacles—that Jesus stands up and says, \"I am the light of the world.\" Jesus here is not only saying, \"I am the source, the well that you draw from and find true joy,\" but \"I am the light that exposes the darkness and reveals what is really life.\" In the context of these torches being lit, some of the commentaries I read said it was a party like you've never seen. They would dance all night. There would be music and celebration.\n\nJesus is revealing that the role of light—him being the light of the world—is not just revealing who Jesus is. He is God himself. It's not just a promise of hope, because woven into the Old Testament prophets is this hope that one day the Lord himself will be our light. There will be no more sun and no more moon, but God will dwell with us. Yet there was an eeriness to the Feast of Tabernacles because in Ezekiel we read that God's presence left the temple. In Ezekiel 9 through 11, there's a moment where the presence of God visibly leaves the temple. Ever since then, the people of Israel, year after year, light these torches as an eerie reminder that God's presence isn't here. Yet there's this celebration that they are people longing for God's presence.\n\nThere in the midst of the celebration and liturgy, Jesus is revealing that God has taken on flesh. His glory is back in the temple. And he says, \"I am the light of the world.\" Jesus's words are a revelation of his identity, a promise of his hope, and an invitation to experience his joy. This is what Jesus does: he exposes darkness and reveals what is light.\n\nWhen we think about darkness and consider the purpose of the early church, including this story of chapter 8 verses 1 through 11 placed right in the middle of this whole narrative, I think it is an illustration for us of what it looks like when Jesus is the light of the world.\n\n# Sermon Transcript\n\nJesus says in John 8:12, \"I am the light of the world. Whoever follows me will never walk in darkness but will have the light of life.\" If Jesus is the light of the world who reveals what is true, exposes what is false, guides whoever follows, and gives life to whoever believes, then his interaction with a woman in John 8:1-11 is an illustration for us of how the light of Jesus wants to come into the windows of our soul.\n\nThis woman is caught in adultery and brought before Jesus. The religious leaders want to trick him. According to Old Testament law, if two people are caught in adultery, they must be seen in the act. Already we see this is an unfair trial—only the woman is brought before Jesus. The Pharisees are frustrated with the grace of Jesus. He hangs out with tax collectors and sinners, and in their minds, he is too lenient with the law. As they bring this woman before Jesus, they are testing him. If Jesus upholds the law and stones her, they can attack his grace. If he doesn't stone her, they can claim he is not a true prophet and is not upholding Mosaic law.\n\nThey bring her before Jesus and ask what he will do. Then comes this mysterious moment where Jesus writes in the sand. Everyone wonders what he is writing—the Ten Commandments? The sins of those standing there? The point is not the details. When scripture withholds details, those details are not the point. The point is that Jesus, the light of the world, is exposing darkness. He exposes that everyone standing there is on an equal playing field. Before God, before the light of the world, we all have darkness. We all have sin. Sin is placing counterfeit gods in the place of God.\n\nWhen we think about what is real life, we must also think about its opposite: counterfeit life. The nature of sin is looking to counterfeit gods as the source of life. Jesus exposes not just this woman's sin—that is already exposed by the crowd—but everyone's sin. He says, \"Let he who is without sin cast the first stone.\" What happens? Jesus continues writing in the dirt. One by one, from oldest to youngest, they walk away. Why the oldest first? Because they have lived long enough to know that they are not without sin. That is true of you. That is true of me. This is what the light of Jesus does in our lives—it exposes the counterfeits that we so easily turn to.\n\nAs the light exposes the sin, they all depart. Jesus says to the woman, \"Does anyone condemn you?\" She says no one does. Jesus responds, \"Neither do I condemn you. Go and sin no more.\" This is the grace of Jesus embedded in the light. The light does not just expose darkness; it reveals what is light. Jesus's interaction with this woman illustrates for us that whoever comes to Jesus does not have to get their life together first to experience his grace. He says: come to me, experience my grace, and then sin no more.\n\nThe light, the purpose of the light of the world, is not to condemn but to lead us into the fullness of real life. Jesus is the light of the world who reveals what is true and what is real life, exposes what is false—the counterfeits we so easily turn to—guides whoever follows, and gives life to whoever believes. There are so many people in our world longing for something to tether them as they navigate this life, which often feels like darkness. Jesus says, \"I am the light. I will guide whoever follows me, and whoever believes in me I will give life.\" This is the invitation of Jesus. He did not come simply to expose darkness but to invite the darkness to experience the joy of the light of life. It is fair for us to borrow the words of the feast of tabernacles: \"He who has never experienced the light of Jesus has never in his life experienced joy.\"\n\nI love the water and stories about the water. Having grown up navigating waters, I love learning about lighthouses. I remember hearing this story some years ago. A captain of a ship looked into the dark and saw a light in the distance. He immediately told his signalman to send a message over the radio: \"Alter your course 10 degrees south.\" He promptly received a reply: \"Alter your course 10 degrees north.\" The captain was furious and sent another message: \"Alter your course 10 degrees south. I am a captain.\" Soon another reply came: \"Alter your course 10 degrees north. I am a lighthouse.\"\n\nWhen we think about Jesus as the light of the world, we must realize that Jesus is not what our culture sometimes thinks religion is. Our culture often views religion as a spotlight that simply finds all your sin, airs out all your dirty laundry, makes you feel bad about yourself so you can do some good works to feel better about yourself. That is man-made religion. But the story of Jesus is categorically different. He says, \"I am the light of the world. I am a lighthouse. I am not telling you to alter your course simply because I want you to change your life, but because there is danger on this side and there is life on this side. I want you to see it. I want you to experience real life.\"\n\nWhen we spend time with Jesus, the light exposes in us the ways we turn to counterfeit things. For all of us, Jesus's words are an invitation to engage in phototherapy. Phototherapy is a treatment for seasonal affective disorder—essentially light therapy. Biologically, God designed our bodies to crave daylight. I believe he also designed our bodies and souls to crave the light of Jesus. The light does expose us. This past week, as I spent time with this passage, I felt Jesus keep exposing layers of me—areas where I turn to the perception of others, to busyness, to scrolling on my phone to satisfy my soul. The invitation of Jesus is to spend time in the light and let those things be exposed. Why? Not so you can feel worse or better about yourself, but so you can see Jesus. You can see where true life, real life, life as it was meant to be lived, is found in Jesus and nothing else.\n\nJesus says, \"I am the light of the world who reveals what is truth, exposes what is false, and guides whoever follows and gives life to whoever believes.\" Some of you this morning might feel uncomfortable with the reality of Jesus as the light of the world, because light does expose darkness in us. You can do one of two things with that reality. You can run back to the darkness—that is the pattern of all mankind. When Adam and Eve sinned, the Lord said, \"Where are you?\" He wanted to extend grace, but they hid themselves. I want you to hear the words of Jesus to the woman in John 8: \"Neither do I condemn you, but go and sin no more. Experience life not in your performance, but in my grace.\" This is where real life is found—in the light of Jesus. It has healing properties. It is redemptive as it shines and reveals what is false in us.\n\nBrothers and sisters in Jesus, those of you who are followers of Jesus, I want to invite you into a regular practice, especially as we enter these winter months where it is darker. Make a regular practice of sitting in the light. It is a bold prayer to pray: \"God, reveal in me what is not of you.\" It is often a hard process. It is easier to move on to the next thing, to fill our schedule, even to read our Bible and move from one thing to the next without spending time letting the light reveal what is counterfeit in us.\n\nJesus says, \"I am the light of the world. Whoever follows me will not walk in darkness, but whoever believes in me will have the light of life.\" The phrase \"light of life\" literally means the light that leads to life. The process of experiencing real life does not happen without the light shining into the darkness and exposing. Make a regular practice of sitting with Jesus. Start with a timer on your phone—five minutes. Ask Jesus, the light of the world, \"Would you reveal in me what is not of you?\" Not as a guilt trip, but as a journey of looking to Jesus, the light of the world.\n\nWe are going to respond this morning in three ways. First, we will respond in singing. Jesus is the light of the world and is worthy of our praise. Second, we will respond in prayer. Jesus said, \"My house shall be a house of prayer.\" While we sing these next three songs, there will be people on the edges of the room wearing green lanyards. If you want to pray with somebody, they are there to pray with you and for you. It does not have to be a crisis. It can simply be: \"Would you stand with me while I ask Jesus to reveal what is darkness in me?\"\n\nThird, we are going to come to the table. The instructions are on the edge of the room. At any moment during these three songs, I invite you to come to the table if you are a follower of Jesus. You will take the bread and dip it in the cup. In this practice, we remember Jesus's words on the night he was betrayed: \"This is my body which is broken for you, and this is my blood that is shed for the forgiveness of sins.\" We return to this table weekly as a church to remember that our worth, our identity, everything that we are is not based on who we are but on who Jesus is and what he accomplished for us in his death and resurrection. There is forgiveness at the table of Jesus. That is why it is good news for you and me that Jesus is the light of the world. If it were not for this, it would be terrifying. But there is grace.\n\nPsalm 36 says this: \"How priceless is your unfailing love, O God. People take refuge in the shadow of your wings. They feast on the abundance of your house. You give them drink from your river of delights. For with you is the fountain of life and in your light we see light.\" Let us stand and worship together.","url":"https://www.youtube.com/watch?v=ltJyyc_2kW0"},{"id":"VZ07pFEuX4M","date":"2025-10-28","title":"Bread of Life","scripture":"John 6","preacher":"Peter Frey","series":"John","desc":"In John 6, Jesus declares Himself the Bread of Life — the only one who truly satisfies our deepest hunger. Join Pastor Peter Frey as he shares how real life is found in Jesus alone. Experience real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# John 6:22-35 – Jesus the Bread of Life\n\nJoin me in reading aloud this prayer for illumination. The words will be on the screen.\n\nHoly God, word made flesh, let us come to this word, open to being surprised. Silence our agendas. Banish our assumptions. Cast out our casual detachment. Confound our expectations. Clear the cobwebs from our ears. Penetrate the corners of our hearts with this word. We know that you can. We pray that you will, and we wait with great anticipation. Amen.\n\nPlease remain standing as you are able for the reading of God's word from the Gospel of John, chapters 22-35. On the next day, the crowd that remained on the other side of the sea saw that there had been only one boat there, and that Jesus had not entered the boat with his disciples, but that his disciples had gone away alone. Other boats from Tiberias came near the place where they had eaten the bread after the Lord had given thanks. So when the crowd saw that Jesus was not there nor his disciples, they themselves got into the boats and went to Capernaum seeking Jesus. When they found him on the other side of the sea, they said to him, \"Rabbi, when did you come here?\"\n\nJesus answered them, \"Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate your fill of the loaves. Do not work for the food that perishes, but for the food that endures to eternal life, which the Son of Man will give to you. For on him God the Father has set his seal.\" Then they said to him, \"What must we do to be doing the works of God?\" Jesus answered them, \"This is the work of God, that you believe in him who he has sent.\"\n\nSo they said to him, \"Then what sign do you do that we may see and believe you? What work do you perform? Our fathers ate the manna in the wilderness, as it is written, 'He gave them bread from heaven to eat.'\" Jesus then said to them, \"Truly, truly, I say to you, it was not Moses who gave you the bread from heaven, but my Father gives you the true bread from heaven. For the bread of God is he who comes down from heaven and gives life to the world.\" They said to him, \"Sir, give us this bread always.\" Jesus said to them, \"I am the bread of life. Whoever comes to me shall not hunger, and whoever believes in me shall never thirst.\"\n\nThis is the word of the Lord. Thanks be to God.\n\n---\n\nGood morning, East Point. We had a cool multi-version experience there during that reading, and in some ways that helps highlight the word to us as we see it in different translations. If you are following along with our Bible reading plan, or if you've gotten one of the Gospel of John journaling Bibles, they're on the high-top table in the back. Inside you'll find a reading plan, though this week got left off of that paper somehow when we first printed it. If you want to follow along this week, make sure we have your email because I sent out an email this past week with the updated reading plan. I'd love to send it to you so you can journey through the Gospel of John with us.\n\nHow many of you remember the game Guess Who? It's a fun one. You have a slew of characters, and your task is to figure out who the other person is by asking questions. The traditional way to play is with physical characteristics. You ask, \"Do they have brown hair?\" and if they say yes, you can put down all the cards that don't have brown hair. By process of elimination, you figure out who the other person is. But there's a much more fun version where you play without asking about physical characteristics at all. Instead, you ask questions like, \"Would you date this person?\" It makes this no longer a kids' game—it becomes a fun party game where you can come up with all kinds of scenarios.\n\nWhen Mary and I were in college, we went to a small Christian school in downtown Chicago, which was a very formative time in our lives. Our professors were very dear to us and had a big impact on our lives. So one year for Mary's birthday, I converted our Guess Who game to feature all of our professors from college. We would play and try to guess which professor the other person was. Here's the thing: when you actually know somebody, it's not just like a cardboard character. When you know the person, you ask different questions.\n\nThe Gospel of John is centered around the question: Who is Jesus? And when you start to see the layers peeled back, you start to ask different questions. It's no longer just \"Who is this person?\" but \"What is the significance of this person?\" As the Gospel of John unfolds, it's like a game of Guess Who as Jesus reveals himself and his followers try to understand who he is. All of us, I think, are on a journey of the very same thing. Whether you are asking the question \"Who is this guy Jesus who lived and walked the earth 2,000 years ago and what significance does he have in my life?\" or whether you are a follower of Jesus walking with him through the Gospel of John asking \"What significance does this belief in Jesus make in my life today?\"—all of us are asking this question: Who is Jesus?\n\nHere this morning we come to John chapter 6. We're walking through a series we've called \"Real Life Jesus.\" As Jesus reveals himself in John chapter 1, it says the Word—the self-existing one—became flesh and dwelt among us, and we have seen his glory, the glory of the one and only. We have seen God in Jesus. In many ways, what we have in Jesus is God with flesh on, making himself known to you and me. Throughout the Gospel of John, as he's revealing himself, last week we looked at where Jesus says, \"I am the living water. Whoever drinks from me will never thirst again.\" We saw that Jesus wants to satisfy that thirst, that longing deep within each of us.\n\nAs this is happening in John chapter 6, we come to an interesting moment. What happens before the passage we just read is a miracle—the only miracle that we find in all four gospels, all four accounts of Jesus revealing himself through signs. John likes to use the word \"sign,\" and I want to ask: What's the purpose of a sign? Hopefully when you came in this morning, you saw lots of signs. We've put lots of signs out, and they have a purpose. We want to give clarity. That's something we strive for at East Point—when you walk in these doors, you have clarity about who we are, what we're about, where you're supposed to sit, where the coffee is. The purpose of a sign is to give clarity. Jesus gave signs. Whenever John says, \"This was the first of the signs that Jesus performed,\" he's trying to give clarity about who Jesus is.\n\nSo what is this thing that Jesus does that's recorded in all four gospels? He feeds 5,000 people with a few loaves and a few fish. He miraculously multiplies a little boy's lunch to feed thousands. We're told this is a sign. Notice what the disciples—the followers who were there that day—say as they try to figure it out. In verse 14, it says, \"When the people saw the sign that he had done, they said, 'This is indeed the prophet who has come into the world.'\" They're putting the pieces together. Jesus does something miraculous. He is somebody special, and not just somebody—they're saying he's the prophet. What do they mean by this? Verse 15 tells us: \"Perceiving that they were about to come and take him by force to make him king, Jesus withdrew again to the mountain by himself.\"\n\nAs Jesus reveals himself through signs, the people are starting to figure out that Jesus is special. But what exactly do they think he is? Jesus knows what they mean because when we jump down to verse 25, after they find him on the other side of the sea—after he's crossed the sea and performed another miracle by walking on water—Jesus answers them. He says, \"Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate your fill of the loaves.\" Jesus sees beneath what they are seeking.\n\nHere's what I want us to see. As Jesus is about to reveal who he is, he gives us a metaphor. Throughout the Gospel of John, seven times Jesus reveals a metaphor about who he is, using the same terminology with each one: \"I am.\" Here in John 6, he says, \"I am the bread of life.\" Jesus is about to reveal this to his disciples, but first he sees beneath their seeking. In order for us to understand that Jesus is the bread of life, we have to see what's happening here with the disciples.\n\nThey are seeking Jesus because they had their fill of the loaves. What's significant here is that they see Jesus is somebody special—he's the prophet, and they want to make him king. But what do they really want? They want him to fix their problems. They want Jesus to be a problem solver. It makes sense, doesn't it? What do we do when our lives get turned upside down? What do we do when we face a circumstance or get that phone call and our world starts to swirl? When we feel the brokenness of the world, we want a problem solver. Many of us find that shapes a lot of our prayer life. We come to Jesus and say, \"Jesus, I've got this thing that I want you to fix.\"\n\nBut what Jesus wants his disciples to get—and this is why he's calling them out—is this: You aren't seeking me because you saw the sign and found clarity. You're seeking me because you saw the sign and you want something from me. And Jesus wants us to get this morning when he says, \"I am the bread of life.\" He wants to communicate to us that he is not the problem solver. He is the solution.\n\nI'm not from the South originally—do you guys consider us from the South? It's debatable. I grew up south of the Mason-Dixon line in Maryland, about ten minutes from that line. I lived in Boston for ten years, so I consider myself a northerner. But something you all say down here is that when you have a Thanksgiving meal, you have the turkey and all the fixings. Now, the fixings are the extra stuff on top of the meal. It's what makes the turkey good—the cranberry sauce, the extra gravy, all the fixings.\n\nI joke about this terminology, but I think it's a great picture of how the disciples are approaching Jesus here. They want him to be the fixer and the fixings. They want him to solve their problems and be the extra stuff that makes life better. They want to make him king. There's Roman oppression in the first century—the Romans are ruling over. If Jesus can take a little boy's lunch and feed a multitude, what could he do with the Romans? I wonder how often we approach Jesus like that too. If Jesus can do that, what could he fix in my life? We keep him at arm's distance a little bit, saying, \"Jesus, would you come and make this better? Would you come and fix my marriage? Would you come and fix my relationship with my son or daughter?\" Don't get me wrong—Jesus cares about these things. But what I want us to see, and what I think Jesus is trying to communicate to his disciples here in John 6, is that he is not merely the fixer or the fixings.\n\n# A Problem Solver, or the Feast?\n\nJesus is not the fixer or the fixings. He is the feast. He is the solution. As this passage unfolds, Jesus confronts the way they are approaching him because he wants them to approach him as the substance of what their souls need. In this series called \"Real Life Jesus,\" we're asking the question: Where is real life found? What are the moments in life when you would say, \"I am really living\"?\n\nJesus wants us to see that real life—really living—is found when we see Jesus not as someone we get sustenance from, but as the very person who is our sustenance. It's a simple distinction, but it's a change in how we view Jesus. The question is: Is Jesus somebody that we get something from, or is Jesus what we are actually longing for? That's what Jesus is inviting us into when he says in verse 35, \"I am the bread of life. Whoever comes to me shall not hunger, and whoever believes in me shall never thirst.\"\n\nWhen Jesus says \"I am,\" we must understand the context of those words. In Greek, these are the words *ego eimi*. As we look across the scope of Scripture and see how God reveals himself, these are two very important words. Back in Exodus, when Moses is called to deliver the people of Israel out of slavery in Egypt, Moses asks God, \"When I go to them, who shall I say sent me?\" God reveals himself and says, \"Tell them I am the I Am.\" It's a statement about self-existence: I am the self-existing one. This is how God revealed himself to be in the Old Testament. Throughout the Old Testament scriptures, there echoes this statement—God reveals himself as the self-existing one, the I Am.\n\nAs the scriptures unfold throughout the centuries, we have a Greek translation of the Old Testament. The Old Testament was written in Hebrew and eventually translated into Greek because that was the common language in Jesus's day. It's beautiful to see that God reveals himself to every language, tribe, and tongue in their own language. As the plan and mystery of God unfolds, we have this Greek translation of the Old Testament, and we find that when God reveals himself to Moses, he uses the very same words that Jesus uses here in the Gospel of John: *ego eimi*, \"I am.\" This is more than a metaphor. Jesus is making a statement about who he is. He is saying, \"I am God.\"\n\nThis confronts the disciples in their seeking and longing. They understand that Jesus is special—he could just create and feed a crowd. Imagine what he could do for us! But Jesus wants them to understand that he is not a problem solver. He is the solution. He is God himself. All of us at some point are confronted with the very same question: Who is Jesus to you? Is he a prophet, a good teacher? Is he someone worth ordering your life around?\n\nBefore Jesus reveals that he's the bread of life, notice what the disciples said to him in verse 28: \"What must we do to be doing the works of God?\" Their response is, \"What do I need to do?\" And Jesus is saying, \"It's not about something that you do. It is about me.\" This is important for us to understand. Self-made religion seeks to get sustenance from God. But genuine faith finds sustenance in God itself.\n\nSelf-made religion says: If I go to church, if I read my Bible, if I pray, if I give money to the poor, then I can satisfy God, and that will satisfy me. That is self-made religion. But genuine faith says: God is my satisfaction before I do anything. I am loved by a God who stepped out of eternity. He took on flesh to reveal himself to me—not as the fixer or the fixings, but as the feast. That is who Jesus is when he says, \"I am the bread of life.\"\n\nN. T. Wright says of this passage: What matters is not what Jesus can do for you. What matters is who Jesus is. Only if you're prepared to be confronted by that in a new way can you begin to understand what he can really do for you and what he really wants to do for you. What matters is not what Jesus can do for you. What matters is who Jesus is. And he says, \"I am the feast. I am the one you are longing for.\" Jesus is the sustenance that our souls long for because he is the substance. He is God himself. That is what he's revealing in each of these \"I am\" statements.\n\nMark Sayers, in his book *The Disappearing Church*, describes our culture like this: We want the kingdom of God without the king. This is a great representation of our culture today. I think it's a great representation of Durham and the longings we have. We want the kingdom of God. We want justice. We want equality. We want people to have inherent dignity. This is one of our core values here at East Point. We celebrate the image of God in every person. And if you ask anybody in Durham, they'll say, \"Yeah, I think that's a pretty good value.\" But we want the kingdom without the king. We want all of the benefits of Jesus without saying, \"Jesus, you are worthy of ordering my life around your leadership.\"\n\nThe invitation of Jesus is that he's not some dictator who wants to call your life into order. He's saying, \"I'm the satisfaction that, when you find me, you reorder your life because you found me.\" Have you ever done that? Found a good restaurant or a good thing at the grocery store and started thinking about it constantly? My wife Mary goes through phases with foods—she'll go into a double-stuff Oreo phase. We're in that phase right now. We'll get a grocery order and it's like, \"Did we really need four packs of double-stuff Oreos?\" But she's longing for that right now. So we pack the pantry based on what we crave. What I want to suggest is this: When we find that Jesus is the feast, that he is the bread of life, we start to reorder our lives. Our order is different. Our pantry is reordered. And why? Because that is what satisfies.\n\nHere's the thing, though: Different foods have different nutritional value. Some of us know that far too well. You eat some things and you're hungry two hours later. You eat other things and it sustains you until dinner time. What makes a food sustaining is usually its nutritional value. So when Jesus says, \"I'm the bread of life. He who eats of me will never hunger. He who drinks will never thirst,\" what Jesus is saying is: I am the substance that your body, your soul, your whole being needs. What is the substance of that? I want to suggest it's this: It is the death and resurrection of Jesus.\n\nAs Jesus goes on in this passage, verse 40 says: \"For this is the will of my father, that everyone who looks on the Son and believes in him should have eternal life, and I will raise him up on the last day.\" There is the hope of the resurrection baked into the bread of life. Why does that matter? It's because what our souls long for is to be in relationship, to be in friendship with Jesus. Our souls long to be in relationship with the God who made us. What stops that is the sin and brokenness in our lives. What would enable us to be fully nourished and have what our souls need? Someone has to deal with the sin. And that's what Jesus did. He went to the cross to take the penalty for our sin, to be the bread that was broken for you and me. And he rose to give new life. What is baked into the bread that makes it the substance of what we need is the hope of the resurrection.\n\nThe hope of the resurrection isn't simply about where we go when we die. It is about the life that we live today. This is something throughout the Gospel of John. Every time John talks about eternal life, he's not just talking about an endless timeline of life. He's talking about the substance of life. What does it mean to really be living? Where is real life really found? It's found when we feast upon Jesus, when we're satisfied in him. The sustenance of real life is to look to Jesus as the substance of real life.\n\nSo I want to ask the question: What does it mean to be satisfied in him? What does it mean to feast on him? I think there are two elements. First, have you eaten of Jesus, proverbially speaking? What does Jesus say it means to eat of him? To eat of Jesus is to look to him and believe in him. So feasting on Christ is belief in Jesus. The first question is: Have you feasted upon Jesus in belief?\n\nD. A. Carson says this: There is no need for continued dependence upon him, for continual feeding on him. It does mean that there is no longer that core emptiness that the initial encounter with Jesus has meant. The consummating satisfaction—the initial feasting occurs when those who have washed their robes in the blood of the lamb stand before the throne of God and experience eternal rest. Never again will they hunger. Never again will they thirst. When we come to Jesus and put our faith in him, there is a feasting in a way that we will never hunger and thirst again.\n\nBut the reality is that we live in a broken world where we experience the hunger pains of brokenness. So there is both a looking to Jesus and a continual dependence upon him. That's why when Jesus teaches his disciples to pray, he says, \"Our Father, who art in heaven, hallowed be your name. Your kingdom come, your will be done on earth as it is in heaven. Give us this day our daily bread.\" The significance of that word \"daily\" is what Jesus unpacks here in John 6. Embedded in this picture of Jesus being the bread of life is the bread that Jesus provided for the Israelites in the wilderness—manna. This was bread that came down from heaven. What Jesus is comparing himself to in this passage is that bread, which was the provision of God. Jesus is saying, \"I'm the provision from heaven that your souls need.\" There is both a feasting in faith and a feasting in daily dependence upon Jesus.\n\nBeing satisfied in the bread of life means being in Christ, being identified with him as his son, as his daughter. Remember what he said in John chapter 1: \"Whoever believes in him, he gives the right to become a child of God.\" Being satisfied with Jesus is being satisfied in who we are in Christ. My circumstances can change. Sickness could come. When I watch documentaries about celebrities or people who by the world's standard have really lived, almost across the board one of their biggest fears is: What if I get sick? That's the one thing my money can't cure. But being satisfied in Jesus is saying: If my health falls apart, if my world starts crumbling, if I reach the height of my career, even then my identity as a child of God means more to me than any of these things. In the highest highs and the lowest lows, being satisfied in Jesus is saying my identity as a child of God is greater than all of these.\n\nCan I just say that is way better than a problem solver, a fixer, or fixings? Jesus is the feast. He is what our souls long for. What's interesting is that Jesus had just fed a crowd of thousands. And when we get to verse 60, it says: \"When many of his disciples heard it, all of what Jesus said, they said, 'This is a hard saying. Who can listen to it?'\"\n\n# The Satisfaction of Jesus\n\nWe often preach a message that Jesus is a problem solver, and that is indeed what we come to him for. But the gospel of Jesus goes much deeper than that. He doesn't want to be merely the one who can fix your problems. He wants to be the one who satisfies your soul. That is what the invitation of the gospel truly is.\n\nThis is what we see playing out in John chapter 6. The crowd goes from thousands down to just a handful because it is a hard teaching. Jesus is laying out the cards on the table, asking: Is this really what you want? If you want true satisfaction, you have to look to me not for what I can do for you, but for who I am. When we get that, we start to see what Jesus can do in our lives—it's glorious, it's beautiful, and it's something we can long for.\n\nAs we close, we see the disciples confronted with this reality. After this, many of his disciples turned back and no longer walked with him. So Jesus said to the twelve, \"Do you want to go away as well?\" And Simon Peter answered him: \"Lord, to whom shall we go? You have the words of eternal life and we have believed and have come to know that you are the holy one of God.\"\n\nBrothers and sisters, Jesus is the satisfaction that our souls long for because he's the substance of what our souls need. We love junk food. We love trying to be satisfied by the things of this world. We love trying to be satisfied by the praise that people give us. We love asking, \"Lord, what do we need to do to earn your favor?\" But these things—they're junk food. They aren't what satisfy. What satisfies is looking to Jesus as the one who made us and who made us for relationship with him.\n\nWe gather each week as the people of God to have a family meal where we feast upon Jesus, who is everything that we need. We confess, Lord, we turn to junk food so often. We try to find satisfaction in so many things. Yet that hunger remains. Being satisfied with Jesus is not only a matter of decisive faith, but of daily faith—saying each day, I need to be nourished. I need this daily bread.\n\nI want to invite you to this feast in Jesus. There is a daily invitation to come to him and let your soul be happy in him. Read his word, for there Jesus is revealed. There we encounter him and find where real life is truly found. I want this metaphor of Jesus being the bread of life to carry you. When you wake in the morning, may Jesus give you a hunger for feasting upon him. When you go to bed each evening, confess the ways that you turn to the junk food of life—self-made religion, the praise of people, the security of the things of this world. Lay it down and say, \"Jesus, I want to be satisfied in you.\"\n\nThis morning, we're going to come to the Lord's table a little differently than we usually do. We're going to take of it all together. If you're a follower of Jesus, this table is for you. You'll be served the elements, take the bread and dip it in the cup, and return to your seat. Once everybody has been served, I'll come back and lead us in partaking of the Lord's Supper together.\n\nJesus says in this passage that for bread to nourish you, it has to be broken. That's the process. On the night he was betrayed—at another Passover feast, as John 6 tells us—Jesus said, \"This is my body which is broken for you. This is my blood that was shed for you.\" It's through the death and resurrection of Jesus that we have the sustenance that we need.\n\nWe come to the table this morning to remember the good news of Jesus: that there is nothing we can do to earn his favor. It is only through his life, his death, his forgiveness, and his resurrection that we can have life. That is why we come to the table. I want to invite you to come and remember the gospel. In a few moments, we'll partake of it together.","url":"https://www.youtube.com/watch?v=VZ07pFEuX4M"},{"id":"FE0uHcUDKcs","date":"2025-10-22","title":"Living Water","scripture":"John 4","preacher":"Peter Frey","series":"John","desc":"Discover the story of the Living Water in John 4 as Pastor Peter Frey shares how Jesus offers true satisfaction that never runs dry.  💧 Experience real hope for real life at www.eastpointdurham.com  Join us Sundays at Oak Grove Elementary — 10:00 AM in Durham, NC.","transcript":"# Sermon Transcript\n\nGood morning church. Please join me in reading this prayer of illumination. The words will be on the screen.\n\n*Oh God, you know us better than we know ourselves. As the scriptures are read, help us listen for your voice. By your spirit, lead us out of our fears and into the knowledge of your love through Jesus Christ, the great shepherd of our souls. Amen.*\n\nPlease remain standing as you're able for the reading of God's word from the Gospel of John, chapters 4, verses 1-15.\n\nNow Jesus learned that the Pharisees had heard that he was gaining and baptizing more disciples than John. Although in fact it was not Jesus who baptized but his disciples. So he left Judea and went back once more to Galilee. Now he had to go through Samaria. He came to a town in Samaria called Sychar, near the plot of ground Jacob had given his son Joseph. Jacob's well was there. Jesus, tired as he was from the journey, sat down by the well. It was about noon.\n\nWhen a Samaritan woman came to draw water, Jesus said to her, \"Will you give me a drink?\" His disciples had gone into town to buy food. The Samaritan woman said to him, \"You are a Jew and I am a Samaritan woman. How can you ask me for a drink? For Jews do not associate with Samaritans.\" Jesus answered her, \"If you knew the gift of God and who it is that asks you for a drink, you would have asked him, and he would have given you living water.\"\n\n\"Sir,\" the woman said, \"you have nothing to draw with, and the well is deep. Where can you get this living water? Are you greater than our father Jacob, who gave us the well and drank from it himself, as did also his sons and his livestock?\" Jesus answered, \"Everyone who drinks this water will be thirsty again. But whoever drinks the water I give them will never thirst. Indeed, the water I give them will become in them a spring of water welling up to eternal life.\" The woman said to him, \"Sir, give me this water so that I won't get thirsty and have to keep coming here to draw water.\"\n\nThis is the word of the Lord.\n\n---\n\nWell, good morning, East Point. Something you'll hear us say at the end of every service is that our worship does not end here. This statement reflects the belief that worship is more than a song or a service. It's grounded in everyday life. After the service, I want to invite you to stick around and have an opportunity to continue our worship around tables, eating chili together and deepening our relationships as a church family. We have crockpots of chili warming up, and after the service, we'll gather out on the picnic tables for a sweet opportunity to continue in worship together.\n\nI find biographies to be a fascinating form of art. In so many ways, telling a person's story is very different from reading a resume. The goal of a biography is to help readers get to know who a person is, not just what they accomplished in their life. There's an art to choosing which stories to include, which moments to highlight, and how to help someone who has never met a person get to know who they truly are. With famous people, it's usually not the stories of their accomplishments or big moments that reveal who they are. It's the small, seemingly insignificant, mundane stories that give a window into the heart of who they are. The art form of biography lies in curating stories in such a way that readers can experience the person, not just know about them.\n\nI say all this as context as we jump back into the Gospel of John this morning, because John is a biographer. He was one of Jesus's closest friends and followers, and he has endless stories he could tell. But he chooses a few. At the end of John, he tells us this: \"Now, there are many other things that Jesus did. Were every one of them to be written, I suppose the world itself could not contain the books that would be written.\" In other words, there are endless stories John could tell. As we read his gospel, it's important for us to ask the question: Why this one? Why did he choose this story at this moment?\n\nJohn includes some unique stories in his gospel—stories that don't appear in the other three gospels. We have four gospel accounts in the New Testament, each telling the same story of Jesus, but each offering a unique perspective. Through the eyes of the biographer, all of them are true, but they're curating the content in such a way to communicate something and help us experience something. What does John the biographer want us to experience?\n\nHe tells us at the end of his book. As we walk through this sermon series in John called \"Real Life Jesus,\" we're exploring the ways that Jesus came to bring real life. We will come back to this statement at the end of John where it says in chapter 20, verse 30: \"Now Jesus did many other signs in the presence of his disciples which are not written in this book. But these are written so that you may believe that Jesus is the Christ, the Son of God, and that by believing you may have life in his name.\"\n\nHere we have the key to John's content curation—the secret to his storytelling. He isn't just telling us facts about what Jesus did. He wants us to experience who Jesus is. For John, to know Jesus is to know life. To experience Jesus is to experience life.\n\nSo when John includes a story about Jesus making a stop at a well in Samaria in the middle of the day, it's unexpected. Imagine if you were reading a presidential biography and the biographer included a story about a trip to McDonald's at midnight. You'd be caught off guard. But you'd also be intrigued. Of all the stories to tell, why this one? It's clear this one is intentional because verse 4 says, \"And Jesus had to pass through Samaria.\"\n\nJesus is on a journey from Judea to Galilee, about a three-day journey on foot. Samaria was technically on the way, but culturally it wasn't. Samaria was a place where you would never expect to find a Jew like Jesus. Many Jews in Jesus's day would never make a stop in Samaria. Most people grow up with unwritten rules about places they aren't supposed to go—maybe a city, a neighborhood, an area of town. For me, it was a certain street. When I learned to drive, I didn't know much about it, but instinctively I learned routes across town that avoided this street. The Jews in Jesus's day did the same thing with Samaria.\n\nThe backstory to this avoidance is a messy one—racial, religious, and political. In 722 BC, the kingdom of Assyria invaded the northern kingdom and came to the area of Samaria. When Assyria took over, they deported some of the Jews who lived there while others remained. The Assyrians settled in Samaria and intermarried with the Jews already living there. What resulted was a people group known as the Samaritans, viewed by Jewish people as political rebels because they intermarried with the enemy. They were viewed as religious sellouts because many integrated Assyrian pagan religions with their Jewish faith, creating a hybrid religion. Ultimately, they were viewed as racially less than. We can feel the tension building as Jesus, a Jew, pulls into a rest stop in Samaria.\n\nWe read in verse 6, \"So Jesus, wearied as he was from his journey, sat beside the well. It was about the sixth hour. A woman from Samaria came to draw water.\" The tension of this moment becomes even more complicated with additional cultural context. First, there's the time of day. It's the sixth hour, which is about noon, the height of the heat. Off the highway comes a Samaritan woman alone. Women would customarily travel to the well in the morning or evening when it wasn't as hot, and they would travel in groups. But here in the scorching midday sun, here she is—someone to be avoided is here avoiding people. It would be safe to assume she has a scandalous story. Not only that, in Jesus's day, the social and cultural tension would be further accentuated by the fact that he is a man and she is a woman. And Jesus asks her for a drink.\n\nShe's as surprised as we are when she responds in verse 9, \"How is it that you, a Jew, ask for a drink from me, a woman of Samaria?\" John adds the cultural commentary there: \"For Jews have no dealings with Samaritans.\" Her response of shock is equivalent to saying, am I on candid camera? What is happening here? But this is no social experiment. Jesus is crossing cultural, racial, religious, and political lines to show this woman that he cares.\n\nDon't miss this. I think John the biographer wants us to understand that finding life in Jesus begins when Jesus finds us in life. Finding life in Jesus begins when Jesus enters our story to pursue us. As we see this story unfold, the first thing is that Jesus enters our story to pursue us. I don't know where you are this morning or where you're coming from into this space, but I believe that Jesus is entering each of our stories, pursuing us. He is seeking us. He meets us where we are.\n\nThis woman is thirsty in more ways than one. They start talking about water. Jesus asks her for water, and she responds, \"Why are you asking me?\" Jesus says, \"If you knew who was asking you, you'd be asking him.\" It's a bit confusing—are we talking about water or something else? She says, \"You don't have anything to draw with. Where did you get this living water? Isn't the well deep?\" There's this conversation back and forth, and isn't that so often how it happens when Jesus is pursuing us? We think the pieces of our lives are about one thing, but Jesus comes along to show us that our thirst isn't actually about a bucket. It's about something else. Jesus is surfacing for this woman what her deepest needs are.\n\nHe reveals the heart of their conversation in verses 13 and 14. He says, \"Everyone who drinks of this water will be thirsty again.\" We all get that. You drink water and a few hours later you need more. \"But whoever drinks of the water that I will give him will never be thirsty again. The water that I give him will become in him a spring of water welling up to eternal life.\"\n\nIf you don't get anything else about what Jesus is revealing here, I want us to see this about Jesus: Jesus is the living water that satisfies our longings, saturates our life, and sustains our living. He satisfies our longings. He saturates our life. He sustains our living.\n\nBut how he does that, this woman still needs to understand. She says to him, \"Give me this water so I don't have to keep coming back to the well.\" In some ways, she's saying, \"If you're that good, give me the fix.\" So often our mentality is that religion is about getting a fix. I feel this thirst in life. I feel these longings. Maybe if I come to Jesus and get my life reordered, maybe that will fix these things I feel. But Jesus is more than a fix. He is more than a problem solver. He's the source of life, and he needs this woman to understand this. He wants each of us to understand this.\n\nThis is how Jesus does it with the woman, and I think it's applicable to each of our stories as well. Not only does he enter our story to pursue us, but he confronts our story to satisfy us. That's what he does for the woman. He says to her, \"Go get your husband.\" It seems out of the blue, but this is something we see throughout the Gospel of John. He constantly surfaces for the people he interacts with that he knows them better than they know themselves. That's true of you this morning—Jesus knows you better than you know yourself. So he asks her a question that is inherently going to confront her story.\n\nShe responds to Jesus, \"I have no husband.\" And Jesus says, \"You're right. You have had five husbands, and the one you have now is not your husband.\"\n\n# Sermon Transcript\n\nFive husbands and the one you're with is not your husband. You see, we live in a culture where this might not actually surprise us. This might be just an everyday celebrity telling their story, but in Jesus's day, this woman having a history of five husbands and being with someone that she is not currently married to was scandalous. It was the equivalent of being a social outcast. Now we see why she's at the well at the noonday sun—because she isn't just avoiding people. People are avoiding her. She feels alone. I imagine that she feels lonely.\n\nThere's an interesting article from the Atlantic this past January. The front of the magazine was titled \"The Antisocial Century.\" The featured article highlights that over the last fifty years, the rate of loneliness has been rising. There are lots of factors to that, but the writer, Derek Thompson, makes this bold proposition: self-imposed solitude might just be the most important social fact of the twenty-first century in America. In 2023, Joe Biden's surgeon general published an eighty-one-page warning about America's epidemic of loneliness. And it's not just America. The UK and Japan have both appointed a minister of loneliness in recent years.\n\nWhat's interesting to note is that in the last couple of years, while levels of solitude continue to increase, reported levels of loneliness are actually leveling out. The article proposes that while people are more alone than ever, they can order food to be delivered to their door. They can talk to an AI bot. They can basically seclude themselves. What is happening is people are actually numbing their loneliness. Our culture is more alone than ever, feeling loneliness and yet numbing it by the things in our lives. I imagine that this woman at the well in the noonday sun is simply trying to numb the pain that she feels.\n\nJesus asks about her husband because this is the source of her shame. This is the source of her loneliness. But what Jesus is doing is confronting our story not to condemn us but to satisfy us. This is what the gospel does for each of us. Jesus enters our story to pursue us, and then he confronts our story to satisfy us because he needs us to surface our thirst. He needs us to understand that we are longing for something.\n\nIt's easy to read this story and feel a far away, removed identity to this woman at the well. But I wonder what Jesus would say to you. Go get your retirement account. Go get your phone. Go get your app, your social media app. Go get your friends. What would Jesus confront in your story to surface those things that are so easy to turn to for satisfaction? Jesus comes and crosses racial, cultural, and political lines—every line he will cross to show you he cares, in order to confront your story in a way that satisfies you.\n\nJesus's deepest mission—and he goes on later in the passage to talk about this—is why he came. This is his food. This is what gets him up in the morning: to come and satisfy your soul. Many of us have a picture of God painted in our culture that God is out to condemn you. But Jesus lives to satisfy you. That is the picture of living water. Jesus came to satisfy our deepest longing. Jesus is living water that satisfies our longings, saturates our life, and sustains our living. He seeks us where we are. He surfaces what we want, and he supplies what we need.\n\nFinding life in Jesus, real life in Jesus, begins when Jesus finds us in life. He confronts our story and he wants to satisfy us and show us that the thing within us that we are longing for is actually him. But what so many of us do is come to Jesus and, after he confronts our story, we think the solution is religion. We say, \"Let me get all these pieces straight.\" That's what the woman does. She says, \"Okay, I see that you're a prophet. You know me better than I know myself. So can you settle this? My people, the Samaritans, we worship here on this mountain, and you Jews, you worship on this mountain. I've got to get the religion right.\" And Jesus confronts our story to say you are focused on what do I do to find this satisfaction, to find real life.\n\nWhat Jesus continually does, throughout the gospel of John—pretty much every sermon we walk through in this book—is the same thing. You are looking to do something to find your satisfaction, to find real life. And it is not found in religion. It is found in me. It's found in a person. And so Jesus is surfacing this. He says, \"The hour is coming and is now here when true worshippers will worship the father in spirit and truth. For the father is seeking such people to worship him.\" Notice he's seeking them. He enters our story to pursue us. God is spirit, and those who worship him must worship in spirit and truth. Essentially, he's saying you're asking the wrong question. Not, \"Do I worship here or do I worship there? Do I go to church? Do I read my Bible? Do I pray this much or this much? Do I fast? What do I do to find the satisfaction my soul is longing for?\" He is trying to show this woman that it's not about these things. It's about him.\n\n\"I am the Messiah,\" Jesus says. The woman said to him, \"I know that the Messiah is coming who's called the Christ. When he comes, he will tell us all things.\" And Jesus says to her, \"I who speak to you am he.\" This is the climax of this conversation, this pit stop in Samaria. It was all for this—not so that she would know the right religious answers, not that she would clean up her past, but that she would see Jesus for who he is. He is the source of life.\n\nJesus enters our story to pursue us. Then he confronts our story to satisfy us. And then I want you to see this as the story goes on. There's so much rich content that we could highlight in this passage. I want you to see what happens when she encounters that Jesus is the source of life. It says in verse 27, \"Just then the disciples came back.\" Apparently, the disciples were off getting lunch in town and they come back, and they're a little bit uncomfortable. It says they have these questions and no one says them out loud: \"What do you seek her? Why are you talking with her?\" And the woman leaves her jar. She had just traveled from town to this well with her jar to draw water, and she leaves her jar and went away into town and said to the people, \"Come see a man who told me all that I ever did.\"\n\nCan you imagine? This woman had spent the entirety of her life trying to hide that story. And she goes into town and starts declaring it. This is the way God rewrites our story—those pieces of shame and pain, even years of what felt like wasting. He enters that and he begins to rewrite that story. Not to diminish our past, but to be a piece of that value that we already echoed this morning: that we tell stories of real hope that includes the mess, the shame, the hurt and pain. He enters that to pursue us. He confronts our story so that we can find that, yes, we do look for things to satisfy us. This isn't just a one-time thing. Jesus says, \"I want to be the source of life that satisfies you on an ongoing basis, that springs up to be a well that sustains your living.\"\n\nSo I want to suggest this morning: some of you are in different places. Some of you need to hear this morning that Jesus sees you. He enters your story and is pursuing you. Some of you this morning need to hear hard words—that Jesus wants to confront you. He wants to confront your story. There are things that you look to for satisfaction. All of us, me included, this week—there are things that I look to to satisfy my soul. And Jesus wants to confront that. Not to condemn you, but to satisfy you. Because he knows what you really need. And then he rewrites that story so that this woman, who once tried to hide everything she'd ever did, says, \"Come see a man who told me everything I ever did.\"\n\nNotice how imperfect her witness is. We think we have to have it all together. We have to have all the answers in order to be used by God. And notice what her evangelism strategy is. She goes, \"Could this be the Christ?\" She's not saying, \"Here is the propositional truth. Jesus is the source of life.\" She's saying, \"Could this be true?\" It says in verse 39, \"Many Samaritans from that town believed in him because of the woman's testimony: He told me all I ever knew.\"\n\nHe sees you. He pursues you. He enters our story. He confronts our story. And he rewrites it because he wants to use you. This is why it's our core value: we tell real stories of real hope. Because we believe that is our most effective witness to a hurting world. We don't have all the answers. We don't have all the quick fixes. But we know someone who knows all we ever did, and he loves us the same. You are fully known and fully loved. That is the glorious truth of the gospel. That is why we are planting East Point Church. That is why we worship each week. That is why we are who we are. Because Jesus is the living water that satisfies our longing, saturates every piece of our lives, and sustains our living.\n\nCome see a man who told me everything I ever did. This is why hope changes everything. Because it doesn't matter what your past is. It doesn't matter how well you can theologically articulate what the Bible says. We know a person, and his name is Jesus, and he changes everything.\n\nThis morning, we're going to respond as we usually do in three ways, but there's an added element this morning. I think as we hear this truth that Jesus is the living water that satisfies our soul, there's an invitation for all of us this morning to say, \"What is that thing that I am prone to look to to satisfy me?\" For some of you, that could be financial stability. For some of you, that could be friendship and people. For some of you, that could be feeling like you have it all together, having the right answers, being perceived by others as put together. For some of you, it might be mindlessness, busyness, just filling your time to satisfy or numb your soul.\n\nAs we respond this morning, we're going to respond with singing. We're going to turn our eyes to Jesus. We're going to pray together. We'll have some prayer partners on the sides of the room with green lanyards. If you want someone to pray over you, they will be there. And we're going to respond by communion. Communion is the way that we remember what Jesus accomplished.\n\nJesus said to the woman, \"If you knew the gift of God, this is the gift of God for you.\" Jesus entered our story and the way he did that was he took on flesh. He lived a perfect, sinless life. Each of us—our deepest longing is for Jesus. What Jesus has to confront is that all of us choose our own way, and we needed Jesus to be the perfect substitute. At the cross he paid the penalty for our sin. He died and rose from the dead to give us new life.\n\nWhen we come to the table each week, we remember Jesus's words: \"This is my body which is broken for you. This is my blood that is shed for the forgiveness of sins. As often as you eat this bread and drink this cup, you proclaim the Lord's death until he comes.\"\n\nAs you go to the table, you'll also find some slips of paper that say, \"Today I choose Jesus over blank.\" I encourage you as you go to the table to receive the gospel. Write down something you want to confess to Jesus, or put a stake in the ground this week. Say, \"I'm going to choose Jesus over my comfort. I'm going to choose Jesus over my control. I'm going to choose Jesus over social media. I'm going to choose Jesus over whatever the spirit of God leads you to write in there.\" Take that with you. Stick it in your pocket. Take it with you this week and remind yourself of the gospel.\n\nAnd then, if you're a follower of Jesus, take that bread, dip it in the cup, eat and remember the gospel.\n\nLet's pray together. God, we thank you for this word. We thank you that you find us in life, that you pursue us, that you love us, that you confront our story so that you can redeem us. God, thank you for the truth of Romans 8:1, that there is therefore now no condemnation for those who are in Christ Jesus. That if anyone is in Christ, we are a new creation. The old has gone, the new has come. And so Lord, as we continue in worship, we proclaim, \"Come see a man who told me everything I ever did.\"\n\n# [Cleaned Transcript]\n\n\"Did and he loves me.\" We give you thanks in Jesus's name. Amen.","url":"https://www.youtube.com/watch?v=FE0uHcUDKcs"},{"id":"9Z45Gwgjwcc","date":"2025-10-08","title":"Real Life = New Life","scripture":"John 3:1-21","preacher":"Peter Frey","series":"John","desc":"In this message from John 1:1–14, Pastor Peter Frey explores how Jesus is the true source of real life — the Word made flesh who brings light to a dark world. Discover the hope and power found in knowing Him.  Originally preached on October 5, 2025 Location: Eastpoint Church (Oak Grove Elementary, Durham NC)","transcript":"# Sermon Transcript: John 3:1-8\n\nJoin me in reading aloud this prayer for illumination. The words will be on the screen.\n\n\"O God, your word is more precious than fine gold and sweeter than purest honey. As we turn to your Scripture, send your Holy Spirit to infuse your word with truth and grace so that the good news of the Lord would shine before our eyes and delight our senses, so that we can respond with wonder, faith, and trust. Amen.\"\n\nPlease remain standing as you are able for the reading of God's word from John 3:1-8.\n\n\"Now there was a man of the Pharisees named Nicodemus, a ruler of the Jews. This man came to Jesus by night and said to him, 'Rabbi, we know that you are a teacher come from God. For no one can do these signs that you do unless God is with him.' Jesus answered him, 'Truly, truly, I say to you, unless one is born again, he cannot see the kingdom of God.' Nicodemus said to him, 'How can a man be born when he is old? Can he enter a second time into his mother's womb and be born?' Jesus answered, 'Truly, truly, I say to you, unless one is born of water and the Spirit, he cannot enter the kingdom of God. That which is born of the flesh is flesh, and that which is born of the Spirit is spirit. Do not marvel that I said to you, you must be born again. The wind blows where it wishes, and you hear its sound, but you do not know where it comes from or where it goes. So it is with everyone who is born of the Spirit.'\"\n\nThis is the word of the Lord.\n\n---\n\nGood morning, East Point. It is such a joy as we have our second preview service to open God's word with you as we continue a series in the book of John that we have called \"Real Life Jesus\"—exploring the ways that Jesus came to bring real life. I wonder if I asked you this question: \"I'll be really living when...\" how you would fill in that blank. Think about it for a moment.\n\nI wonder if you've ever had a time in your life when you were looking forward to a circumstance and you thought, \"I'll be really living when...\" Maybe you can think back to a time when you were anticipating a job change or looking forward to a vacation. You were thinking, \"I'll be really living when I'm sitting on the beach with my toes in the sand.\" Perhaps it was the next milestone—once you get out of school and start your career, you thought, \"I'll be living then.\" Maybe it was meeting your spouse and being in a relationship, or starting a family. I wonder how we might fill in that blank. And when we look back at our lives, we realize that some of the things we thought would bring real life didn't actually bring real life at all.\n\nAs we explore this sermon series in the Gospel of John, we're asking a fundamental question: What really is life? I think John, as he writes to his readers, wants them to engage with this very question. What does it mean to really live? Where do we find that life? Ultimately, as we look through the pages of the Gospel of John, the overarching message is this: Jesus came to bring life—not just any life, but real life. That deep longing within you that sometimes you've placed in the circumstances of life, only to be disappointed by them—that real life is what Jesus came to bring.\n\nAs we look at the Gospel of John, I think one thing we have to acknowledge is that we live in a culture and a world that is spiritually seeking. There are studies and reports—Christianity Today has an article that outlines a progression of people's religious affiliations over the last few decades. Prior to the 1990s, many people had a religious affiliation. If you asked them to describe it, they would associate themselves with an institutional church and give a clear answer. In the 1990s, there started to be a shift. People began giving a spiritual answer rather than a religious one. They started saying, \"Well, I spiritually align here.\" But in the last few years, there has been another shift. It has moved from religious affiliation to spiritual association to what is now the overarching terminology people use: meaning-making. This is where I look for meaning.\n\nHonestly, I don't think that's a bad shift. Deep within us, at the heart of what we're longing for, is this: I'm trying to make sense of life. When I look at the world around me, the brokenness I see in our community, the brokenness I feel within myself, the longing for something beyond my present experience of reality—there is a deep longing for meaning. This shift to meaning-making accompanies another shift that researchers have observed. Prior to Generation Z, there was a steady increase in people identifying as atheist or agnostic. Generation after generation, each was claiming higher numbers of atheists and agnostics. But Generation Z is the first generation to change that pattern. Gen Z is shifting in its language. If you ask them for their religious association, more people are saying \"nothing in particular\" rather than \"atheist\" or \"agnostic.\" I think that's because Gen Z is more in tune with the idea: I'm searching for meaning somewhere. I'm not going to say there's nothing out there, but I'm just saying nothing in particular.\n\nAll of this highlights a deep longing within each of us to make sense of life. I think the Gospel of John is written to help us see Jesus as the one who makes sense of life—and not just that, but as the one who came to give life. He didn't just come to give you a way to order your life. He came to give you life itself.\n\nThis morning in John chapter 3, we're going to meet an individual who is perhaps in that place of seeking, trying to make sense of things. He hears about Jesus. He hears about Jesus performing signs. In John chapter 2, we read the story of Jesus's first miracle—he turns water into wine at a wedding feast. What's interesting there is that he demonstrates he has supernatural power to transform. As the Gospel of John unfolds, he calls disciples to follow him. John the Baptist points to him, saying, \"Behold, the Lamb of God who takes away the sin of the world.\" His identity is slowly being unveiled through these first two chapters.\n\nWhen we come to the end of chapter 2, we read these words: \"Now when he was in Jerusalem at the Passover feast, many believed in his name when they saw the signs he was doing. But Jesus on his part did not entrust himself to them, because he knew all people and needed no one to bear witness about man. For he himself knew what was in man.\" I think this is an important commentary for us to hear this morning: Jesus knows what's in your heart. He knows what you're longing for. He knows how you would fill in that blank about real life. He knows where you look for meaning. So when we meet a man named Nicodemus who comes
