n\nThis invitation that Jesus extends to us, modeled in his own life—I want to give you one big idea for us this morning. When I was thinking about how to preach on prayer for a whole summer, I realized we could spend a year on this. But we're going to spend ninety days. As a congregation, we want to come before Jesus with the disciples and say, \"Lord, would you teach us to pray?\" Here's my one big idea: Prayer is a practice of relational identity rather than an implementation of effective strategy.\n\nHere's what I mean. When the disciples come to Jesus and say, \"Lord, would you teach us to pray?\" Matthew records this same moment, and we have the fuller answer of the Lord's Prayer. The prayer begins in Matthew 6:9: \"This then is how you should pray: Our Father in heaven.\" The starting point. The first two words. This is the foundation of prayer: relational identity. Our Father.\n\nJesus, the Creator and Sustainer of the universe, constantly got away to pray. I think we're asking the wrong question. The question behind prayer is not the necessity of a means to an end, but the opportunity of a relationship. Jesus, fully God and fully man, lived into his dependency upon his Father. This starting point of the Lord's Prayer is not just an introduction to what comes next—it's the very foundation of prayer: Our Father.\n\nThis is radically different from Jewish prayers up to that point. Jewish prayers were wrapped up in the transcendence of God—God being bigger, God being separate, God being unlike us. As we sang this morning, \"Holy, holy, holy.\" But Jesus teaches his disciples not a rote prayer, but a model for us. The starting point of prayer is not an effective strategy to get what you want from God. He starts with relational identity. I want us to really let those words sink in: our Father.\n\nThroughout the scriptures, when prayer is discussed, it is continually put in the context of the fatherhood of God. In Matthew chapters 6 and 7—the last two chapters of the Sermon on the Mount—the word \"father\" appears seventeen times in just two short chapters, and the majority of these references are in the context of prayer. This is what Jesus is holding out to us. Prayer is not mechanical, as if it were some cosmic vending machine into which we put in a request and out comes an answer. What Jesus is holding out to us, and what he models in his life and ministry with his constant prayers, is that prayer is a relational identity. It is out of the fatherhood of God that we approach him as adopted children into his family.\n\nMy kids teach me this so vividly about what God is inviting me into. My kids so freely ask me for what they need. It's not transactional, as if they were thinking, \"Dad, you are my means to an end.\" It's simply the relationship we have. Tim Keller says it like this: \"Who would ever barge into a king's court in the middle of the night at 3:00 a.m. and ask for a drink of water except for the king's child?\" My kids do this all the time. At 3:00 a.m., from their bed, they'll say, \"Dad, I'm thirsty.\" In that moment, I guarantee you my four-year-old is not doing transactional calculations, thinking, \"My dad has water, so I can come to him and ask for water.\" He's coming to me out of relationship. Because he knows that I care about him. It's not about what I have for him. It's about who I am to him.\n\nAs we kick off this series, I want to encourage us that the starting point of prayer is relational identity. If you have put your faith in Jesus, we are told throughout the scriptures that we are adopted as God's children. In Galatians chapter 4, it says it like this: we have received the spirit of adoption, so that as sons we cry out, \"Abba, Father.\" There is this cry of our hearts—we come to God as Father based on what he has accomplished for us through the cross. Through his death and resurrection, we have new life. We are adopted into his family, where we are no longer slaves, but sons. In Galatians 4:6, it says we are heirs of all that is his—all that becomes his becomes ours. The starting point of prayer is relational identity. We are children of a good, good Father.\n\n# Sermon Transcript: Prayer and Dependency\n\nAs we embark on this journey of exploring prayer together, I want to suggest something foundational: if it is true that my starting point in prayer is that I have a good Father who cares about me, then the point of my prayer is more dependency than efficiency. It's more about dependency on who God is, his care for me, and his love for me than about efficiency. Because if we're honest, prayer is not efficient. It's clumsy. It's time-consuming. I could be entering prompts into AI much faster.\n\nThe Pope released a manifesto this week—I believe it's called an encyclical—that is 250 pages long. I didn't read it all, but I read the Atlantic articles about it. What's fascinating is that the Pope holds a kind of moral and cultural compass voice in our society. The Atlantic highlighted one of the Pope's most surprising arguments: his insistence that humanity is fundamentally good, not in spite of, but because of the things that make us unlike machines. The Pope writes, \"Finiteness, when truly accepted, does not diminish us, but opens us to recognizing the face of God and others. Indeed, precisely because we experience limits, vulnerability, suffering, and failure, we can recognize the inherent dignity of every person, both our own and that of others.\"\n\nThe article contrasts this with Peter Thiel, the billionaire venture capitalist, who hesitated to answer whether humanity ought to survive. He and other members of the tech investor class have suggested instead that humans might be better off if we outsource more of our imperfect decision-making—moral and otherwise—to superintelligent AI. The article concludes: \"Their perspective tends to dismiss human limitations as liabilities. Despite the fact that human imperfection itself is what inspires compassion and reflection, and that lends great art its beauty. Perfection is inhuman, and pretensions to it are doomed and misbegotten.\"\n\nHere's what I want to suggest: I don't think the Pope is demonizing AI as something that can be used for good. Rather, here's the temptation our culture faces right now—viewing efficiency as the highest value of humanity. If we can do something faster and better, then that's the ultimate achievement. But prayer radically confronts that, because it's slow and inefficient by human standards. And that is what AI can never replace: relationship. Something that's slow and inefficient. Relationships take time. We don't try to master them; we practice them.\n\nMary and I have been married for fifteen years, and the goal of marriage is not that we master this thing, but that we practice love. I want to suggest that the same is true of prayer. This isn't something we're here to say like, \"Here's a skill of the Christian life that you need to master. Get an hour in or check these boxes.\" That is not the goal. The goal is love. You have a Father who loves you, who invites you to come to him in the middle of the night and tell him what's on your heart. Why? Because he knows it already and he cares.\n\nJosh and I have disagreements about AI all the time, and we talk about what we should use it for and what we shouldn't. You can guarantee that I'm not going to let it write my sermons, because the time that it takes is part of the process of God forming me. That's part of the process of what God invites us into. I say this because I was at a church planting cohort two weeks ago, and we had a session on how to use AI for ministry. It was great, and I walked away from it thinking, \"Okay, I'm a little bit more sold on AI. I need to use it for some of the things that we do, some of the systems.\" But what struck me was this little sentence in the handbook: \"Never let AI pray for you.\" I thought, \"What? Why did they include that?\" But here's the thing: our soul's tendency is to find the most efficient way to do things. That's a cultural push and value.\n\nHere's what I'm holding out for us as a congregation. As we are in this formative state in year one of Eastpoint Church, prayer is not about being an effective strategy to get from point A to point B. Prayer is about a relational identity. We have a Father who is good, who loves us, who invites us—as it says in Hebrews 4—to come boldly before his throne of grace. Over the course of the summer, we're going to explore what that looks like and create spaces to practice this together.\n\nHere's the thing: this is not about an effective strategy. The starting point is that we are children of a good Father. I want to encourage you in your prayers that the Pope is right—limitedness is a gift to you. Because it is dependency upon our Father where we flourish the most, not independence. Prayer is an invitation to become childlike, to value dependency over efficiency, to value limitedness, and to come to our infinitely good Father and say, \"I know you care. I don't understand this whole prayer thing.\" Tyler Staton says this: \"God is not grading your prayers like an essay. He's talking to you like a child.\" So I want us to lay down the preconceived notions that we've got to pray the right words or get in the right amount of time. Instead, see God as a good Father, and let that be our starting point for prayer.\n\nEach week as we walk through this series on prayer, we're going to take a moment and practice this together. I'm going to invite you to just sit with God for a couple of minutes and think about these big questions: Who is God? Who are you? Why are we here? I want you to start by sitting with God and just thinking about him as a Father. For some of you, that's a complicated image. Most of us, our experience of fatherhood through our human fathers was conditional—if you follow the rules and keep the status quo, the relationship's good. But God confronts that. Many of us have had well-meaning fathers who were maybe a little absent, or even harsh. And God is coming to meet us this morning and saying, \"I am what your earthly father wasn't. I am perfectly good, perfectly present.\" He's inviting us to trust that he does care.\n\nFor some of you in this moment of prayer, I would invite you to ask God to show you his goodness as a Father. Let's just start here in the course of the summer by sitting in our relational identity. Don't jump to strategy; don't jump to requests. Just sit.\n\n---\n\nI want to invite you to join me over the next ninety days using a journal called Sacred Prayer. We have them on the back table. I don't have enough for everybody, but they're available on Amazon as well. If money's a hindrance, just take one. It's a ninety-day journal that gives space each day to be still. It walks through an acronym—S.A.C.R.E.D.—stillness, attentiveness, and more. The acronym is explained within it.\n\nHere's what I want to invite you into: this is not a formula. This is not an effective strategy. This is a tool. It's not the only tool for prayer, but I want to invite you to join me. It'll coincide with our prayer series. Would you just take some time each day and sit with God? I'm going to guarantee you it'll be clumsy. It'll feel pointless sometimes. There's even a question in there that I don't even love: \"How did I experience a fresh revelation from God in his word today?\" Sometimes I read the word and I'm like, \"I got nothing.\" And that's okay. You can write, \"God, I got nothing.\" That's okay.\n\nI want to invite you to see that prayer is something practical. It is a practice of relational identity. If we are God's children, it starts with talking to him like that. I want to invite you to grab one of these and use it over the course of this summer.","url":"https://www.youtube.com/watch?v=K47oghFvamI"},{"id":"S4iCehDKOlg","date":"2026-05-26","title":"Pentecost Sunday","scripture":"Acts 2:1–11","preacher":"Peter Frey","series":"Special","desc":"In Acts 2, the Holy Spirit is poured out at Pentecost, empowering the church to proclaim the gospel to every nation. Join Pastor Peter Frey as he shares the power, presence, and mission of the Spirit-filled church. Experience real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: Pentecost Sunday\n\nPlease remain standing as you are able for the reading of God's word from Acts 2, verses 1-11. When the day of Pentecost came, they were all together in one place. Suddenly, a sound like the blowing of a violent wind came from heaven and filled the whole house where they were sitting. They saw what seemed to be tongues of fire that separated and came to rest on each of them. All of them were filled with the Holy Spirit and began to speak in other tongues as the Spirit enabled them.\n\nNow there were staying in Jerusalem God-fearing Jews from every nation under heaven. When they heard this sound, a crowd came together in bewilderment because each one heard their own language being spoken. Utterly amazed, they asked, \"Aren't all these who are speaking Galileans? Then how is it that each of us hears them in our native language? Parthians, Medes, and Elamites, residents of Mesopotamia, Judea and Cappadocia, Pontus and Asia, Phrygia and Pamphylia, Egypt and the parts of Libya near Cyrene, visitors from Rome, both Jews and converts to Judaism, Cretans and Arabs. We hear them declaring the wonders of God in our own tongues.\" This is the word of the Lord. Thanks be to God.\n\n---\n\nAt this time, I want to dismiss our East Point Kids to their class. Thanks for worshiping with us, guys. Justin is rounding you up, and our East Point Kids volunteers will take you to your classrooms.\n\nGood morning, East Point Church. It is such a joy to be worshiping with you this morning. This week is a super special week. It's what we affectionately call in our home birthday week. I celebrated my 38th birthday on Tuesday.\n\nWe love birthdays in our home. One of Mary's and my soapboxes is that we need to resist the begrudging attitude that many have toward getting older. I think another year is not something to be bemoaned but something to be celebrated. Being married to someone with a life-threatening lung disease will ingrain that attitude in you very quickly.\n\nTuesday happened to be when our community group meets, and our group chose to surprise me for my birthday by everyone dressing up like me. We have a picture if you want to throw it up there. Yep. This is everybody in a black t-shirt. If you don't see me outside of Sunday, you often find me wearing a hat and jeans. It was a sweet surprise. I walked in and wondered why everybody was wearing the same thing.\n\nSpeaking of community groups, we've hit our summer rhythm moment where our community groups take a different break for the summer, though there will be opportunities throughout the summer for social gatherings. This is a great opportunity if you want to jump into the life of our church. Really, the heartbeat of who we are is doing life not just in this gathering on Sundays, but in all of life. So I would love to connect you with one of our groups. I think our group is going to Highwire on Tuesday night. If you're not in a group and you want to come to Highwire on Tuesday night at 6 p.m., we'd love to have you.\n\nAnother perspective that Mary and I have about birthdays is that your moms are really the ones who should be celebrated on your birthday. They're the ones who did the hard work of bringing you into this world. In fact, Mary has adopted the practice of sending cards to her close friends on their children's birthdays that say, \"Happy Labor Day.\"\n\nThis week is not just my birthday week, but it is what is known throughout church history as the birthday of the church. Today is Pentecost Sunday in the traditional church calendar. If you're like me, I didn't grow up in a church tradition that observed Pentecost. In fact, Pentecost was somewhat confusing to me because it's mostly wrapped up in my association with the Pentecostal church, which depending on your background may be a positive or negative experience. For me, it was confusing, and the idea of celebrating Pentecost Sunday was somewhat foreign.\n\nBut over the years I have grown to love the church calendar because it roots us in something far deeper than this present moment in time. I have grown to love Pentecost Sunday because it is really the birthday of the church. We as a church are in our first year as East Point Church, and it has been a fun and wild journey. We officially launched on February 8th, and I think that will forever be the birthday of East Point Church. But I want to suggest that Pentecost Sunday is really our birthday as a church because we are part of something way bigger than what God is doing here at Oakgrove Elementary School. We are part of a move of God that began when God poured out his spirit on the church.\n\nAs we look together at Acts 2 this morning, I want to suggest that just as I cannot take any credit for the day that I was birthed, that too is the point of Pentecost Sunday. What gives life to the church is not a group of people who decided to come together to start a religious movement. It wasn't articles of incorporation, a mission statement, or even passionate leaders. The thing that gives life to the church has nothing to do with us and has everything to do with the spirit of God.\n\nMy wife Mary is serving in kids this morning, and she just loves birth stories. She loves to serve women in labor and delivery as a doula, and if you have a birth story, she will sit and want to listen to it. But this morning Acts chapter 2 is the birth story of the church. Let me turn there in my Bible. Beginning in verse one, it says, \"When the day of Pentecost came, they were all together in one place.\"\n\nI want to pause there. The gathering of followers of Jesus in one place is pretty important. I think there is this individualistic concept of what it means to follow Jesus—just me and my Bible in the mountains, watching a good sunrise. That is great and wonderful, but the church started when they were all together in one place. There is something uniquely special about the gathering of God's people.\n\nMoving to verse two: \"Suddenly, a sound like the blowing of a violent wind came from heaven and filled the whole house where they were sitting.\" Imagine the scene, man. Here are these believers. They have followed Jesus. Many of them have seen the resurrected Christ. We are 50 days after Easter. Pentecost comes from the word \"pent,\" which means fifty. We are 50 days after Easter.\n\nPentecost is a celebration of the Jewish people that came 50 days after the Passover. It was a celebration of the first of the harvest. It was a harvest party. This is the moment when the church—not yet born, but followers of Jesus—experiences what Jesus had told them to do: \"Go in Jerusalem and wait for my spirit.\" Here they are sitting in the house, and suddenly a sound like the blowing of a violent wind came from heaven and filled the whole house where they were sitting.\n\nImagine it if we were here in Oakgrove Elementary this morning. All of a sudden, these windows burst out. There is not just a breeze but a violent wind that starts blowing through here like a hurricane.\n\nVerse three says, \"They saw what seemed to be tongues of fire that separated and came to rest on each of them. And all of them,\" verse four, \"were filled with the Holy Spirit and began to speak in other languages as the spirit enabled them.\"\n\nIf you are like me, you read this and think, \"This is a little crazy. What is happening here?\" Let us start with the wind. In this moment, what is happening is not categorically new for the minds of those sitting in the room because Jesus had prepared them for this. Throughout his life and ministry, Jesus had told them that he was going to send his spirit.\n\nIn fact, let me read for you what John the Baptist said in Matthew chapter 3. John says, \"I baptize you with water for repentance, but after me comes one who is more powerful than I, whose sandals I am not worthy to carry. He will baptize you with the Holy Spirit and fire.\" This has been foretold.\n\nJesus in John chapter 3 says you have to be born again—new life has to happen. He compares the coming of life to the coming of the spirit. What does he compare that to? He compares it to wind, which for the Jewish audience was not an unfamiliar image for the spirit of God. If we go all the way back to the beginning, Genesis chapter 1, it says the spirit of God was hovering, and the word \"spirit\"—in Genesis chapter 1, verse two—is \"ruach,\" which is the word for wind.\n\nAll throughout the scriptures, wind is associated with the spirit of God. Consider the crucial passage in the Old Testament in Ezekiel chapter 37. Ezekiel is taken to a field where there are dry bones. The Lord says to Ezekiel, \"Ezekiel, prophesy to the breath—prophesy. That word, 'breath,' is 'ruah,' wind. Prophesy, son of man, and say to it: This is what the Sovereign Lord says: Come, breath, from the four winds and breathe into these slain, that they may live.\" So Ezekiel prophesied as he commanded, and breath entered them. They came to life and stood on their feet—a vast army.\n\nThis moment in Ezekiel is actually a crucial moment in Old Testament prophecies of the day when God would bring new life to his people, when he would make a new covenant with them. So here we are sitting in the room, violent wind, and all of a sudden this fire comes down. What is the deal with fire? That is a little creepy. But if we rewind in the Jewish mindset and think through the Old Testament scriptures, when God appears, there is often fire.\n\nMoses is in the wilderness, and the Lord is going to get his attention and send him to Egypt to set his people free from slavery. How does he do it? A burning bush. In 2 Chronicles 7:1, when Solomon dedicates the temple—which is the place where God's presence would meet with his people—it says that fire came down from heaven at the dedication of that temple.\n\nFire all throughout scripture has been associated with the presence of God. As God delivers his people out of Egypt and slavery into the wilderness, how does he lead them by night? With a pillar of fire that comes and rests in front of them and leads them. This is the picture of God's presence.\n\nHere we are in the room with this violent wind and these pillars of fire. All of a sudden, it does not seem like some creepy, woo-woo charismatic thing. It seems like God is here and he wants to make that known. God is making it clear that—and I want you to hear this—if you miss nothing else about Pentecost Sunday, here is what it is all about: The church is about the presence of God in his people.\n\nAll throughout the scriptures, there is the question of where and how God will dwell with his people. They are sinners. The story starts with God dwelling with his people in the Garden of Eden. But something broke that, and it is our sinfulness. The story woven throughout the Old Testament is sometimes easy to get lost in the weeds with all these laws and judges and different things, but do not miss the big story: the question of how people can get back to the place where God dwells with them.\n\nHere we come to this house where people are waiting just as Jesus had promised. God comes to dwell not in a temple or a tabernacle or in some religious system. He comes to dwell in his people. Notice that it does not come as just a single pillar of fire. What happens? It divides. Over each person is this flame. I have trouble even imagining the scene of what this looks like—fire over everybody's head. But the picture here is vivid: God is coming to dwell in each of his followers, and that is categorically new.\n\nThis has never been a concept before now in the redemptive history of God. The concept of God's presence was tied to a place. We have to be there. There is something that has to happen to make us worthy to be there. That is the story of the Old Testament law and all the rigmarole of rituals. What does Jesus do? Well, we are told in the Gospels that he dies on the cross to take the payment.\n\n# Sermon Transcript\n\nUpon him was the punishment that brought us peace. The curtain in the temple that divided the inner place where God's presence dwelt from everybody else was torn from top to bottom. God made it possible to dwell in you. This is wild. I think it's important that we celebrate Pentecost Sunday because this is what the church is all about. If you are a follower of Jesus, if you've looked to Jesus's finished work on the cross and his resurrection as your only hope in life and death, his spirit comes to dwell within you. This gives us a category for what we're doing here this morning. God's presence is here. And you all are burning bushes. You are designed by God to be part of a hurting world, tasting and seeing who God is because God dwells within you.\n\nThe Spirit of God, the Holy Spirit, is the third person of the Trinity. It is the presence of God that empowers the people of God to join the mission of God. The Trinity is mind-boggling: God, one being, three persons, each fully God. God the Father, God the Son, God the Holy Spirit. In the providence and outworking of God's mysterious and sovereign plan, each person of the Trinity is working for your good. From the beginning of time, we're told in Ephesians 1 that God the Father set his love on you before time began. He would purchase you with the blood of Jesus, his Son, and you would by faith through grace be sealed with the promised Holy Spirit. The Holy Spirit is not some woo-woo force out there. God personally dwells in you if you are a follower of Jesus. The presence of God changes everything.\n\nIf we don't miss anything else, I want us to sit in the reality that the presence of God is what you were made for. To be in the presence of the God who created you. And he says, \"I'm going to dwell in you.\" When you think about what it means to walk with Jesus and follow after God, Paul says it like this in Romans: \"The same spirit that raised Jesus from the dead lives within you.\" That is a game-changer for how I approach my walk with God. It no longer becomes \"I have to produce life,\" but rather \"life is within me. God, how do I join you?\" That's what I want us to see about who we are as East Point Church. We are simply asking the question: How do we join what God is already doing through his spirit?\n\nIn Acts chapter 2, we see something remarkable. The first thing is that what is ordinary becomes extraordinary. Look at how the passage unfolds. Acts chapter 2, verse 5 says, \"Now there were staying in Jerusalem God-fearing Jews from every nation under heaven.\" God is so good. He decides to send his spirit at Pentecost, knowing that everybody will converge on Jerusalem and every nation will be present at this moment. Verse 6 says, \"When they heard the sound, the crowd came together bewildered because each one heard their own language being spoken.\" Utterly amazed, they asked the question in verse 7: \"Aren't all these who are speaking Galileans?\"\n\nGalileans doesn't mean much to most of us, but it means country folk. These are ordinary people, not the elites. It's like having somebody who is not educated, from the country, suddenly speaking in many languages. What's happening? This is what God does. When the spirit of God empowers the church, what is ordinary becomes extraordinary. We see this story throughout the book of Acts. In Acts chapter 5, Peter and John are arrested because they're proclaiming the good news of Jesus. When they say, \"We cannot help but speak what we've seen and heard,\" it says they were all amazed at their courage because they remembered that they were ordinary men. That's the story of God.\n\nPeter is going to get up and give the first big sermon of the church. It's incredible. I encourage you to read all of Acts chapter 2 because he proclaims the good news of Jesus to all who are listening that day. But here's what I want you to see. This is the same Peter who, fifty days ago—fifty days after Passover—denied Jesus. This is what the spirit of God does when he fills the church. He takes what is ordinary and even broken and makes it extraordinary. All of a sudden, these ragtag people are speaking and everybody's hearing it in their own language. God does something miraculous there, and it's emblematic of what Jesus said in Acts chapter 1: \"You will be my witnesses here in Jerusalem, Judea, and the ends of the earth.\" Jesus is giving the church a glimpse of what he wants to do through this categorically new thing empowered by the spirit.\n\nHe wants to bring people together who don't ordinarily come together. That is what we see in the church. Diversity was not a cultural idea—it is God's idea. When all these languages are being heard at Pentecost and people are hearing in their own language, it's a reversal of what happened at Babel in Genesis 11. What do people do? They say, \"We want to be all that. Let's make a tower up to God.\" They build this tower and God says, \"What are you doing?\" The judgment God puts on them is to give them all different languages, which confuses and disperses them. But here at Pentecost, Babel is undone. By the spirit of God, what is ordinary becomes extraordinary, and the church becomes a place where people from different cultural backgrounds, different languages, different political ideologies can come together and say we are about the kingdom of God and not the kingdom of earth. That is extraordinary, and that is something the spirit of God wants to produce in and through the church.\n\nNot only does God take what's ordinary and make it extraordinary, but when the presence of God fills the people of God, he takes what is extraordinary and makes it ordinary. We talk about our core value as East Point Church: we expect God to change lives. What happens at the end of Acts chapter 2? Peter gives his message, and verse 41 says, \"Those who accepted his message were baptized. About 3,000 were added to their number that day.\" As you read through the book of Acts, people's lives keep getting changed.\n\nNow, it's important for us to understand that the book of Acts is a descriptive book of the birth of the church. We're not trying to take everything in Acts and say we expect that to happen today. But what we do expect is that the spirit of God wants to take what is extraordinary—lives being changed—and make it ordinary for us, such that we expect it. God, that confronts my fears. It confronts my comfort. It confronts my expectations of God because it invites me into deeper faith. I want to say that this is what the spirit of God wants to do in each of us: to move us from seeing God at work as the exception to seeing God at work as our expectation. That is what the spirit of God wants to do.\n\nThis is what we celebrate at Pentecost. God is empowering the church—you and me, men and women, boys and girls who make Jesus Lord of our lives. His spirit dwells in you to empower you to join God in his mission, to bring together people from every tribe and tongue to taste and see that Jesus is good and that they were made for more. The spirit of God creates a new category of ordinary: a spirit-filled, diverse community that believes Jesus changes everything. When I come to this text, it is both convicting and inviting. It convicts me because I ask myself, \"Do I believe this?\" And it's inviting because I sense God saying, \"I want you to believe this because it's true.\"\n\nAs we come into our time of response this morning, I'm going to pray. We have in the back of the room a world map on the floor and a map of the triangle. Our vision statement as East Point Church is to bring hope to the triangle and the nations as we proclaim and embody the good news of Jesus. I sense the spirit of God is inviting us to believe that he wants to change lives, that he wants to bring hope to the triangle and the nations.\n\nAt the back table are some tealight candles. I want to capture a picture for us on Pentecost Sunday. I invite you during our time of worship as we close this service to take one of those tealight candles, turn it on, and put it on one of these maps—whether it's in the triangle or somewhere across the globe. Would we boldly as a church believe that God is inviting us into something way bigger than ourselves? Something way bigger than what was started on February 8th when East Point launched. Something that started at the birth of the church when God poured out his spirit and said, \"This changes everything.\"\n\nFather, we thank you for this word. We thank you that you have invited us to be part of what you are doing to the ends of the earth. God, I am humbled that you would dwell within me. Who am I that you would choose to give your life for mine? God, I pray that you would give us a vision as a church for seeing what is ordinary and that you would turn it into something extraordinary. We want to offer ourselves to you in that. God, I also ask that you would give us faith—that what is extraordinary would be ordinary for us. God, would you bring about revival in East Durham? Would you bring together men and women, boys and girls who don't look alike, don't talk alike, who come from different backgrounds, and would you bring us together under one roof to say that Jesus changes everything? That's why we're here, God. So we offer ourselves to you. Stir in us your spirit. We ask in Jesus's name. Amen.","url":"https://www.youtube.com/watch?v=S4iCehDKOlg"},{"id":"LC-gSJ4Q0Ls","date":"2026-05-19","title":"True Religion","scripture":"Isaiah 58","preacher":"Peter Frey","series":"Isaiah","desc":"In Isaiah 58, God calls His people beyond empty religious activity into lives marked by justice, compassion, and wholehearted devotion. Join Pastor Peter Frey as he shares what true religion looks like and how it leads to real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: Isaiah 58 — Religious Worship That Looks Empty\n\nGood morning. My name is Irene. Please join me in reading aloud this prayer for illumination.\n\n*Lord, open our hearts and minds by the power of your Holy Spirit that as your word is read and proclaimed, we may receive it with joy. Amen.*\n\nPlease remain standing as you are able for the reading of God's word from Isaiah chapter 58, verses 6 through 11.\n\n*Is not this the kind of fasting I have chosen, to loose the chains of injustice and untie the cords of the yoke, to set the oppressed free and break every yoke? Is it not to share your food with the hungry and to provide the poor wanderer with shelter? When you see the naked to clothe them and not to turn away from your own flesh and blood? Then your light will break forth like the dawn and your healing will appear. Then your righteousness will go before you and the glory of the Lord will be your rear guard. Then you will call and the Lord will answer. You will cry for help and he will say, \"Here I am.\" If you do away with the yoke of oppression, with the pointing finger and malicious talk, and if you spend yourselves in behalf of the hungry and satisfy the needs of the oppressed, then your light will rise in the darkness and your night will become like the noonday. The Lord will guide you always. He will satisfy your needs in a sun-scorched land and he will strengthen your frame. You will be like a well-watered garden, like a spring whose waters never fail.*\n\nThis is the word of the Lord. Thanks be to God.\n\n---\n\nGood morning. If you're new here this morning, I want to extend a special welcome to you. We're glad you're worshipping with us. We are wrapping up today a sermon series that we've been walking through in the book of Isaiah that we've called \"Good News in Uncertain Times.\" If you're like me, we need good news.\n\nHow many of you grew up watching Antique Roadshow? You know, the PBS show where people bring in something they think is valuable, and then there's that moment of crushing despair when they find out it's a counterfeit? There's a modern equivalent in Pawn Stars, and I saw an episode where someone brought in a portrait signed by Abraham Lincoln himself. The man was so confident, but apparently there's a famous counterfeiter named Joseph Cosey who was a master at forging signatures. It's estimated that multiple super valuable documents are in circulation among collectors that aren't actually real because Joseph Cosey was so skilled.\n\nThere's a moment watching these shows where the person comes in with something they think is valuable, and then someone who knows the real deal picks it up. Instantly, they know it's a fraud. In Isaiah chapter 58, we have one of these moments. The chapter begins with God telling Isaiah, \"Shout it aloud. Do not hold back. Raise your voice like a trumpet. Declare to my people their rebellion and to the descendants of Jacob their sins.\"\n\nNow, you would expect what comes next to be a litany of serious sins—adultery, idolatry. But listen to what verse two actually says: \"For day after day they seek me out. They seem eager to know my ways, as if there were a nation that does what is right and has not forsaken the commands of its God. They ask me for just decisions and seem eager for God to come near.\"\n\nThat's not what I expected. Rebellion and sins shouted like a trumpet? Isaiah wants us to see something crucial this morning: there is a kind of worship that looks religious but God calls rebellious. There is a kind of worship that looks religious but God calls it rebellious.\n\n---\n\nYou know how hard it is to shop for watermelons? You knock them, you look at the spot underneath, you have formulas to find a good one. But we all know what it's like when you get home—it's a gamble. You cut it open and you might find it's empty inside.\n\nThat's the picture here in Isaiah 58. On the outside, these watermelons look the same. But there's a kind of worship that looks righteous and religious on the outside but is empty on the inside, while there's a kind of worship that is full. So let's read on in Isaiah 58. Verse 3 says: \"Why have we fasted?\" they say. \"And you have not seen it. Why have we humbled ourselves and you've not noticed?\" This is Israel speaking to God.\n\nNow God speaks back: \"Yet on the day of your fasting you do as you please and exploit all your workers. Your fasting ends in quarreling and strife and in striking each other with wicked fists. You cannot fast as you do today and expect your voice to be heard on high.\"\n\nThere is a kind of fasting, a kind of worship. In ancient Israel, there were basically three big practices of worship that defined Jewish faith—much like today when we might say read your Bible, pray, and go to church. Fasting was one of these central practices. And God says, \"You seem eager for God to come near. Day after day you seek me out. Yet there's this practice of approaching God that can look religious but is empty on the inside.\"\n\nWhat God diagnoses here is a kind of hope that is transactional. Throughout this series in Isaiah, we've been exploring the theme of hope—that there is good news in uncertain times because we have hope rooted in future promises grounded in past acts of God that transform the present. In ancient Israel, that hope was rooted in having seen God be faithful before. He's made promises about the future, and that transforms how we think about the present.\n\nWe saw this in Isaiah 43: \"When you pass through the waters, I will be with you. When you pass through the fire, I'll be with you. They won't overwhelm you.\" God isn't promising that life will be easy, but he's promising that he'll be with you. This promise of hope is beautiful—but it becomes religious and empty when it becomes transactional.\n\n---\n\nWhat do I get from God? This is the transactional approach. We approach worship thinking, \"I put in my part, so God will give me his part.\" How many of you have experienced this, or seen a friend go through it? Somebody gets a cancer diagnosis, and what do we always say? \"But they're such a good person.\" We equate doing good with the idea that maybe God will transact something in return. When we approach hope as transactional, this is what Isaiah tells us God proclaims: \"Shout it out from the rooftop. Blare the trumpet. There is a kind of worship that looks religious but God calls it rebellious, and it's empty. That is a hope that is transactional and not transformative.\"\n\nWhat God is inviting us into here in Isaiah 58—and this is one of the most beautiful passages of invitation and promise for us as followers of Jesus—is that transactional hope is self-seeking. Look back at verse 3: \"Yet on the day of your fasting, you do as you please.\"\n\nNotice a phrase repeated later in this chapter. In verse 13, when God talks about the Sabbath: \"If you keep your feet from breaking the Sabbath and from doing as you please on my holy day, if you call the Sabbath a delight and the Lord's holy day honorable, and if you honor it by not going on your own way and not doing as you please.\"\n\nThis phrase, \"doing as you please,\" appears both when God talks about fasting and when he talks about the Sabbath. The idea here is transactional hope. When we approach God transactionally—I put in my part, you give yours—that equates to self-seeking religion. But what Isaiah wants us to see, and what I believe the Spirit of God wants for us as Eastpoint Church this morning, is transformational hope, not transactional hope. Transactional hope is self-seeking. Transformational hope is self-giving.\n\nLook at verse five and six: \"Is this the kind of fast I have chosen, only a day for people to humble themselves? Is it only for bowing one's head like a reed or lying in sackcloth and ashes? Is that what you call a fast, a day acceptable to the Lord? Is not this the kind of fasting I have chosen, to loose the chains of injustice, to untie the cords of the yoke, to set the oppressed free and break every yoke? Is it not to share your food with the hungry and provide the poor wanderer with shelter? When you see the naked to clothe them and not to turn away from your own flesh and blood?\"\n\nThe calling is clear: transformational hope turns into self-giving love.\n\n---\n\nWe have a core value here at Eastpoint that we empower mercy-filled lives. Part of that value is asking, \"What does it mean to have hope that transforms us?\" It turns us into a people who give ourselves away rather than seeking the comfort and self-sufficiency that our culture so easily ingrains in us.\n\nI want you to make a closed fist in front of you. The process of God transforming you is moving you from this to opening your hands to him. We live in a culture so ingrained with the ideology that satisfaction, delight, comfort, meaning, and purpose in life comes from what I can grab in my hands. But the invitation of God is different.\n\nLook at the promise that follows in verse 8: \"Then your light will break forth like the dawn and your healing will quickly appear. Then your righteousness will go before you and the glory of the Lord will be your rear guard. When you call, the Lord will answer. You will cry for help and he will say, 'Here I am.'\"\n\nThis beautiful promise of flourishing is not found with a closed fist. It is found with open hands of self-giving love—what I want to describe as whole life generosity. God is inviting us as a church to really think about this: a life that looks good on the outside can be empty on the inside. There's a kind of worship that looks religious, but God says it's rebellious because you are seeking your pleasure rather than the good of me and my people.\n\nNotice the indictment God gives here: they turn away from their own flesh and blood. In ancient Israel, this phrase referred to family—your children, your blood relatives. What God is inviting us into is that transformational hope starts to change the way we see all people.\n\n# Sermon Transcript\n\nAnd this is countercultural to the people of the ancient world. It is countercultural to us today to say, \"I care for you as my own flesh and blood even though you're not.\" But that is what hope in God does in us. This kind of living comes from a place of abundance. Remember Isaiah 55? If you weren't here, I'm going to read the first few verses: \"Come all you who are thirsty. Come to the waters. You who have no money, come buy and eat. Come buy wine and milk without money and cost. Why spend your money on what is not bread and your labor on what does not satisfy? Listen, listen to me and eat what is good and you will delight in the richest fare.\" This is the invitation of God to His people—that you have a lavish feast before you in the goodness of God, in the grace that He offers, in the love that's experienced in our relationship with Him.\n\nOut of that place of abundance and flourishing, it's not found in self-seeking but in self-giving, whole-life generosity. Verse 10 says this: \"If you spend yourselves in behalf of the hungry and satisfy the needs of the oppressed, then your light will rise in the darkness and your night will become like the noonday. The Lord will guide you always. He will satisfy your needs in a sun-scorched land and strengthen your frame. You will be like a well-watered garden and a spring whose waters never fail.\" This is the invitation of God: that religious hope is transactional and self-seeking, but real hope is transformational. It transforms us into a people who are generous. Why? Because of Isaiah 55. We have received the generosity of God.\n\nThis is why our core value is mercy-filled lives. It has two aspects to it: we have been filled with mercy, and it's out of that mercy that we want to move toward brokenness, not away from it. We want to move toward the oppressed, toward the marginalized, toward the vulnerable. Why? Because that's what God did with us. In 1 Peter it says, \"Once you were people who had not received mercy, but now you have received mercy. And then what does he say the purpose of that is? That you may declare the excellencies of him who called you out of darkness into his marvelous light.\" Real hope is not transactional—something we just get as a promise to escape from the world around us. Real hope is transformational. It transforms us from the inside out so that we start to see flourishing differently. We actually flourish when we seek the flourishing of others.\n\nDon't believe me? Look at Jesus. Jesus exemplifies this in his life. How is he born? He's born in a stable, put into a feeding trough. Why? Because God always identifies with the oppressed. Throughout scripture we see this description of God. In Isaiah chapter 1, God introduces himself as a defender of the oppressed, as a father to the fatherless. He cares for the widow and orphan. This is the same indictment we have in Isaiah 58: \"Wash yourselves and make yourselves clean. Take your evil deeds out of my sight. Stop doing wrong. Learn to do right. Seek justice. Defend the oppressed. Take up the cause of the fatherless. Plead the case of the widow.\" And then the verse that comes after that in Isaiah chapter 1, verse 18, says: \"Come, let us settle the matter,\" says the Lord. \"Though your sins are scarlet, they shall be white as snow. Though they are red as crimson, they shall be like wool.\"\n\nThis is the promise that accompanies a self-giving life, a life of whole-life generosity that cares for the hungry and the vulnerable and the marginalized. These promises are not transactional; they're relational. Because God knows that flourishing is found in him, not in some transactional benefit that comes along with those things. But here's what I want to suggest: the world has a different approach. We have a culture around us. You're not going to go out on the street and find somebody who says, \"Yeah, I'm not about this justice thing. I'm not about caring for people who are hurting.\" But what you will find is that the pursuit, the aim of that, is often from a place of \"I want to feel good about myself. I want to feel better about my part in systemic injustice.\" What God is inviting us into is different. We don't come at this topic from a place of scarcity. We come from a place of abundance. We're feasting at the table of the Lord, and we think, people have got to get in on this. I've tasted and seen that God is good, that he does care for the oppressed, for the fatherless, for the widow. He does care for me, and I want people to experience that. As we walk in that self-giving love, we start to experience the promises of flourishing. The flourishing is found in God.\n\nGod is inviting us into a life of whole-life generosity. We often think about generosity in terms of money, but I want us to think more holistically about that. How is God calling all of us—our time, our talents, and our resources—to step toward brokenness, to step toward those who are hurting, and to care as God has cared for us? In Durham County, about one in seven people are food insecure. That's roughly 45,000 people, and about one in six children in Durham experience food insecurity. If we think about the context of the school where we are standing and sitting this morning, those statistics are much higher. One East Durham community assessment, though a bit dated, had a targeted area nearby Oak Grove with a 46% poverty rate. In the same assessment, only about 23% of residents were homeowners, highlighting housing instability and vulnerability to displacement. Durham has one of the highest eviction filing rates among North Carolina's largest counties—about one eviction filing for every 28 residents.\n\nBut these are numbers. Behind every statistic is an image bearer of God. A mother choosing between rent and groceries. A senior isolated by rising costs of taxes. A child trying to learn while carrying hunger or instability. I sat through moments like this, and if you're like me, I feel this burden of guilt. But I want to suggest here that the motivation is not guilt. It is the beauty of the table that God has laid for us. And it's out of that abundance that we move into lives that are full of generosity.\n\nIt is my prayer for us as Eastpoint Church that God would keep us from being a church that looks religious on the outside but rebellious on the inside. What God invites us into is to pour yourself out, not try to fill yourself up. That comes from a place of having been filled, having been satisfied. We move toward brokenness, we move toward the hungry out of a place of abundance and satisfaction, and we have a God who is lavishly pouring out grace and abundance.\n\nI am deeply indebted to Tim Keller's book *Generous Justice*. I highly recommend it if the Lord is prompting you to wrap your head around what this looks like. He says this: \"If a person has grasped the meaning of God's grace in his heart, he will do justice. If he doesn't live justly, then he may say with his lips he is grateful for God's grace, but in his heart he is far from him. Grace should make you just.\"\n\nI was deeply moved recently when John Perkins, an amazing advocate for justice and racial equality in America, passed away. I had the opportunity to cross paths with him a couple times during his life, and he writes this in one of his books: \"Individualism in our society as I look at it today is the greatest threat to an understanding of the church and the meaning of being a Christian. Yet the unique contribution of America in the history of humankind has been the perfection of individualism. The result is a generation of Christians trying to find God's will for my life rather than God's will, period.\" I hear those words with conviction because the temptation is to approach God as a means to an end for my good. But what if God is the end? And he is the definition of good. All of a sudden my categories for what it means to live toward God and toward my fellow brothers and sisters, my own flesh and blood as Isaiah puts it, is categorically redefined. All of a sudden good is not something transactional but something relational.\n\nI want East Durham to experience that. We step into lives that view real hope as rooted in grace, which produces whole-life generosity. The lavish generosity of Isaiah 55 leads us to the radical generosity of Isaiah 58. \n\nWe live in a culture that is so polarized and politicized that anytime we talk about what it means to care for the vulnerable and step toward the marginalized, we see it through those lenses. Some of us have emotions tied up in that. If you're like me, sometimes I feel a sense of overwhelm when I think about systemic injustices and things like hunger and homelessness in Durham. These are not things that are easily or simply stepped into. It can feel like, \"This is overwhelming. I want to step into this, but I also feel like a drop in a bucket. What is my part in all of this?\" Here's what I want to recommend for us this morning: there are systems of injustice, there are problems that are bigger than the actions we take. But I think the temptation is to let that overshadow what God wants for us in Isaiah 58.\n\nI think God wants us to be transformed by our hope in the way we see people. For some of you, I'm radically challenged about the way I raise my kids. I don't want them to grow up with a closed posture in life. I want them to have open hands. If that means making radical financial decisions that the world calls stupid for the sake of their formation, I want to do it. If that means stepping into conversations that really make me uncomfortable—I don't think addressing systemic overarching problems of our society means I should turn my eyes away from my own flesh and blood. I don't want you to do that either. I don't know what that looks like completely, but I do know that we are called to step into it.\n\nI want to invite you to reflect on this. Throughout church history, there's a practice of the daily examine—a practice of asking questions of our hearts to reveal what is in there. And here is the hope: I do not want you to walk out of this place being motivated by guilt. I'm not here to put guilt on your shoulders. I want you to bask in the lavish grace of God this morning and say, \"I want others to experience that.\" Whether you want to close your eyes or just sit and reflect, I'm going to read through these questions. Give yourself a couple seconds to reflect on each one.\n\nWho are the people I most naturally see and care about? Who do I tend not to notice? When I encounter suffering, need, or vulnerability, what rises in me first? Compassion? Fear? Indifference? Frustration? Helplessness? Distraction? Is there a place where I have settled for a faith that is personal but not compassionate? Who is hungry—physically, emotionally, or spiritually—that God may be inviting me to move toward? Where might God be inviting me to pour myself out rather than simply give what is convenient? Have I allowed busyness, comfort, politics, or cynicism to dull my love for people? What resources has God entrusted to me—time, attention, influence, money, hospitality, encouragement—that could become mercy for someone else? What would it look like for me to live this week with open eyes, open hands, and an open heart?\n\nIf you hang around me long enough, you'll hear me talk about George Müller, a man who gave his life to care for others.\n\n# Sermon Transcript\n\nGeorge Müller was a man of deep faith who devoted his life to caring for the fatherless. In Bristol, England, he opened his home to a few children, and that work grew to encompass thousands. Over the course of his life, he cared for tens of thousands of orphans during the height of the Industrial Revolution, when there was a multitude of children without families. I remember reading a quote from his journal that has stayed with me: \"I don't start my day without finding my heart happy in God.\" He was moved from a place of being satisfied in the Lord.\n\nHe wasn't approaching these acts of service as a transactional thing, but out of a place of abundance. What challenged me most was something else he wrote: \"God judges what we give by what we keep.\" God judges what we give by what we keep. For some of us, the invitation is not necessarily what God is asking you to give. The invitation is deeper: what are you holding on to? What are you seeking to find comfort, security, and meaning in?\n\nEach week we respond in worship in a few different ways. We respond in singing, we respond in prayer with prayer partners around the room, we respond by coming to the Lord's table, and we also respond in generosity. I don't want to gloss over this because this is a practice of the church that forms us—that shapes us into who we long to be. Yes, we want to invite you to give to the mission of Eastpoint. But more importantly, I want to invite you not out of need, but out of the abundance that God has offered to us. As a church, we're going to return to this often.\n\nI want to share a liturgy that will guide our hearts and minds. You'll notice that we are a church that practices liturgy. Each week before we read Scripture, we pray: \"God, open our eyes, open our hearts.\" A liturgy is something that forms us—a practice we do week after week to shape us into who we long to be. I want us to be formed not by the patterns of this world, but by the patterns of Christ's kingdom.\n\nI invite you to read these words with me:\n\n*Holy Father, you are a faithful provider. Everything I have is a gift from you. All I have and am belongs to you. To give without sacrifice, to keep everything to myself, and to build my own kingdom is the way of the world that you cannot abide. But generosity is the way of those who call Christ their Lord, who love him with freed hearts and serve him with renewed minds, who withstand the delusion of riches, whose hearts are in his kingdom and not the systems of this world. I am determined to increase in generosity until it can be said there is no need among us. I'm determined to be trustworthy with such a little thing as money that you may trust me with true riches. Above all, I am determined to be generous because you, Father, are generous. It is the delight of your daughters and sons to share your traits and to make you known in the world.*\n\nAs part of being a people who are filled with mercy, we return to the table each week. We return to the table because it starts here. Jesus not only identified with the oppressed, but he suffered injustice to take our sin upon himself. He rose to give hope and new life. We come back to the table each week to remember this central truth.\n\nIf you're a follower of Jesus, I invite you to come to the table during the next three songs. There's one in the back and one up here. We come to remember that on the night Jesus was betrayed, he broke bread with his disciples and said, \"This is my body which is broken for you.\" He took the cup and said, \"This cup is a new covenant in my blood\"—a relational thing, not transactional—poured out for the forgiveness of sins. As often as you eat this bread and drink this cup, we proclaim the Lord's death until he comes. We proclaim that we are a people who have received mercy. So, God, make us a people of mercy.\n\nI invite you, if you're a follower of Jesus, to dip the bread in the cup and eat and remember the gospel. Let's stand and sing together.","url":"https://www.youtube.com/watch?v=LC-gSJ4Q0Ls"},{"id":"2YUrPpUUOYQ","date":"2026-05-12","title":"The Invitation of Hope","scripture":"Isaiah 55","preacher":"Peter Frey","series":"Isaiah","desc":"In Isaiah 55, God invites all who are thirsty to come and receive life freely through Him. Join Pastor Peter Frey as he shares the hope, grace, and satisfaction found in responding to God’s invitation. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript\n\nGod of light, you have revealed your very self in your Son, Jesus Christ, your Word and mercy made flesh, who lived among us, full of grace and truth. Open us once again that in your words of your holy Scripture, we might know your presence and follow in your light always. Amen.\n\nPlease remain standing as you are able for the reading of God's Word from Isaiah 55:1-7. \"Come, all you who are thirsty. Come to the waters, and you who have no money, come, buy and eat. Come, buy wine and milk without money and without cost. Why spend money on what is not bread and your labor on what does not satisfy? Listen, listen to me and eat what is good, and you will delight in the richest of fare. Give ear and come to me. Listen that you may live. I will make an everlasting covenant with you, my faithful love promised to David. See, I have made him a witness to the peoples, a ruler and commander of the peoples. Surely you will summon nations you know not, and nations you do not know will come running to you because of the Lord your God, the Holy One of Israel, for He has endowed you with splendor. Seek the Lord while He may be found. Call on Him while He is near. Let the wicked forsake their ways and the unrighteous their thoughts. Let them turn to the Lord, and He will have mercy on them, and to our God, for He will freely pardon. This is the Word of the Lord.\n\nPlease be seated. At this time, we'll dismiss the kids to Adventure Park. All right, Eastpoint kids, have a great time in class. We love having you worship with us.\n\nGood morning, Eastpoint Church. I'm so glad to have you worshiping with us this morning. We have a special couple in the house today. Taleeb and Alexa got married on Friday. Congratulations, you two. What a joy to celebrate that with you.\n\nI've often found restaurant slogans to be somewhat amusing, so I thought I'd share a few with you and see how well you identify them. Let me start with an easy one: \"Have it your way.\" That's Burger King. How about this one: \"When you're here, you're family.\" That's Olive Garden. \"Finger licking good?\" Kentucky Fried Chicken. And here's one more: \"Come hungry, leave happy.\" That's IHOP. I understand the \"come hungry\" part, but I think it should really be \"leave with regrets.\"\n\nIn many ways, I jokingly start the sermon this way because I think the message of Isaiah 55 is exactly that: come hungry, leave happy. Isaiah just does it better than IHOP. Look at how Isaiah 55 begins. \"Come, all you who are thirsty. Come to the waters. And you who have no money, come, buy and eat. Come, buy wine and milk without money and without cost.\" Then notice how the chapter ends. \"You will go out in joy and be led forth in peace. The mountains and hills will burst into song before you, and all the trees of the field will clap their hands. Instead of the thorn bush, the juniper will grow. Instead of briars, the myrtle will grow. This will be for the Lord's renown, for an everlasting sign that will endure forever.\" The invitation of Isaiah 55 is come hungry, leave happy.\n\nLet me pray with you again. Jesus, as we sit in this beautiful invitation of Isaiah 55, we pray that you would meet us here. God, would you show us more of yourself? Show us the depths of your mercy. Reveal in us what is not of you. God, I pray that you might fill us with your joy, rooted in the hope that we have in Jesus. We pray in Jesus' name. Amen.\n\nYears ago, when newspapers were still a common thing, a newspaper in London reportedly offered a prize for the best definition of thirst. Thousands of answers were submitted. Some described the dryness of the mouth. Others talked about the body's craving for water after hard labor in the sun. But the winning entry was just a single sentence: \"Thirst is the conscious desire of the body for water.\" It's simple but profound, because thirst is more than dryness. It's an awareness. It's the realization that something essential is missing.\n\nIsaiah 55 is written as an invitation. I want to walk through this passage and think about it through the lens of an invitation. Imagine you just went to the mailbox, pulled out an envelope, and opened it to see \"You're invited\" on the top of the page. Every good invitation needs five elements: you need to know who's invited, what the occasion is, how to RSVP, what to expect, and what to bring. Clarity is key when it comes to an invitation.\n\nThe words of Isaiah 55 begin, \"Come. You're invited.\" The first question is: who is invited? Notice what it says: \"All you who are thirsty.\" Thirst, as we learned, is the conscious desire of the body for water. I think Isaiah is taking this and speaking into a spiritual reality that runs deep within all of us. We are searching. We are longing. The invitation of Isaiah 55 is that you have deep desires within you, and if you want to receive this invitation of God's abundant, lavish mercy, you must have a conscious awareness of your thirst.\n\nHere's what I want to suggest: that conscious awareness of thirst confronts our self-sufficiency. Look at verse two: \"Why spend money on what is not bread and your labor on what does not satisfy?\" The invitation is to come thirsty. If you're thirsty, come. But the implication of verse two is that some of you are not thirsty, or so you think. Why do you spend your money on what is not bread? Why do you labor on what does not satisfy?\n\nI recently came across an article in The Atlantic magazine about the best free bread in America. It's a lengthy piece that takes you on a journey from Red Lobster's cheddar biscuits to Texas Roadhouse's buttered buns with cinnamon spread. My family didn't go out to eat often growing up, but I distinctly remember moments when my parents would say, \"Don't fill up on the bread. Don't spoil your dinner.\" But how many of us have done exactly that? You go out to eat because you're hungry and you came for the steak. But then they bring that basket of perfectly warm bread with butter, and you just start eating. You know it's good. But you came for the main course, and when it arrives, your appetite is already gone.\n\nThe picture of Isaiah 55 is this: you have a thirst, a hunger that God created within you. It is something meant to be satisfied, and you are filling it up with things that don't satisfy. The invitation of who's invited is an invitation to those who are thirsty, and not only thirsty, but those who are broke. Notice the end of verse one: \"Come, buy wine and milk without money and without cost.\" Verse two then asks, \"Why spend money on what is not bread, and your labor on what does not satisfy?\" The invitation of God's mercy confronts our self-sufficiency. God says, \"Come. If you're thirsty and if you're broke, come.\" But some of you are spending your labor and your money on things that do not satisfy.\n\nRhetorical questions appear throughout Scripture. Jesus echoes this very question: \"What profit is it for a man to gain the whole world but forfeit his soul?\" In other words, there is a way of living that fills up on biscuits and misses what you were made for. There is a way of living that seeks the approval of people and the accumulation of comfort. There is a way of living that looks to the next thing—if I just get past school, if I just get to that bigger house, if we just grow our family. We chase an insatiable desire, laboring and spending money on things we believe will satisfy us. But the invitation of Jesus is this: come, all you who are thirsty. All you who are broke, come. The implication is that you're invited. You just need an awareness that you're the one who's thirsty.\n\nSo the first element of clarity in this invitation is: who's invited? Everyone who's thirsty. What's the occasion? Look at verse three: \"Give ear and come to me. Listen that you may live. I will make an everlasting covenant with you, my faithful love promised to David.\" The occasion is God's faithful love for you. You're invited to the covenant of God's faithful love.\n\nI think we often view the invitation of Christianity as something propositional—a certain set of principles by which we govern our lives. We sometimes approach God's Word as a manual for life, like the acronym \"BIBLE: Basic Instructions Before Leaving Earth.\" This idea treats it as a system for ordering your life to have a better existence. But the occasion here is not a proposition or a system of beliefs. The occasion is a person. It's relational, not propositional. The invitation of Christianity is relational. It's a person who loves you and sets His love upon you. Give ear and come to what? To me. Listen that you may live. I will make an everlasting covenant with you, my faithful love promised to David.\n\nThis echoes a promise God made to David, that there would be a descendant of King David who would reign with an eternal throne, an eternal kingdom. He would reign over the house of David forever. The promise points us to Jesus. It's a person. So the occasion of the invitation is God's faithful love.\n\nHow do I RSVP? What are the details? Notice verse six: \"Seek the Lord while He may be found. Call on Him while He is near. Let the wicked forsake their ways and the unrighteous their thoughts. Let them turn to the Lord, and He will have mercy on them, and to our God, for He will freely pardon.\" The invitation is to everyone who is thirsty. The occasion is that God loves you. The RSVP, what do you do? It is this: forsake self-sufficiency and call upon Jesus. This is the invitation of God's abundant, lavish mercy. Seek the Lord while He may be found. Call on Him while He is near.\n\nI want you to hear this: God is near to you this morning. He's closer than you realize. He's greater than you can imagine, but He's nearer than you realize. Scholars debate what Isaiah is referring to when he says, \"Seek the Lord while He may be found.\" The implication is that there may be a day when He may not be found. There's an urgency to this call, and I think there's a mystery to it as well.\n\nThe verses that follow say, \"For my thoughts are higher than your thoughts. My ways are higher than your ways. For my thoughts are not your thoughts, neither are my ways your ways. As the heavens are higher than the earth, so are my ways higher than your ways and my thoughts than your thoughts.\" I want you to hear this: the invitation of God to you in His mercy is not to have all the answers. It's to have a person who is greater than we can imagine and nearer than we realize. And He wants to show you abundant mercy.\n\nBut the reality of our condition—the reason we receive the invitation in the first place—is that we have gone to the cheddar biscuits instead of the main meal. We have sought things we thought would satisfy. And the heart of that is idolatry. It's putting anything and everything in the place of God in our lives. The Bible calls that sin. The invitation here is: come to the waters, all you who are thirsty. Find water, bread, and wine without money and without cost.\n\nThe reality is we all know that there's no such thing as a free lunch. My wife Mary and I lived in Boston while I was in seminary, and we were friends with the owner of a Chick-fil-A up there. Chick-fil-A used to have a policy where they gave out many coupons for free sandwiches from their calendars. They had a policy that their coupons would expire.\n\n# Sermon Transcript - Cleaned\n\nCoupons at Chick-fil-A never expire. That was their policy. Mary and I were seminary students without much money, so we collected Chick-fil-A coupons and got free meals all the time. But then we got to know the owner through our church and became friends with him. That's when I started to realize something: when you know the owner, the free meal doesn't feel so free anymore. You start to think about how he's absorbing the cost. There's no such thing as a free meal—somebody's always paying for it.\n\nThe good news of the gospel of Jesus is that Jesus set his love upon you while we were still enemies of God. He stepped into our sin and our broken world caused by our self-sufficiency, and he said, \"I'm going to set my love upon you.\" That's the occasion of the invitation. Jesus paid the price so that we can read the words in verse 7: \"Let them turn to the Lord, and he will have mercy on them, and to our God, for he will freely pardon.\" This word \"freely\" means abundantly. The supply will not run out. It's the endless supply of God's forgiveness and grace. That isn't just free—it's paid for. That's the invitation.\n\nSo, who's invited? Everyone who's thirsty. What's the occasion? God's faithful love for you. How do I RSVP? Forsake self-sufficiency and call upon Jesus. The Bible calls this repentance—turning from what we have tried to fill ourselves with and turning to God and saying, \"Jesus, I believe you paid for that. I want to feast on what will actually satisfy my soul, and that is a relationship with God.\"\n\nWhat should you expect? He gives you three things. You'll find water for your thirst, bread for your nourishment, and wine for your enjoyment. Your thirst will be quenched, your soul sustained, and your heart delighted. These are the promises of the gospel of Jesus. C. S. Lewis says, \"Our desires are not too strong, but too weak. We are half-hearted creatures, fooling around with drink and sex and ambition when infinite joy is offered us. Like an ignorant child who wants to go on making mud pies in the slum because he cannot imagine what is meant by the offer of a holiday at the sea—we are far too easily pleased.\"\n\nThe invitation of Isaiah 55 contains so much beauty and complexity. The invitation here is that there is a feast greater than anything you're searching for. There is a depth to the well of God's living water. Jesus said, \"I am the bread of life.\" He said, \"I am the living water.\" Your thirst is quenched, your soul is sustained, and your heart is delighted. How does God do that? He gives us himself. Remember, this is not about propositions—it's about relationship. God invites us to experience who he is. And how do we know who he is? He's given us his word. I want to suggest this is not basic instructions before leaving Earth. This is the revelation of a person, and his name is Jesus.\n\nVerse 10 of this passage says, \"As the rain and snow come down from heaven and do not return to it without watering the earth and making it bud and flourish so that it yields seed for the sower and bread for the eater\"—notice the bread, the offer, the invitation that you will find bread. Where do we find it? Right here. So verse 11 says, \"So is my word that goes out from my mouth. It will not return to me empty, but will accomplish what I desire and achieve the purpose for which I sent it.\" This is the good news. The word of God will lead you to the feast of God's table.\n\nI love the description Isaiah gives us. As the snow and rain water the earth, sometimes I walk away from time in this word, and it doesn't really feel like my thirst is quenched, my soul sustained, and my heart delighted. Sometimes it's like a snow day. The word has come and is sitting on me. Rain waters the earth immediately, but snow takes time. We lived in Boston, and I remember our first year there in 2011. Mary and I watched the stop sign outside our apartment disappear as the snow piled up. It was dreadful, just trying to make it through the dirty winter of snow in Boston. But when spring comes, that snow melts, the grass starts growing, the trees change, and suddenly what was stagnant has watered the earth. I think God's word sometimes is like that in our lives.\n\nThe invitation is to come to the table. Jesus is offering you the abundant, paid-for grace and mercy of God. We have the invitation to feast on that. Sometimes in our culture of immediacy, we want it to be like a rainstorm that instantly brings spring. Sometimes that takes time. But the promise here is, \"So is my word that goes out from my mouth. It will not return to me empty. It will accomplish what I desire and achieve the purpose for which I sent it.\" The desire of God for you this morning is that your thirst would be quenched, your soul satisfied and nourished, and your heart delighted. That joy would be the outcome of our hope.\n\nHere's the invitation: Everybody who is thirsty. What's the occasion? God loves you. How do I RSVP? I forsake self-sufficiency and I turn and call upon Jesus. What should I expect? My thirst will be quenched, my soul sustained, and my heart delighted. What should I bring? Absolutely nothing. Again, verse 1 says, \"Come, buy wine and milk without money and without cost.\"\n\nHere's the good news of the gospel in Isaiah 55. You're invited to experience the satisfaction that your soul is longing for. The only way to experience that is to come empty-handed and say, \"I bring nothing to the table. It's not my answers that I can provide. It's not my past. It's not my effort to pull myself together.\" The invitation is come all you who are thirsty. That's you. That's me. We are longing to be satisfied by the goodness and mercy of God, and it is abundant, and it is paid for. The invitation is come thirsty and broke, and the promise of verses 12 and 13 is leave with joy and peace.\n\nVerse 12 says, \"You will go out in joy and be led forth in peace. The mountains and hills will burst into song before you. All the trees of the field will clap their hands. Instead of the thorn bush will grow the juniper. Instead of briars, the myrtle will grow. This will be for the Lord's renown, for an everlasting sign that will endure forever.\"\n\nHere's the promise: come hungry and leave happy. Not the happiness that the world wants to offer—that's dependent upon circumstances. We have thorn bushes and thistles in our broken world. But the promise is, just as the snow and rain waters the earth, God is going to do what he has promised. He said, \"One day I will wipe away every tear, and one day all things will be made new, and you will experience the joy and peace not of some propositional truth, but of a person who loves you.\" And he says in Isaiah 55, \"Come.\" Just come.\n\nLet's pray together. Father, we thank you for this word. We thank you for the invitation to your abundant and lavish grace. Lord, I pray for any in the room this morning who've never received your invitation of grace. God, I pray that they would hear the invitation of Isaiah 55 and the invitation of the gospel—that everyone who calls on the name of the Lord will be saved. Jesus' last words when he gave his life for us on the cross were, \"It is finished.\" The feast is paid for. The satisfaction is here. Father, I pray that this hope—that you will turn the thorn bush into flowers—would be the joy and peace that sustains us, that quenches our thirst, that delights our heart. God, even as we continue in worship, I pray that we would respond to your invitation. That we would drink deeply from the well that is your grace. That we would feast upon you. And that you would sustain our weary souls. We pray in Jesus' name. Amen.","url":"https://www.youtube.com/watch?v=2YUrPpUUOYQ"},{"id":"JyydXvRRAhU","date":"2026-04-30","title":"The Greatness of a God Who Is Near","scripture":"Isaiah 40","preacher":"Peter Frey","series":"Isaiah","desc":"Originally preached on April 26, 2026, this message from Isaiah 40 reveals the greatness of God and His nearness to His people. Join Pastor Peter Frey as he shares how the Creator of all things meets us in our weakness and renews our strength. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon T
