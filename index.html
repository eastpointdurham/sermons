erse 41: \"Two people owed money to a certain moneylender. One owed him five hundred denarii, the other fifty. Neither of them had the money to pay him back. So he forgave the debts of both. Now which of them will love him more?\" In other words, if one man owed five hundred and another owed fifty, and you canceled both debts, which man is going to love him more?\n\nThe question seems simple to Simon, but he's struggling to see its relevance. \"The one, I suppose, who had the bigger debt,\" he says. \"You suppose, Simon?\" Jesus responds. Curiosity is peaked as Jesus turns to the woman. She's still at his feet. He looks at her in a way that no man had ever looked at her before. He says to Simon, \"Do you see this woman?\" I imagine that Simon is starting to get uncomfortable with the simplicity of Jesus's questions.\n\nJesus continues, \"I came into your house. You did not give me any water for my feet, but she has wet my feet with her tears and wiped them with her hair. You did not give me a kiss, but this woman from the time I entered has not stopped kissing my feet. You did not put oil on my head, but she has poured perfume on my feet.\" This Pharisee's hospitality is not necessarily being criticized, but the affectionate gratitude of a woman off the streets is being praised. The welcome of a prestigious Pharisee is outdone by the gratitude of an unnamed prostitute.\n\nJesus continues in verse 47: \"Therefore, I tell you, her many sins have been forgiven as her great love has shown. But whoever has been forgiven little loves little.\" And here it is. The reason I've taken the majority of my time to tell you this story is this verse right here. He who is forgiven little loves little. He who is forgiven much loves much. Her debt was large and her love was great.\n\nI want to make a few observations from this text about Christian hospitality. I use that word Christian hospitality intentionally. Hospitality is not uniquely Christian. Walt Disney is pretty skilled at it. But I do want to suggest that Christian hospitality is uniquely transformative. The first thing I want us to see in this text is that the practices of Christian hospitality and generosity are proportionately connected to our realization of the gospel.\n\nWhat do I mean by that? We all owed a debt that was too big for us to pay. And Jesus paid it all. We are the recipients of radical and generous hospitality. What is hospitality? It is welcoming the stranger into a place of dignifying presence. Christian hospitality is about seeing people and welcoming them into spaces of dignifying presence. Our directional goal as a church is this: I regularly look for opportunities to practice hospitality toward friends and strangers by seeing and welcoming them into a space of dignifying presence.\n\nWhat does this look like? One of the things it looks like is that Christian hospitality goes beyond cultural expectations. That is what Jesus does all throughout the gospels. He defies every cultural expectation. A rabbi, a teacher, a messenger from God would never associate with a woman like this. The disciples struggled with this. He hangs with the woman at the well in John chapter 4, and they struggle with Jesus associating with her. Here in Luke 7, right before this passage, in verse 34, it says, \"The Son of Man came eating and drinking, and you say, 'Here is a glutton and drunkard, a friend of tax collectors and sinners.'\" The criticism of Jesus is that he is breaking cultural expectations. I want to suggest that Christian hospitality is about breaking cultural expectations, not meeting them.\n\nSome of you, when you had that baggage about hospitality, had this picture of a clean house, a four-course meal, and your guests joyfully laughing around the table. I want you to leave that baggage here this morning. I want you to hear Jesus's invitation to radical hospitality that is not so much about what is provided, but how it's provided. Christian hospitality is less about what is provided and more about how it is provided.\n\nThis woman comes to Jesus in the darkness of the night using her tears and her hair to wash Jesus's feet. Her resources are primitive. She anoints his feet with perfume that is probably a part of her story. And Jesus praises the hospitality of this woman. What I want us to see is that we are recipients in the gospel of Jesus of radical hospitality. We were once sinners. We were once, as it says in First Peter 2, strangers and aliens, but now we are a royal priesthood, a chosen generation. We are who God has set his dignifying presence upon.\n\nHere's what I want to suggest: hospitality does not have to be extravagant, but it is expensive. And Jesus showed us that at the cross. He said, \"This is my body which is broken for you. This is my blood that is shed for you.\" The radical hospitality of the gospel shows us that hospitality will cost us something, but it doesn't have to meet our cultural standard of expectations. The kids' toys don't have to all be perfectly placed away. Your house doesn't have to be immaculate and clean. The meal does not have to be lavish. But we have received hospitality.\n\nJesus suggests in this passage that our practice of hospitality is proportionally connected to our realization of the gospel. When Jesus says, \"He who has forgiven little loves little, and he who is forgiven much loves much,\" I don't think he's suggesting that this woman's debt was bigger than Simon's. I think he's suggesting that she realizes her debt is big and Simon doesn't. This is what we are called to: as we realize the gospel message, that by grace we have been saved and God has set his favor upon us such that he sees us. He sees our story in all its messiness and he welcomes us in not as strangers but as friends. He who is forgiven little loves little. He who is forgiven much loves much.\n\nSo Christian hospitality is about seeing people and welcoming them into a space of dignifying presence. My three-year-old Elijah is in a season where his favorite phrase right now is, \"I know.\" \"Elijah, you need to finish your dinner.\" \"I know, but—\" \"Elijah, it's time to get your shoes on.\" \"I know, but—\" Some of you, as I talk about Christian hospitality, are having that dialogue in your brain right now. \"I know, but I'm an introvert.\" Me, too. Some of you don't know this, but I wither on Sundays.\n\n# Hospitality as Christian Practice\n\nI am not suggesting that you need to be a social extrovert and have people in your home every evening. I am not suggesting that you need to practice some standard of hospitality that came to your mind when we started this message. Rather, I am suggesting that part of the calling of us as followers of Jesus is to see people—to actually see them—and to welcome them into spaces of dignifying presence. My hope is that our internal dialogue would be less \"I know, but\" and more \"I know, and I know that hospitality because I've received it, and I want to practice that.\"\n\nLet me give you some practical next steps. First, if you have space and can practically do so, consider welcoming people into your home. I don't want you to think about cultural expectations or what your mother-in-law might expect. Instead, think about what it looks like to welcome somebody who might be a stranger into a space of dignifying presence. A table is one of the most dignifying spaces in our society—sitting around a table with someone and saying, \"I want to hear your story. Let's have a meal together.\"\n\nLast week, many of you wrote down five names of people you want to pray for—people who are far from God. What would it look like to welcome that person into a space of dignifying presence? It doesn't have to be in your home. Maybe it's saying, \"Let's go out to a restaurant together,\" or \"I'm going to sit and have coffee with you,\" or \"Let's just go take a walk.\" What matters is that we focus less on what is provided and more on how it's provided. This is the call of Christian hospitality: to see people and create spaces of dignifying presence.\n\nThe second practical next step is to listen to the story of someone you usually ignore. Think for a moment about your regular rhythms of life. Who comes to your mind as someone you usually overlook? Maybe it's a cashier you see all the time, or a janitor in your workplace, or a neighbor who always goes straight into their house. I want to encourage you to see them and create a space of dignifying presence by listening to their story. Simply say, \"Hey, I see you all the time, and I'd love to hear your story.\" This is ordinary hospitality, but I think it's radical in the way Jesus exemplifies it throughout the Gospels.\n\nThe third next step is to accept an invitation that you'd usually decline. Here's the twist of Jesus on radical hospitality: Jesus did not have a home. He is always the guest of hospitality. His practice of hospitality is about creating spaces of dignifying presence. Think about what he said to Zacchaeus, this outcast of society, this tax collector whom everybody probably hated. Jesus didn't say, \"You're coming to my house today.\" He said, \"I'm going to your house today.\" I want to suggest that part of how we as Christians, as followers of Jesus, practice radical hospitality is by accepting invitations we would naturally decline. This is hard for me. I get invitations from neighbors to block parties, and sometimes I just don't want to go. I'm not saying you have to say yes to everything, but I am wondering: what if part of how I practice hospitality and follow Jesus is saying yes to some of those invitations? What if it means saying yes to people I might ignore because I'm a little scared of their story?\n\nFinally, let's think about generosity. Generosity is the practical use of our finances and resources toward these ends. There will be an email later today about opportunities to explore generosity. One is a journey of generosity—an incredible, pressure-free weekend where you explore stories of generosity with peers, with no strings attached and no hidden agenda except to explore what generosity could look like for us as followers of Jesus. When you see these opportunities, I encourage you to consider how you might participate. Additionally, some of you may feel that you need to start with the basics—how do I budget so that I even have finances to give? We are going to offer classes in financial stewardship to help us develop the practices of generosity and hospitality.\n\nWe are in a season where I believe that radical hospitality is the call of the church—to enter into spaces of hostility. I don't care what your political position is on immigration, social welfare, or national security, but I do care that you see people through the lens of the Gospel and the lens of hospitality before you see them through any political lens. The church is called to be radically hospitable because we are the recipients of radical hospitality.\n\nAs I close, I want to leave you with the words of Jesus to Simon: \"Do you see this woman?\" Do you see your LGBTQ neighbors? Do you see the hundreds of refugees who came into Durham just in the last couple of months? Do you see the neighbor across the street? Because that's you. That's me. He who is forgiven little loves little, but he who is forgiven much loves much.\n\nLord, we pray that you would make us a church that loves well because you first loved us. We pray in Jesus's name. Amen.","url":"https://www.youtube.com/watch?v=WowKrrzOu8M"}];
var SERIES_ORDER = ['John','Colossians','Isaiah','Advent','Prayer','Together','Psalms','Special'];
var allSeries = [];
for (var i = 0; i < DATA.length; i++) {
  if (DATA[i].series && allSeries.indexOf(DATA[i].series) < 0) {
    allSeries.push(DATA[i].series);
  }
}
var active = 'All';
var withTranscripts = 0;
for (var i = 0; i < DATA.length; i++) { if (DATA[i].transcript) withTranscripts++; }

function fmt(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'});
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function hi(text, q) {
  if (!q) { return esc(text); }
  var escaped = esc(text);
  var lower = escaped.toLowerCase();
  var ql = q.toLowerCase();
  var out = '';
  var i = 0;
  while (i < escaped.length) {
    var j = lower.indexOf(ql, i);
    if (j < 0) { out += escaped.slice(i); break; }
    out += escaped.slice(i, j) + '<span class=hit>' + escaped.slice(j, j + ql.length) + '</span>';
    i = j + ql.length;
  }
  return out;
}

function excerpt(transcript, q) {
  if (!transcript || !q) { return ''; }
  var lo = transcript.toLowerCase();
  var idx = lo.indexOf(q.toLowerCase());
  if (idx < 0) { return ''; }
  var start = Math.max(0, idx - 80);
  var end = Math.min(transcript.length, idx + 220);
  return (start > 0 ? 'â¦' : '') + hi(transcript.slice(start, end).trim(), q) + (end < transcript.length ? 'â¦' : '');
}

function toggleTx(btn) {
  var card = btn.parentNode.parentNode;
  var box = card.querySelector('.tx-full');
  var isOpen = box.classList.toggle('open');
  btn.textContent = isOpen ? 'Hide transcript' : 'Read transcript';
}

function buildFilters() {
  var ordered = [];
  for (var i = 0; i < SERIES_ORDER.length; i++) {
    if (allSeries.indexOf(SERIES_ORDER[i]) >= 0) { ordered.push(SERIES_ORDER[i]); }
  }
  var rest = [];
  for (var i = 0; i < allSeries.length; i++) {
    if (SERIES_ORDER.indexOf(allSeries[i]) < 0) { rest.push(allSeries[i]); }
  }
  var all = ['All'].concat(ordered).concat(rest);
  var el = document.getElementById('filters');
  el.innerHTML = '';
  for (var i = 0; i < all.length; i++) {
    var btn = document.createElement('button');
    btn.className = all[i] === active ? 'fb on' : 'fb';
    btn.textContent = all[i];
    (function(name) { btn.onclick = function() { setFilter(name); }; })(all[i]);
    el.appendChild(btn);
  }
  var fc = document.getElementById('footer-count');
  if (fc) {
    fc.textContent = DATA.length + ' sermons' + (withTranscripts ? ' Â· ' + withTranscripts + ' with transcripts' : '');
  }
}

function setFilter(f) { active = f; buildFilters(); render(); }

function render() {
  var raw = document.getElementById('q').value.trim();
  var q = raw.toLowerCase();
  var list = [];
  for (var i = 0; i < DATA.length; i++) {
    var s = DATA[i];
    if (active !== 'All' && s.series !== active) { continue; }
    if (!q) { list.push(s); continue; }
    if (s.title.toLowerCase().indexOf(q) >= 0 ||
        s.scripture.toLowerCase().indexOf(q) >= 0 ||
        s.preacher.toLowerCase().indexOf(q) >= 0 ||
        s.series.toLowerCase().indexOf(q) >= 0 ||
        s.desc.toLowerCase().indexOf(q) >= 0 ||
        (s.transcript && s.transcript.toLowerCase().indexOf(q) >= 0)) {
      list.push(s);
    }
  }
  var metaEl = document.getElementById('meta');
  metaEl.textContent = (q || active !== 'All')
    ? list.length + ' sermon' + (list.length !== 1 ? 's' : '') + ' found'
    : '';
  if (!list.length) {
    document.getElementById('results').innerHTML = '<div class=empty><p>No sermons found.</p>Try a different search or filter.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    var txSnip = excerpt(s.transcript, raw);
    var txHtml = txSnip ? '<div class="tx-hit">' + txSnip + '</div>' : '';
    var badge  = s.series ? '<span class="sb">' + esc(s.series) + '</span>' : '';
    var txBtn  = s.transcript ? '<button class="tb" onclick="toggleTx(this)">Read transcript</button>' : '';
    var txFull = s.transcript ? '<div class="tx-full">' + esc(s.transcript) + '</div>' : '';
    html += '<div class="card">';
    html += '<div class="ct">' + hi(s.title, raw) + '</div>';
    html += '<div class="cm"><span>' + fmt(s.date) + '</span>';
    if (s.preacher) { html += '<span class="cm-dot"></span><span>' + esc(s.preacher) + '</span>'; }
    if (badge) { html += '<span class="cm-dot"></span>' + badge; }
    html += '</div>';
    if (s.desc) { html += '<div class="cd">' + hi(s.desc, raw) + '</div>'; }
    html += txHtml + txFull;
    html += '<div class="cf">';
    if (s.scripture) { html += '<span class="tag">' + esc(s.scripture) + '</span>'; }
    html += '<a class="wl" href="' + s.url + '" target="_blank">Watch â</a>';
    html += txBtn;
    html += '</div></div>';
  }
  document.getElementById('results').innerHTML = html;
}

buildFilters();
render();
</script>
</body>
</html>
