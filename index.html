 broken for you.\" This is the good news of the gospel. He took the cup and said, \"This is my blood that is shed for the forgiveness of sins.\" Paul tells us, \"As often as you eat this bread and you drink this cup, you proclaim the Lord's death until he comes.\"\n\nIn many ways, the table is a place where we remember the person, the place, and the thing: that Jesus is our peace, that we have a place of peace at the foot of the cross, and that peace becomes our thing. This is our weekly reminder that peace is our thing. So if you're a follower of Jesus, I invite you at any time during these three songs to come to the table.\n\nGod, we are so grateful that you tore down the dividing wall between us and you by destroying it at the cross. Lord, in doing that, you tore down the dividing wall between us and one another. You bring us together. Lord, we long for your peace to reign here in this gymnasium, in this school, in this community. Would your kingdom come? Would your will be done? Would you allow us to walk in the freedom and confidence that we have in your peace? Grant us a firm foundation. Grant us a place to stand in Christ. We pray this in Jesus' name. Amen.","url":"https://www.youtube.com/watch?v=OjegW5OPfq8"},{"id":"9ncc07RT3Os","date":"2025-12-04","title":"Hope in the Midst of Darkness","scripture":"Isaiah 9:1–7","preacher":"Peter Frey","series":"Isaiah","desc":"In Isaiah 9, a light shines in the darkness — the promise of Jesus, our everlasting hope. Join Pastor Peter Frey as he shares how Christ brings light and peace in every season. Experience real hope for real life this Advent at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: Isaiah 9:1-7 and the Hope of Advent\n\nPlease remain standing as you are able for the reading of God's word from the book of Isaiah, chapters 9, verses 1-7.\n\n\"Nevertheless, there will be no more gloom for those who were in distress. In the past, he humbled the land of Zebulun and the land of Naphtali, but in the future he will honor Galilee of the nations by the way of the sea beyond the Jordan. The people walking in darkness have seen a great light. On those living in the land of deep darkness, a light has dawned. You have enlarged the nation and increased their joy. They rejoice before you as people rejoice at the harvest, as warriors rejoice when dividing the plunder.\n\n\"For as in the day of Midian's defeat, you have shattered the yoke that burdens them, the bar across their shoulders, the rod of their oppressor. Every warrior's boot used in battle and every garment rolled in blood will be destined for burning—will be fuel for the fire. For to us a child is born, to us a son is given, and the government will be on his shoulders. He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.\n\n\"Of the greatness of his government and peace there will be no end. He will reign on David's throne and over his kingdom, establishing and upholding it with justice and righteousness from that time on and forever. The zeal of the Lord Almighty will accomplish this.\"\n\nThis is the word of the Lord. Thanks be to God.\n\nYou may be seated. Good morning, East Point Church. This is the first Sunday of Advent, and I wonder what comes to your mind when you hear the word disappointment. We are in a time of year when expectations are building, especially for children. I remember when I was eight years old, all I wanted for Christmas was a puppy. I really wanted a dog, and I had been working on my parents for a while, trying to convince them that I would be responsible and that it would help our family. I really wanted a golden retriever. That Christmas season, all I talked about was how much I wanted a dog.\n\nChristmas morning came, and I opened my special gift—it was the size of a puppy box. Inside was a stuffed golden retriever. I was disappointed. To give my parents credit, we were not in a place to have a real golden retriever. But that feeling—we all know what disappointment is like. The heart of disappointment is that our expectations are not met. We all have expectations. Expectations of our family members, expectations of society, expectations of the Christmas season, expectations of what might come in the new year, expectations of that next season of life. We all have expectations, and if we use another term, we might call those hopes.\n\nOn this first Sunday of Advent, we sit in reflection on hope, expectation, and longing for something. I think deep within each of us is a longing for hope. Ingrained in the DNA of our church as East Point Church is our mission statement: we exist to point a hurting world to hope in Jesus. Here on this first Sunday of Advent, I want us to sit in the longing, the expectation, those deep desires within each of us—the hopes that drive our hearts.\n\nDuring this season of Advent, there is an invitation to slow down while everything else in our society is speeding up—to the next Christmas party, the next present that needs to be purchased, the next thing that needs to be checked off the list. How many of you find that you are only a checklist person during the Christmas season? Life gets full. Our society this season is full. The invitation of Advent, the reflection on Christ's coming, is an invitation to slow down, to be still, and to let those longings deep within each of us find their home in Christ.\n\nThis morning we come to probably one of the most epic passages of imagery throughout Scripture. We read the words in Isaiah 9, verse 2: \"The people walking in darkness have seen a great light on those living in a land of deep darkness. A light has dawned.\" Our East Point logo—the sunrise and the triangle at the bottom—really comes from this verse. We exist to point a hurting world to the light that has dawned in the darkness.\n\nAs we reflect on Isaiah's words, spoken hundreds of years before Christ's coming, I want us to consider what it means that we have hope in Jesus. In this passage, we are given a backdrop. The backdrop of hope is darkness and brokenness. We're walking through a series throughout this season of Advent that I've called \"A Weary World Rejoices.\" Embedded in that phrase from \"O Holy Night\" is a reality that we all feel: a longing for joy and the deep reality of weariness.\n\nEach week of Advent, we're going to sit in the reality of what we have by faith in Jesus. We have hope. We have joy. We have peace. And we have love. At the same time, we live in a world full of darkness, a world full of chaos, a world full of sorrow, and a world full of brokenness. We sit in the midst of the tension of that reality. In many ways, that is the invitation of Advent—we celebrate that Christ has come, and we look forward to the fact that he is coming again. We sit in tension in the midst of the brokenness of our world.\n\nIn the first verse of Isaiah, we find this context: \"Nevertheless, there will be no more gloom for those who are in distress.\" There is a backdrop of gloom. We need to rewind a little and go to the verse before this, in chapter 8. It says, \"Then they will look toward the earth and see only distress and darkness and fearful gloom, and they will be thrust into utter darkness.\" The context of Isaiah 9 is the judgment that came on the people of Israel because they had turned from the Lord. There are consequences for actions, and there is judgment for the people of Israel. It is described as deep darkness, utter darkness.\n\nThen we go to verse one of Isaiah 9: \"In the past he humbled the land of Zebulun and the land of Naphtali.\" These are two of the tribes of Israel in the northern kingdom. It's talking about the people of Israel. He humbled them, but in the future he will honor Galilee of the nations by the way of the sea beyond the Jordan. Then we find those words of verse two: \"The people walking in darkness have seen a great light. On those living in a land of deep darkness, a light has dawned.\"\n\nThe first thing I want us to see about hope is that hope gives light to life. Hope gives light to life. This is the imagery of Isaiah 9 that John picks up on—the theme of true and real life that Jesus came to bring. The imagery that John picks up on in John chapter one is that in him was light. There is light in Jesus. How do we know that Isaiah, hundreds of years before Jesus walked the earth, is talking about Jesus? Well, Matthew tells us pretty clearly in Matthew chapter 4. He says, \"When Jesus heard that John had been put in prison, he withdrew to Galilee and, leaving Nazareth, he went and lived in Capernaum, which was by the lake in the area of Zebulun and Naphtali to fulfill what was said through the prophet Isaiah: 'Land of Zebulun and land of Naphtali, the way of the sea beyond the Jordan, Galilee of the Gentiles. The people living in darkness have seen a great light on those living in the land of the shadow of death. A light has dawned.' And from that time on, Jesus began to preach, 'Repent, for the kingdom of heaven has come near.'\"\n\nHere Jesus is clearly seen as the fulfillment of Isaiah chapter 9—that the people walking in darkness have seen a great light, those who are in a land of the shadow of death upon them. The light has dawned. Jesus comes to bring the light in the midst of the darkness. As we reflect on this theme, \"A Weary World Rejoices,\" we see darkness all around us. I wonder this morning as we enter the season of Advent, what are the things that are weighing on your heart? The places of darkness? The weariness of navigating a broken world? Where do you feel that right now?\n\nIn this season of Advent, Jesus invites us to sit in that. Tish Harrison Warren says this in her wonderful little book on Advent: \"The Advent season is when we refuse to deny the darkness yet dare to believe that the light is coming.\" We refuse to deny the darkness. The setting of Isaiah 9—of gloom and darkness—is something that we as a church understand when we tell stories of real hope. We do not believe that hope is optimism. We believe that hope is realism that is grounded in promises.\n\nN.T. Wright says this: \"Hope is not a vague optimism that things will somehow get better. It is a settled confidence that God is keeping his promises.\" Hope is light in the midst of the darkness. As the passage of Isaiah 9 unfolds, I also want you to see that hope produces joy in the midst of sorrow. We're going to look at this in a couple of weeks when we explore the theme of joy. But here in this passage, we see that the product of hope is joy. \"You have enlarged the nation and increased their joy. They rejoice before you as people rejoice at the harvest, as warriors rejoice when dividing the plunder.\"\n\nHope is light in the midst of darkness. It produces joy in the midst of sorrow. And notice that hope is rooted in something. It's rooted in victory. \"For as in the day of Midian's defeat, you have shattered the yoke that burdens them, the bar across their shoulders, the rod of their oppressor. Every warrior's boot used in battle and every garment rolled in blood will be destined for burning—will be fuel for the fire.\"\n\nNot only is hope rooted in victory, but our hope—our Advent hope—is rooted in redemption. Notice that the picture of victory is not only that the enemy is defeated, but their defeat is fuel for the fire. That is the redemption of all that is broken and sorrowful and sad in this broken world. Jesus came to redeem, to make fuel for the fire of what we long for. In these verses of Isaiah, we see that hope is light in the midst of darkness. Hope produces joy in the midst of sorrow. Hope is confidence rooted in victory, and that victory is redemptive.\n\nAs Second Corinthians 4 says, \"These light momentary afflictions are preparing for us an eternal weight of glory beyond all comparison as we look not to what we see, but what we cannot see. For what is seen is transient, but what is unseen is eternal.\" Hope is grounded in the promises of God. But during Advent, hope becomes tangible because it is during the season of Advent that the promises of God became a person. The promises of God take on flesh.\n\nNotice that all of this buildup in Isaiah 9—light dawning in the darkness, hope that comes and produces great joy, hope that is grounded in victory that is not only victorious but redemptive—all of this is grounded in one thing. In verse six: \"For to us a child is born, to us a son is given, and the government will be on his shoulders. He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace. Of the greatness of his government and peace there will be no end. He will reign on David's throne and over his kingdom, establishing and upholding it with justice and righteousness from that time on and forever. The zeal of the Lord Almighty will accomplish it.\"\n\nAdvent is about the promises of God being embodied in a person, and his name is Jesus. He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace. We could spend all of Advent unpacking those names, but in them we find the wisdom of God, the strength of God, the love of God, and the peace that he came to bring. It is only in a person that the promises of God are more than something to long for. They become something we can be confident of. That is what is categorically different about Advent hope: Jesus came and he took on flesh so that the promises of God might be accessible to us.\n\nWe say here at East Point, hope changes everything. We have a big banner out in the lobby. Hope changes everything. When we say that, we mean that Jesus changes everything. Why? Because Jesus is our hope. N.T. Wright says again, \"When God wants to change the world, he does it through a baby.\" He takes the most humble, unexpected, and vulnerable thing—a baby—and he enters our brokenness, our weariness, our sadness, our darkness to be the light that turns our longings into hope.\n\nAgain, hope is not a vague optimism that things will somehow get better. It's a settled confidence that God is keeping his promises. During the season of Advent, we go back to the very first promise of God—that when darkness entered the world, when brokenness entered the world...\n\n# Advent Sermon: Hope in a Person You Can Trust\n\nWhen the first man and woman chose to refuse to trust, sin entered society with consequences. Yet in the midst of God's declaration of judgment, he gives a promise: \"I will put enmity between you and the woman and between your offspring and hers. He will crush your head and you will strike his heel.\" There in Genesis 3:15, we have the gospel first proclaimed—the promise that there would be a child of the woman who would one day bring victory over sin and death.\n\nIn Isaiah 6, when we see those words \"for to us a child is born,\" they are loaded with expectation and longing. The Old Testament scriptures continually return to a single question: could this be the one? In Isaiah 9, we read, \"For to us a child is born, a son is given.\" During the season of Advent, we sit in the reality of hope—the understanding that our hope is not simply a longing, but a person.\n\nWhat Isaiah 9 teaches us about hope is this: what turns promises into hope is a person you can trust. Consider your own life. Promises you hold mean nothing if the person making them cannot be trusted. If someone continually lets you down, their promises ring hollow. But Jesus—the Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace—is a person you can trust in a way that no earthly mother or father ever could. This very reality is what turns promises into hope, because hope is the settled confidence that God is keeping his promises.\n\nDuring the season of Advent, we do two things: we remember that God kept his promise that he would come, and we sit in the expectation and hope that he is coming again. The wear and tear of living in a weary world gets our souls out of alignment. We need to be realigned—not just with abstract promises, but with promises embodied in a person we can trust. When promises are a person you can trust, you have hope. And hope changes everything.\n\nWe believe that everything sad in this broken world will be undone. We believe that one day Jesus will return and make all things new, that the sorrow, injustice, pain, and angst we feel will give way to the prince of peace. As Tish Harrison Warren notes in her book on Advent, we celebrate not two comings of Christ but three: his past coming, his future coming, and his present coming through the Spirit of God in the church. When Jesus said, \"Peace I give to you. Though I am going away, I am sending another,\" he promised that the Spirit of God through the church of God would come into the brokenness of our world.\n\nWhen we read Isaiah 9:2—\"The people walking in darkness have seen a great light. On those living in the land of deep darkness, a light has dawned\"—we recognize it as describing a past reality that Jesus has come, a future reality that Jesus will come, and a present reality that Jesus is coming into our broken world through broken people like you and me who are indwelt with the Spirit of the living God. We have a hope not in abstract promises about the future, but in a person who walks with us. This is the light that dawns through a church plant in the middle of a gymnasium in East Durham—a community that believes hope does change everything. It does not make everything easier, but it enters into the mess of our world today and invites us to trust.\n\nThis is what Advent is about. This is what settled confidence in a God who keeps his promises looks like. I invite you in this season, while everything else is speeding up, to slow down and remember the promises of God.\n\nRemember that whoever receives Christ, he gives the right to become a child of God. Remember the hope that if anyone is in Christ, he is a new creation—the old has gone, the new has come. Remember that there is no condemnation for those who are in Christ Jesus. Remember that we have an inheritance that is imperishable, that though a job may seem insecure and a paycheck may seem like our only hope, we have an inheritance that will last beyond the grave. Remember that nothing in all of creation—not sickness, not strife, not nakedness, not the sword—nothing can separate us from the love of Christ.\n\nThese are the promises of God. What turns promises into hope is a person you can trust, and his name is Jesus.","url":"https://www.youtube.com/watch?v=9ncc07RT3Os"},{"id":"la-qPZ8jG3Q","date":"2025-11-24","title":"Jesus Is the Vine","scripture":"John 15","preacher":"Peter Frey","series":"John","desc":"In John 15, Jesus teaches that He is the Vine and we are the branches — apart from Him, we can do nothing. Join Pastor Peter Frey as he shares how abiding in Christ leads to true fruitfulness and real hope for real life.","transcript":"# Sermon Transcript: John 15:1-11\n\nGood morning. I'm going to read a prayer for illumination. You spoke, Creator God, in the beginning. Your words and the Word brought all things into being. You spoke, loving God, through Jesus, the Word who dwelt among us. You spoke, living God, and released your Spirit to work in and through us. God, speak to us now as we read and reflect on these words of scripture. Amen.\n\nPlease remain standing as you're able for the reading of God's word from the Gospel of John, chapter 15, verses 1 through 11. \"I am the true vine, and my Father is the vine dresser. Every branch in me that does not bear fruit, he takes away. And every branch that does bear fruit, he prunes that it may bear more fruit. Already you are clean because of the word that I have spoken to you. Abide in me and I in you. As the branch cannot bear fruit by itself unless it abides in the vine, neither can you unless you abide in me. I am the vine, you are the branches. Whoever abides in me and I in him, he it is that bears much fruit. For apart from me, you can do nothing. If anyone does not abide in me, he is thrown away like a branch and withers, and the branches are gathered, thrown into the fire, and burned. If you abide in me and my words abide in you, ask whatever you wish, and it will be done for you. By this my Father is glorified, that you bear much fruit, and so prove to be my disciples. As the Father has loved me, so have I loved you. If you keep my commandments, you will abide in my love, just as I have kept my Father's commandments and abide in his love. These things I have spoken to you that my joy may be in you and that your joy may be full.\" This is the word of the Lord. Thanks be to God.\n\nWell, good morning, East Point. It is a joy to be gathered in this space and to worship together, to open God's word together. When I was in high school, I was a young believer who had just started following Jesus and was trying to figure out what that looks like. I came across a small book called *The True Vine* by Andrew Murray. I remember reading this book and thinking that it was so transformative for me that I gave it to Mary and she read it. We both started to see our walk with Jesus a little bit differently.\n\nAs I was reflecting on the passage we come to in the Gospel of John this morning, I was thinking back on one of the most transformative books of my life. It's really a simple book—I think it's public domain now. You could Google it and read it. It's thirty days of walking through this passage that we just read. I was thinking about what was so transformative back when I was a high schooler trying to figure out what it means to follow Jesus. This picture that Jesus gives us—that he is the vine and we are the branches—why is that what transformed the way I looked at what it means to follow Jesus?\n\nAs I was reflecting on this passage this week, it stood out to me that it was a shift in my thinking about how faith works. You'll often hear me talk about my childhood. I had a fascination with how things work. I would imagine things like vending machines—how does a vending machine work? You put in a quarter and it starts a process and out comes your soda. I started to imagine this process of mechanical engineering: you put in this, and out comes that.\n\nI think we often try to break down the mechanics of faith like that. There are a couple of verses in this passage that I think have been taken out of context and turned into a kind of mechanical engineering of faith—the idea that if you put in this prayer, out comes this outcome, or if you follow Jesus, life will look like XYZ. But as I sat at the feet of Jesus this week reflecting on John 15, I'm reminded that Jesus wants us to see that faith is not mechanical. It's organic. It's like a vine that grows.\n\nJesus says in this passage—it is the last of the \"I am\" statements that we find in the Gospel of John—\"I am the vine and you are the branches.\" He gives us a picture of our relationship to Jesus, not as something that is mechanical, but something that's organic, something that grows, something that if you have gardened it at all can have all kinds of variables. Jesus says, \"I'm the vine. You are the branches.\"\n\nAs we look at this passage this morning, I want to note that our screen fell in the parking lot and broke, so I'm going to make a lot of jokes about what we would have shown you if we had it. In that mishap, I think there's some pruning that happens in moments like that. But one thing that is helpful: if you don't have a Gospel of John journaling Bible, we have some on the back table. I want to make sure you have one because I think it's really helpful to be able to mark up the scripture.\n\nIf you walk through John 15 and circle the words repeated between verses 4 and 10, you will find the same word ten times: abide. I had a cool screen where it would take a text and pop out those words, but we see this repeated command or description of the Christian life where he says abide. This word literally means stay, remain, make your home.\n\nRemember when Jesus, at the beginning of the Gospel of John, encounters a couple of disciples who say, \"Lord, where are you staying? Where are you making your home?\" Jesus says to them, \"Come and see.\" We see this repeated command in John chapter 1: come and see. I think the invitation of Jesus this morning in John 15 is to come and see what it means to abide in Jesus.\n\nHe says in verse one, \"I am the vine and my Father is the vine dresser.\" In many ways, the Gospel of John, as we've been walking through it, gives us orientation for where life is found. It's like when you go to the mall or some big area and you have the map that says, \"You are here.\" John is repeatedly trying to help us discern where we are when it comes to life and life abundantly.\n\nIn this passage, Jesus is inviting us to recognize who we are and who we are not. So what does it look like if the picture of the Christian life is a branch abiding in the vine? I think the first thing we see in this passage is that Jesus is inviting us to resist self-sufficiency.\n\nNotice what he says in verse two: \"Every branch that does not bear fruit, he takes away. Every branch that does bear fruit, he prunes that it may bear more fruit.\" Down to verse four, he says, \"Abide in me and I in you. As a branch cannot bear fruit by itself unless it abides in the vine, neither can you unless you abide in me.\"\n\nI think the first thing Jesus is inviting us into is to resist the lie that you are sufficient in and of yourself. The picture he gives is a branch. It's a really practical picture. A branch falls off the vine and is absent of any source of life. Jesus's words here are clear: in and of yourself, you are insufficient. You are insufficient to have life and life abundantly.\n\nRemember John's key verse at the end of his gospel. He says, \"I have written these things so that you may believe in the name of the Son of God and that by believing in his name, you may have life.\" This is what John is inviting us into. This is the path to life: stay connected to Jesus. Apart from him, you can do nothing.\n\nSo the first invitation here is to resist self-sufficiency. The image speaks for itself in the twenty-first century. A branch falls off the tree—what happens to its leaves? They wither, they die. We get that. But in order for us to really grasp the force of this passage, we have to recognize the larger scope of this picture for John's audience.\n\nRemember, John is writing largely to a Jewish audience who already has a picture of a vine. In Psalm chapter 80, verse 8, we find this description of what God did for the people of Israel: \"You brought a vine out of Egypt and drove out the nations and planted it. You cleared the ground for it. It took root and filled the land.\" In the book of Psalms, the people of Israel are described as a vine that God planted.\n\nIf we jump a few verses later to verse 14, the verses that follow describe the vine going wild. It starts getting ravaged by wild animals. \"Turn again, O Lord God of hosts. Look down from heaven and see and have regard for this vine.\" The psalmist concludes in verse 18 of Psalm 80: \"Then we shall not turn back from you.\" Notice what the psalmist says: \"Give us life and we will call upon your name.\"\n\nSo woven into the history of the people of Israel is both an image of a vine—that the people of Israel are the vine—and the reality that the vine has withered. The prayer from the people of Israel was, \"Lord, look on this vine and give us life.\"\n\nJeremiah picks up on this imagery. He says, \"Yet I planted you a choice vine, wholly of pure seed.\" This is God speaking to the people of Israel. \"How then have you turned degenerate and become a wild vine? Though you wash yourself with lye and use much soap, the stain of your guilt is still before me, declares the Lord.\"\n\nWhen Jesus says to his disciples, \"I am the true vine,\" he is inviting you and me to resist the idea that we in and of ourselves can have life. He is inviting the people of Israel to shift their mindset from viewing themselves as the vine to viewing Jesus as the vine. This is the invitation of the Christian life. What do we do apart from Jesus? We try to find life in our self-sufficiency. We try to find our identity in who we are, in who people say we are. We try to find our sufficiency in what we can gather, in what we can produce.\n\nThe invitation of Jesus is to resist self-sufficiency. Apart from me, you can do nothing.\n\nThen the invitation is, as we recognize who we are and who we're not—we are not the vine—he invites us to rest in Christ's sufficiency. So we resist self-sufficiency and rest in Christ's sufficiency. Notice what he says: \"I'm the vine. My Father's the vine dresser. I'm the vine. You are the branches. Whoever abides in me and I in him, he it is that bears much fruit. For apart from me, you can do nothing.\"\n\nThe picture of a fruitful, flourishing life—this is kind of a catch word in our society. What does flourishing look like? Our staff team is reading a book right now called *Strong and Weak* by Andy Crouch. He really asks the question of where flourishing is found. The invitation of Jesus here in John 15 is that flourishing is not found in something that you produce. Flourishing is not found in self-sufficiency but by resting in Christ's sufficiency.\n\nJesus is both our substitute and our supply. Notice that in the image of the true vine, Jesus is saying, \"You were once pictured as the vine. You need a substitute. You need someone who can be the good and better source of life.\" Notice how Jeremiah so eloquently points us to that reality: though you try to wash yourself, though you try to get your life together, we cannot have true and abundant life apart from Jesus.\n\nIn the progression of this chapter, we see that Jesus is both our substitute and our supply—he's what supplies life to the vine. Notice verse seven: \"If you abide in me and my words abide in you, ask whatever you wish and it will be done for you.\"\n\nThis is a verse that has often been taken out of context and turned into a mechanical form of prayer—a \"name it and claim it\" kind of approach to God. But notice in the context of this picture, it is not mechanical. It's organic. What Jesus is saying here when he says, \"If you abide in him and his words abide in you, ask whatever you wish,\" is this: when we stay connected to Jesus, when we resist self-sufficiency and rest in Christ's sufficiency, we start to be conformed to his image. We start to be a conduit.\n\n# Sermon Transcript\n\nThe branch is the part of the vine that is between the source of life and the fruit. What Jesus is picturing here is that when you are connected to Jesus, you are supplied with the life that leads to a flourishing, fruitful life. Jesus is our supply. The invitation is to rest in him, remain in him, and recognize who you are. You are not the vine. You are the branch.\n\nAs we resist self-sufficiency and rest in Christ's sufficiency, the next invitation throughout this passage is to remain attentive to the Spirit. For many of us who have been around the church, our picture of abiding—of staying connected to Jesus, of his words abiding in us—has become a perfectly curated consumption of content. Perhaps you picture yourself sitting with your Bible and your morning coffee, reading God's word. I'm not downplaying this practice, but I do want to suggest that our picture of a vine is perhaps a little domesticated. We all probably have house plants that are perfectly kept in a pot on a windowsill, in a little greenhouse where sunlight comes in perfectly. The organic picture of a vine in Scripture might be more wild than we imagine.\n\nJesus wants us to consume his word and have it in us, but I think what Jesus is picturing as he speaks of himself as the vine and us as the branches is something that directly follows his saying, \"I am sending my spirit to you.\" In John 14, he says his spirit will be our helper. \"Peace I leave with you,\" he says, \"not peace like the world gives, but peace that transcends understanding. Do not let your hearts be troubled.\" The picture of abiding in Jesus is a continual attentiveness to the Spirit of God throughout all of life.\n\nI want us to have a picture of a vine that is in the elements. When Jesus said this in the ancient world, he was not picturing your little succulent on a windowsill. Yet sometimes that is what we think abiding in Jesus looks like—sipping our coffee with our premium leather Bible, consuming content. But Jesus is inviting us into something more. Yes, set aside time to be with him. But the picture of abiding in him is remaining when the storm comes, when the pruning happens. For me this morning, it was when the TV fell in the parking lot. What does it look like to stay attentive to the Spirit of God who gives peace like nothing else in this world? What does it look like to stay attentive to the source of life in all of life, to linger in God's presence in the busyness of life?\n\nI am often confronted by this on Sunday mornings. My routine is Saturday night—after the kids go to bed, I spend a couple of hours going back through my message for Sunday morning, getting my thoughts in order, spending time in prayer with the Lord. I always go to bed on Saturday night, set my alarm clock a little bit earlier than usual, thinking, \"I'm just going to wake up in the morning and have a relaxing time with Jesus.\" And without fail, my kids wake up before that alarm goes off. Without fail, every Sunday morning, I am confronted by the question: What does abiding in Jesus look like when it is not my curated content consumption?\n\nThere is an invitation to have an attentive awareness that the Spirit that raised Jesus from the dead dwells within me as my toddlers are running circles around me and smearing banana on my pants. That, I think, is the invitation of John 15. What does it look like to abide in that? What does it look like to stay connected to Jesus? In all of this there is the resisting of self-sufficiency, resting in Christ's sufficiency, remaining attentive to Christ in you, and then rejoicing.\n\nNotice verse 11: \"I have told you all these things that my joy may be in you and that your joy may be full.\" There is an invitation to rejoice in the process of conforming to Christ. What does that look like? He says in verse 2, \"Every branch in me that does not bear fruit, he takes away. And every branch that does bear fruit, he prunes that it may bear more fruit.\" The picture here of a fruitful life is the painful process of pruning. God and Jesus want to prune self-sufficiency out of our lives so that we will rest in Christ. I'll be honest—this morning when we pulled out the TV and found it broken, I sensed the Spirit of God inviting me into what I'm about to preach: to find joy in the pruning of self-sufficiency.\n\nI want to encourage you as we think about what Jesus is inviting us into. He is inviting us into a fruitful, flourishing life. The more time we spend abiding in Jesus, the more we are conformed to his will. We hear the promise of verse 7: \"Ask whatever you wish and it will be done for you.\" While many of us get caught up on these words because we're so programmed by the mechanics of religion, we miss Jesus painting for us a picture of a relationship where we begin to love the things that Jesus loves and have confidence in him rather than ourselves. We have confidence to pray in anticipation of fruit—the fruit of the gospel in our lives.\n\nThe invitation of this passage is to have confidence in Christ and dependence on Christ that leads to becoming a conduit of Christ to the world around us. Resist self-sufficiency. Rest in Christ's sufficiency. Remain attentive to Christ in you, the Spirit of God in all of life. Rejoice in the process of conforming to Christ. This is what is categorically different about Christianity than any other religion. All religions have lists—a moral picture of fruitfulness. But the difference of Christianity is that these lists are fruits. They are not something that you produce.\n\nThe Christian life is not about performing for Christ but conforming to Christ by remaining in Christ. Religion is about the manufacturing of morals. Walking with Jesus, abiding in him, is about Jesus producing in you what you cannot produce. When Galatians 5 lists the fruits of the Spirit—love, joy, peace, patience, kindness, goodness, gentleness, and self-control—these are things that you cannot produce. The invitation of the Christian life is not to reform your life morally, but to be transformed by the one who is the source of life. Stay connected to Jesus.\n\nLet me give you a few practical applications. The first is that I want to encourage us to be a church that continually focuses on being before doing. Who you are in Christ is the starting point. What we just sang moments ago: \"I am who you say I am.\" In the process of resisting self-sufficiency, the things that we do in the Christian life have to flow out of who we are in Christ. The gospel is confronting in this way. It says you don't come to Jesus and offer what you have to offer. You come to Jesus with nothing to offer, and Jesus says, \"I will give you life.\" In John 1, he says, \"To all who receive him, he gives the right to become children of God.\" That has been the overarching picture throughout the gospel of John: life is not something you can produce of and by yourself. So resist self-sufficiency. Be before you do.\n\nWhat does that look like? I want to encourage you in your personal devotional life with Jesus. Develop practices of reading his word, spending time in prayer, listening to him, and talking to him about what's on your heart. But develop a reflex in those practices of starting with being before doing. One of the reasons we do a prayer for illumination before we read the word is to pause our hearts and recognize the role of the word in our lives—that it is where we find life. We don't come to God's word as some have made it out to be, as like a map for life or an acronym for \"basic instructions before leaving earth,\" as if the Bible is an instruction manual for finding the mechanics of faith. The invitation is to be a child of God first and then to walk with him and experience the life and fruitfulness.\n\nThe second encouragement I want to give you is read before you feel. Jesus invites us here with the question: Where do we find life? We find life in Jesus. How do we meet, encounter, and be conformed to Jesus? We need his word to abide in us. How do we do that? We spend time with him. The invitation of Jesus is to let this word abide in you. Often what I experience in my life is that I don't always feel like that. You ever been there? You don't feel like opening the word and saying, \"Oh man, I've got to release self-sufficiency and find my sufficiency in Christ and rejoice in the pruning.\" That is hard and painful, and sometimes I don't feel that. So my encouragement to you is to stay connected to Jesus. Part of that is reading before you feel and trusting that even when you don't desire Jesus, the discipline of remaining, of staying with him, is part of the process by which God will produce in you the fruit of desiring the things of God.\n\nDon't let your feelings drive your relationship with Jesus. Let the truth that Jesus is the true vine drive you again and again to a continual attentiveness to the Spirit of God that is given to all who look to Jesus in faith. He is our substitute. He is the one who lived a perfect, sinless life. He said, \"I will give my life because nothing you can do can bring you back into right relationship with me.\" So I will give my life for you. The invitation is to repent of your self-sufficiency and look to him in faith—that he died and he rose from the dead to give new life.\n\nThe third application I want to give you is that the Christian life is not about performing for Jesus. It is about conforming to him as his life flows through your veins.\n\nI'll close with a piece of poetry that wraps up a little book called The True Vine:\n\n*It is only a little branch, a thing so fragile and weak. But that little branch hath a message true to give, could it only speak. I'm only a little branch. I live by a life not mine, for the sap that flows through my tendril small is the lifeblood of the vine. No power indeed have I the fruit of myself to bear, but since I'm part of the living vine, its fruitfulness I share.*\n\n*How dost thou ask how I abide? How this life I can maintain? I am bound to the vine by life's strong ban, and I only need remain. Where first my life was given, in the spot where I am set, I'm born and upheld as the days go by by the stem which bears me yet.*\n\n*I fear not the days to come. I dwell not upon the past. As moment by moment I draw a life for which forever more shall last. I bask in the sun's bright beams, with the sweetness which fills my fruit, yet I own not the clusters hanging there, for they all come from the root.*\n\n*A life which is not my own, but another's life in me. This is the message that the branch would speak—a message to thee and me. A struggle not to abide, nor labor to bring forth fruit, but let Jesus unite thee to himself as the vine branch to the root. So simple, so deep, so strong, that union with him shall be. His life shall forever replace thine own, and his love shall flow through thee.*\n\n*For his Spirit's fruit is love, and love shall thy life become forever more on his heart of love, thy spirit shall have her home.*\n\nWe're going to respond.","url":"https://www.youtube.com/watch?v=la-qPZ8jG3Q"},{"id":"DEWimoCOmlQ","date":"2025-11-19","title":"Jesus Is the Way","scripture":"John 14","preacher":"Peter Frey","series":"John","desc":"In John 14, Jesus says, “I am the way, the truth, and the life.” Join Pastor Peter Frey as he shares how Jesus leads us to the Father and offers real hope for real life. Experience it this Sunday at Eastpoint Church in Durham, NC.","transcript":"# John 14:1-14 Sermon Transcript\n\nJoin me in reading aloud this prayer for illumination. The words will be on the screen.\n\nGracious God, we do not live by bread alone. Let the heavenly food of the scripture we are about to hear nourish us today in the ways of eternal life through Jesus Christ, the bread of heaven. Amen.\n\nPlease remain standing as you are able for the reading of God's word from the Gospel of John, chapter 14, verses 1-14.\n\n\"Let not your hearts be troubled. Believe in God, believe also in me. In my father's house are many rooms. If it were not so, would I have told you that I go to prepare a place for you? And if I go and prepare a place for you, I will come again and will take you to myself, that where I am, you may be also. And you know the way to where I am going. Thomas said to him, 'Lord, we do not know where you are going. How can we know the way?' Jesus said to him, 'I am the way and the truth and the life. No one comes to the Father except through me. If you had known me, you would have known my father also. From now on, you do know him and have seen him.' Philip said to him, 'Lord, show us the Father, and it is enough for us.' Jesus said to him, 'Have I been with you so long and you still do not know me, Philip? Whoever has seen me has seen the Father. How can you say, \"Show us the Father\"? Do you not believe that I am in the Father and the Father is in me? The words that I say to you, I do not speak on my own authority, but the Father who dwells in me does his works. Believe me that I am in the Father and the Father is in me. Or else believe on account of the works themselves.'\"\n\nThis is the word of the Lord.\n\nThanks be to God. You may be seated.\n\nOne of my go-to questions when I'm ready to get beneath surface-level conversations with a person and really get to know what's going on in their heart is this: What's keeping you up at night? Now, some of you are literalists. When I ask that question, you respond, \"Nothing. When my head hits the pillow, I'm out until the alarm goes off or the baby starts crying.\" At that point, I have to explain my question a bit more. I'm not really asking about your sleep habits. I'm asking about your heart. Whether it's the thing that keeps you up at night or the thing that brings you to the point of exhaustion, what troubles your heart? I wonder how you'd answer that this morning.\n\nThe reality is there's no shortage of causes in our broken world for a troubled heart. There's the uncertainty of health. There's the unpredictability of relationships. There's the inequality of society. There's the injustice of systems. There's the polarization of politics. There are marriages that are struggling. There are bodies that don't work like they should. There's the painful grief of infertility. There's the searing sorrow of miscarriage. There are strange family members. And at the end of the day, there's the sobering reality that none of us—not you, not me, no one—can control what happens tomorrow. We all know what it's like to have a troubled heart.\n\nBecause of this, if we read the opening words of John 14:1 in isolation—\"Let not your heart be troubled\"—it can feel a bit trite. It could come across as if Jesus is saying your heart should not be troubled by these things. But we know that Jesus is not saying this, because Jesus, perfectly God and fully man, knows what it's like to have a troubled heart. If we rewind two chapters to chapter 12, Jesus is reflecting on his impending death, the reason for his coming. And he says in verse 27, \"Now my soul is troubled, and what shall I say? Father, save me from this hour? But for this purpose I have come to this hour.\"\n\nIf we go to the very next chapter, chapter 13, we find Jesus having dinner with his closest friends. It says in verse 21 that Jesus was troubled in his spirit and testified, \"Truly, truly I say to you, one of you will betray me.\" I jumped over chapter 11, when Jesus attends the funeral of his friend Lazarus. When he sees Mary, his dear friend, weeping, it says in John 11:33, \"When Jesus saw her weeping, and the Jews who had come with her also weeping, he was deeply moved in his spirit and greatly troubled.\"\n\nWhen we look at the brokenness of the world around us and within us, it is appropriate and right to have a troubled heart. Jesus shows us this. So what then is Jesus holding out to us in John 14 when he says, \"Let not your heart be troubled\"? He wants us to know that there is hope. There is a cure for your troubled heart and mine. And it's not a religious system that offers an escape from trouble. It's not a set of principles for living that calms the trouble. It's not a promise of prosperity that keeps you from trouble. It's not a mindset of positivity that changes your perspective on troubles.\n\nJesus tells us here in John 14 that there is one cure for your troubled heart and mine. And Jesus says, it's me. I am the only hope for your troubled heart. Notice what he says in this passage: \"Let not your hearts be troubled. Believe in God. Believe also in me.\" Jesus is not holding out a formula for inner peace or religious devotion as a cure for your troubled heart. He is inviting us to believe. But not just to believe in anything. Our culture loves the idea that the object of your belief doesn't matter—that it's about the sincerity of your belief. But hear me clearly. The cure for your troubled heart and mine is not simply believing. It is who you're believing that matters. He says, \"Believe in God. Believe also in me.\"\n\nOn Wednesday of this week, I was taking Elijah, our three-year-old—he's almost four—to school, and I could tell on the way that he was deeply reflecting on something. About ten minutes into the drive, he asks, \"Hey, Dad. Why did God make our bodies puke?\" It's a great question. Here I am with five minutes before we get to school, and I have to explain why our bodies puke. So I started here: \"Elijah, you know what? The world and our bodies don't work the way they were supposed to. Sometimes you hear us talk about how we live in a broken world. And because of sin—do you remember what sin is?\" He said, \"No.\" So I said, \"Okay, we've got four minutes left.\" I explained that when mommy and daddy say choices have consequences, God designed us to live in a certain way so we find flourishing in life. The rules that mom and dad give you are so that you can flourish, Elijah. God ordered our world in a similar way. When we don't follow that order, it's something we call sin. It's breaking God's law. It's not that he's trying to be mean. He's trying to help you. So there are consequences to that. In our world, things don't work the way they're supposed to, and sometimes you puke.\n\nI'm thinking about how I'm doing with this explanation, and then I realized we've got two minutes to get to school. I've got to give him some hope here. So I said, \"You know what? But one day Jesus is going to change that. One day Jesus is going to make everything sad untrue. One day your body that doesn't work like it's supposed to and sometimes pukes is going to be redeemed by Jesus. All that Jesus invites us to do is trust him.\" And Elijah goes, \"What's trust?\" I'm like, \"I've got one minute.\" I literally took thirty seconds to come up with my answer. I said, \"Elijah, you know when you stand on top of the stairs, you tell me to go halfway down, and then you say, 'Dad, catch me'? That's trust. You are believing that I will catch you.\" He goes, \"Oh.\" And then he says, \"But Dad, if Mom jumped off the top of the stairs, she would crush you.\"\n\nElijah's three years old, and he is grasping a critical truth about trust. It's not about the amount of faith a person has. It's about who they are trusting in. Can they catch your weight? Here in John 14, Jesus wants to turn our eyes to the content of your faith. That he alone can handle our weight. That he alone can handle what troubles your heart—that thing that keeps you awake at night or that thing that brings you to the point of exhaustion. Jesus alone can carry that weight. And he invites us to trust.\n\nThe heart of this passage as it unfolds is that Jesus is saying the content of where you put your trust matters. Jesus knows that his disciples are feeling anxious about some of the things he's been saying. In chapter 13, he's talked about how he's going to die, how one of them is going to betray him, and how he has to go away for a while. I imagine that Jesus's friends, his closest followers, are struggling with this. And Jesus knows there's something deeply comforting about John 14:1—that Jesus knows your heart will be troubled and so will mine. When he says, \"Do not let your heart be troubled,\" he knows what it's like. And he cares. He cares deeply about the things that trouble your heart.\n\nNotice what he offers to his disciples as they wrestle with these troubles. He says in verse two, \"In my father's house there are many rooms.\" Now, something important for us to understand is that John uses the phrase \"In my father's house\" only one other time in the Gospel of John. It's in chapter 2 when he's referring to the temple. In ancient first-century Judaism, the temple is the place where heaven meets earth. So what is Jesus telling them? In my father's house, the place where heaven meets earth, there's plenty of room. \"If it weren't so, would I have told you that I go and prepare a place for you? And if I go and prepare a place for you, I will come again and take you to myself, that you may be also where I am. And you know the way where I am going.\"\n\nThis passage is something that's often read at funerals. I've done it. I've performed a lot of funerals. This is a comforting passage because Jesus is pointing us to a future hope. He's pointing us to something that is sure. He's saying, \"I'm going to prepare something for you—a place where heaven meets earth, and there's room for you.\" There is something comforting about that. But I do think this passage has often been misunderstood by the church regarding what Jesus is pointing us to.\n\nI want you to get this this morning. I think it's often that Christianity is made out to be about escaping the brokenness of our world—that our hope is about one day escaping the brokenness and being in the kingdom of God. But the message of Jesus throughout the gospels, John's gospel included, is that the kingdom of God is breaking into our broken world. While many Christians inappropriately place emphasis on the day we will escape to paradise, what Jesus is communicating here, I don't think, is \"Don't let your heart be troubled because one day you're going to escape.\" I think what he's saying is, \"One day you're going to be with me forever.\" His point in saying that is, I'm here with you now. The kingdom of God is coming now. There is peace now.\n\nPeace for your troubled heart and mind, I want you to get this, is not about escaping to paradise. Peace for your troubled heart and mind is about the presence of Jesus. Jesus wants you to see that there is one cure, one remedy for your troubled heart, and it is a person—a relational person. He's saying, \"I'm going to prepare a place for you.\" This is the language of a bridegroom preparing a place for his bride. This is relational. This is not escapism. Christianity is not about escaping the brokenness of the world. Christianity is about a person who took on flesh, stepped into the brokenness, who said, \"I have a troubled heart,\" and who says, \"Do not let your heart be troubled. Put your trust, put all your weight in the fact that I can catch you.\"\n\nNothing in this broken world—the uncertainty of health, the unpredictability of relationships, the things that keep you up at night—is outside the domain of what Jesus says: \"I will be with you.\" As the passage goes on, Thomas, who's a bit of a realist, says to Jesus, \"You're saying we know the way? How do we know the way? We don't even know where you're going.\" And Jesus says to him, \"I am the way...\"\n\n# Sermon: \"I Am the Way, the Truth, and the Life\"\n\nThe truth. I am the life.\" This is one of the \"I am\" statements in the Gospel of John. Each of these statements reveals something about Jesus's identity—a framework and paradigm for how we understand faith. Jesus says, \"I am the way.\"\n\nConsider what happens when you type \"East Point Church Durham\" into your GPS. The way can mean the path or route you take. But Google Maps offers something more: it lets you choose how you'll get there. Will you go by foot, public transit, or car? Each choice determines a different route. When Jesus says, \"I am the way,\" he's saying this: \"I am both the destination and the mode of finding true and lasting peace. The cure for your troubled heart and mind is understanding that Jesus is both the destination our hearts long for and the means by which our hearts find true and lasting peace.\"\n\nJesus declares, \"I am the way, the truth, and the life. No one comes to the father except through me.\" I acknowledge that this verse is a stumbling block for many. Jesus claims there is one way, one cure for our troubled hearts and the brokenness in our world. He is saying, \"I am the only hope.\" Many in our culture today have a problem with that. They ask, \"What about other religions that claim to be the way? What about this path or that path?\" Many say, \"Perhaps all these paths lead to the same destination.\"\n\nTim Keller writes something helpful on this point: \"The trouble with this is that it doesn't work. If you dethrone Jesus, you enthrone something or someone else instead. The belief that all religions are really the same sounds nice and democratic, though the study of religions quickly shows that it isn't true. What you're really saying is that none of them are more than distant echoes, distorted images of reality. You're saying that reality, God, the divine is remote and unknowable. That neither Jesus nor Buddha nor Moses nor Krishna gives us direct access to it. They all provide a way toward the foothills of the mountain, not the way to the summit.\"\n\nBut here in John 14, Jesus says, \"I am the way. I am the truth and the life.\" As we walk through the Gospel of John, we see Jesus repeatedly saying, \"I am offering you life—real life, flourishing life as it was meant to be lived.\" And here, in an almost pinnacle moment of the gospel, Jesus says, \"You can't find it anywhere else. It is only in me.\" Jesus wants to be clear about the cure for your troubled heart and mine, and we see this in the verses that follow.\n\nPhilip responds, essentially saying, \"Okay, all this talk about you being the cure, about God being the solution for our hearts—just give it to us now. Fix it all.\" What Jesus says to him is profound, and we must not miss it. In verse 9, Jesus says, \"Have I been with you so long and you still do not know me, Philip? Whoever has seen me has seen the father. How can you say, 'Show us the father.' Do you not believe that I am in the father and the father is in me? The words that I say to you, I do not speak on my own authority, but the father who dwells in me does his works. Believe me that I am in the father and the father is in me or else believe on the account of the works themselves.\"\n\nIn verses 7 through 11, Jesus says essentially the same thing seven times in different words: \"I and the father are one. If you've seen me, you've seen the father.\" In other words, you might think that escaping to the presence of God is the solution. And in some ways, you're right. But in other ways, you're wrong—because I'm right here. God and heaven are invading earth in a redemptive way. Jesus is saying, \"I'm going to prepare a place for you.\" What will he do? He will go to the cross where he will be killed for your sin and mine. He will say, \"Father, forgive them for they know not what they do.\" Three days later, he will rise from the dead so that your troubled heart and mine can say, \"Even though I walk through the valley of the shadow of death, I will fear no evil. Why? Because Jesus is with me.\"\n\nI want you to hear this clearly: The place where you find peace for your troubled heart is not the paradise of heaven. Heaven will be wonderful. But peace is not found in the paradise of heaven—it is found in the presence of Jesus. That is what heaven is all about. That is what the way of Jesus is all about. The way of Jesus is about walking in his presence.\n\nJust a few verses later, in verse 27, Jesus says, \"Peace I leave with you. My peace I give to you. Not as the world gives do I give to you.\" He repeats, \"Let not your hearts be troubled, neither let them be afraid.\" Jesus echoes these words in the context of what he says just before: \"I'm going to go away, but I'm going to send another—a helper. It is the spirit of God, the spirit of God that lives and dwells within every follower of Jesus.\"\n\nThe invitation of the gospel, when Jesus says, \"I am the way, the truth, and the life. No one comes to the father except through me,\" is this: We do have a future hope. One day Jesus will return and God will make all things new. But this future hope changes our present reality. The spirit of God, the risen Christ, lives within us and invites us to walk in him and be part of his transformation in our world today. When Jesus says, \"Let not your heart be troubled,\" this is no fortune cookie. This is no trite word. This is the word of the one who conquered death and offers peace for your troubled heart and mine.\n\nIn many ways, John 14:6—\"I am the way, the truth, and the life\"—is something every person in this world needs to hear. Jesus does offer a cure for your troubled heart and mind. He offers hope beyond the grave. If you're not a follower of Jesus this morning, I want you to hear that. But I also want to speak to those of you who are followers of Jesus: These words are for you. The way of Jesus, the truth of Jesus, the life of Jesus is found when we look to Jesus and his presence as our only hope. Not escaping, but being. You were made for a relationship with him.\n\nEugene Peterson writes, \"The Jesus way wedded to the Jesus truth brings about the Jesus life. Jesus as the truth gets far more attention than Jesus as the way. Jesus as the way is the most frequently evaded metaphor among the Christians whom I have worked with for fifty years as a North American pastor.\" He goes on to say, \"We can't suppress the Jesus way in order to sell the Jesus truth. The Jesus way and the Jesus truth must be congruent. Only when the Jesus way is organically joined with the Jesus truth do we get the Jesus life. And it goes without saying that when you wed the Jesus truth with any other way, you have a corruption of what life as God has designed it.\"\n\nWhen you wed the Jesus truth with the American way, you have corrupted politics. You have a corrupted worldview. You have embraced the lie that peace and rest for your troubled heart can be accomplished through the success of your career, the accumulation of money, and your reputation in society. Jesus says, \"I am the way.\" If you want the truth that I am and the life I offer, you have to follow the Jesus way.\n\nWhat is the Jesus way? Just the chapter before this, Jesus took off his robe and washed his disciples' feet. He said, \"If you love me, you'll follow my commands.\" What is my command? Love one another. This is the way of Jesus. This is the truth your troubled heart is longing for. And this is where life is truly found. The place where you find peace isn't the paradise of heaven. It's the presence of Jesus, and he is here this morning. He is inviting you to lay down any other way you are seeking to flourish, any other way you are seeking truth. He is inviting you to find life—life abundantly.\n\nWe are going to respond this morning in three ways. First, we're going to sing together three songs because we believe Jesus is worthy of our praise. Second, we're going to respond in prayer. During these songs, a couple of people on the edges of the room will be wearing a green lanyard. If you would like somebody to pray with you, pray over you, I invite you to take advantage of that. Third, if you are a follower of Jesus, we have a practice we return to weekly. It's something Jesus instituted with his disciples when he took bread, broke it, and said, \"This is my body which is broken for you.\" He took the cup and said, \"This is my blood that is shed for the forgiveness of sins. As often as you eat this bread and drink this cup, you proclaim the Lord's death until he comes.\"\n\nThis is the invitation of the table. If you are a follower of Jesus, we return to this table for one reason: to remember that we find life in Jesus and nothing else. I invite you at any point during these three songs to come to the table, take a piece of bread, dip it in the cup, and remember the good news—that there is nothing you can do to earn God's favor, nothing you can do or have done that can keep you from his love and forgiveness. He invites you to come to him.\n\nAs we respond, let me pray for us. God, my heart feels the unrest and trouble of living in a broken world, and I imagine there are those in this space this morning who feel that as well. I imagine that every person here has something that either keeps them up at night or brings them to the point of exhaustion. This morning, I pray that you would draw our hearts and eyes to look to you as the way, the truth, and the life, and that we would find in you the life we've always longed for. We pray in Jesus's name. Amen.","url":"https://www.youtube.com/watch?v=DEWimoCOmlQ"},{"id":"6GM81BTH-_E","date":"2025-11-11","title":"The Good Shepherd","scripture":"John 10","preacher":"Peter Frey","series":"John","desc":"In John 10, Jesus reveals Himself as the Good Shepherd who lays down His life for His sheep and leads them into life to the full. Join Pastor Peter Frey at Eastpoint Church in Durham, NC, and discover real hope for real life in Christ.","transcript":"# Sermon on Jesus the Good Shepherd\n\nJoin me in reading aloud this prayer for illumination. The words will be on the screen. \"Guide us, oh God, by your word and spirit that in your light we may see light and in your truth find wisdom and in your will discover your peace through Jesus Christ our Lord. Amen.\"\n\nPlease remain standing as you are able for the reading of God's word from the Gospel of John, chapter 10, verses 10-18. These are the words of Jesus:\n\n\"The thief comes only to steal and kill and destroy. I came that they may have life and have it abundantly. I am the good shepherd. The good shepherd lays down his life for the sheep. He who is a hired hand and not a shepherd, who does not own the sheep, sees the wolf coming and leaves the sheep and flees, and the wolf snatches them and scatters them. He flees because he is a hired hand and cares nothing for the sheep. I am the good shepherd. I know my own and my own know me, just as the Father knows me and I know the Father. And I lay down my life for the sheep. I have other sheep that are not of this fold. I must bring them also, and they will listen to my voice. So there will be one flock, one shepherd. For this reason, the Father loves me because I laid down my life that I may take it up again. No one takes it from me, but I lay it down of my own accord. I have authority to lay it down, and I have authority to take it up again. This charge I have received from my Father.\"\n\nThis is the word of God.\n\n---\n\nIt's great to be worshiping with you this morning as we continue in our series through the Gospel of John, which we've called \"Real Life Jesus.\" We're exploring the ways that Jesus came to bring real, authentic life. Last week we talked about what stands opposite to that—counterfeit paths and counterfeit offers in our world that claim to lead to real and abundant life.\n\nHere in John chapter 10, Jesus makes a bold claim. He says that the thief came to steal, to kill, and to destroy, but he came that we may have life and have it abundantly. As we trace through the Gospel of John, this theme of life appears from the beginning. In chapter one, it says that in Jesus was life, and that life was the light of all mankind. This reveals who Jesus is. John unfolds for us the truth that real life is found in Jesus.\n\nNow, we live in a world full of what I would call gurus. We live in the age of internet gurus offering everything from life hacks to work advice. How many of you have received a spam text message saying, \"I have an offer for you. You can make $10,000 a week if you do this\"? There are countless offers out there claiming to show us the path to life. In 2023, the BBC released a podcast series called \"The New Gurus,\" which traced individuals on the internet who became spiritual leaders for people. Interestingly, the host identified something striking: the decline in church attendance was being met proportionally with the rise of internet influencers who were essentially serving as pastors, offering people a path to life. \"If you dropship, you'll make a lot of money and secure your future. All you need is passive income. Get into cryptocurrency. Sign up for my course, and I can give you a surefire path to retiring at 40.\" This is the age we live in—the age of the internet guru.\n\nJesus addresses this directly here in John chapter 10 with another of his \"I am\" revelatory statements. He says, \"I am the good shepherd.\" This statement is critically important for us, especially in the twenty-first century when so many people are trying to offer us a path to life. It's easy to scoff at this on a Sunday morning, but I want us to do some real self-reflection this morning about how easy it is for us to be seduced by what I'm going to call the bad shepherds of our world. Jesus uses the metaphor of a shepherd, an occupation familiar in the ancient world. I remember when my wife Mary and I lived in Scotland, we rented a car and drove up to the Highlands. There were sheep right in the middle of the road. Sheep are among the most helpless creatures. They need guidance, protection, and care. When Jesus says, \"I am the good shepherd,\" he is telling us what kind of shepherd he is. The implication is clear: there are all kinds of shepherds, all kinds of gurus, all kinds of people and things offering life. Jesus says, \"I'm the good one.\" If you want life—real, abundant life—you have to take seriously the claim that Jesus is the good shepherd. He is the one we need when navigating this broken world, especially in those moments when we're as helpless as sheep trapped in a ditch.\n\nAs we look at the \"I am\" statements we've examined so far, we've seen that Jesus is the light of the world, the bread of life, the living water. Each statement reveals who Jesus is. Using the language of the Old Testament where God reveals himself as \"I am\" the self-existing one, Jesus is also revealing the nature of who he is. When he says, \"I am the bread of life,\" he means, \"I am the substance you are made for.\" When he says, \"I am the living water,\" he means, \"I am what quenches your thirst.\" When he says, \"I am the light of the world,\" he means, \"I am what exposes what is false and gives a path to what is true.\"\n\nThis metaphor is particularly interesting because it's the first time in the \"I am\" statements that we see how Jesus feels about you. In saying, \"I am the good shepherd,\" Jesus wants us to understand something about the way he leads. The good shepherd is a shepherd grounded in love. So as we look at the love of the good shepherd, the first thing we see in this passage is that the love of Christ is intimately relational.\n\nAt the beginning of John chapter 10, Jesus says: \"The sheep hear his voice and he calls his own sheep by name and leads them out. When he has brought them all out, he goes before them and the sheep follow him for they know his voice.\" The picture of Jesus's leadership in our lives and his love for us is intimately relational. He knows his sheep by name.\n\nThere's a story of a young shepherd boy keeping a large flock of sheep. When asked, \"How many sheep do you have?\" he answered, \"I don't know. I can't count.\" The man asked, \"Well, how do you know if some haven't wandered off when you camp at night?\" The boy answered, \"I don't know how many wander off, but I know each one. I can't count, but each sheep has a name, and I know their names.\" Scripture tells us that not only does Jesus know the number of hairs on your head, but he knows you by name. I want you to hear this this morning. When Jesus contrasts the thief who comes to steal, kill, and destroy with himself, who has come that you may have life and have it abundantly, he is holding out a promise: he knows you better than you know yourself, and he loves you all the same.\n\nOne of the greatest fears of all mankind is that someone would actually know us—know the depths of our soul. As we've explored in previous weeks, when the light shines in the darkness, we can either hide or run to the light. The invitation of Jesus here in John chapter 10 is this: if you want to have life as it was meant to be experienced and lived, come to a good shepherd who knows you by name. He knows everything about you. He knows that thought you had this morning. He knows the way you twisted the truth. He knows you better than you know yourself, and he loves you. He wants to lead you into life.\n\nThis stands in stark contrast to the age of the internet guru and the many shepherds we encounter in our lives. There is distance between us and all these leaders. It is an age of signing up for courses and finding life hacks, as if some principle could deliver life. But Jesus wants us to understand that life is not found in a life coach or even in religious principles to live by. Life is found in a person who knows you, who loves you, who cares about you. The love of Christ is intimately relational.\n\nOne thing we must understand about the Gospel of John is that John had a Jewish audience in mind. When they heard Jesus say, \"I am the good shepherd,\" they would have recognized Old Testament echoes. Throughout Scripture, the people of Israel were referred to as God's flock. This sheep imagery was not foreign to his readers. But notice what Jesus clarifies. He wants them to understand that his leadership is intimately relational, not merely national. Their assumption was that if they had association with the people of God—if they grew up in the religious tradition, if they had connection to Jesus—then they were in the flock. But Jesus makes this clear in verse 16: \"So there will be one flock and one shepherd.\" He explains: \"I have other sheep that are not of this fold. I must bring them also, and they will listen to my voice. So there will be one flock, one shepherd.\"\n\nWhat Jesus is communicating to the people of Israel is that it's not about national identity. What we need to hear is that it's not about your association with Jesus or your religious credentials. It's not about your principles of religion. It is about a person who is your shepherd. That's the invitation of Jesus in John chapter 10. If you want to have life—life to the full—Jesus isn't offering a set of principles to order your life around. He's holding out himself as an intimately relational person.\n\nSo we see that Jesus is the intimately relational good shepherd. What does he ground this in? He grounds it in his relationship with the Father. This is supremely important throughout the Gospel of John. Jesus continually communicates, \"I and the Father are one.\" Look at what he says in verse 14: \"I am the good shepherd, I know my own and my own know me.\" We see that intimate relational aspect of Jesus being your good shepherd. What is it grounded in? Verse 15: \"Just as the Father knows me and I know the Father, I lay down my life for the sheep.\"\n\nSo when we think about what kind of shepherd Jesus is—if you want to look to Jesus as the good shepherd who leads to life—his relationship with the Father is the foundation. They are united in love, in purpose, and in their commitment to you.\n\n# The Good Shepherd\n\nAt the moment when Jesus is baptized, the voice from heaven declares: \"This is my beloved son in whom I am well pleased.\" This is what Jesus is communicating to us. That relationship he has with the Father, he's inviting you into when you make him the good shepherd. Jesus is inviting us into an intimately relational course to follow. It is grounded in a person, not in principles or a process, but in a relationship.\n\nWe must see that this calling is not only intimately relational, but intentionally sacrificial. Woven into this passage are Jesus's words that he lays down his life for his sheep. He says, \"I am the good shepherd. The good shepherd lays down his life for the sheep.\" What Jesus is starting to communicate, and what his disciples are trying to wrap their heads around, is that his death is coming. But he wants them to understand, and wants us to understand when we look back after his death and resurrection, that the death of Christ was not an accident but a mission. Jesus did not die as a casualty to a cause. He died as a solution to the curse.\n\nWhen Jesus says in verse 18, \"No one takes my life from me,\" he wants us to see that his death was not something forced upon him. His death was an intentionally relational act of love, given for you. He lays it down so that he may take it up again. C.S. Lewis captures this beautifully: \"It costs God nothing, as far as we know, to create nice things, but to convert our rebellious wills, it cost him crucifixion.\"\n\nJohn 10:10 tells us, \"The thief comes to steal, to kill, and destroy.\" That is the state of all of us apart from the good shepherd. But Jesus says, \"I have come that you may have life and have it abundantly.\" And the only way you can experience that is through the intentionally sacrificial love of the good shepherd.\n\nJohn 15:13 says, \"Greater love has no one than this, that he laid down his life for his friends.\" There is a beautiful irony here: Jesus is the good shepherd because he is the sacrificial lamb. In John 1, when John the Baptist sees Jesus coming, he doesn't say, \"Behold the good shepherd.\" Rather, he says, \"Behold the lamb of God who takes away the sin of the world.\" Later, when John sees a vision of the throne room of God, he hears the words, \"Behold the lion who has conquered.\" And when he looks, he sees a lamb looking as if it had been slain. Jesus's victory is won through sacrifice. He says, \"I laid down my life that I may take it up again. I am intentionally sacrificial in my love for you because I want you to share in my victory of resurrection.\"\n\nIn order for us to see the lion of the tribe of Judah, we must see the lamb that was slain. The good shepherd loves you so intimately that he died for you intentionally so that you might experience real life abundantly. That is the truth of John chapter 10.\n\nLater in this chapter, verse 27 says, \"My sheep listen to my voice. I know them and they follow me. I give them eternal life, and they shall never perish. No one will snatch them out of my hand. My Father, who has given them to me, is greater than all. No one can snatch them out of the Father's hand.\"\n\nWhat invitation does this passage present to us? First, there is an invitation to trust him. Jesus is a better leader, a better lover, and a better source of life than anything you could turn to. So trust the good shepherd.\n\nSecond, there is an invitation to experience the peace of his salvation. If you look to him and his death and resurrection as the solution to the curse—as the answer to what the thief came to steal, kill, and destroy—Jesus says, \"No one, nothing can snatch you out of his hand.\" Experience the peace of that. Deep down within each of us is a longing to find true and lasting peace, and Jesus offers that.\n\nThird, the invitation of this passage is to listen. Jesus makes it clear that his sheep know his voice and they follow him. And that takes time. There are some voices I can pick up in a crowd. After service, when we're chatting in a room full of chatter and clutter, if I hear my wife's voice, I know it immediately. Why? Because I spend time with her. I know that voice. And that is the invitation of the good shepherd. If you want a path to life and true, lasting peace, spend time with him in his presence. Open his word and hear his voice. As you do, I believe you will find the truth of this passage resonate in your soul: that Jesus knows you by name, loves you as his own, leads you for your good, sacrifices for your safety, died for your forgiveness, and rose to give you life.\n\nIt is so important that we read this back into Psalm 23, that well-known passage. Jesus is my shepherd, so I shall not want. He makes me lie down in green pastures. He leads me beside still waters. Jesus restores my soul. Jesus leads me in paths of righteousness for his name's sake. And even though I walk through the valley of the shadow of death, I will fear no evil. Why? Because Jesus is with me. His rod and his staff, they comfort me. Jesus has prepared a table for us in the presence of our enemies. He anoints my head with oil. My cup overflows. Surely goodness and mercy shall follow me all the days of my life, and I shall dwell in the house of the Lord forever.\n\nThis morning, we're going to respond in three ways. We're going to sing together because we have a good shepherd. We're going to pray together. During these next thr
