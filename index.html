 to Jesus in John chapter 3, Jesus knows what's in his heart. He knows what he's looking for. And he has an interesting interaction with Jesus.\n\nJohn 3:1 tells us: \"Now there was a man of the Pharisees named Nicodemus.\" The Pharisees were an important religious group in the New Testament. They were the religious elites—probably the most scholarly and had all the right answers for many things. In Jesus's day, there was Roman rule. Rome governed the overarching government, but the Pharisees were given specific governmental authority as well among the Jews. So the Pharisees had both religious elitism and political elitism. Nicodemus comes from a place of power. He's described as \"a ruler of the Jews.\" Verse 2 says: \"This man came to Jesus by night and said to him, 'Rabbi.'\"\n\nNow, titles are important. Let me give you a little example. Yesterday I had the joy of coaching Elijah's first soccer team. I wasn't supposed to be the coach, but the way youth soccer works is that sometimes you show up and you need a coach. The first week I was there, the coach was actually present, but his son was having a hard time. I walked up to him and asked if I could help. He said, \"Yeah, could you just take over?\" So the two of us tag-teamed it for a while. This week, he texted me and said he wouldn't be there on Saturday and asked if I could fully coach the team. So I gathered these three to five year olds and got them together. I said, \"I'm Coach Peter. Here's the game plan for today.\" About halfway through the practice, my son Elijah came up to me and said, \"Hey, Coach Peter.\" I responded, \"It's Coach Dad to you.\" But in that moment, him calling me Coach Peter made me feel a certain way. Why is he calling me Coach Peter? What does he want from me by calling me coach Peter?\n\nWhen Nicodemus comes to Jesus and says, \"Rabbi,\" that's an important word. Rabbi was a teacher—not just a teacher like at a school, but a teacher that people would follow and really order their lives around. In Jesus's day, there would be rabbis with a set of teachings, and their disciples (that's what the rabbis' followers were called) would come and start to order their lives around that rabbi's teachings. So when Nicodemus comes to Jesus and gives him this important title, he's saying, \"I am recognizing your position of authority.\" Notice what he says: \"Rabbi, we know you are a teacher come from God. For no one can do these signs unless God is with him.\"\n\nHere they are acknowledging Jesus. And notice it's not just \"I.\" Nicodemus says, \"We know that you are a teacher.\" Nicodemus is coming as a representative of the religious elites of his day, and he's saying, \"I acknowledge that I see something special about you.\" It seems that Nicodemus is going somewhere with this. When you come to someone and say, \"Rabbi, I see that you are special,\" a question is usually coming. But remember what we read at the end of chapter 2: Jesus knows what's in the heart of men. Jesus knows the question, the longing. He knows what is deep within Nicodemus's heart. So before Nicodemus even gets to his question, Jesus responds to him.\n\nI think this is true in relationships. As you get to know someone, you start to know what their longings are. For example, yesterday when we came home from soccer, Elijah came to me and didn't call me Coach Peter this time. He said, \"Hey, Dad.\" And in that moment, I responded, \"No, you cannot have an ice cream sandwich\"—because I knew what was in his heart. I knew what he was going to ask. Jesus knows what Nicodemus is going to ask. And look at what Jesus says to him in verse 3.\n\nJesus answers him: \"Truly, truly I say to you, unless one is born again, he cannot see the kingdom of God.\"\n\nNow, this seems like a big jump from Nicodemus saying, \"Teacher, I know that you are special. I know that God is with you.\"\n\n# Sermon Transcript: Born Again\n\nFrom God, that God is with you.\" And Jesus makes the jump to know what Nicodemus is really longing for. This is honestly what most people in the first century were longing for. They were longing for the kingdom of God. What does that mean? They were longing for God to make the world right and for them to have a place in that. The Jewish people had this promise that God would send a Messiah, someone who would be the hope of all mankind to set the brokenness in order. So the longing that Jesus knows Nicodemus has deep within his heart is: Are you the one bringing this thing? And how can I be part of it?\n\nJesus presses into Nicodemus's deepest need beyond his felt need. He says, \"No one can see the kingdom of God unless they are born again.\" Now this terminology carries baggage for many of us. The term \"born again Christian\" has been somewhat hijacked by media and contemporary culture. When most of us hear it, we may think of polarizing people involved in culture wars. But I want us to set that baggage aside and ask: what is Jesus really telling Nicodemus here? Jesus is hitting at a question deep within all of us: Where do we find real life? Where do we find the life we've been longing for, that we were made for? Jesus is saying you cannot even experience that unless you experience new life.\n\nAt the heart of this passage and the heart of the Gospel of John is this truth we cannot miss: real life begins with new birth. Nicodemus responds in verse four: \"How can a man be born when he is old? Can he enter a second time into his mother's womb and be born?\" I don't think Nicodemus is being serious here. He's saying, \"Jesus, this sounds outlandish. You're only born once.\" Sometimes we don't have the categories for our deepest longings. What Jesus is doing for Nicodemus is giving him the categories for understanding his deepest need.\n\nJesus answered, \"Truly I say to you, unless one is born of water and the spirit, he cannot enter the kingdom of God. That which is born of the flesh is flesh. That which is born of the spirit is spirit. Do not marvel that I said to you, you must be born again.\" Jesus is communicating to Nicodemus: Yes, we are all physically born—hopefully all of you are self-aware enough to know that. But Jesus is identifying a deeper need. When it comes to real life, there is a birth that you need to experience in order to experience life as it was meant to be. That is a spiritual new birth.\n\nDeep within all of us is a longing to experience new life. But most of us look to the things that are natural in this world to find that. When we fill in the blank \"I'll be really living when,\" we think of things we can produce, order, or get to by our own will. But in the longing deep within all of us, we are longing for something we can't order, can't achieve, and can't get to. What Jesus is saying is that your deepest need is something you can't produce.\n\nJesus says, \"Truly, truly I say to you, unless one is born of water and the spirit.\" What is he talking about water? Remember who Nicodemus is. He's an elite Pharisee who would have had most of the Old Testament by memory, certainly key passages. One of those key passages is Ezekiel chapter 36. God makes a promise: \"I will sprinkle clean water on you and you shall be clean from all your uncleanness, from all your idols. I will cleanse you and I will give you a new heart and a new spirit. I will put within you. I will remove the heart of stone from your flesh and give you a heart of flesh.\"\n\nAll the way through the Old Testament, the prophets promised that one day water was a symbol—a day when God would do something new, create new hearts in people. What Jesus is doing for Nicodemus is connecting the dots. When he says born of water and of the spirit, he's connecting the dots to show that you need an absolute renovation. You don't just need a renovation—you need regeneration.\n\nMost of us, when life feels broken and out of control, when we feel like we aren't experiencing life as it was made to be, we try to do things that can produce life. If you don't get anything else this morning, the message of Jesus to Nicodemus and the message of the Spirit of God to each of us is this: real life has to be given to you. It is not something you can produce. Real life begins with new birth.\n\nTo say it another way: real life isn't about a better life. It's about new life. God doesn't make good people better. He makes dead people live. The message of the Gospel, the message of the Gospel of John, is that all of us without Jesus are dead—spiritually dead. We are born into this world with a propensity to choose our own way, not the way that life was made to be. The Bible calls that sin. It is ordering our lives around ourselves on the throne rather than God. We were meant to experience life with God on the throne of our lives.\n\nIn that passage in Ezekiel where God says, \"I will put a new heart in my people,\" he says he's going to deliver you from your idols. I know that we don't live in a culture here in America where we have tangible physical idols, most of us. But we have all kinds of idols—things that we put on the throne of our lives. Things that we fill in the blank of: \"I'll really be living when.\" It's not just things like money and success. It can be things like: I'll be really living when I feel accepted by the people around me. I'll be really living when I can make a difference in this world. I'll be really living when I can feel secure about myself. All of these things are what scripture calls idols. Scripture says that all of us have things that we place on the throne of our lives. Those things we look to for life, when the only thing that can bring life is Jesus.\n\nSo real life isn't about a better life. It's about new life. As we think about this interaction between Jesus and Nicodemus, we have to ask: what does this mean for us? What does it mean for me in my life and for each of us? The invitation of Jesus is that he came to give you life. As the passage goes on, it gives this picture of Jesus who is lifted up, and whoever looks to him will experience real and eternal life.\n\nWhenever we read in the Gospel of John, tuck this away for your reading through John: whenever you see the word \"eternal life,\" most of us think about what happens after we die. But John is painting the picture of eternal life as something that is experienced here and now. Yes, it has to do with how we make sense of death and what's after death. But John is very clear that Jesus wants to bring, as it says in John 10:10, \"life and life to the full.\" That's real life as God designed it.\n\nHere is the invitation of Jesus. Many of us know this verse. It comes a few verses later in this passage, but in John 3:16, it says: \"For God so loved the world that he gave his only son that whoever believes in him should not perish but have eternal life. For God did not send his son into the world to condemn the world, but in order that the world might be saved through him.\"\n\nThis is the invitation of Jesus for each of us. You want to experience real life? Look to Jesus. Look to his finished work where he came into our world not to condemn the world but to give life. He lived the life we could not live. He died the death that we deserved. He rose to give new life. Everyone who looks to him can not only have hope beyond the grave but hope here now—hope that reorders our life. That longing of Gen Z for meaning-making—Jesus speaks into that longing to say you were made for a purpose. You are made for a relationship with Jesus that redefines what truly living is.\n\nI want to speak to a couple of groups in the room. First, to those of you who've been following Jesus for years and this language of new birth and regeneration is familiar to you—something you know. But I want us to ask: if that is where life comes from, what does it look like to walk in that? What does it look like to walk in the new life that Jesus has designed?\n\nPart of what Jesus is inviting us into is coming back again and again to identity. Who are you? Who are you deep down? What defines who you are? The answer is: you are loved by Jesus. If that is true of you, if he paid the price that you owed for your sin and he rose to give you new life, what does that look like in our lives?\n\nJesus gives an example at the end of this passage. He says: \"The wind blows where it wishes and you hear its sound, but you do not know where it comes from or where it goes. So it is with everyone who is born of the spirit.\" I use this illustration with my son all the time. He asks, \"Why can't I see God?\" I say, \"Well, you know how the wind blows and you can't see it? But you see here in the fall these leaves falling from the trees and you see the trees blowing. What is Jesus saying in all of this? Jesus is saying that if you want to see Jesus and the new life that he brings, look at his people. Look at life change.\n\nIn our hallway, there's a big banner that says, \"We expect God to change lives.\" It is a core value here at East Point. Part of this expectation is that God wants to change lives. It happens when we come to the end of ourselves and say, \"We can't make ourselves better. We need Jesus to make us new.\" God doesn't make good people better. He makes dead people live.\n\nAs we think about this core value of expecting God to change lives, when I was in seminary, I was living on the north shore of Boston. There was an advertisement for someone who needed help with his sailboat. I grew up around the water in the Eastern Shore of Maryland, but I'd never been a sailor. I thought this sounded like a great opportunity. It was basically an older gentleman who had bought a forty-foot sailboat. He knew he shouldn't sail by himself, so he was looking to hire someone to go sailing with him.\n\nWe would go out sailing together. I'd help him learn the technology on his boat and how to use it. One of the things that struck me was that a sailboat is just useless unless the wind blows. We'd go out some days and the wind would die down and we'd just sit out there in the water, pleasant enough but static. But when the sail would fill with air, when the wind would blow, that thing would do what it was meant to do. It would cruise, almost silently. All of a sudden, this thing we couldn't see made this big, massive thing in the water do what it was designed to do.\n\nI think it's a great illustration that Jesus uses here of each of our lives. Without the Spirit of God bringing new life, our lives just feel like dead weight in the water. But Jesus came...\n\n# Sermon Transcript\n\nTo bring new life—life to the full, life as it was meant to be. When the Spirit of God blows into a situation, you see life change. You see your life reordered. One of the things we're praying for East Point Church is that the Spirit of God would move in such a way that people cannot help but say there is something happening here. They may not know what or who this God is or where He comes from, but they can see that He changes lives. It's true. He changed mine. There are people throughout this room who could tell their story of real hope, who could say, \"I was once dead in my sin, and I looked to Jesus, and it changed everything. The Spirit of God filled my sails, and my life looks categorically different now.\" Rather than living for myself, I live to point a hurting world to hope in Jesus. That is what we were made for. That is what you were made for.\n\nSo if you've been following Jesus for years, I encourage you to come back to this every single day. Real life begins with new birth. Real life is found in Jesus alone. If you've never followed Jesus, this is probably one of the most important passages in Scripture for you. Jesus offers an invitation to believe. I want you to let it sink into your mind—that picture of the sailboat that simply needs to catch the wind. That's the invitation to you: to turn to Jesus is simply to say, \"Jesus, I believe in you. I believe that you created me for purpose, and I want to find life in you.\" Look to Jesus.\n\nThis morning, we're going to respond to God's Word in three ways. We're going to sing together three songs of response. Why do we sing? Because we believe that Jesus is the source of our life and He's worthy of our praise. On the sides of the room, you'll see two tables. During these three songs, at any point, if you are a follower of Jesus, this table is for you. It is a way that we remember the message of Jesus—what He gave His disciples, His followers, as an example. The body of Christ was broken for you, and the blood of Jesus was shed for you. We take this bread and drink this cup to remember that message. So if you're a follower of Jesus, I invite you at some point during these three songs to go to the table, take that bread, dip it in the cup, and eat and remember the good news of Jesus for you.\n\nThe third way we respond is this: this is a place of prayer. There will be some people around the room with green lanyards. If you have questions or if you just want to say, \"Hey, can you pray for me?\" those people would love to pray for you. I invite you to stand with me as we pray and continue our time in worship.\n\nJesus, we thank you for your word. We thank you for the life that is found in Christ alone. Thank you for this story of Nicodemus and this interaction. God, I pray that your Spirit would rain in this place as we continue in worship. For any in this room who don't know you, Lord, I pray that they would see your love for them, that they might turn to you and say, \"Jesus, I need your life. I know that I fall short of the life you designed, but you died to offer forgiveness of sin and new life.\" We look to you this morning even as we worship. God, would you be praised? Would you be present here? Meet with us as we turn our eyes to you. We pray in Jesus's name. Amen.","url":"https://www.youtube.com/watch?v=9Z45Gwgjwcc"},{"id":"NtVfx1ie0lQ","date":"2025-10-07","title":"The Source of Real Life","scripture":"John 1:1-14","preacher":"Peter Frey","series":"John","desc":"Originally preached on September 28, 2025 by Peter Frey Location: Eastpoint Church (Oak Grove Elementary, Durham NC)","transcript":"# Sermon Transcript\n\nGood morning, church. Would you join me in reading aloud this prayer for illumination? The words will be on the screen. \"Guide us, O God, by your word and spirit, that in your light we may see light. In your truth find wisdom, and in your will discover your peace through Jesus Christ our Lord. Amen.\"\n\nPlease remain standing with me as you are able for the reading of God's word from John chapter 1, verses 1-14.\n\n\"In the beginning was the word, and the word was with God, and the word was God. He was in the beginning with God. All things were made through him, and without him was not anything made that was made. In him was life, and the life was the light of man. The light shines in the darkness, and the darkness has not overcome it. There was a man sent from God whose name was John. He came as a witness to bear witness about the light, that all might believe through him. He was not the light, but came to bear witness about the light. The true light which gives light to everyone was coming into the world. He was in the world, and the world was made through him, yet the world did not know him. He came to his own, and his own people did not receive him. But to all who did receive him, who believed in his name, he gave the right to become children of God, who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God. And the word became flesh and dwelt among us. And we have seen his glory, glory as of the only son from the Father, full of grace and truth.\"\n\nThis is the word of the Lord.\n\nGood morning again. It is such a joy on this day to open God's word with you as we mark this season of East Point Church. We're calling this our pre-launch season, and these are our preview services—an opportunity for friends and neighbors to come in, get to know who we are as a church, and look forward to publicly launching to the community in January. You're joining us at the ground floor of a group of imperfect people who believe that hope in Jesus changes everything, and that East Durham needs more churches that point people to Jesus. That's the short story of East Point Church.\n\nOne of our core values here at East Point, which you'll hear us say often, is that we tell stories of real hope. That word \"real\" is intentional. We live in a world where it's sometimes hard to discern what's real and what's not. There's fake news and real news. There's artificial intelligence and ChatGPT. My wife Mary has taken quite a deep dive into ChatGPT. Let me share something with you—and please don't judge me—we have a hairless cat named Harry, whom we rescued. I've never been a cat person, but Mary convinced me she always wanted a hairless cat. Mary has always thought Harry is very regal, very proper. So she decided to ask ChatGPT to help her make pictures of Harry. She typed in, \"Create a picture of Harry that is very regal.\" And this is what came out. Then she said, \"That's not regal enough. Please make him more royal.\" And this is what came out—clearly not real.\n\nBut back to the point: we live in a world where it's sometimes hard to tell what's real and what's not. When we say here at East Point that we tell stories of real hope, we're not just talking about real hope versus false hope, though that is true. We're talking about hope that is connected to the realities of everyday life. We're talking about hope that reaches into the messiness and brokenness of our world and actually makes a difference.\n\nMany of you probably remember sitting in a philosophy class and thinking to yourself—or maybe muttering it out loud—\"What does this have to do with real life?\" Some of you have probably sat through a sermon and asked that same question. This morning we're starting a series in the Gospel of John that I've called \"Real Life Jesus.\" It's a play on words on two levels. On one hand, the book of John is a historical account pointing us to the reality that Jesus was a real person who lived, died, and rose from the dead. On the other hand, I believe the Gospel of John is uniquely written so that we would see that belief in Jesus is not some pie-in-the-sky ideology disconnected from real life. Rather, it speaks into the messy and broken realities of our world, of our everyday lives, and redefines for us what real life truly looks like. That's what I mean by \"Real Life Jesus.\"\n\nWe'll see this theme woven throughout the chapters of John's gospel as we walk through it over the next nine weeks. Toward the end of the book, John pulls back the curtain and tells us the purpose of the whole book. He says that Jesus performed far more God-revealing signs than are written down in this book. \"These are written down so that you will believe that Jesus is the Messiah, the son of God, and in the act of believing have real and eternal life in the way he personally revealed it.\" The Gospel of John is written so that we might understand and experience what real and true life really is. Over the next few weeks, we're going to explore: Who is this Jesus, and how does his life redefine for us what real life truly is?\n\nLet's jump into John chapter 1 and read verses 1 through 4. \"In the beginning was the word, and the word was with God, and the word was God. He was in the beginning with God. All things were made through him, and without him was not anything made that was made. In him was life, and that life was the light of men.\"\n\nSome of you, when we read this opening to the book of John, might think, \"Am I back in philosophy class? What is all this wordy language about?\" I think what John is doing—and John loves images throughout his gospel—he uses images to connect ideas that sometimes feel hard to grasp. I have a three-year-old now who asks me, \"Who is God? Why can't I see him?\" These are ideas that are hard to explain. This is how John starts his gospel. He says, \"I'm going to tell you the story of Jesus. Where do I begin? Let's start with the beginning. Let's start with where did everything come from?\"\n\nIn these opening words, John is pointing us to the reality that everything starts with God. He uses words that echo Genesis: \"In the beginning.\" It connects us to the moment when God speaks life out of nothing, when God says, \"Let there be light,\" and out of nothing, light comes into existence. What John is doing in this opening to the Gospel of John is showing us that real life—real life as it was made to be—always begins with Jesus. Jesus was there in the beginning. He is fully God, and he spoke the world into existence. This is what we have in John's gospel: the reality that real life begins with Jesus.\n\nWe have those words in verse 4: \"In him was life, and that life was the light of all mankind.\" As we peel back the curtain of John's gospel and see where he begins the story of Jesus, understand this: before anything existed, before light came into darkness, before man was formed, before life was breathed into existence, Jesus was. So if you're going to ask the question, \"Where do I find real life?\"—you have to start with Jesus. That is the story of the gospel of John: real life begins with Jesus.\n\nIf we jump ahead to the end of the passage we read, we see that John tells us the word became flesh. He uses this picture of God's self-revelation. God speaks the word—this is Jesus—and he became flesh. In the ancient world, when John's readers received this letter about Jesus and read \"the word became flesh,\" it was a messy concept. In that day, body, soul, and spirit were very distinct categories. Flesh was a somewhat messy concept. So what is John telling us that Jesus did? Jesus stepped into our messiness. He stepped into the brokenness of our world.\n\nI think deep within each of us—deep within every person—is a longing for where we find real life. I'm not just talking about everyday life, and I'm not just talking about what it means for my lungs to breathe in air and my heart to beat. I'm talking about what it means to truly be alive, to actually live. What am I made for? The message of the Gospel of John and the message of God for each of us this morning is that real life begins with Jesus. Jesus steps into the disorienting messiness of our world, and he takes on flesh to show us—get this—he stepped into our real-life messiness so that we might experience real life anew.\n\nThe world is broken. Just look at the news. Look at our community. There is a deep ache within all of us that this is not the way it was meant to be. Jesus stepped into our brokenness. He stepped into our world. He took on flesh and dwelt among us, and we have seen his glory, full of grace and truth. Jesus took on flesh, stepped into our real-life messiness, so that we might experience real life anew.\n\nNow look at verses 11 through 13: \"He came to his own, and his own people did not receive him. But to all who did receive him, who believed in his name, he gave the right to become children of God, who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God.\"\n\nI think this is what Jesus wants us to hear this morning. Deep within each of us is a longing for real life—a desire to experience life as we were made for. And we have to see that real life in Jesus begins with a relational identity rather than a religious activity. Look at this in these verses: real life begins with a relational identity rather than a religious activity.\n\nJohn tells us that the world did not receive Jesus. They didn't recognize that he is the source of real life. But there's this amazing \"but\" in verse 12: \"But to all who did receive him, he gave the right to become children of God.\" So I want us to see this morning that real life in Jesus begins with a relational identity. What does that mean? Real life is found in a person. So many of us have the propensity to try to find life in things we do, in performance, in other people and friendships. But there is only one person who can bring real life, and that is Jesus. Real life begins with a relational identity.\n\nHow does a child get his identity? How does a child get her identity as a daughter? Not through anything she does. It is born out of a relationship. And that is what Jesus invites us into. Jesus invites us to know him personally. He's not some abstract idea. He's not some proposition that we gather to learn things about on Sundays. Jesus is a person who wants to know you intimately, who wants to walk with you in the messiness. He is the word who took on flesh. He took on the messiness of real life so that we could experience real life anew.\n\nIt begins with a relationship with a person, and it flows out of a place of relational identity, not religious activity. Many of us try to produce in our own strength, but deep within us we have this longing. There is a widespread spiritual awakening within our culture. People are longing, turning to all kinds of things to find meaning and find real life. And that longing within each of us is a longing to be in relationship with Jesus. But in that search, many of us...\n\n# Sermon Transcript\n\nWe may have a background in the church or hold certain religious concepts, but many of us operate from the assumption that if we do more things for God, we'll experience the life we want from him. John paints a completely different picture of where life actually comes from. It is born out of a relational identity, not religious activity.\n\nI'll be honest with you—I have a battery problem with my car. Every Sunday morning, I'm rushing to get out the door, go to start my car, and the battery is dead. This has been happening for weeks. I know some of you would judge me and say I should just fix the problem, but here's the thing: I have one of these battery-powered jump packs. All I do is hook it up to the battery, turn it on, and it jump starts my car so I can get here. I've been doing this for weeks.\n\nMany of us do the same thing with our spiritual lives. Deep down within us, we have this longing for life. Maybe if I read my Bible more, I'll get a jump start. Maybe if I pray more, or if I'm part of this church plant, East Point Church, that will help me feel more of what God designed me for. These are all good things. This tool is amazing. But the point that John is making for us in John 1 is that religious activity does not bring real life. Religious activity is a part of a life with Jesus, but real life comes from a relationship with him.\n\nWhat I really need is to fix the battery problem in my car. What all of us need is to come back to Jesus anew and say, \"Jesus, I can't earn your favor. I can't produce the life that you've made me for. But I believe that to everyone who receives you, who believes in your name, you give the right to be a child of God.\" So I'm going to start my day from a place of identity: I am a child of God.\n\nIf you're here this morning longing for that kind of life—a life that doesn't come from the things you do or the ways you perform or the security you can procure in this world—this is the gospel of Jesus. He became flesh and dwelt among us. He lived a perfect life that we could not live. All of us fall short of the life that God designed for us. Jesus said, \"The wages of that is death, and I'm going to take that upon myself. You don't have to jumpstart your life. I'm going to give my life for you.\"\n\nJesus died. He was buried. And he said, \"I'm not going to let death have the final word. I'm going to raise from the dead so that everyone who receives me, who believes in my name, will have the right to become a child of God and will experience life as it was meant to be.\" This is real life in Jesus. And this is what we are made for.\n\nThere's a section in John 1 that mentions a man named John who came to bear witness to the light. He wasn't the light himself; he just came to point people to the light. A little over a year ago, I was sitting in my front stairwell praying, asking God what church he was calling us to plant. As I was sitting there praying, there's a window that faces out the front of our house. That morning, for the first time, it sank in as I saw the sunrise in that window. I realized our house faces east. I said, \"What if we planted a church called East Point Church that would point people to the light that has dawned in the darkness, so that people might experience real life in Jesus?\" And here we are.\n\nWe aren't the light. We're just here to point people to the light, to point people to the reality that there is life beyond what we can see in the broken messiness of this world. Jesus stepped into that messiness. He took on flesh so that we could experience life anew. This is who we are. Whether you've been following Jesus for years or you want to say this morning, \"I want to follow Jesus,\" this is the invitation of the gospel.\n\nWeek after week, we will come back to this truth: real life is found in Jesus and nothing else. Each week we will respond to God's word in three ways. First, we will sing together. During the singing, we'll have three songs, and it's an opportunity to respond to Jesus. If Jesus is stirring in your heart this morning, this is a space for you. This gymnasium is a special place because God's spirit is here with his people. There will be a couple prayer partners on the edge of the room wearing green lanyards as we sing. If you want somebody to pray for you this morning, you don't have to have a crisis—if you just want to pray with somebody, they're there for you.\n\nWe respond with singing. We respond with prayer. And the third way we respond is with the Lord's Supper. On the night Jesus was betrayed, he was sitting with his disciples. He took the bread, broke it, and said, \"This is my body which is broken for you.\" He's pointing us to the price he had to pay for us to have real life. He took the cup and said, \"This is my blood that was shed for you, poured out for the forgiveness of sins.\" Paul tells us, \"As often as you eat this bread and drink this cup, you proclaim the Lord's death until he comes.\"\n\nSo as East Point Church, we weekly come back to the gospel, the good news of Jesus, to remember that this is where we find real life. This is a table for those who are followers of Jesus. If that's not you this morning, I invite you not to partake of it. But if you are a follower of Jesus, or if you want to decide this morning that this is what you were made for, the invitation of Jesus is for you, and this table is for you. During the three songs, you can come at any time. It's an opportunity for you to come whenever you're ready to this table, take a piece of bread, and remember that this is the body of Christ broken for you. Dip it in the cup and remember this is the blood of Jesus shed for you.\n\nAs we respond as a church, let's proclaim the good news together to one another, with one another, and to Jesus: that real life is found in Jesus and no one else. Let's stand and worship together.","url":"https://www.youtube.com/watch?v=NtVfx1ie0lQ"},{"id":"u3hsQ5bJ8QU","date":"2025-08-07","title":"How Long, O Lord?","scripture":"Psalm 13","preacher":"Peter Frey","series":"Psalms","desc":"A message on Psalm 13 exploring what it means to lament. Originally preached at Waypoint Church.","transcript":"# Psalm 13: The Discipline of Lament\n\nIt was March 1st, 2017. That year, it happened to be Ash Wednesday, the beginning of the season of Lent. I stood next to a coffin, staring at a gaping hole in the ground at a cemetery in Hopkinton, Massachusetts. Tears rolled down my cheeks. I was leading the funeral for someone who had become very dear to Mary and me. Rose was just 58 years old. She and her husband had come to the church I was pastoring only a year earlier. They had very little church background, but they were searching for hope. Rose had an advanced form of stomach cancer. In that short year, we saw Rose engage with the truth of the gospel of Jesus and turn to him for hope. It was beautiful.\n\nBut it wasn't long before I got a call one Thursday evening from her husband. He said, \"Peter, can you come over to the house? I think Rose is coming toward the end.\" I remember driving over to their house that evening, getting to their home, and going to their bedroom. I knelt next to the bed where Rose was lying. As I held her hand and prayed for her, it brought back memories from five years earlier when I had done the same thing with my dad and said goodbye to him.\n\nI remember leaving their house that evening and getting in the car and feeling numb. I remember driving those winding New England roads and thinking about my own wife Mary at home, hooked up to IV antibiotics and a feeding tube as her cystic fibrosis was declining and her body was struggling in ways it never had before. As I made my way home, I remember praying the words of Psalm 13. How long, oh Lord? How long? How long do we have to deal with broken bodies, cancer, and disease? How long, oh Lord?\n\nOne of the most helpful things for me in seasons of suffering and sorrow have been the psalms of lament. A third of the psalms in our Bible are psalms of lament. That means 50 out of 150 songs are songs that start with a minor chord—that start with sorrow. I learned in my childhood piano lessons that a simple change of one note can turn a major chord into a minor chord. Some of you know full well that with one note, one phone call, one conversation, life can turn from the major chord of praise to the minor chord of lament. It happens just like that. You get a phone call, you have a conversation, life takes a turn, and all the sudden the major chord of praise turns to \"How long, oh Lord, how long will you forget me? Will you hide your face from me forever?\"\n\nChurch, I want you to hear me: We as the church are a people of hope. In a few weeks, we're going to pull out the stops and throw a party because we believe that the resurrection of Jesus changes everything. But I want to suggest this—hope without lament is simply spiritualized optimism. Lament is being honest and mourning the pain, brokenness, evil, and injustice that we see in the world around us.\n\nDid you notice the inscription above this psalm? It says \"A psalm of David to the choir director.\" This is meant to be worship. I want to suggest that we are a people who worship because of hope, and part of our worship is lament—being honest that the world is not the way it was meant to be. Listen to these words from Psalm 13, verse 1: \"How long, oh Lord? How long will you forget me? How long will you hide your face from me? How long must I wrestle with my thoughts day after day and have sorrow in my heart? How long will my enemy triumph over me?\"\n\nHere's what lament does: It refuses to dismiss the struggle that we feel, the questions that emerge when I read about God's goodness and power, yet I see and feel the world's brokenness and pain. At times those feel in conflict. Lament is grieving that this is not the way it was meant to be. I believe that we as Western evangelicals need to recover the discipline of praying with lament.\n\nHere's what that looks like. It begins with being honest with God about how you feel. God knows what I feel before I tell him. There's a documentary interview between Eugene Peterson and Bono on the Psalms that I encourage you to watch. In it, Eugene Peterson says we need to discover a way to cuss without cussing. The lament psalms teach us to do that. Tell God what you feel and don't be polite about it. Some of us who grew up in the church have been cultured to talk to God in a certain way. We'll say to our friends, \"Life really sucks right now.\" But we come to God and say, \"Heavenly Father, you are sovereign and good and work all things together for my good.\" He knows how you feel before you even say it. So would you tell him? Would you tell him that sometimes life feels like you're wrestling with your thoughts day after day with sorrow in your heart?\n\nI know there are lots of different personalities in this room. Some of you are more naturally inclined to express emotion, and some of you are not. For some of you, letting your emotions out and having a good cry with Psalm 13 is going to be natural. For others, it might feel more unnatural to tell God, \"I feel like you're hiding right now.\" But I want to encourage you that regardless of what emotions or tears might come out, you need to be honest with God that this world is not the way it was meant to be. There are ripples of brokenness all around us. Psalm 13 is an invitation to view honesty with God as a part of your worship of him.\n\nFor us to truly celebrate the resurrection hope of Easter Sunday, we have to lament that death was necessary—that the world is broken and that there is a reason we long for something better. The more that we lament the brokenness of the world, the more that we will long for the resurrection. The more that we are honest with God about what we feel, the more ready we are to receive the good news of the gospel. So begin with being honest with God. For some of you, that will look like journaling. For others, it will look like taking a walk outside and just telling God what you feel. For some of you, it's when you're driving and you need to let something out. Tell God what you feel and don't be polite about it.\n\nNow notice how the psalm moves in verse 3: \"Look on me and answer, Lord my God. Give light to my eyes or I will sleep in death. My enemy will say, 'I have overcome him. My foes will rejoice when I fall.'\" Lament begins with being honest about what you feel, and then lament pleads with God for what you want to feel. The psalmist makes his request: \"Set your eyes on me. I want to feel seen. I want you to acknowledge that this brokenness I'm walking through is not outside of your power and control, your goodness and your grace, your love and your mercy.\"\n\nRight now the psalmist cries, \"How long, oh Lord, will you...?\" That cry is saying, \"God, I feel like my circumstances are in contradiction to what I believe about you.\" If you have circumstances in your life that maybe you're even pushing aside, thinking you're not allowed to bring them into this space—Psalm 13 is an invitation that God is inviting you to hold that tension. Tell him what you feel and then plead with him for what you want to feel. We want to feel seen. We want our eyes to see more than despair. Hope with lament is a deep spiritual life. Hope with lament will give depth to your waiting on God even when you can't see it.\n\nThe invitation is this: be honest about how you feel, then plead for what you want to feel. In the final movement of this psalm, verse 5 says, \"But I trust your unfailing love. My heart rejoices in your salvation. I will sing the Lord's praise for he has been good to me.\" Some commentators say something must have happened between verses 4 and 5. I don't think so. I think the psalmist is holding on to hope regardless of what he feels. That's the third movement of lament: be honest about what you feel, plead for what you want to feel, and then hold on to hope regardless of what you feel.\n\nFaith says, \"I believe this about God. I believe that he's all powerful. I believe that he's sovereign. I believe that he's merciful and he's good.\" Trust says, \"I will hold on to hope even when my faith is blinded by my circumstances.\" He says, \"I will trust in your unfailing love.\" God's love for you is steadfast. It is sure. When Moses asked the Lord to reveal his glory, he saw the Lord pass before him in a cloud and heard this: \"The Lord, the Lord, gracious and compassionate, slow to anger and abounding in steadfast love.\" This is who our God is.\n\nWhen we're honest with the brokenness, when we're honest about what we feel and we plead for what we want to feel—to feel seen, to see more than despair—then we can hold on to this reality: Even though I can't see it, God, I'm going to put my hope in who I know that you are, even if my circumstances seem to blind me from that. And so we sit in this place of waiting upon God. Tish Harrison Warren says, \"God isn't a sadist who delights in using agony to teach us a lesson. But in the alchemy of redemption, God can take what is only sorrow and transform it into the very path by which we learn to love God and let ourselves be loved. This is the strange and usually unwanted way of the abundant life—the dying necessary to bring resurrection.\"\n\nVerse 6 says, \"I will sing the Lord's praise for he has been good to me.\" How does that sit in the same stanza as \"How long, oh Lord? How long will you hide your face from me?\" I think it's because the psalms of lament are a movement from disorientation to reorientation. It's what we see happen in Psalm 73. The psalmist says, \"Surely God is good to Israel. That faith—I believe this about God. God is good.\" But in verse 2, he says, \"As for me, I've nearly stumbled when I look at the prosperity of the wicked.\" There's a journey in Psalm 73 from disorientation—God, this is confusing to me. When I look at the world around me and I sing this on Sunday morning, it's disorienting. Throughout Psalm 73 there's a movement of redefining God's goodness. It starts with struggling because the wicked seem to prosper. But how does it end? \"My flesh and my heart may fail, but God is the strength of my heart and my portion forever.\" The last verse says, \"But for me it is good to be near God.\"\n\nHere in Psalm 13, we hear these words: \"I will sing the Lord's praise for he has been good to me,\" even in the place of feeling like God is absent. The psalmist comes back to holding on to hope, believing what he knows is true of God even when he can't feel or see it. In that place there is trust—where the rubber of hope meets the road of suffering. It's this place of trust, of waiting on God. As the psalmist waits on God, he says, \"You know what? God has been good to me.\" Because goodness is redefined. It's not defined by prosperity, but by the proximity of God. This is the message of the Psalms over and over again: God does not give us all the answers, but he gives us himself. Psalm 131 says, \"I do not lift my eyes to things too high or too exalted, but like a weaned child with his mother, I come to God.\" When a toddler experiences something in everyday life that upsets them, you could logically explain it to them, but that is not what they need.\n\n# Sermon Transcript\n\nGoing to help. What do you do? You hold them. You hold them in your arms and let them know they are okay. And I want to suggest that Psalm 131 holds out exactly this to us. God is not ignoring the fact that there are things too high, too marvelous, too outside of what we can understand. Why hasn't Jesus made all things new yet? I do not know. But I do know this: he said that he will be with us always to the very end of the age, and that he is in the process of working all things together for good for those who love him and are called according to his purpose.\n\nHe is unfolding his plan of redemption in and through this categorically new thing of Jew and Gentile, you and me coming together under this thing called the church. He is bringing about his kingdom here and now. I do know that, and I believe it. I believe that he is good, even when I don't always see it. But in that, we have to be honest. God, this world is broken. Your kingdom come. Your will be done on earth as it is in heaven. Come redeem what is broken. It is here, as we hold on to hope, regardless of what we feel. We say, \"God, I believe this is true, and I'm going to hold on to hope even when I do not see it.\"\n\nAnd he says in verse five, \"I trust in your unfailing love. My heart rejoices in your salvation.\" I don't think he has a clue what that looks like at this moment. Some of you this morning have circumstances in your life—broken relationships, grief and loss—where you are like, I don't know what salvation looks like in that. I don't know what deliverance or hope looks like. But I can rejoice in the reality that nothing I'm walking through today is outside of what the resurrection can reach. We are people of resurrection hope. But Lord, make us a people of lamenting hope.\n\nAs I stood at the graveside of Rose's funeral that Ash Wednesday, the gravity of the season of Lent settled on me in a way that it had never settled on me before. I realized that the season of Lent is a season of lament. It's a journey to the resurrection. These days leading up to Easter require us to be honest with the brokenness within ourselves, our society, and our world. It begins on Ash Wednesday with those sobering words: \"From dust you came and to dust you shall return.\" A reminder of our mortality. We are invited in the season of Lent to mourn what is—to mourn our sin, to mourn our sickness, to mourn that this world is broken, that evil seems to win, that injustice is everywhere, and God at times seems nowhere to be seen.\n\nIt is through lament that we hold on to hope. It is through lament that we can stand at a graveside and say resurrection is coming. Death does not have the final word. And we can sing with an old hymn writer, \"When darkness veils his lovely face, I rest on his unchanging grace. In every high and stormy gale, my anchor holds within the veil.\" Church, some of you this morning have things in your life that you need to lament and say, \"This isn't the way it was meant to be.\"\n\nIt took me years. Mary and I have been married for fourteen years, and it took me many years of our marriage to actually lament the fact that we wouldn't have biological children. I think I initially was like, \"I trust the Lord. It's his plan. He's good.\" Don't get me wrong—foster care and adoption has been the most beautiful thing in our lives. But there came a moment where I had to mourn that and say, \"God, bodies don't work like they're meant to, and that's not the way it was meant to be.\" I wonder if some of you have something in your life that you've been pushing aside under theological jargon, saying, \"I'm supposed to be okay with this.\" And I think the invitation of Psalm 13 is this: it's not okay. That's why the resurrection matters. That's why we hold on to hope. I will trust your unfailing love because at times it feels like a long wait, oh Lord.\n\nSo my invitation for you this morning is this: we're in a moment. We're going to sing a song of lament. We'll start sitting down. We're going to have prayer partners around the room wearing yellow lanyards. Some of you, I encourage you if you're hurting this morning to be prayed for—don't walk through this alone. I want to encourage you to take the next couple minutes and make space for lament. Be honest about what you feel. Plead with God for what you want to feel. And hold on to hope regardless of what you feel.\n\nI also want to add this: there are two psalms in the psalter—Psalm 39 and Psalm 88—that are laments and don't end in hope. In fact, Psalm 88 ends, \"Darkness is my only friend.\" If that's you this morning, I want you to hear that psalm as an invitation to hold that before God. He sees you. I truly believe he loves you. And I truly believe that he is making all things new and that he's good, even when you can't see it.","url":"https://www.youtube.com/watch?v=u3hsQ5bJ8QU"},{"id":"247spsTHZuE","date":"2025-08-07","title":"Life in the Waiting Room","scripture":"Psalm 130","preacher":"Peter Frey","series":"Psalms","desc":"","transcript":"# Cleaned Sermon Transcript\n\nThe year was 2018. We were living in Boston, and Mary was being treated as a cystic fibrosis patient at Boston Children's Hospital. Cystic fibrosis has historically been a children's disease, but modern medicine has rapidly changed that, and they now see adults at the children's hospital. We were there for an operation that Mary needed to go through, so I knew the drill well. We went to preop, they started asking all the questions, we signed all the papers, and then the time came to prepare to take her back to the operating room. As Mary prefers, they start the sleeping medication before they wheel her back—a moment she actually looks forward to. They put little footprints on the floor and say, \"It's time for Mary to go to the OR. You follow the blue footprint all the way to the waiting room.\" So that's what I did. They wheeled Mary down the hall, I said, \"Bye, honey,\" and she was already carefree from the medication. Then I headed to the waiting room.\n\nBoston Children's had done a beautiful job making it as comfortable as possible. There were nice windows with sunlight overlooking this historic Boston street, comfortable chairs, and coffee to drink. But nobody was comfortable. I remember walking in and taking in the room. I saw a couple sitting across from me with an empty stroller next to them, holding those magazines—you know the ones everybody flips through in waiting rooms but nobody actually reads. They were just flipping through, and I could tell they weren't looking at anything. I saw a single mom scrolling on her phone, nothing staying with her—just scroll, scroll, scroll. I saw another couple with a young child, and the child was restless as you'd expect, and the parents were feeling irritated as they would be. Nobody was comfortable.\n\nI remember sitting there feeling this uncomfortableness in my own soul and thinking: What is it about waiting that is so hard? It dawned on me that day. Everyone sitting in this room feels powerless right now. We feel powerless because something between where we were and where we want to be is out of our control. That's hard. Powerlessness is hard.\n\nOne of the things I think we learn from reading the book of Psalms is that waiting is not something we're meant to run from or resist. It's something we're meant to develop as a discipline for our soul. What if waiting is not something we're supposed to passively just get through? What if seasons of waiting are something deeply transformative for our lives?\n\nI'm not just talking about waiting in a waiting room. I'm talking about seasons where we're between where we were and where we want to be. Maybe for you it's the next job promotion or the next season of life. Maybe you're waiting for the kids to get out of the house. Maybe you're waiting to have kids. Maybe you're waiting for some circumstance or relationship to be resolved in your life, and you're in that in-between space—where you were and where you want to be—and you feel powerless. What are we supposed to do in those seasons? Where do we go in the tension between where we were and where we want to be?\n\nPsalm 130 is a psalm about waiting. It comes in a series of psalms called the Psalms of Ascent. Eugene Peterson calls these the dog-eared psalms of the Bible because they were a series of psalms that the people of Israel would return to again and again on their annual trip to Jerusalem to worship at the temple. So in Psalm 130, we find a road trip playlist—a song meant to help you get between where you are and where you want to be. I think the Lord has a message for each of us in whatever season we're in, wherever this applies to you, being in between. I think the Lord has a word for us.\n\nPsalm 130 begins in verse one: \"Out of the depths I cry to you, Lord. Lord, hear my voice. Let your ears be attentive to my cry for mercy.\" Out of the depths I cry to you. Throughout the Psalms, the depths are a picture of a place of powerlessness. Have you ever been out on the water when a storm comes upon you? I grew up around the Chesapeake Bay in Maryland and am well acquainted with this. When you're out on the water, everything's peaceful and calm, and then a storm comes, and all of a sudden you feel really, really powerless. Throughout the scriptures, the depths of the sea are a picture of that place of powerlessness. So the psalmist uses this image to describe his season of life: I am in over my head. Have you ever been there? This is what waiting often feels like. I don't like waiting. I don't like waiting in waiting rooms. I don't like waiting for my Netflix to buffer. It's hard. Waiting is hard.\n\nSo what does the psalmist tell us to do in seasons of waiting? I think Psalm 130 gives us a guide—a simple guide—for how to develop the discipline of waiting in seasons of being between where we were and where we want to be. The first thing he tells us is to find our footing in the forgiveness of God. Look at verse three: \"If you, Lord, kept a record of sins, Lord, who could stand? But with you there is forgiveness, so that we can with reverence serve you.\"\n\nIt's interesting that the psalmist goes from \"out of the depths I cry to you, Lord, hear my voice\" to what seems like an irrelevant tangent about forgiveness. But I think the psalmist's word for us this morning is that in seasons of waiting when you feel like you're in over your head, you've got a place to stand. Find your footing in the forgiveness of God.\n\nMary and I, for many years of our marriage, had a standard poodle named Oliver. He was a puppy till the day he died. Standard poodles are full of energy. We were living on the north shore of Boston and needed to find a way to get some of that energy out. We discovered Singing Beach in Manchester by the Sea. If you ever get a chance to go there, the sand is quite cool—you walk in it and it squeaks, and it kind of sounds like it's singing, hence the name. In the off season, we would take Oliver to Singing Beach where dogs could run off leash. He loved the water. He loved going into the ocean waves while we threw a ball, and he'd swim out to get it. One thing we discovered is that he learned to swim by gradually working up his confidence in going into the water. He had a gradual decline into the water, so he could venture as far as he wanted as he learned to find his footing.\n\nYears later, we took Oliver to a friend's house that had a swimming pool. Oliver saw the water and his first instinct was to go swimming. He ran and jumped into the pool, and all of a sudden Oliver was in pain. He was just flailing about in the water, doing a literal doggy paddle, trying to find his bearings. Mary and I were standing on the edge of the pool, concerned as dog parents would be. But the reality was he was in the shallow end. We were just watching him flailing and panicking, and then all of a sudden his foot hit the bottom of the pool, then his other foot hit the bottom, and he went from flailing to realizing he had a place to sit.\n\nI think that many times in my own life, when that wave rushes over me—when I get the call from the doctor or I'm just in the daily grind of toddler life—we panic. We flap. I wonder how often God is standing there at the edge of our lives, saying: You've got a place to stand. We have a place to stand in the forgiveness of God. This is why I think the psalmist goes there—because how often, when we are in the in-between of where we were and where we want to be, we try to find our identity in where we want to be. You know this process. Your heart does it. You think: \"If only I can get to the summer. If only I can get to the weekend. Once I get out of this busy season, maybe then I will.\" We start to find our identity in what we want to be rather than who we are in Christ.\n\nThis is the message of the gospel all the way back in Psalm 130: find your footing in the gospel. Before you are in a circumstance, before you perform or act, God says you are loved. You are called to purpose, and you have a place to stand. So in those seasons of waiting between where you were and where you want to be, resist the temptation to find your identity in a circumstance and come back to the gospel of Jesus and his love. You've got a place to stand. Notice what the psalmist says: \"With you there is forgiveness, so that with reverence we may serve you.\" There is a place to stand and a place to find purpose even in this season of waiting.\n\nI remember when we made the move in 2019. I stepped out of ministry. I'd been pastoring for many years at that point, and it was a disorienting season for me because all of a sudden my identity as a pastor was no longer my vocation. We made the move for Mary's health, and I struggled because I realized I had found a lot of my identity in a circumstance in my life rather than in who God says I am. There was this process for me where the Lord said: \"Peter, you've got a place to stand. Your identity isn't wrapped up in what you do for me. You are loved. You are defined as a child of God before you do anything. So you have a place to stand.\"\n\nThe first thing you do is find your footing in the forgiveness of God. The second thing the psalmist tells us is to hold on to the promises of God. Look at verse five: \"I wait for the Lord. My whole being waits, and in his word I put my hope. I wait for the Lord more than watchmen wait for the morning.\"\n\nHere's what Psalm 130 says. He almost wants you to sit in the waiting for a moment. He says it again: \"More than watchmen wait for the morning.\" Mary and I, when we were living in Boston, got some Wi-Fi cameras around the house so she could check them on her phone and I could check them on mine. What I didn't realize when I got these Wi-Fi security cameras is that they also had a two-way speaker on them. One day I was doing what I do as a man—I walked to the kitchen, opened the fridge door, and took inventory of what food there was. I realized I was hungry but didn't know what I wanted to eat. About thirty seconds into this inventory, I heard a voice above me: \"What you're looking for?\" I was really glad I made the investment in Wi-Fi security cameras.\n\nIn the ancient world, they didn't have Wi-Fi security cameras or high-tech security, automatic locking doors, or fingerprint scanners. What they had as the front lines of defense was walls around the city with watchmen positioned on them. Their job was to stand on the city walls during the most vulnerable hours—the night—look out into the horizon, and wait for the morning. The picture of watchmen waiting for the morning was a very active job. It was tiring and uncertain, mundane and uncertain. In many ways, it probably often felt like what you and I feel in those seasons of waiting—an angsty thing, like: would morning just come? But the picture the psalmist gives us of putting our hope in God's word is the picture of watchmen waiting on the wall. It is a picture of active waiting.\n\nNow, we all know what passive waiting looks like. You stand in line at the grocery store. What do you do? You pull out your phone and start scrolling. At this point, it's habitual. But active waiting is a different kind of waiting. It is a kind of waiting that...\n\n# Sermon Transcript\n\nA longing that yearns from a place of contentment—this is what the psalmist expresses when he says, \"In your word, I put my hope.\" There is a picture of holding on to the promises of God in seasons of waiting. But unless you are actively pursuing it, you're not going to hold on to it.\n\nI remember when Mary and I were in Boston after I attended seminary there. When I was graduating, I received a scholarship to the University of Edinburgh to pursue a master of theology in preaching. At first, Mary and I weren't sure we could manage it with her health needs. We talked to her medical team in Boston, and they connected us with a cystic fibrosis team in Edinburgh who said they would transfer her records and that it could work well. Mary and I prayed through it and felt the Lord was calling us to go. It seemed like a great opportunity for me to grow as I stepped into ministry and to experience the church in Scotland. We raised extra support from friends and family and crossed the Atlantic.\n\nAbout a month in, I realized this wasn't as straightforward as I thought. Mary's health began to struggle, and she was admitted to the hospital in Edinburgh. We were navigating a new healthcare system, new medications, different access to care. We questioned God: What are you doing? Then in January, it became clear we needed to call her team in Boston. When we Skyped with her doctor, he said the words we didn't want to hear: \"I think you need to come home.\" We had planned to be there for a year. We were only four months in. It felt like a wave crashing over us, leaving us disoriented. God, what are you doing? I thought this was the plan.\n\nWe booked a plane flight for two days later, left everything in our apartment, and got on that plane. Mary was admitted to the hospital in Boston for about a month. As her lungs began to rebound and we tried to figure out our next steps, we ultimately decided that Mary needed to stay in the States while I would fly back to Scotland, defend my thesis, and accomplish everything I could in the shortest amount of time before returning home. Mary's family was there to help care for her.\n\nI'll never forget arriving back in Edinburgh to our little apartment. Walking in and seeing everything just as we had left it—a bit of a mess, with important things in bags. On our cheap IKEA couch was everything Mary had left that morning: her vest treatment, the machine that would shake her lungs to help clear them, her nebulizer. And there was her Bible, open to where she had been reading that morning. I picked up her Bible and read Psalm 57: \"I cry out to God most high, to God who fulfills his purpose.\" I said, \"God, I don't know what your purpose is in all of this, but I'm going to hold on to this promise that you will fulfill your purpose for me.\"\n\nIn the months that followed, after I came back from Scotland, we were living in our friend's basement while I was trying to figure out if I could take a full-time job and care for my wife. I kept coming back to Psalm 57, verse 2: \"I cry out to God most high, to God who fulfills his purpose for me.\" I was in a season of being in between, waiting for God to show us where he was leading us. I was holding on to the promises of God—that he is with us and that he fulfills his purpose for us.\n\nWhat God was doing in all of this, I didn't fully understand at the time. Sometimes we are able to see God's purposes on this side of eternity. Sometimes there are circumstances we walk through where I think we will only see God's purposes on the other side of this life. But during that year in Scotland, Mary and I had committed to sending videos to the friends and family who had supported us—updates on what we were studying, pictures of castles, that sort of thing. We started making daily videos. Inevitably, those videos turned into chronicling Mary's health, giving people updates on how she was doing.\n\nWhen we put these videos on YouTube, it wasn't just our friends and family who were interested. After we came back to the States and continued making daily videos, hundreds of thousands of people were watching every day as we shared our story of finding hope in the midst of real brokenness. For the next eight years of our life, we chronicled our journey with Mary. This became our mission statement at East Church: pointing a hurting world to hope and peace. It flows out of what has simply been Mary's and my journey and God's purpose for us.\n\nWhen I look back at that Psalm 57, verse 2, that I read through tears on that little IKEA couch in Scotland, I now see what you were doing, God. But in the midst of it, it felt messy. It felt hard. It felt really confusing.\n\nSo the encouragement of Psalm 130 is this: when you are in those seasons, when you are in the depths, find your footing in the forgiveness of God and hold on to the promises of God. Hold on to the promise that there is therefore now no condemnation for those who are in Christ Jesus. Hold on to the promise that God works all things together for the good of those who love him and are called according to his purpose. Hold on to the promise of Second Peter 1:3, that his divine power has given us everything we need for a godly life. Hold on to the promise that in Christ we are blessed with every spiritual blessing in the heavenly places. When you are in seasons of waiting, hold on to the promises of God—not because it simply feels good, but because it's there that we find not just something to hold on to, but the only thing we can hold on to that will actually hold us.\n\nIn those seasons of waiting, I encourage you to find your footing in the forgiveness of God, hold on to the promises of God, and put your hope in God himself. Look at verse seven with me: \"Israel, put your hope in the Lord. For with the Lord is unfailing love and with him is full redemption. He himself will redeem Israel from all their sins.\"\n\nPut your hope in God himself. Psalm 130 was written hundreds of years before Jesus walked the earth, yet we find the gospel message here: that God is a lavish lover, a loyal lover, and a lavish redeemer. This word for his unfailing love is important—ingrain it in your memory. It appears throughout the Psalms and the Hebrew scriptures. It is the Hebrew word hesed. There is not one English word that can wrap up the kind of love that God has for us. Some translations call it steadfast love. Some call it loving-kindness. It is the kind of love that is so loyal to you that even when you are not pursuing it, it is pursuing you. This is the kind of love that God has for you.\n\nSo what do we do in those seasons of waiting? Remember who God is. Even when you can't see it, when the wave is crashing over you, remember: God, you are a loyal lover. You are a good, good father. You are with me, and one day you are going to redeem everything. We look forward to that day.\n\nThis past Easter was the first time, having a three-year-old, that I had to really explain the meaning of the resurrection to my children. As a pastor, I was faced with the challenge of explaining this to my three-year-old son. I said to Elijah, \"Hey, one day God is going to make everything sad untrue.\" I asked him, \"Elijah, what is something sad in your life that you want to see God make untrue one day?\" He sat back and thought about it, and with a pout on his face, he said, \"Only adults can use scissors.\" I said, \"You know what? You're right. That is hard. And one day Jesus is going to make all things new, and that thing that was once dangerous, you'll be able to use in all its purpose and glory.\" I wonder for you: What is that sad thing that you want to see Jesus make untrue?\n\nFind your footing in the forgiveness of God. Hold on to the promises of God. Put your hope in God himself—that he is a loyal lover and a lavish redeemer and one day he is going to make all things new. This is our hope.\n\nIn these seasons of waiting, I don't think waiting is something that we should resist. I think these are actually the most formative seasons of our lives. Don't rush to the next thing. Let your feet sink down into this season and ask God, \"What do you want to form in me right now? What do you want to show me of your character that can't even be contained in language? What do you want to show me right now?\" You will find that it is out of the depths of waiting on God that you will find the depth of your walk with him. It's true of my life. I believe it's true of yours as well. It is out of the depths of waiting on God that you will discover the depth of your walk with God.\n\nWe find the message of Psalm 130 echoed all the way through Romans chapter 5. Romans chapter 5, verse 1 says this: \"Therefore, since we have been justified through faith, we have peace with God through our Lord Jesus Christ, through whom we have gained access by faith into this grace in which we now stand.\" Notice the gospel of Jesus here, church: you have a place to stand, a place to find your footing in the forgiveness of God. Notice how it continues: \"And we boast in the hope of the glory of God.\" We hold on to the promises of God. \"Not only so, but we also glory in our sufferings.\" We glory in our sufferings. We glory in the seasons of being in between, in the seasons of waiting, because we know that suffering produces perseverance, perseverance produces character, and character produces hope. And hope does not put us to shame. You know why? Because we put our hope in God himself. Because God's love has been poured out into our hearts through the Holy Spirit who has been given to us.\n\nBrothers and sisters, wherever you find yourself this morning, may we be a church—may Reach Fellowship be a church, may East Point Church be a church, may the body of Christ be a place where people can find their footing in the forgiveness of God, hold on to the promises of God, and put their hope in God himself.","url":"https://www.youtube.com/watch?v=247spsTHZuE"},{"id":"WowKrrzOu8M","date":"2025-06-11","title":"Radical Hospitality","scripture":"Luke 7:36-50","preacher":"Peter Frey","series":"","desc":"A message on the practice of radical hospitality from Luke 7:36-50. Peter Frey explores what it looks like to create spaces of dignifying presence for our neighbors as we celebrate the image of God in every person.   Preached at Waypoint Church in Chapel Hill, NC.","transcript":"# Sermon Transcript: Christian Hospitality\n\nI'd like you to humor me for a moment and imagine what comes to your mind when I say hospitality. For many of us, we might have some baggage wrapped up in this word. Maybe you think of Martha Stewart, fine dining, or maybe your mother or mother-in-law's standard of hosting. I'd like for us to set that baggage aside for a moment. It's my hope that most of you will just leave it behind. Now let's take a journey to Luke chapter 7, where we're going to meet Jesus at the home of Simon the Pharisee.\n\nYou could find a crowd pretty much everywhere Jesus went. They gathered in the city streets and filled the village homes. Everywhere he went, people were pressing close to see his next move and hear his next word. There was something extraordinary about this man, and everyone knew it. Rumors spread throughout the multitudes that followed him as to his identity. Some said he was a religious teacher. Some said he was a messenger sent from God. Some said he had power to heal diseases. Some said he even had authority to raise the dead. Some even concluded that God had visited his people. Still others had their doubts. But one thing was certain: there was something extraordinary about this man, Jesus.\n\nAs we see the crowds form around Jesus, it's easy for us to sometimes forget that crowds are made of individuals, each with a different reason for being there. An outcast of society looking for acceptance. A victim of disease looking for a way out. A lawyer looking for self-advancement. A prostitute looking for peace. A religious leader looking for recognition. Here in the midst of the crowd, we meet one of these religious leaders. His name is Simon, and he has an agenda. You see, he's a Pharisee, a man of the law. The Pharisees were the holier-than-thou type. If being perfect wasn't an option, they considered themselves the next best thing. Simon's agenda is simple: while everyone else is looking for hope in this man who seems to be god-sent, Simon is looking for a fault. Certainly this man Jesus couldn't be as extraordinary as everyone is making him out to be.\n\nWe read in verse 36 of Luke 7 that one of the Pharisees invited Jesus to have dinner with him. He went to the Pharisee's house and reclined at the table. Simon extends to Jesus what I imagine was a banquet of prestigious presence. I can see the lawyers and religious experts surrounding this table. Jesus arrives at the dinner party worn and dirty from the day's journey on foot. The men around the table fix their gaze on Jesus, the guest of honor, or rather the object of their observation. I can see the table garnished with the finest of foods. As was the custom, the men lean into the table, their feet resting behind them. I can see the banquet hall open to the evening air. The eyes of the men are fixed on Jesus, watching his every move, analyzing his every word. He speaks with such gentleness and yet authority. I imagine that Simon's doubts are subtly fading as he begins to see why people called this man a prophet, a messenger from God. Perhaps his doubts are being replaced by feelings of pride and self-righteousness that he had invited such a man into his house.\n\nBut Simon's thoughts are interrupted. The conversation of the men around the table is cut short by what sounds like the sobs of a woman. All the eyes in the room turn to see a woman standing behind Jesus with tears in her eyes and an alabaster stone jar in her hands. Whispers fill the room as the dinner guests recognize this woman. They had seen her before. She was what scripture describes as a sinner from the streets of the city—a nice way of saying a prostitute had just interrupted this dinner party of prestige. All the eyes in the room turn to Jesus, the man under observation. What will he do next?\n\nThe woman cannot hold back the tears as they pour from her cheeks and go to Jesus's feet. The dirt on his feet darkens with each drop from the woman's face. She lets out unintentional sobs as she drops to her knees at his feet. She lays down her jar of oil. Her premeditated plans to anoint his head are interrupted by the pouring out of her tears. I imagine that she had been among the crowds that followed Jesus, that she had seen him show compassion on the hurting. She had heard the stories. It was as if he understood the pain that she felt, the tears that she shed, the guilt that she bears, the shame that she tried to hide in the darkness of the night.\n\nJesus does not prohibit the woman. He silently allows her tears to touch his feet. Already feeling the shame of judgment from the men around the table, the woman makes use of her let-down hair, wiping the tear-moistened dirt from Jesus's feet. Her resources are primitive, but her intentions are genuine. Her hair now muddied, Jesus's feet now clean. She proceeds to kiss Jesus's feet in a simple act of thankful affection interspersed with the sobs of sorrow. In a final act of gratitude, the woman takes the jar of anointing perfume and pours it over the newly cleansed feet. I imagine the tears continue to flow from her cheeks as she persists in kissing Jesus's feet.\n\nI can hear the whispers around the table now escalating into loud murmurs as the men shift their gaze from the reactionless Jesus to Simon the dinner host. Simon's doubts are confirmed. He stares at Jesus, drawing his thoughts to conclusions. We read in verse 39: \"When the Pharisee who had invited him saw this, he said to himself, 'If this man were a prophet, he would know who is touching him and what kind of woman she is, that she is a sinner.'\" If Simon had any indication that this man was a prophet, it has now vanished. Jesus's allowance of this woman's actions is an indication in Simon's mind that he does not know who she is, for she was the kind with which no man of God would associate. Surely she is not worthy to touch a man of prestige, and here she is kissing Jesus's feet while Jesus does nothing about it.\n\nSimon's thoughts are interrupted once again. This time it's Jesus. \"Simon, I have something to say to you.\" Simon is confused for a moment, wondering if he uttered his assessment of Jesus out loud. \"Tell me, teacher,\" he responds. I imagine everyone in the room is now eavesdropping on their conversation, wondering what Jesus will say. Will he scold Simon for allowing this woman to touch him?\n\nJesus begins to tell a story. We read in v
