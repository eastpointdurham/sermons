following Jesus sounds great, but this one relationship is beyond that\"? For some of you who are parents, there is a temptation to say, \"Yes, I believe Jesus reigns, that he is sovereign, that my future is in his hands, but when it comes to my kids, I'm going to make them the idol. I'm going to cater their life to control it.\" But the invitation of Jesus is: let the peace of Christ reign. For some of you, there are the circumstances of your life—a job, your home situation, or perhaps as we talk about husbands and wives, you think, \"That's irrelevant to me because I don't have one.\" You feel like Jesus reigns in all these aspects of your life, but this one aspect—you're not sure you can trust Jesus with that. The invitation of Jesus for you this morning is: let the peace of Christ reign in your heart.\n\nHow do you let the peace of Christ reign in your heart? Will you let the word of Christ saturate your heart? You sing psalms, hymns, and spiritual songs in your hearts and to one another in gospel community, giving thanks to God in all of it. This is the process of the gospel transforming you. It's easy to look at the wall and want that, but you have to start with catching the ball. The first step is identifying: is there something in your life where you're saying, \"Exclusions apply, Jesus\"? The invitation this morning is: let the peace of Christ reign.\n\n# Sermon Transcript — Cleaned\n\nAnd when it does, whatever you do, work at it with all your heart as working for the Lord, not human masters. There's a picture here like the substitute teacher coming into the classroom—that moment when students think, \"This is not real authority, so I can goof off.\" I remember spitball games erupting the moment a substitute teacher walked in.\n\nThe message of religion has historically been, \"What would Jesus do?\"—a call to morally reform your life to be something Jesus would approve of. But the message of the gospel is antithetical to that. The gospel invites a different question: What is Jesus inviting me to experience because he has already accomplished it? The invitation becomes something like this: What does it look like for the peace of Christ to reign in my heart and life in such a way that I now have new meaning, even in the mundane work that I do? You will receive an inheritance from the Lord as a reward, because it is the Lord Christ you are serving.\n\nAll of a sudden, whether it's changing a baby's diaper or doing the mundane tasks of everyday life, everything shifts. Let me give you a practical illustration. Each week we have a team that comes in here at 8:00 in the morning and sets up this space so that we can meet Jesus. We put up pipe and drape, we pull out the TV and try not to break it, and we do all the things that need to happen on a Sunday morning.\n\nThis is what Paul is inviting us into. You could ask somebody on the setup team, \"What are you doing?\" They could say, \"Well, I'm putting up pipe and drape,\" or \"I'm setting up the gym to look a little better.\" But Paul's invitation is to see the mundane task of putting up pipe and drape each week, and whatever your sphere of life looks like, as this: \"I am serving Jesus to create a space for people to experience him.\" All of a sudden, waking up and coming to set up this space has a whole lot more purpose. I'm not saying that to recruit you, though if you want to, talk to me. What I'm saying is that Jesus wants to transform even how you approach the mundane tasks of life. Serving Jesus is worth it.\n\nAs we come back to this series, \"First Things First,\" it's this: Jesus is worthy. He's worthy of all of us. And we want to give that to him. We want to live our lives in light of who he is and what he has accomplished. Let's pray together.\n\nFather, we ask that you would transform us from the inside out. God, we want you to reach into every aspect of our lives. We didn't even get a chance to explore the nitty-gritty of what this looks like in some of these relationships in our lives, but Lord, we just want to see that you reign. We want to start asking the question: Where am I holding back from experiencing your transformation in my life?\n\nEven as we come to respond this morning, God, I pray that the peace of Christ would reign in our hearts, that our worship and our singing would be a response of overflow—not the gauge of us mustering up some kind of faith for you, but the gauge of what you have given us sinking in, roots going down into who we are in you. We have died and we are raised to newness of life. This is the good news.\n\nJesus, I want to confess this morning, and I invite each person here to confess to you, God: there are no exclusions to where you want to reign, where you want to transform. God, I confess I have a lack of belief that there are spaces you can transform. So I want to lay those before you this morning and ask: God, would you reign? Would you be Lord in my marriage, in my home, in this church, in the brokenness of this community? Jesus, you are Lord. So come. Your kingdom come. Your will be done here on earth as it is in heaven. We pray in Jesus' name. Amen.","url":"https://www.youtube.com/watch?v=0tKAGTKbHqU"},{"id":"2PuSeVjHBwM","date":"2026-03-02","title":"New Life in Christ","scripture":"Colossians 3:1–14","preacher":"Peter Frey","series":"Colossians","desc":"In Colossians 3:1–14, believers are called to set their hearts on things above and put on the new self in Christ. Join Pastor Peter Frey as he shares how new life in Jesus reshapes our identity, relationships, and daily living. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon: First Things First - Colossians 3:1-14\n\nI'm Alexa, and I'd like to invite you to join me aloud in reading this prayer for illumination. The words will be on the screen. \"Guide us, O God, by your word and Holy Spirit, that in your light we may see light. In your truth find freedom, and in your will discover peace through Christ our Lord. Amen.\"\n\nPlease remain standing as you're able for the reading of God's word from the book of Colossians, chapter 3, verses 1 through 14:\n\n\"Since then you have been raised with Christ, set your hearts on things above where Christ is seated at the right hand of God. Set your minds on things above, not on earthly things. For you died, and your life is now hidden with Christ in God. When Christ, who is your life, appears, then you will also appear with him in glory. Put to death, therefore, whatever belongs to your earthly nature: sexual immorality, impurity, lust, evil desires, and greed, which is idolatry. Because of these, the wrath of God is coming. You used to walk in these ways, in the life you once lived. But now you must also rid yourselves of all such things as these: anger, rage, malice, slander, and filthy language from your lips. Do not lie to each other since you have taken off your old self with its practices and have put on the new self, which is being renewed in knowledge in the image of its creator. Here there is no Gentile or Jew, circumcised or uncircumcised, barbarian, Scythian, slave or free, but Christ is all and is in all. Therefore, as God's chosen people, holy and dearly loved, clothe yourselves with compassion, kindness, humility, gentleness, and patience. Bear with each other and forgive one another. If any of you has a grievance against someone, forgive as the Lord forgave you. And over all these virtues, put on love, which binds them all together in perfect unity.\"\n\nThis is the word of the Lord. Thanks be to God.\n\nAt this time, we will dismiss the kids in the Adventurers class.\n\n---\n\nAs we prayed this morning, we truly believe that God led us to meet in this space to invite God in, through the prayer that Jesus invited us to pray: \"Your kingdom come, your will be done here on earth as it is in heaven.\" We have this prayer before us each week, and it reminds us that our heartfelt prayer is to see the kingdom of God break into the darkness, to see the light break into the darkness, and to see it happen even in a space like this here at Oakgrove Elementary School.\n\nBefore we dive into the Scripture, I want to invite those of you who are new to us or have been visiting for a while but want to explore how to get connected. I'd love for you to join us for lunch right after this service. We've ordered plenty of subs, and we'd be delighted for you to stick around. We're going to have what we call Explore East Point, which is basically our opportunity to learn about who we are, what we believe, how to get connected, and really how to join in what Jesus is inviting us into as a church in our mission and vision. You can even ask any questions you might have about our church.\n\nAs we turn to God's word this morning, I want to take a moment to acknowledge the context we're living in. East Point's mission is to point a hurting world to hope in Jesus. As I look at the world around us, we feel that context deeply. We turn on the news this weekend and see war across our world. In the midst of a world that is full of brokenness, pain, violence, and division, I want to take a moment and ask God that his kingdom would come, that hope would break into the darkness.\n\nWould you join me in praying together? God, we come to you this morning with heavy hearts as we look at war across our world. Lord, I lift up to you our brothers and sisters in Iran. I pray for protection and safety for civilians. I pray for light to break into the darkness. Lord, I do pray for peace in that region. God, I pray for decision makers in all of this to be slow to action. I pray for justice and mercy. God, I pray for your body, for brothers and sisters and even friends and family of those gathered here this morning who may fear for their lives. I pray for protection and for your spirit to comfort your people, created in your image. God, we do pray your kingdom come, your will be done here on earth as it is in heaven. Help us to know, in the midst of our limited capacity, how to be part of your kingdom coming here in Durham as it is in heaven. As we turn to your word, would you help us this morning? Help us to see you clearly, to see your hope more fully, and for that to transform us. We pray in Jesus' name. Amen.\n\n---\n\nI sometimes get amused by misunderstandings. There was a situation a few years ago when Mary and I were serving on the leadership of a church. We would gather with the pastor each Tuesday morning to pray for individuals in the church and touch base on people we hadn't seen the previous Sunday. We'd maybe send them a text message to see how they were doing. We did that with one couple, and Mary reported to us at this prayer meeting that we needed to pray for one of our friends because he was having his toenails removed. I grimaced when I heard this—I could only imagine that would be a painful process. We took time and prayed for our brother's toenails. One of us followed up later in the week and got a text back that said he had his tonsils removed. Mary looked back at her original text message, and it actually said he was getting his tonsils removed. It was a big misunderstanding.\n\nWe all know what it's like to misunderstand an assignment. Here's an example: a smoke detector was installed on the ceiling with the words \"installed on the ceiling\" written on it. I think they misunderstood the assignment—it was supposed to be the date. Or consider this one: a trophy shop received a request that said, \"I do not want any engraving. Just leave the metal plate blank. No engraving.\" I think they misunderstood the assignment as well.\n\n---\n\nThis morning, we're continuing our series in the book of Colossians, which we've called \"First Things First.\" The heartbeat behind this title is that we do not misunderstand the assignment that we are called to as East Point Church. We want to have the priorities of the assignment right. As we've been walking through Colossians, we've seen the reality of Jesus: he is supreme over all and he is sufficient for all. As we come to the middle of the book in chapter 3, there's a turning point where we must ask the question, \"So what? What does this mean for us?\"\n\nIf Jesus is supreme over all and sufficient for all, then we must reckon with his claims. As C.S. Lewis put it so eloquently in *Mere Christianity*, you have to take Jesus's claims seriously. If this man who was raised from the dead claims to change everything, then either he is a lunatic, a liar, or he is Lord. We have to decide which one. In many ways, as we come to chapter three, that's the question circling here: If Jesus is supreme over all and sufficient for all, so what for us?\n\nPaul addresses this in Colossians chapter 3, beginning in verse one. He says, \"Since then you have been raised with Christ, set your hearts on things above where Christ is seated at the right hand of God. Set your minds on things above, not on earthly things.\"\n\nI want to suggest that Paul is holding out to us this encouragement: Focus on what is finished in Christ. Our focus on what is finished in Christ is the fuel for transforming what is unfinished in us. Let me say that again because I want us to let this sink in today: Our focus on what is finished in Christ is the fuel for transforming what is unfinished in us. Another way to say that is this: gospel identity fuels gospel transformation.\n\nWhen Paul says, \"If you have been raised with Christ,\" what is he talking about? He's talking about what happens when we put our faith in Jesus. The invitation of the gospel—the good news of Jesus—invites us to find that his life, death, and resurrection become our own. His perfect life that we couldn't live, his death that paid the debt we owed and could never pay—Jesus paid it all. That's what we saw in chapter 2 of Colossians. And then his new life—he rose from the dead to defeat the grip that sin had on us. This is what we just sang when we sang \"Living Hope\": \"the grave has no claim on me.\"\n\nSo Paul says if that is true, if you have been raised with Christ, what do we do? He says make sure your focus is on your identity, on what is finished in Christ. I want to hold out to us that the church sometimes has a misunderstood assignment—that sometimes we have a focus on the wrong things. Before we unpack what this means for us, I want to highlight three ways to miss the point of Christianity.\n\nThe first is a focus on eliminating sin. I've seen this in my own life. I want to suggest that putting sin to death is not the goal of the Christian life. This passage clearly says to put sin to death, but I want to be clear: putting sin to death is not the goal of the Christian life. It is part of the process of experiencing resurrection life. The focus of the Christian life is not eliminating sin. It is experiencing life in Jesus. Part of that process, as we're going to see, is putting sin to death.\n\nThe second way we misunderstand the assignment is through a focus on earning love. We are hardwired to feel like we need to earn love. Many of us, by default, operate in that mode. Maybe it was cultured from our parents, or maybe it wasn't even intended, but we interpreted life through the lens that if I try harder, I will earn love. Some of us experience the opposite: in our failures, we find rejection. We operate with the belief that if we live a better life, we will experience God's love. This is a misunderstanding of the assignment of the Christian life. It is a misunderstanding of the good news of Jesus.\n\nThe third way we misunderstand the assignment is through a focus on elevating self. Here is what I want to see Jesus confront in us this morning: When we turn the Christian life into a self-improvement project, we have misunderstood the assignment. The good news of Jesus is that in Jesus's life, death, and resurrection, we have everything that we need for fullness of life. The love that you long for, the elimination of sin that brings life, the process of becoming who you were meant to be—it is all accomplished for you in Jesus.\n\nThis is why Paul begins in chapter 3, verse one: \"Since then you've been raised with Christ, set your mind on things above, set your heart on things above.\" He continues, \"For you died, and your life is now hidden with Christ in God. When Christ, who is your life, appears, then you will appear with him in glory.\" This is the heart of the Christian life: understanding that Jesus is life. When we put our faith in him, we begin to say that Jesus is our life.\n\n# Cleaned Sermon Transcript\n\nJesus's life—whether you put your trust in him or not. But his offer to you is that he wants to be your life. That is the beautiful invitation of the gospel. It's a shift in what we set our focus on as a church. We set our focus on gospel identity. We set our focus on what is finished in Christ as the fuel for what transforms what is unfinished in each of us, in our world, and in our community. Our focus on what is finished in Christ will fuel what we long to see Jesus do. It's a matter of turning our eyes to things above.\n\nI have made it my life goal to use pole vaulting as sermon illustrations because I was a pole vaulter in high school. I've come to the conclusion that it was the most pointless skill to ever learn. Nobody says, \"Hey Peter, you want to go do a pickup game of pole vault?\" Yet for some reason I got into it, discovered I was really good at it, won the Maryland State Championship, graduated from high school, never pole vaulted again, and it is a useless skill. So I'm determined to use it as a sermon illustration. The Lord's going to redeem it right now.\n\nThe challenge of pole vault is the psychological dimension. You're running, putting all your faith into this fiberglass pole that bends in half and launches you in the air. When I would pole vault, my biggest fault—the thing that would hold me back—was what I would look at. The goal of pole vault is to go over the crossbar set at a certain height. But as I do the pole vault, I turn upside down and all the energy is in the pole, launching me in the air. My mind wants to set its eyes on what I'm trying to get over. My coach would always say after I missed, \"What were you looking at?\" And I'd say, \"I looked at the crossbar.\" What I needed to do was lift my eyes to something I couldn't see—the height I was trying to get to.\n\nWhat Paul holds out to us this morning is this: if you want to see life change, you have to stop looking at the crossbar of where you're at and start looking at the heaven reality of who you are in Jesus. Lift your eyes to something that is invisible—the spiritual reality that you are buried with Christ and raised to newness of life. That requires faith, but faith is confidence in a promise. This is what Jesus holds out to us: through his death and resurrection, we have new life. Sin is defeated. The grave is conquered. We have an opportunity to experience life as we were meant to experience it. Paul says, \"Lift your eyes. Set your minds on things above.\"\n\nNow, you may have heard the phrase \"so heavenly minded, no earthly good\"—that all we do is talk about heaven and we're no good to the earth today. That's not what Paul is talking about. What he's saying is this: if you have hope in Jesus, and hope is a promise that transforms the present, then that promise we see in the gospel transforms everything. If Jesus raised from the dead, we will too if we put our trust in him. That future hope—that one day all brokenness will be undone, everything sad made untrue—when we long for that promise, it transforms the present for us. If we want to see transformation, what does Paul tell us? Look to the finished work of Jesus, because our focus on the finished work of Jesus will fuel the transformation of what is unfinished in us.\n\nPaul encourages us: \"You have died, your life is now hidden with Christ in God.\" He uses an image—the image of Jesus's death and resurrection, the image of baptism. I want to hold this out to us as a church. On Easter Sunday, just over a month from now, we're going to have baptisms. If you have never been baptized as a step of proclaiming your faith in Jesus, I want to give you this picture because that's what Colossians 3 is rooted in. In baptism, we identify with the spiritual truth of what Jesus has done in our lives. It's a public profession that we believe Jesus's death is our death. Our old life is buried with Christ and we are raised out of the water—a picture of Jesus raising from the dead. Jesus's life is our life. If you have put your faith in Jesus or Jesus is pursuing you and inviting you to put your faith in him and you want to take that step of baptism, we would love to talk to you as we look forward to celebrating life change on Easter Sunday.\n\nThe passage goes on: \"Put to death, therefore, what belongs to your earthly nature.\" Here's the idea: we take sin seriously because we take Jesus's win seriously. We take sin seriously in our lives because we take Jesus's win over sin and death seriously. I want to be clear about something. The focus is not on eliminating sin. Putting sin to death is not the goal of the Christian life, but it is part of the process of experiencing resurrection life. We put sin to death because Jesus already died for it. We do not fight sin for victory. We fight sin from victory.\n\nAs I was preparing this sermon, an older worship song came to mind with a line that just strikes at the heart of it: \"I'm fighting battles that you've already won.\" This is the message of the gospel—Jesus has defeated sin. He's inviting us to experience life. What often happens is we become defeated by the brokenness and sin in our lives. All of us experience this. On a regular basis, I am convinced that part of what Jesus invited me into as a parent is being refined of the impatience in my own heart. When that surfaces in me, I can feel defeated. What does Paul encourage us in that defeat? Don't make the focus eliminating that. Make the focus what Jesus has done with that and then act accordingly. Put it to death. Take sin seriously. Sin is killing you. It's keeping you from the life that God designed for you.\n\nHe gives us two groups of sin in this passage: sexual sin and speech. About sexual sin, he says: \"Sexual immorality, impurity, lust, evil desires, greed, which is idolatry. Because of these, the wrath of God is coming.\" Some people read a list like this and think, \"See, that's my problem with the church. They're always talking about sexual immorality and why what you don't do.\" But I want to suggest something. The book of Colossians up to this point has held out that life is found in Jesus. Now he comes to the point: there are things in your life that are keeping you from experiencing that life as God designed it. This isn't a guilt trip into becoming some self-improvement, more moral person. God doesn't make good people better. He makes dead people live. This is the truth of what God wants to do in you. He wants you to experience resurrection life. Part of that is saying, \"I'm going to kill what is keeping me from experiencing that life.\"\n\nHe says: \"You used to walk in those ways in the life you once lived, but now you must rid yourselves of all things such as these: anger, rage, malice, slander, filthy language from your lips. Do not lie to each other since you have taken off your old self with its practices and have put on the new self, which is being renewed in knowledge in the image of its creator.\" In the early church, there was a practice at baptism. The forty days leading up to Easter were a period of people getting ready for baptism, setting their focus on who Jesus is and what he has accomplished in our lives. On Easter Sunday, they would wear old clothes and then be baptized and put on new clothes. Paul is picking up on that imagery when he says, \"Your old self has been put away. You have put on a new self.\" This is what Jesus wants to do in us.\n\n\"We have put on the new self, which is being renewed in knowledge in the image of its creator.\" The process of putting on new sheets—and I do love new sheets—requires taking the old ones off. That is what this passage is all about. You're not a terrible person and you are, but in Christ you are a new person. You're invited into a new wardrobe, a resurrection wardrobe. You have to take off what is part of the old self. We do not hold out a Christianity where how you live doesn't matter. No, that is not the message of Jesus. How you live matters because Jesus has a way of living where resurrection life is truly found. We put to death what is part of our old self and we put on what is our resurrection self.\n\n\"Therefore, as God's chosen people, holy and dearly loved, clothe yourselves with compassion, kindness, humility, gentleness, and patience.\" Before we get to how Jesus wants to change your life, notice the starting point: as God's chosen people, wholly and dearly loved. Tim Keller says it like this: Christianity is the only religion where we get the verdict before the performance. This is what God declares over you when you put your trust in him. You are holy. You are loved. You are chosen. Nothing about your life—the things you excel in or the things you fail in—will change that identity. This is where we have to come back. Set your mind on things above. Set your heart on things above. We have to treasure who we are in Christ. Christ is our life. We have to focus on the finished work of Jesus as the fuel for transforming what is unfinished in us.\n\nAs we do that, this is what he invites us to. Clothe yourselves with compassion, kindness, humility, gentleness, and patience. Bear with each other and forgive one another. If any of you has a grievance against someone, forgive as the Lord forgave you. Once again, he ties how we live into who we are. In the gospel, we are forgiven by Jesus. That makes us a people who forgive. Over all these virtues, put on love, which binds them all together in perfect unity. Here is what he's holding out to us: put on Jesus. Who exemplifies these characteristics? Jesus himself. This is what he's saying: walk in who you already are. If you've put your faith in Jesus, this is true of you—sin is defeated, the grave is conquered, and you have hope. As we set our heart and our mind on that hope, what it does is make us so heavenly minded that we engage in earth like all of life depends on it. People need to experience that resurrection life is possible. This is the good news of Jesus.\n\n# Sermon Transcript\n\nThe assignment is to set our focus on the gospel reality of what is already true of you. So the question I want to leave us with this morning as we wrap up our time is this: What captivates your imagination? In the course of a day, in the course of your life, what's captivating your imagination?\n\nThe Lord convicted me of something, and I can be real with you here at East Point because we tell stories of real hope. As I was thinking about this, I realized that in my parenting, I live in a lot of fear. Not fear that my kids are going to get hurt—I'm fine with them climbing trees and doing their thing. Rather, I fear that I'm going to fail them. One of my deepest fears that I operate in is: What if I'm a great pastor and a terrible dad? And all of a sudden, Jesus confronted me with that. That fear of failure, that shame, that feeling that maybe I don't do enough or show up enough—that is what's captivating my imagination.\n\nWhat Jesus invited me into is this reality: Peter, would you let this sink in—your life is hidden in Christ. If you are in Christ, you have hope beyond your performance. The pressure I'm feeling is really my desire for idolatry, my desire to put myself on the throne of my life, my kids' lives, the throne of East Point's life. What Jesus invites me into is laying down that idolatry and putting it to death. I need to set my heart on what is true of me in Jesus.\n\nI want to be a dad full of compassion, humility, and love—the characteristics that Paul holds out to us. But the process of seeing Jesus do that in me is not pulling myself up by my bootstraps. It's setting my gaze on Jesus, who is better and more sufficient. He is the sufficient father, and I can trust him. Some of you, it might not be parenting. Maybe it's your marriage or the job God has put you in. Maybe it's confusing sometimes to understand what it looks like to follow Jesus in that and experience resurrection life. Maybe you feel insufficient, or maybe you feel like you should be doing more. Maybe you feel a sense of shame when you come before Jesus on Sundays, thinking, \"I'm not a good enough Christian.\"\n\nPaul wants to tell you: Put that to death and set your gaze on who you are in Christ. You are his chosen child, holy and beloved prior to anything that you do. Hold those spaces that maybe feel confusing—your job, your home life, your relationships—and ask Jesus, \"What does it look like for my identity in you to fuel transformation? To give me greater compassion, greater love, to make me more like you, to forgive as you forgave me? I want that. So I'm going to turn my gaze to you this morning.\"\n\nWhat captivates your imagination? This doesn't mean we don't put in effort, but we resist the belief that effort is earning. The goal of spiritual practices—spending time with Jesus, spending time in prayer, giving out of generosity, serving those around us—is to allow your heart and mind to be more and more captivated by the resurrection reality of Jesus. Treasuring Jesus leads to transformation in Jesus.\n\nThat's why we respond each week with a time of worship. Each week, we set up this time and space here at Oakgrove Elementary School where we want to be led by God's spirit to meet with Jesus and treasure him. We have several ways we want to invite you to respond. First, we respond in singing. We express worship and praise that Jesus is worthy. As the passage goes on, it speaks of singing psalms, hymns, and spiritual songs over one another. Hearing your neighbor sing these songs is part of what helps captivate your heart with Jesus, and that's why we do it.\n\nSecond, we pray. We're doing something special this morning during our time of prayer. In the back here, there's a table with a poster for the teachers of Oakgrove Elementary. We would love for you during these three songs to go over there and write an encouraging note if you feel led. You can sign it or leave it unsigned. We're going to have it at our lunch with them tomorrow. On that table, we also have slips of paper with all the teachers and staff of Oakgrove Elementary. I want to invite you during this time of worship to take one and pray over the individuals who work in the school. We'll also have partners around the room wearing green lanyards during this time of worship. If Jesus is stirring in you and you think, \"Man, I feel like I misunderstood the assignment of the Christian life,\" we would love to pray over you this morning.\n\nWe also want to invite you into the practice of generosity. Generosity is an overflow of worship. There are a couple of ways you can give each week. You can give online through our website, or we have a box by the door for your offering. We also want this time to be about the Lord making us people of whole-life generosity—not just financial generosity, but a desire to give ourselves to the cause of Jesus.\n\nFinally, each week here at East Point, we come back to the table. I want you to view communion as an opportunity to reenter your focus on what is true of you if you are a follower of Jesus. It is not your elimination of sin, your self-effort, or your elevation of self that makes you holy and beloved. It is what Jesus accomplished for you. On the night he was betrayed, he took bread with his disciples and said, \"This is my body which is broken for you. This is my blood that is shed for the forgiveness of sins. As often as you eat this bread and drink this cup, you proclaim the Lord's death until he comes.\" Paul says that if you have put your faith in Jesus, this is true of you. You've died with Christ and you've been raised to newness of life. We come to the table each week to set our heart and mind on what is already true of us—that we are holy and beloved because of Jesus and not because of us.\n\nLet me pray for us as we continue in worship. God, we are grateful for the good news of Jesus, that you are sufficient, that you paid it all. Lord, I pray for anyone in this room who feels like they've missed the whole point of Christianity. I pray that you would help them see that Jesus is holding out life, and I pray they would receive it. God, I pray you would move in their hearts this morning to simply express trust and hope in your finished work. You have paid it all. God, I pray that you would move in each of us as we ask, \"What does it look like in me to take the next step in my walk with Jesus?\" God, would you turn our eyes to the gospel reality of who we are in Jesus? We pray in his precious name. Amen.","url":"https://www.youtube.com/watch?v=2PuSeVjHBwM"},{"id":"sDyzBRQ-WZQ","date":"2026-02-26","title":"Christ + Nothing = Everything","scripture":"Colossians 2:6–23","preacher":"Peter Frey","series":"Colossians","desc":"In Colossians 2:6–23, Paul reminds believers that Christ is fully sufficient — we need nothing more. Join Pastor Peter Frey as he shares how freedom, fullness, and real hope for real life are found in Jesus alone at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: Colossians 2:6-23\n\nStartle us, O God, with your truth and open our hearts and minds to your wondrous love. Speak your word to us—silent and in voice—but your own. Be with us now as we turn our attention, our minds and our hearts to you in Jesus our Lord. Amen.\n\nPlease remain standing as you are able for the reading of God's word from the book of Colossians, chapter 2, verses 6 through 23.\n\nSo then, just as you received Christ Jesus as Lord, continue to live your lives in him, rooted and built up in him, strengthened in faith as you were taught and overflowing with thankfulness. See to it that no one takes you captive through hollow and deceptive philosophy, which depends on human tradition and the elemental spirit forces of the world rather than on Christ. For in Christ all the fullness of the deity lives in bodily form, and in Christ you have been brought to fullness. He is the head over every power and authority.\n\nIn you were also circumcised with a circumcision not performed by human hands. Your whole self, ruled by the flesh, was put off when you were circumcised by Christ, having been buried with him in baptism, in which you were also raised with him through your faith in the working of God who raised him from the dead. When you were dead in your sins and in the uncircumcision of your flesh, God made you alive with Christ. He forgave us all our sins, having canceled the charge of our legal indebtedness, which stood against us and condemned us. He has taken it away, nailing it to the cross. And having disarmed the powers and authorities, he made a public spectacle of them, triumphing over them by the cross.\n\nTherefore, do not let anyone judge you by what you eat or drink, or with regard to a religious festival, a new moon celebration, or a Sabbath day. These are a shadow of things that were to come. The reality, however, is found in Christ. Do not let anyone who delights in false humility and the worship of angels disqualify you. Such a person goes into great detail about what they have seen and is puffed up with idle notions by their unspiritual mind. They have lost connection with the head, from whom the whole body, supported and held together by ligaments and sinews, grows as God causes it to grow.\n\nSince you died with Christ to the elemental spirit forces of the world, why, as though you still belong to the world, do you submit to its rules? Do not handle, do not taste, do not touch—these rules which have to do with things that are all destined to perish with use. They are based on merely human commands and teachings. Such regulations indeed have an appearance of wisdom with their self-imposed worship, their false humility, and their harsh treatment of the body. But they lack any value in restraining sensual indulgence. This is the word of the Lord. Thanks be to God.\n\n---\n\nGood morning, East Point. It's a joy to be worshiping with you this morning. I know that was a lot we just read, and we're going to dig into it in a moment. But first, I want to extend an invitation to lunch next week. If you are new to East Point or have been here only recently, we would love to have you join us for lunch at what we call Explore East Point. This is your first step toward connection here at East Point. We're going to share our story—how God brought us here to Oakrove Elementary School—and talk about our vision, mission, and the values that drive who we are as a church. We'll discuss what it looks like to follow Jesus together and how to be meaningfully involved in the life of our church. We'll talk about community groups and serve teams, and we would love to have you join us. There's more information on our website, but basically, next week after the service we'll have lunch together. We would love to have you stick around.\n\nIf you're visiting with us, it's wonderful to have you this morning. When you came in, you should have received a visitor bag. We would love for you to fill out that connect card so we can follow up with you and help you get connected in the life of our church.\n\nThere are some awards you get in life that you just don't put on your resume. I think one of those was my only season of playing basketball as a kid. I got the most enthusiastic award—which is code for \"you weren't very good, but you sure did try.\" Then there was the title I received in my high school yearbook: \"Best to Take Home to Parents,\" which is code for \"I wouldn't date him, but my parents would love it if I did.\" There's another award I received in high school that I usually don't talk about—the Calculus Award. That's what Mary calls me: Mr. Calculus. For some reason that I'm still trying to figure out, my brain was good at math. I'm the guy everyone hated because math came naturally to me. Logically, I chose a career where I would never put those math skills to use. Well, not completely true—I do count the chairs on Sunday mornings when we set them up.\n\nAll joking aside, I've often wondered why the Lord redirected my natural inclination away from math problems toward people problems. But I will say there is one math equation that I return to often as a pastor. It's an equation around which the logic of the book of Colossians—the book we're journeying through as a church—is built. And it is this: Jesus plus nothing equals everything.\n\nAs we continue our sermon series in the book of Colossians, first things first. We come here to the heart of Paul's letter—the reason he's writing. You see, the followers of Jesus in Colossae, this young church plant that Paul is writing to, were in danger of doing bad math. We don't know exactly what the equation would look like for the church in Colossae, but we can make some guesses based on the passage we just read. The heart of the heresy that Paul is trying to warn the church about is trying to add something to Christ. When you hear the word heresy, you might think it means outright rejection of Jesus. But really, the heart of the heresy Paul is confronting is not rejecting Jesus at all. It's trying to add something to him. They were trying to do addition in an equation that needs nothing added to it: Jesus plus nothing equals everything.\n\nThe Colossian church had received Christ as Savior, but they were in danger of reducing him to a supplement. Look at verses 6 and 7. I want to highlight these two verses as we continue working through Colossians. I would say these two verses summarize what Paul wants for the church. He says this: \"So then, just as you received Christ Jesus as Lord, continue to live your lives in him.\" The word here for \"live your lives\" is literally \"walk\" in the Greek language in which this was written. This is the most common metaphor used throughout the New Testament for the Christian life. It is a walk—something mundane, daily, part of our everyday lives. This is the connection Paul is making: as you received Christ as Lord, walk in him. Just as you received Christ as Lord, continue to live your lives in him. What does that look like? \"Rooted and built up in him, strengthened in the faith as you were taught, and overflowing with thankfulness.\"\n\nThe point Paul is making—and we're going to peel back the layers of what this looks like—is something that you and I are very much in danger of as well. As we think about this idea of first things first, Jesus is supreme over all. He is the source of all. He is the meaning of all. He is the hope of everything broken. Paul has held up Jesus as the one who is supreme. But here he brings us to this point: not only is he supreme in all of creation and in all of salvation, but he is sufficient for all of life. That's the point he's making here.\n\nJust as you received Christ as sufficient for your salvation, he's also sufficient for your growth. Sometimes we face a disconnect between how we receive Christ in the gospel and how we live our lives. Paul wants to peel back the layers and help us see that the gospel is not the starting point of the Christian life. It is the sustaining power of the Christian life. Some preachers have said it's not the ABCs of the Christian life—it is the A to Z. The gospel, the good news of Jesus, that by his death and resurrection we have new life, is as relevant the moment we turn to Christ as when you wake up in the morning and think about what's ahead of the day.\n\nThat's what Paul wants to hold out to us this morning: the gospel is not the starting point. It is the sustaining force of the Christian life. Turning to Christ as our everything is not a moment in the Christian life. It is the movement of the Christian life. Here's a warning we see throughout all of Scripture: complacency leads to captivity. Paul makes this point as the verses go on. Complacency about Christ's sufficiency leads to the captivity of self-sufficiency. Look at verse 8. He says, \"See to it that no one takes you captive through hollow and deceptive philosophy, which depends on human tradition and the basic principles of this world rather than Christ.\"\n\nHere's the heart of why he says to just as you received Christ as Lord, continue to walk in him: because complacency about Jesus's place as first in your life will always lead to captivity. We see it throughout the Old Testament. God chose a people and said, \"I'm going to set my love upon you and invite you to be in relationship with me.\" He gave them a way in which he designed life to be lived. But all throughout the Old Testament, we see this play out—complacency leads to captivity. Paul makes the same point for the church today. Complacency about Christ's place as first, not only in all of creation and in salvation but in all of life, leads to the captivity of self-sufficiency.\n\nWhy? Because you and I, when we are faced with facts, are prone to control. We like control, don't we? This morning, when I woke up and discovered we had no power in our neighborhood, I thought, \"How am I going to make coffee?\" I said, \"You know what? I've got a generator. I'm going to start the generator so I can make a cup of coffee.\" And I had this feeling: \"Oh no, the power is out. I don't have control over my morning anymore.\" There's this grasping in my soul toward control. What Paul wants to encourage you with this morning is that Jesus is sufficient not only to give you purpose and meaning but to give you growth and to give you life as he designed it.\n\nThe temptation is: maybe I can life hack this and do it in my own strength. Maybe I can get to that place of life where I find fulfillment. All the sudden, Jesus plus nothing equals everything has been changed to Jesus plus my effort, my self-sufficiency, my feeling of purpose in what I do. There is a real sense in which complacency about Christ's sufficiency leads to the captivity of self-sufficiency.\n\nThere are a lot of verses here that we don't have time to unpack everything, but I think what Paul lays out is that he's confronting two different things. One is that they were in danger of religious rituals being added to the equation of Jesus. He actually makes a play on words. The word he uses for \"take you captive\" sounds in Greek a lot like the word for synagogue, which is where the Jewish people would worship. He's making a play on words to make a point: be careful that you don't replace your righteousness in Christ with religious rituals.\n\nAre religious activities—attending church or being part of the body or the things we do in our Christian life—bad? No. But his point is: where is your sufficiency? Where is your wholeness and fulfillment found? Is it Jesus plus the things that you do, or is Jesus sufficient? What he does is point us to the key to avoiding the captivity of self-sufficiency: treasuring Christ's sufficiency above all else. That's why the very next verse says in verse 9, \"For in Christ all the fullness of the deity lives in bodily form.\" He's already made this point—Jesus is the image of the invisible God.\n\n# Sermon Transcript\n\nIn him all the fullness of God was pleased to dwell. He made that argument in verse one. But look what he says in verse 10: \"And you have been given fullness in Christ who is the head over every power and authority. In him you also were circumcised, putting off the sinful nature.\"\n\nWhat he's going to do in these verses is describe the process of how the gospel changes us. In other words, how you receive Christ. If you're not a follower of Jesus this morning, hear these words. This is what Jesus invites us into through his death and resurrection. We put off the works that we try to do to earn God's favor and we receive the finished work of Jesus.\n\nIt says in verse 11: \"In him you are also circumcised with the circumcision done by Christ, not with a circumcision done by the hands of men.\" This is a picture of Jesus's work, not our works. \"You have been buried with him in baptism and raised with him through faith in the power of God who raised him from the dead.\" In verse 13, Paul writes: \"When you were dead in your sins and in the uncircumcision of your sinful nature, God made you alive with Christ. He forgave all your sins. Having canceled the written code with its regulations that was against us, he took it away, nailing it to the cross. And having disarmed the powers and authorities, he made a public spectacle of them, triumphing over them by the cross.\"\n\nWhy does he go into this big explanation of what Jesus has done? Because he wants us to see that the Christian life is not just about how we are saved. The gospel is both how we are saved and how we are sustained. It is not just the starting point of the Christian life—it's the sustaining power. It's not just a moment; it's the movement of the Christian life. He wants us to see and marvel in Jesus. He paid it all.\n\nThe message of Christianity is not \"get your life together to earn God's favor.\" It is \"while we were still sinners, Christ died for us.\" Imagine for a moment the ways that we fall short of God's glory. In our moments of frustration and irritation, we are prone to anger, prone to jealousy, prone to pride. That record of debt—the ways we don't measure up to God—Jesus took all of that at the cross. He said, \"I'm taking all of that record that you owe and I'm going to nail it to the cross.\" That is the literal picture he gives here: the record of debt that we owe to God is nailed to the cross.\n\nImagine for a moment that you had a debt—your school loans—and all of a sudden someone says, \"I have paid that in full.\" But you have this tight budget in your life, and you're thinking, \"I've got to pay these loans off.\" The debt has been paid in full, but you're still operating as if it hasn't. That's his point here. Just as you received Christ by his free gift of grace—by the work of Jesus and not by your works—so continue to walk in that. Walk in the freedom of that. Experience the sustaining momentum of Christ in you.\n\nIn the rest of the passage, he gives these examples. In verse 16, he says: \"Therefore don't let anyone judge you by what you eat or drink or with regard to religious festivals.\" What he's referring to is the Jewish commands and order of how you earn God's favor. Don't think that this is how the Christian life and fulfillment are found. That is Jesus plus religious ritual, and you're doing bad math there. He says at the end of verse 16: \"Do not let anyone judge you about new moon celebrations or Sabbath days. These are a shadow of the things that were to come.\" You're trying to find meaning in a shadow.\n\nI love that even this morning, as we're using flashlights to get around the house, my four-year-old Elijah is fascinated with the shadow of himself on the wall. There's this fascination: Can I touch it? Can I interact with the shadow? What Paul is illustrating is that trying to find fulfillment in religious ritual is like trying to have a relationship with a shadow. What he wants to tell us comes in verse 19, the heart of his argument. \"He has lost connection with the head from whom the whole body is supported and held together by its ligaments and sinews, growing as God causes it to grow.\"\n\nWhat he wants us to see is that complacency about Christ's sufficiency leads to the captivity of self-sufficiency. When that happens, we've lost connection to where true fulfillment is found, where true life is found. The power has been unplugged. When you start adding anything to Jesus as the source of your fulfillment, the power has been unplugged from the Christian life. The invitation is to treasure Jesus, to treasure the work that he accomplished at the cross—that your debt was paid in full and it is nailed to the tree. We bear it no more. He has taken our sin upon himself so that in him we have new life. The invitation here is to live in that life. Just as you received Christ as Lord, continue to live in him.\n\nHe not only gives this picture of adding religious ritual to Jesus; he also gives the picture of adding the philosophies of this world to Jesus. In verse 20, he says: \"Since you died with Christ to the basic principles of this world, why as though you still belong to it, do you submit to its rules? Do not handle, do not taste, do not touch. These are all destined to perish with use because they're based on human commands and teachings. Such regulations indeed have an appearance of wisdom, with their self-imposed worship, their false humility, and their harsh treatment of the body, but they lack any value in actually transforming you and restraining sensual indulgence.\"\n\nWhat he's saying is that the power to become mature in Christ is not yours. Last week we looked at what Christian maturity is. Christian maturity is learning to live into the reality of Christ in you and you in Christ. When you live into that reality, you're connected to the head. You're plugged into the power source. That starts to transform you from the inside out. The message here is simple: Jesus wants us to do good math—gospel math. Jesus plus nothing equals everything.\n\nHe also describes these philosophies of the world. In verse 18, he says: \"Don't let anyone who delights in false humility and the worship of angels disqualify you for the prize. Such a person goes into great detail about what he has seen, and his unspiritual mind puffs him up with idle notions.\" There's an idea that there is some level of spirituality to be found on your own, whether it's astrology or whatever it might be.\n\nI want to ask a question as we close this morning: What are we as East Point Church here in the 21st century in danger of changing the equation of Jesus plus nothing equals everything into? David Brooks is an op-ed writer for the New York Times with an acute awareness of our culture. In a TED talk some years ago, he spoke about lies that our culture tells us. As I was thinking about what philosophies we are in danger of adding to Jesus as our source of fulfillment, I want to highlight three of these lies.\n\nThe first is that career success is fulfilling. Brooks said in that talk, \"I've had a fair bit of career success, and I found that it helps me avoid the shame I would feel if I felt myself a failure. But it hasn't given me any positive good.\" We could fill in the blank with career to say career success, family success, or any kind of success in this world. What would you say Jesus plus this is your fulfillment?\n\nThe second lie he highlights is that self-sufficiency makes us happy. \"If I just win the lottery, lose 15 pounds, do a little more yoga, I will be more happy because I'm more self-sufficient.\" There's that propensity toward control. In actuality, as anybody on their deathbed will tell you, the things that make people happy are the deep relationships of life, the losing of self-sufficiency. What Christ invites us into is something even deeper—the relationship you were created for with the God of the universe, in whom all the fullness of God came to dwell to reconcile us to him. We have that in Christ.\n\nThe third lie is meritocracy. \"You are what you accomplish.\" The myth of meritocracy is that you can earn dignity by attaching yourself to prestigious brands. The emotion of meritocracy is conditional love. You can earn your way to love. The evil of meritocracy is that people who've achieved a little more than others are actually worth a little more than others.\n\nChurch, I want to lean into this for a moment. This myth of meritocracy plagues our political system, the divide between parties, the tensions we feel even in our own families. The equation all of a sudden becomes Jesus plus my tribe, Jesus plus my political ideology, Jesus plus people seeing me as part of that tribe, Jesus plus people seeing me as successful. Jesus plus.\n\nI want to invite us this morning to do gospel math: Jesus plus nothing equals everything. How do we do that? We come back to the sufficiency of Christ again and again and again. When the forgiveness of Christ comes out of focus, that's when we are at risk of complacency. When we are complacent, it leads us to the captivity of self-sufficiency.\n\nHow do we practice this as a church? We talk about being a church that is centered on the gospel, and we come back to this week after week by coming to the Lord's table. The Lord's table is an invitation to remember that the debt is paid. It is nailed to the cross. We come to the table not out of ritual—not thinking that Jesus plus this table equals something in our lives. This is not a magical snack. This is a reminder. It is a way for us to tangibly remember that Jesus is sufficient. He is what we need for fulfillment, and he is what we need to live the Christian life.\n\nAs we come to the table, we remember Jesus's words on the night he was betrayed. He said, \"This is my body which is broken for you, and this is my blood that is shed for the forgiveness of sins.\" Paul tells us, \"As often as we eat this bread and drink this cup, we proclaim the Lord's death until he comes.\" Why do we proclaim the Lord's death? Because we need the reminder that Christ is the one who makes us grow. Christ is the one who saves us. It's not by works of the flesh. It's not by you getting your life together that you earn God's love. He loves you this morning. It's from that place of love that we step into the reality that I'm connected to the power source of the Christian life, and I can walk in the freedom of that. I don't have to walk in the shame of how I did or didn't perform. I can walk in the freedom that Jesus paid it all. All to him I owe. Sin had left a crimson stain. He washed it white as snow. That is our story.\n\nSo we come back to this truth once again: Jesus plus nothing equals everything. As we continue in worship, we're going to respond in three ways. We're going to sing together. We're going to come to the table at any point during the next three songs. If you are a follower of Jesus, we invite you to come to the table. You'll take the bread and dip it in the cup and remember the sufficiency of Jesus and his work at the cross. We'll also have prayer partners on the edge of the room. We respond through singing, through the Lord's table, and through prayer. If you want somebody to pray over you this morning, you don't even have to say what you want them to pray for. You could just say, \"I would love for you to pray for me this morning.\" They are there for you.\n\nI invite you to pray with me as we respond. God, we are so thankful for the good news of Jesus. Lord, I ask that you might...\n\n# Cleaned Sermon Transcript\n\nThis moment surfaces in us. What have we been trying to add to Jesus? Is it the approval of others? Is it religious rituals? Are we trying to approach this season of Lent as an opportunity to feel closer to you out of our own effort?\n\nGod, I pray that you would invite us, even as we respond in singing, to come back to your cross and remember that you paid it all. You're not only sufficient to save us; you are sufficient to sustain us. So I pray for those who are weary this morning. God, I pray that you might bring encouragement, that your power is at work. Your Spirit is inviting us to surrender and to worship you as our everything.\n\nWe pray this in Jesus's name. Amen.","url":"https://www.youtube.com/watch?v=sDyzBRQ-WZQ"},{"id":"nugpG-wVZkc","date":"2026-02-18","title":"What Jesus Means for You","scripture":"Colossians 1:21–2:5","preacher":"Peter Frey","series":"Colossians","desc":"In Colossians 1:21–2:5, we see how the reconciling work of Jesus transforms our identity and purpose. Join Pastor Peter Frey as he shares what Christ’s supremacy means personally for you and how it leads to real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon: First Things First\n\nPlease remain standing for the reading of God's word this morning.\n\nHi, my name is Ashley. Please join me in reading aloud this prayer for illumination. The words will be on the screen.\n\nLord, holy and gracious God, may your Holy Spirit give us a spirit of wisdom and revelation, so that with the eyes of our hearts enlightened, we may know the hope to which Christ has called us, the riches of his glorious inheritance among us, and the greatness of his power for those who believe. Amen.\n\nPlease remain standing as you are able for the reading of God's word from the book of Colossians, chapter 1, verses 21 through chapter 2, verse 5.\n\nOnce you were alienated from God and were enemies in your mind because of your evil behavior. But now he has reconciled you by Christ's physical body through death to present you holy in his sight without blemish and free from accusation. If you continue in your faith established and firm and do not move from the hope held out in the gospel, this is the gospel that you heard and that has been proclaimed to every creature under heaven and of which I, Paul, have become a servant.\n\nNow I rejoice in what I am suffering for you. And I fill up in my flesh what is still lacking in regards to Christ's afflictions for the sake of his body, which is the church. I have become its servant by the commission God gave me to present to you the word of God in its fullness. The mystery that has been kept hidden for ages and generations, but is now disclosed to the Lord's people. To them, God has chosen to make known among the Gentiles the glorious riches of this mystery, which is Christ in you, the hope of glory.\n\nHe is the one we proclaim, admonishing and teaching everyone with all wisdom, so that we may present everyone fully mature in Christ. To this end, I strenuously contend with all the energy Christ so powerfully works in me. I want you to know how hard I am contending for you and for those at Laodicea and for all who have not met me personally. My goal is that they may be encouraged in heart and united in love so that they may have the full riches of complete understanding in order that they may know the mystery of God, namely Christ, in whom are hidden all the treasures of wisdom and knowledge.\n\nI tell you this so that no one may deceive you by fine-sounding arguments. For though I am absent from you in body, I am present with you in spirit and delight to see how disciplined you are and how firm your faith in Christ is.\n\nThis is the word of the Lord.\n\n---\n\nAt this time, we will dismiss the kids in the adventure class.\n\nThank you, Ashley. Good morning, East Point Church. If you're new here and I haven't had the opportunity to meet you yet, my name is Peter and I have the joy of serving as the lead pastor. I love the kids volunteers just waving in the back—have fun, adventurers.\n\nI want to invite you to lunch on March 1st, two weeks away. March is two weeks away—isn't that crazy? Right after the service, we're going to host what we call Explore East Point. This is your pathway to finding your place here in our community at East Point. We'll have lunch together right after the service in the cafeteria. You can learn about who we are and discover how we seek to follow Jesus as a church. You can hear about our serve teams and our community groups and ask our staff team the questions you have about our church. These are your first steps to getting connected into the life of our church. We would love to invite all of you to join us there on March 1st.\n\nStephen Covey—you may know that name from his best-selling book, The Seven Habits of Highly Effective People. He also wrote a book based on the third habit from that series, called First Things First. In some ways it's a self-help book geared toward productivity in the workplace. But his reflection on what it means to put first things first is a helpful starting point for us this morning. He says this: \"Putting first things first means organizing and executing around your most important priorities. It is living and being driven by the principles you value most, not by the agendas or forces surrounding you.\"\n\nWe're continuing this morning in a series through the book of Colossians that we've titled First Things First because Paul is writing to a church that was in danger of letting secondary things become primary. They were being pressured by new teachings, spiritual add-ons, cultural expectations, and persuasive voices. Paul's message is simple but powerful: if Christ is not our everything, we have nothing.\n\nColossians is not a book about productivity. It is a book about priorities. It's about organizing your life, your beliefs, your habits, your identity around what matters most. And what Paul holds out to us is Jesus himself. As we jump into the passage we just read and consider its implications for us today, let me pray for us again.\n\nGod, would you guide us? We need a word from you. We live in a world that is full of voices, full of brokenness, and we are longing to order our lives around what matters most. So Lord, would you turn our eyes to Jesus in these few minutes? Would you help us to see you more clearly? We ask in Jesus' name. Amen.\n\nI want to take us to the heart of the passage we just read, where Paul is defending his ministry. Paul is writing to the church from prison. He has been imprisoned because of his work in the church. We officially launched as a church last week. I want you to imagine this evangelist and pastor who has proclaimed that Jesus is over all, in all, and redeeming all—we looked at that last week—and he has been put into prison. He's writing to the church, and you can imagine if they're receiving a letter from their founding evangelist, they may be confused. \"Paul, you're in prison. We're facing opposition. People don't celebrate the church growing and bearing fruit.\" This is what he says in Colossians 1, verse 28.\n\n\"He is the one we proclaim, admonishing and teaching everyone with all wisdom, so that we may present everyone fully mature in Christ.\"\n\nThis is Paul's thesis statement for why and how he does the things that he does. He says, \"Here's my mission: it is to proclaim Jesus. Why? Because the verses that came before this said he's the image of the invisible God, the firstborn of all creation. For by him all things were created—things in heaven and things on earth.\" He goes on to proclaim that Jesus is first in everything, and that changes everything for Paul. So he says, \"This is my mission: to proclaim Jesus to you. I'm not trying to convince you that I'm a great apostle or evangelist. I'm simply trying to hold out to you the powerful name of Jesus—what we just sang about.\"\n\nI want to share a little insider fact with you. Written on my pulpit is a little phrase. It's a reminder to me each week of why we do what we do. It says: \"Point them to Jesus.\" Church, when we peel back all the layers of why we're planting East Point Church, why we're here in East Durham, the words of Paul in verse 28 capture it all: \"He is the one we proclaim.\" Why? Because we believe that is where the power of the gospel is. Point them to Jesus.\n\nThis is how he describes his mission and his ministry. He says, \"My goal is to present everyone mature in Christ.\" So what I want to do this morning is ask this question: What does maturity in Jesus look like? Here's what I want to hold out to you: Christian maturity is learning to live in the reality of Christ in you and you in him. This whole passage is Paul describing what that looks like.\n\nLet's start with this: You are in Christ, so stay. You are in Christ, so stay.\n\nThat's what he says in verse 21: \"Once you were alienated from God, were enemies in your minds because of your evil behavior. But now he has reconciled you by Christ's physical body through death to present you holy in his sight, without blemish, and free from accusation.\"\n\nThis is the description we looked at last week: Jesus is the hope of everything broken. And where is that hope rooted? It's rooted in his life, death, and resurrection. What is so significant about his life, death, and resurrection? Well, through his life, death, and resurrection, he is reconciling things in heaven and things on earth. He is making peace by the blood of his cross so that we could be reconciled by Christ's physical body through death—to present you holy in his sight. This is the precious reality of the gospel: if you have put your faith in Jesus, your life is hidden in Christ.\n\nI saw an illustration once that I think is helpful for understanding this admittedly abstract concept that you are in Christ, yet it is one of the most central ideas in the New Testament. So I'm going to draw a little picture here. This is you. The message is that through Jesus's death and resurrection, when we put our faith in him, we identify with Jesus so that we are in Christ. When we put our faith in Jesus, your life is in Christ so that his perfect life—what does Paul say?—he reconciled us to present us holy in his sight. I don't know about you, but my life in and of itself is not holy. I fall short of the life that God designed me to live. But Paul says, \"The reality for me is that I was once alienated from God. I was once an enemy, but Jesus has reconciled me so that when God looks at me, he sees Christ, his righteousness, his holiness.\"\n\nSo Paul's message to the church is this: This is your reality. You are in Christ if you have put your faith in him. Receive the free gift of his good news that he accomplished at the cross. This is your reality. His message is stay there.\n\nThis is what it says in verse 23: \"If you continue in your faith established and firm and do not move from the hope held out in the gospel.\"\n\nThis is what Paul's holding out to us this morning. This is what Christian maturity looks like. I'm speaking to you as followers of Jesus. If you're not a follower of Jesus this morning, I want you to listen in because this is the description of what life in Jesus looks like. But for those of you who are followers of Jesus, I want to lean into this: What does maturity look like for you? Paul says, \"To this end I toil. I give my life that you would be mature in Christ.\" This is Christian maturity: learning to live in the reality that you are in Christ. When God looks at you, he sees the holiness, the blamelessness, the goodness, the perfection and beauty of Christ. Why? Because Jesus took our sin upon himself and he paid it all at the cross. He rose so that we could have new life—so that your life is in Christ. So stay there. This is the beautiful invitation of the gospel.\n\nI loved as a child going to the beach and wading out into the surf a little bit. You ever do this? You stand about ten to fifteen feet into the waves and they keep coming in while you just try to stay put. The waves crash in—sometimes it's a little wave, and sometimes it's a big one that hits you at the waist—and you just try to stay. As those waves come in, what happens to your feet? They start to sink down into the sand. I want to suggest to you this morning that Christian maturity is letting your feet sink down into the reality of who you are in Christ.\n\nThe temptation of the Christian life, and the temptation that Paul is trying to combat, is that the Christian life is about adding a bunch of stuff to this foundation. The idea is that if you just get this life hack of reading your Bible for fifteen minutes, and then if you pray this certain prayer, and then you give this amount of money to the church, and then you order your life in this certain way, then you will be holy and blameless and without fault before God's presence. But the message of Jesus is that Christian maturity is not about adding to this. It's about letting your feet sink down into it. And that is such a freeing thing because I don't measure up. If the story was just about my own effort and performance, I would be hopeless. But what does Paul say to us? Don't move from the hope held out to you in the gospel: that you are in Christ.\n\n# Sermon Transcript\n\nYou are in Christ, so stay. I think that's the first thing he wants to encourage us with. The next thing he encourages us with is that this isn't the full picture. Christ is in you as well. So you are in Christ, but Christ is in you. Look at verse 24. He says, \"Now I rejoice in what I am suffering for you, and I fill up in my flesh what is still lacking in regard to Christ's afflictions for the sake of his body, which is the church. I have become its servant by the commission God gave me to present to you the word of God in its fullness, the mystery that has been kept for ages and generations, but is now disclosed to the Lord's people. To them God has chosen to make known among the Gentiles. What is God making known? Paul's working hard to make this known. What is it? Verse 27: To make known among the Gentiles, among all people, the glorious riches of this mystery, which is Christ in you, the hope of glory.\"\n\nLet me make this simple for us. Once you were alienated from God because of our sin. We were separated from God. The life we were designed to have, the fullness of having a relationship with God, was lost to us because of that separation. But Christ has reconciled us to God so that we are in Christ. When God looks at you and you put your faith in Jesus, he sees Christ and his righteousness. And then what does God do? He comes and indwells all of his followers such that Christ is in you. You have hope because you are in Christ, and that hope lives within you because Christ is in you.\n\nHere's what Paul describes in his life and ministry. He says, \"You are in Christ, so stay. Christ is in you. So strive.\" Look at verse 29: \"To this end, I strenuously contend with all the energy Christ so powerfully works in me.\" The message for us this morning is simple. You are in Christ, so stay there. Don't drift from that. Don't move on. We often say in the church that we do not graduate from the gospel of Jesus. The Christian life is about being grounded in it, and that is what Colossians is all about. When we talk about first things first, this is why as we officially launch as a church, we are starting here. We want to ground ourselves in the reality of who we are in Christ.\n\nIf we peel back the layers of our mission of pointing a hurting world to hope in Jesus, we want people to experience this truth: there are all kinds of philosophies out there, all kinds of things that you can try to implement in your life to find fulfillment and wholeness and meaning. But the message of Colossians is here. This is where you find it. So don't move from the hope held out to you. Let your feet sink down into it.\n\nI want us to see that this is not just a passive thing. It is an active engagement of Christ in you—his energy working in you. Look at verse 29 again: \"To this end, I strenuously contend with all the energy Christ so powerfully works in me.\" That word contend means to struggle, to strive.\n\nFor our boys' birthdays, which fall around Christmas, we were trying to do something special to break up the monotony. We took them to Frankie's Fun Park and had them ride go-karts for the first time. They have these doubles go-karts where the boys can sit in the passenger seat with a steering wheel that doesn't actually do anything. I had Elijah with me, and I tried to follow his every move as he turned that steering wheel. We're going around the track and he's turning the wheel, and I'm swerving all over the place. This is the picture of the Christian life.\n\nThere is an invitation to strive, to give yourself, to give your energy to the calling that God has given us to point a hurting world to hope in Jesus. When you discover something that is life-changing, you want to tell people about it. I discover something my phone will do and I get excited at a family gathering: \"Have you guys seen this?\" That's what Paul is saying. The most life-changing reality in all the universe is that there is hope apart from anything you have done or anything you could do. It is based on the righteousness of Jesus, and God has presented you holy and blameless in his sight. So just receive that.\n\nYou are in Christ, so stay there. Christ is in you. His energy is in you, so strive and live that out. He invites you to be part of what he's doing in our world today. He is changing lives. We expect as East Point Church that God is going to change people's lives, and we want to join him in that. Sometimes it's like us sitting in the passenger seat of the go-kart, steering and not really knowing what we're doing. And God is saying, \"It is my energy working through you.\" Don't forget that I am at the steering wheel, that I'm the one who changes lives, and you get to join me in that.\n\nThe message is: you are in Christ, so stay there. Don't try to turn the Christian life into some magical thing of earning God's favor. Stay in the grace of Jesus. Realize this, learn this: Christian maturity is a journey we will all take as a church, moving toward maturity in Christ. That is a journey of learning to live in this reality, that Christ's energy so powerfully works in us, and we want to join Jesus in that. He is making all things new.\n\nAs we embark as a church into this season of Lent, this passage gives us a beautiful invitation. Lent is not about earning anything from God. You are already reconciled if you have received the grace of Jesus. You are already in Christ. Lent is simply a season to slow down long enough to live in that reality. Paul says, \"Continue in the faith, stable and steadfast, not shifting from the hope of the gospel.\"\n\nThese next forty days leading up to Easter are an opportunity to gently ask yourself: Have I shifted? Have I drifted from the hope held out in the gospel? Has something else quietly taken first place? Christian maturity is learning to live in the reality of Christ in you and you in Christ. Lent is an opportunity to practice that. It's not about spiritual performance or spiritual attention. Lent is an opportunity to set aside forty days to prepare ourselves for the resurrection of Jesus that we're going to celebrate. We're going to pull out the stops the weekend of Easter. We're going to throw a block party here on the premises and invite our neighbors to come and celebrate. We'll have a celebration service here on Easter Sunday. But until we get there, we need to settle into why Jesus's death and resurrection even matter.\n\nThe reality is it's about grace. It's about us not deserving anything from God, but him saying, \"I'm going to present you holy and blameless without fault.\" Stay there and strive with all Christ's energy in you to realize that his energy wants to transform you from the inside out. He wants to use you to point a hurting world to hope in Jesus.\n\nLent is not about becoming more impressive Christians. If you choose to give something up in this season so that you can gain more of Jesus, that is not a badge that you earn for God's favor. It is simply a way that you can use the energy that Christ has placed in you to realize who you are in Christ and Christ in you. It's about becoming more rooted Christians. It's not about adding something new, but going deeper into what is already ours. Because maturity is not about moving beyond Christ. It's about learning to live more fully in him.\n\nLet's pray together. God, we thank you for this word. I pray that even this morning as we respond in singing and prayer and come to your table, it would be like we're standing on the shores of your grace with waves after waves of reminders that you are sufficient, that you are over all, that you are worthy of it all. God, would you let our feet sink down into who we are in Christ? Lord, I know some of us have things in life that feel distracting, that feel overwhelming, that maybe feel really broken. Your reconciliation covers all of that. God, I pray that even this morning you would turn our eyes to the power of the cross, that even while I was an enemy of you, you set your love upon me and changed my life. God, we long for you to make all things new, and we thank you that you are doing that. We want to hold on to hope. You've placed the hope of glory within us. Help us to rest in that this morning. Help us to celebrate it and help us to hold on to it even when we don't feel it. We pray in Jesus' name. Amen.","url":"https://www.youtube.com/watch?v=nugpG-wVZkc"},{"id":"Dp1jF4N8Gms","date":"2026-02-10","title":"Who Is Jesus?","scripture":"Colossians 1:15–20","preacher":"Peter Frey","series":"Colossians","desc":"In Colossians 1, Paul reveals the supremacy and glory of Jesus Christ — fully God, creator, and reconciler of all things. Join Pastor Peter Frey as he explores who Jesus truly is and why it matters for real hope and real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: Colossians 1:15-20\n\nPlease remain standing for the reading of God's word. Good morning, Easton Church. My name is Miner, and this is my beautiful wife, Arlet. Today we will read Scripture together—she will read in English and I will read in Spanish.\n\nAll right, good morning everyone. Please join me in reading aloud this prayer for illumination. The words are on the screen for you. Lord, speak
