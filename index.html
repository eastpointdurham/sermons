way near the bathrooms, is that we expect God to change lives. Rooted in that core value, which we're going to talk about this morning, is a fundamental belief that this is not about us. It's not about East Point Church or our abilities to reach people. It's about our belief that God is able to change lives. That's why we're doing what we're doing. That's why we're here as a church. And we want to invite you into that.\n\nThis week, as you came in, you should have received a prayer and fasting guide for our church. Inside, you'll find daily prayer points that we encourage you to join us with over the next three weeks as we corporately ask God to meet us in these things. We'll be praying for those whom Jesus is seeking. Jesus says, \"I have not come for the healthy. I have come for the sick, and I have come to call sinners to repentance.\" We believe as a church that this applies to all of us. Who is Jesus seeking? It's anyone and everyone. We truly believe that we live in a moment in time in the city of Durham where there is a need for hope. That is our mission as East Point—to point a hurting world to hope in Jesus.\n\nIn that guide, you'll find some descriptions about fasting and prayer. Fasting, if you're new to the church, is a practice. It's not just something done inside the church; as a church, we view fasting as a practice, not a formula. It's something we can develop and practice to cultivate our spiritual hunger for God. There are basic instructions in the guide, but we want to invite you to join us on the three Wednesdays leading up to our launch—this coming Wednesday the 7th, the 14th, and the 21st. We encourage anyone who is physically able to fast with us from sunrise to sunset and dedicate that time to praying for the movement of God's spirit here in East Durham.\n\nIf you're not able to fast from food, there's encouragement in the pamphlet to choose something else—perhaps social media or television—and abstain from it to carve out time to seek the Lord. On Wednesday evening at 6:00 p.m., we're gathering at Faith Baptist Church off of Cheek Road. They've opened their doors to us, and we'll have a potluck followed by an evening of prayer and worship together. We would love to have you join us.\n\nI know I'm throwing a lot at you this morning, but it's a new year, and I feel like we need to get on the same page. If you are new with us, you should have received a connect card in your welcome bag this morning. We would love for you to fill that out so we can be in contact with you and share information about what's coming up in the life of our church and ways to get connected. You can fill it out and hand it to myself or someone wearing a lanyard after the service, and we would love to connect you with other things happening in our church.\n\nWell, it's a new year. How many of you made New Year's resolutions? A few of you. I gave up on resolutions a few years ago and started a different practice. Have you seen the practice of choosing a word for the year? Four years ago, right before Christmas, my wife Mary and I welcomed our first child into our home through adoption. As that new year came, Mary and I both chose a word for the year: grace. We decided we would give ourselves grace, rest in the grace of Jesus, and not count how many cups of coffee we had in a day. Year two of parenting rolled around and I chose grace again. By year three, I realized I had a tradition—the year of grace. Well, it's year four and I actually chose a different word this year. It's been an exciting journey as God brought Mary and me to Durham six years ago. It was one of the most disorienting seasons of our lives. Mary was really sick, we moved here for her health, I stepped out of ministry, and we didn't know what God was doing in all of that.\n\nBut in the midst of that, I truly believe that part of the story God was writing was to start giving us a burden for planting a church on the east side of Durham—a church that is able to point people to hope in Jesus. God started building that burden, and as I stand here this morning, three weeks away from officially launching with a room full of people gathered together, it is an exciting moment. I think about why we're doing this, because as we go through life, it is easy to drift. The busyness of our culture pulls us from one thing to the next, from one show to the next task on the list. We go to sleep and wake up and do it again. It's easy to get to the end of a year wondering, \"What did I do? What is my life all about?\"\n\nThe invitation—and what many of us feel excited about in a new year—is the opportunity to reset, to get a fresh start, to recalibrate. Much of the drive behind setting a New Year's resolution or choosing a word for the year comes from a desire within each of us to have a mission, to have a why behind our existence. As I think about that, one of our distinctives as East Point Church is that we are missional. Over the next three weeks, we're going to walk through a sermon series I've called \"Missional,\" and it's who we are.\n\nI want us to think about this word. It's an adjective based on a noun—the noun is mission. We all long for a mission. I want us to view ourselves as East Point Church and ourselves individually. If you are a follower of Jesus, we are called to be missional. That's an adjective that describes how we live. Often, we think about mission as something we go and do, but in this series, I want us to step back and view all of our lives, every aspect of our being, as missional. This thing I do is missional. This aspect of my life, this relationship I have, this space God has placed me in, this neighborhood God has put me in—I am called to be missional.\n\nWhat greater moment for us to consider than the moment when Jesus leaves his followers after his resurrection and gives them his final words in the Gospel of Matthew? Every time we see Jesus on a mountain, we know it's an important moment. Matthew liked the imagery of mountaintops. He was writing primarily to a Jewish audience, and the Jewish audience would have had in their minds Mount Sinai—the place where God met with Moses, gave his people his law, where God's presence came down. The mountain was an important place.\n\nMatthew picks up on this imagery in Jesus's life. We see the Sermon on the Mount in Matthew chapter 5. In Matthew 17, we find the Mount of Transfiguration, where Jesus is revealed in all of his glory to three of the disciples. And we come to Matthew chapter 28—the end of the Gospel of Matthew—where Jesus stands as the resurrected Lord. We need to rewind a couple chapters. Throughout the gospel, throughout his life, Jesus said, \"I came for one mission: to seek and save the lost.\" Then he started talking about how he would die and rise from the dead. His disciples were confused. The moment came—he was crucified, and all hope seemed lost. But three days later, he rose from the dead. The tomb was empty.\n\nIn Matthew 28:16, it says: \"Then the 11 disciples went to Galilee to the mountain where Jesus had told them to go. And when they saw him, they worshiped him; but some doubted.\" Imagine this moment. This leader, this hope, this man who said, \"I have come to bring the kingdom of God. I have come to change everything\"—he was crucified, and it seemed all hope was lost. Jesus had told them he would rise, but somebody rising from the dead? Is that really possible? Yet he had given them instructions: go to the mountain, and there I will meet you. And there he met his disciples.\n\nCan you imagine the moment? Some were worshiping. I joke that my wife Mary has the spiritual gift of spontaneous doxology. She will sometimes just break out singing, \"Praise God from whom all blessings flow.\" My four-year-old son has started this practice too. He'll find that his shoes match and say, \"Praise God from . . .\" It's really cute. Can you imagine the moment of spontaneous doxology when the disciples see that their hope is not dead, that he is alive? But I can also imagine what some of them were feeling deep within their hearts: Is it really true? Is this really him? Is this whole thing really real?\n\nI don't know about you, but I've been there. I stand here this morning, and my faith is imperfect. There are moments when I look at that banner in the hallway—\"We expect God to change lives\"—and I wonder, will he? Is this thing that we're doing as East Point Church really going to make a difference? When they saw him, verse 17 says they worshiped him, but some doubted.\n\nThen verse 18: \"Then Jesus came to them and said, 'All authority in heaven and on earth has been given to me.'\" What comes next is something that if you've been around the church, you've probably heard before. It's described as the Great Commission.\n\n# The Mission of the Church\n\nThe Great Commission is where Jesus gives his followers their marching orders—here's what we're all about, here's our why. When all is said and done, here is your why, East Point Church. But before he does that, he says this: \"All authority in heaven and on earth has been given to me.\" I think this is crucial, and don't miss this—because it comes right on the heels of the disciples worshiping him while some doubted—the mission of the church is based on Jesus's authority and not your ability. The mission of the church is based on Jesus's authority and not your ability or the strength of your faith.\n\nWhen I was in college, I worked for a catering company in downtown Chicago. I would often serve at high-end parties throughout the city. Usually they didn't even tell us what the party was—they just gave us an address and told us to show up and serve. One evening we were sent to a mansion in Lake Forest, Illinois, on the North Shore of Chicago. A van of us servers carpooled together, and when we pulled up, I realized this was no ordinary party. It was the Christmas party for Carl Haas and his racing team. Paul Newman and Carl Haas had formed an IndyCar racing team, and we were serving at the team's Christmas party at Haas's house.\n\nAs a server, I was given a tour of the house. They had an indoor pool area with glass doors that opened onto a giant tent—a fully enclosed ballroom that extended the house. We had access to the entire house and could take guests anywhere. But then they took me down to the wine cellar. I'd never seen a wine cellar before, and this was the largest one I've ever seen. They said to us as servers: \"You have access to the entire house. You can take guests there. But if guests want wine from the cellar, you need to get one of the hosts' permission to take that bottle.\"\n\nWhen Jesus says \"All authority in heaven and on earth has been given to me,\" he's not saying \"I have access to everything.\" He's saying \"I have authority over everything.\" I had access to the entire Carl Haas house, but I did not have authority over that house. Sometimes in the church and in society, we like the idea of God having access. We like the idea of God being an ever-present help in times of trouble. But Jesus has more than access in the midst of all the brokenness, hurt, and injustice in our world. He has authority. Why does that matter? Because he's about to give a mission to his followers, and he wants you to view him as the one who has authority—who has the ability to change lives, not just be present in them.\n\nWhen Jesus says, \"Go and make disciples of all nations, baptizing them in the name of the Father, the Son, and the Holy Spirit, teaching them to obey everything I've commanded you,\" this calling to the church is based in Jesus's authority and not your ability or the strength of your faith. Remember, the disciples worshiped him, but some doubted. Jesus came to imperfect people who have imperfect faith and invited them to be part of his perfect plan in the midst of a broken world. That's what the church is.\n\nJesus says, \"All authority in heaven and on earth has been given to me. Therefore, go and make disciples of all nations.\" Whenever we see \"therefore,\" we have to ask: what's it therefore? The reason we have a therefore here is that Jesus is basing this calling—this mission—on his authority, not your ability. Then he says, \"Go and make disciples.\" In this sentence, there are many verbs in our English translation, but there is one verb in the Greek: make disciples. All the other words are participles. He says, \"Make disciples as you are going, and baptizing them, and teaching them to obey everything I have commanded you.\"\n\nThe mission of the church is focused on making followers of Jesus. Jesus gives us a description of what a follower of Jesus is. If he's giving us the mission to make followers, he's describing how to do that. As you're going in everyday life, do this: baptize them in the name of the Father, the Son, and the Holy Spirit. In the early church and in the church today, baptism stands as a visible picture of identifying yourself with the life-changing work of Jesus's death and resurrection. The first step of being a follower of Jesus is to identify yourself with the life-changing work of Jesus's death and resurrection. Why? Because this changes everything. The founder of our movement did not stay dead. He rose from the dead and said, \"I am giving hope to a hurting world.\" He invites you: \"Come follow me.\"\n\nThe first step to following Jesus and receiving his gift of grace is to identify yourself. I'm not saying—and Jesus is not saying—that baptism is what makes you a follower of Jesus. But baptism is the first step in that journey of identifying yourself. It's the public witness. As a church, we celebrate baptism as a public witness of the work that God has already done in the heart when we identify with Jesus's life-changing work of dying for our sake, taking our sins upon himself, and rising from the dead to give us new life.\n\nI remember the day I took the step of baptism. I had come to follow Jesus. All the truths I had learned in my childhood were simply truths I had learned. But there came a moment when the Spirit of God awakened my heart to what those truths meant for me. I gave my life to Jesus in junior high school. I remember making the decision to be baptized on October 19th. Mary and I have a little liturgy in our house. When we see the clock say 10:19 in the morning—sometimes I catch it during our worship service—we yell out, \"It's 10:19!\" and the other person responds, \"Remember your baptism!\" Why do we do that? Because we want to remember that our identity is found in the death and resurrection of Jesus, not in my ability or the things I've done or the things I've done against God. My identity is not found in that. My identity is found in Jesus's love for me and what he has accomplished through his death and resurrection.\n\nIf you are not a follower of Jesus, this is the invitation of Jesus to you. And if you are a follower of Jesus and you've found your identity in the forgiveness of the cross and the resurrection of the tomb, but you've never been baptized—never taken this visible step of witnessing to the work that God has done for you—I want to invite you into that. We would love to have you profess your faith before our body and take the step of baptism. We're called to invite people to find their identity not in the things they have done or accomplished, but in what God has accomplished for them. That's why Jesus says, \"Go and make disciples.\" A follower is someone who finds their identity in the life-changing work of Jesus's death and resurrection.\n\nThen he says, \"Teaching them to obey everything I've commanded you.\" Why do we teach? Why do I stand here on Sunday mornings? Why do we make the word of God central to the life of our church? Because we believe that all authority in heaven and on earth has been given to Jesus. He defeated our greatest enemy. He died and rose from the dead. He is king. If he is king, we as his followers reorder our lives around everything that he said. Jesus gives us this command to teach people everything he's commanded us. This is why the word of God is central to who we are as East Point Church—because we believe that God changes everything. Hope changes everything. We expect God to change lives. We find ourselves in the midst of God's story. The story is not about you. It's not about me. It's not about East Point Church. It's about Jesus as king. We want to reorder our lives around what he has said to us because we believe that this changes everything.\n\nAs I enter this new year and have made my word for the year \"missional,\" I ask: Why am I planting East Point Church? Why are we planting East Point Church? Why do I exist? I want to view every piece of my life as part of joining Jesus in his work of making all things new. We all long for that.\n\nYesterday I was working in the yard. The boys got a trampoline for Christmas and are very excited about it. But my yard is not very level, so I was digging out the spot for the legs. I said to Elijah, \"Buddy, you can jump on the trampoline while I dig out the holes for these legs.\" He said, \"No, Dad. I want to help.\" He grabbed his little shovel. He wasn't helping much, but he wanted to help. This is who we are inherently from childhood—we're driven to have a mission, not just to exist and jump through life. We're inherently driven to have a mission. And not just that—we're driven to have a mission with somebody.\n\nAfter a few minutes, he lost his balance and fell into the hole. I reached down and said, \"Hey, partner, I got you.\" I pulled him up. About two minutes later, we're digging and I see him intentionally fall into the dirt. He says, \"Dad, can you say it again?\" I say, \"Yeah, here you go, partner. I got you.\"\n\nHere's the beauty of the mission of the church. Jesus is not standing there with individuals saying, \"Go and make disciples.\" He's talking to this group of imperfect individuals who've come together to see the resurrected Christ. In Acts, Jesus says, \"You will be my witnesses. Just tell the world what you've seen, and you will be partners with me.\" Here's the beauty of Jesus's mission. When he says, \"All authority in heaven and on earth has been given to me. Therefore, go and make disciples,\" he's not saying, \"Go and change the world.\" He's saying, \"I'm going to change the world. You want to be part of it?\" He holds out his hand in the midst of our dirt and our doubt and says, \"Hey, partner, I got you. Come join me in my work of changing lives.\"\n\nEast Point Church, I want us to have this perspective as we think about what it means to be missional. It is not that we are here to change East Durham or to change anybody's life. We are here because we believe God is changing lives, and we simply want to join him in that. He holds out his nail-pierced and resurrected hand to you and says, \"Hey, partner, come join me in my work of making all things new.\"\n\nSo what is a follower of Jesus? It's somebody who finds their identity in the life-giving work of Jesus's death and resurrection. That's why he says, \"Baptizing them in the name of the Father, Son, and Holy Spirit,\" and then reordering their lives around his teaching, letting Jesus shape your life. Church, as a church, we're moving into this year believing that God is doing something among us.\n\n# Sermon Transcript\n\nI would love to invite you into a Bible reading plan. If you fill out your connect card, I can email you the PDF. We are going to walk through the New Testament over the course of this year, and it also includes the Psalms and Proverbs. It is an incredible daily practice of opening your lives to the King of Kings who has authority over heaven and earth. He doesn't just have access—he has authority. And he can change your life. He can change mine. He is inviting you to open his word and reorder your life around it.\n\nNotice what Jesus says to them: \"Surely I am with you always to the very end of the age.\" Sometimes when I read the New Testament and the Gospels, I think, \"Man, it would be great to be one of the disciples and see Jesus, to be there on the mountain when the resurrected Christ shows up.\" I wonder if I would be among those who doubted. But here's the beauty of what Jesus tells us when he closes this. He says, \"Surely I'm with you always to the very end of the age. Jesus is here.\"\n\nJesus didn't just leave and ascend into heaven. He told his disciples moments before this, \"It's better that I go away because I am sending another—a helper.\" The Spirit of God empowers the church by his presence. So if you want the world to see Jesus, if you want to know where Jesus is today, he says, \"I am with you always to the very end of the age.\" You can take that as a comfort in the midst of hard seasons of your life. But I also want you to see that as the empowerment of God's presence in the mission of what God has called you to. He is with you. And that changes everything.\n\nWhen I was in high school, I played soccer most of my life, but I went out for track and field in high school to keep in shape. I was mediocre at every track and field event, and my coach said, \"Hey Peter, why don't you try pole vaulting?\" I think it was kind of a deflection—like, \"Peter, go over there with those people. You're not really good at all this other stuff.\" But it turned out I had a natural knack for pole vaulting of all things. I don't know why, but I think some of it had to do with fearlessness. I took to pole vaulting pretty quickly and started excelling in the sport.\n\nWhen my junior year came around, my coach—who was like eighty years old and had never pole vaulted in his life—was an incredible coach. He really wanted me to go to a pole vault camp in Boulder, Colorado. He said, \"We'll find a way. Apply for it, and if you get in, we'll make a way for you to get there.\" This camp was called Elite Immersion with Pat Manson, who holds the world record for pole vaulting over seventeen feet for twenty years straight. He was an Olympic pole vaulter, and the camp accepted only four pole vaulters who would live in his house and train with him for a week. My coach sent an application, I got in, and I flew out to Boulder, Colorado to train with an Olympic athlete for a week. I will say that pole vault is a very useless skill after you graduate from high school, so while this sounds cool, it's really just a story I have to tell.\n\nOne day, Pat took us to the Olympic training center in Boulder. I remember it was four high schoolers arriving at this place that looked like an amusement park. There was a rock wall that went completely across the facility and Olympic athletes training everywhere. We were just standing there with our eyes up in the air looking around when a security guard stopped us because we had wandered ahead. He asked, \"What are you doing here?\" Behind me—and I'll never forget this—Pat Manson, the world record holder in pole vault, put his hands on our shoulders and said, \"They're with me.\" And just like that, we had access to the place. The security guard walked away, and we had a blast.\n\nJesus closes his commission to his followers, to his church, with this: Here's your mission. Make disciples. Make followers. Invite people to reidentify their life not by the story that they've lived, but by the story that Jesus lived. Teach them to reorder their lives around what he said because he's changing lives and he's worthy of being king of your life and mine. And he says, not only that, but when you face opposition and wonder, \"What is my role in all of this?\"—he puts his hand on your shoulder and says, \"They're with me. I have all authority in heaven and on earth, and I have called imperfect and doubting people to be part of bringing good news of great joy that will be for all people. Because Christ is born, he lived a perfect, sinless life, he died for your sins and mine, and he rose to give newness of life.\" Jesus says, \"They are with me.\"\n\nThe mission of the church is grounded in the authority of Jesus, empowered by the presence of Jesus, and focused on making followers of Jesus. That is why we exist at Eastpoint Church. That is why we are launching in three weeks. That is why we are here at Easter. And at the end of each service, we say this benediction: Go in the mercy of Christ. Why do we say that? Because we want you to find your identity in what Jesus has done for you. We tell the story of hope. One of our core values is that we tell stories of real hope. The invitation to follow Jesus is simply saying, \"Jesus changed my story. He wants to change yours too.\" Then we say, go in the mercy of Christ, tell the story of hope, and expect God to change lives.\n\nHe holds out his nail-pierced and resurrected hand to you this morning and says, \"Partner, I got you.\" And surely he will be with you always to the very end of the age.\n\nLet us pray together. Father, we thank you for this word. We thank you that you invite us into your mission of bringing hope to a hurting world. God, would you remind us that it's not about us or our ability or the strength of our faith, but about the authority and power and presence of our resurrected Lord. So we turn our eyes to him this morning in Jesus's name. Amen.","url":"https://www.youtube.com/watch?v=O9lipVkhWM0"},{"id":"kwdfasiR4Z4","date":"2025-12-22","title":"Love in the Midst of Brokenness","scripture":"1 John 4:9–10","preacher":"Peter Frey","series":"John","desc":"In 1 John 4, we see the depth of God’s love revealed through Jesus Christ. Join Pastor Peter Frey as he shares how God’s love meets us in our brokenness and brings real hope for real life. Celebrate Advent with us at Eastpoint Church in Durham, NC.","transcript":"# Cleaned Sermon Transcript\n\nGood morning. It's great to be worshiping with you this morning. My name is Peter, and I have the joy of serving as lead pastor of East Point. We are so glad that each of you are here. If you were brave enough to go to the mall this afternoon the weekend before Christmas, I'd tell you you're crazy. If anyone here loves Christmas crowds and wants to get stuck in a line of cars searching for a parking spot for thirty minutes so you can make your way through hundreds of people to buy something you could have ordered online, you're probably a little crazy. But let's say you're crazy enough to go to the mall today. We all know the experience of getting turned around in the hustle and bustle and losing track of which way the exit is and where you parked your car. So you come to the directory map, and before you make sense of the map, you have to find that helpful red marker that says \"You Are Here.\" It's helpful. It helps you find your bearings in relation to what's around you.\n\nWhether you're joining us here at East Point for the first time this morning or you've been with us for a while, I want to take this opportunity on this Christmas celebration service to help us find our bearings. About three years ago, God began placing in Mary and my heart a burden to plant a church here on the east side of Durham. We began a journey of praying, discerning, equipping, and building a team. This past August, about forty of us began meeting on Sunday mornings, praying for the opportunity to join Jesus in his work of bringing hope to our city. In September, God opened the door for us to meet here in Oak Grove Elementary School, and we began establishing our weekly rhythms as we anticipate publicly launching to the community in January.\n\nThis morning, you're joining us at an exciting moment—really the ground floor of the establishment of a new church. Today's a preview of who we are as East Point before we publicly launch on January 25th. If you're visiting with us this morning, I would love to invite you to jump into our rhythms as a church and be part of what God is doing in the forming of this new church. We pray, \"God, your kingdom come. Your will be done in East Durham as it is in heaven.\" You don't have to wait until January 25th to jump into our community. We'd love for you to join us on Christmas Eve and next Sunday. We meet each Sunday at 10:00 a.m.\n\nThat's the \"You Are Here\" map of East Point Church. But do you ever wish there was a \"You Are Here\" map of life? Have you ever felt like life is a bit like going to South Point Mall the weekend before Christmas? There are countless voices competing for your attention and endless hustle vying for your energy. It's chaotic and crowded. There are expectations and disappointments, hopes and disillusionment. Life often feels like a confusing labyrinth of pain and sorrow rather than a purposeful journey of joy. If you're like me, you sometimes long for a directory you can look at to find your bearings. Which way is up? Which way is down? Who am I? Why am I here? What is this life all about? Where do I find meaning?\n\nI want to suggest that the coming of Jesus—what we celebrate at Christmas, the moment when God took on flesh—is the decisive moment of history when mankind is given the orienting picture of \"You Are Here.\" Hundreds of years before Jesus walked the earth, the prophet Isaiah described his coming like this: \"The people walking in darkness have seen a great light. On those living in a land of deep darkness, a light has dawned.\" John, the gospel writer, picks up on Isaiah's imagery when he describes Christ coming like this: \"The true light that gives light to everyone was coming into the world.\"\n\nWhat is John telling us? If you want to get a picture of \"You Are Here,\" look at the moment when God is here—when God took on flesh. If you want to find light in the midst of the dark, chaotic, and confusing world that you're in, look at where God is. That is what Christmas is all about, and that is why it is so significant in our church calendar. In fact, the new year doesn't actually start with January 1st. It begins with the first Sunday of Advent. Why? Because the coming of Jesus is the decisive moment in history when we find our bearings. When we find which way is up and which way is down, who we are, and what we were made for. Christmas is the starting point for understanding the brokenness and weariness that we feel in the world around us and within our own souls.\n\nTo do that, we look to the God who created us. Christmas is the moment when God came near. He made himself known. We celebrate Emmanuel, which means God with us. This is why Jesus's birth matters—because he came to show us God so that we can discover who we are, how we got here, and how to make sense of it all. During the season of Advent, we as a church have been gazing upon Jesus, seeing him as the source of hope in the midst of darkness. We gaze upon him as a source of peace in the midst of chaos and conflict in our world today. We gaze upon Jesus as a source of joy in the midst of sorrow that we experience daily. And today, the last Sunday of Advent, we turn our eyes to Jesus as the source of love in the midst of a world full of brokenness.\n\nTo be loved is our deepest longing. Yes, we long for hope. We long for peace. We long for joy. But I want to suggest that each of these longings is rooted in our insatiable desire to be loved. We come out of the womb with this insatiable desire. I think everyone here this morning will acknowledge that we have a complicated relationship with love. I would venture to say that there's no one in this room whose longing to be loved has not led to hurt. Whether from family or friends, teachers or teammates, when someone we look to for love lets us down, we become suspicious of love. The lyrics ring out in our hearts: \"What is love? Baby, don't hurt me. Don't hurt me no more.\"\n\nHow would you define love this morning? I think we could all describe the feeling, but the definition is a little bit harder. In 1 John chapter 4, verse 8, we find a mind-boggling claim: \"Whoever does not love does not know God, because God is love.\" Let's think about that for a moment. John doesn't say that God is loving or that God loves. He's saying that God is love. What do we celebrate at Christmas when Jesus stepped into our world? We celebrate the coming of love. This statement—God is love—is saying that God is the one who defines what love is. Love finds its source in God. That insatiable desire deep within all of us, that we long to be loved, comes from God's very nature. God in and of himself is the definition of love. He is the one who defines love.\n\nMichael Reeves, in his book \"Delighting in the Trinity,\" says it like this: \"It is not that God does love, but that he is love. Notice this: all our human notions of love are just a shadow of his own.\" The love that you feel for your spouse or your kids, the love that you long for from the people around you, the love that you experience in the intimacy of friendship or relationships—these are just shadows. As C.S. Lewis says, \"If you find within yourself an insatiable desire that nothing in this world can satisfy, I think the conclusion is we were made for something outside of this world.\"\n\nWhen John says God is love, we have the picture of the Trinity—the word we use to describe God the Father, Son, and Holy Spirit. God is three persons but one being. That's a little mind-boggling. But in that we find the source of love because God, in his eternal nature, has always existed in a loving relationship between three persons. When John says God is love, he is telling us that God is not defined by love as if love was something outside of God. God is the very one who defines love. All of those longings that we feel in this world, Jesus came to satisfy. That is what we celebrate at Christmas.\n\nAs the passage goes on in verse 9, we find that the love of God is not something nebulous that we have to find as if this longing for love is an existential search that you and I spend all our lives trying to find, whether it's looking within ourselves or in the world around us. It is not something nebulous. It is a person who came to find us. That is what we celebrate at Christmas. Love is not something nebulous; it is a person who came to find you. Verse 9 says, \"This is how God showed his love among us.\" The word \"showed\" literally means to make visible. God made his love visible to you in this: He sent his one and only son into the world, so that we might live through him. The love of God is not something nebulous we have to find. It is a person who came to find us.\n\nVerse 10 says that Jesus sacrificially gave of himself so that we might live: \"This is love: not that we loved God, but that he loved us and sent his son as an atoning sacrifice for our sins.\" I want to pause for a moment and zoom out from what we just read. We read the words \"God is love.\" In our culture, if you said that to someone on the street in Durham this morning, that's a pretty politically correct thing to say. Most people would be like, \"Okay, I'll take that.\" But as the passage goes on, we are given a visible picture of what that means. God sent his son. If we look at verse 10, the love of God is rooted in a problem. God's love is rooted in you and me. In our longing to be loved, we have a problem that the Bible describes as sin—the brokenness that exists within ourselves, with one another, and in our world because of our turning from life as God designed it. We don't choose to place the God of the universe, who created you for a purpose, as the king of our lives.\n\nSo what is love? God sent his son to take that problem on himself. That is the good news of Christmas. God entered our mess. He entered our brokenness. He entered our world of sin so that he could take our sin upon himself. This is why Christmas is just an anticipation of Easter Sunday, when Jesus went to the cross to pay the debt that you and I owed because of our sin, and when he raised from the dead so that we might live, as it says in verse 9. This is why Christmas matters. Love took on flesh to take on our brokenness so that we could have that insatiable desire to be loved met—not on our merits, but on his.\n\nTim Keller says this: \"To be loved but not known is comforting but superficial. To be known and not loved is our greatest fear. But to be fully known and truly loved is what we need more than anything. It liberates us from pretense, humbles us out of our self-righteousness, and fortifies us for any difficulty life can throw our way.\" Church, I want you to hear this this morning. You are fully known in all of your mess and brokenness and whatever past you bring into this space. And you are fully loved. That's the message of Christ coming.\n\n# Cleaned Sermon Transcript\n\nYou're here because you know you have this insatiable desire to be loved. But where do you go with all this? John tells us in verse 16. He says, \"We know and rely on the love God has for us. God is love. Whoever lives in love lives in God and God in them.\" I want you to see these two words: to know and rely on. Experiencing the love of God begins with faith. There is a moment of trust that Jesus invites you into where he says, \"This is what you were made for. You were made for a relationship with me. You didn't have to come find some nebulous concept of love. I stepped into your world so that love would be a person you could come to. I came to seek and find you.\" As John says in the opening chapter, it's the picture of simply opening your arms and receiving this love.\n\nMary and I are high school sweethearts. When we were in high school, Mary liked me before I liked her. She would come and give me a hug, and she described me as a brick wall. She'd say, \"You just stood there. I was giving you a hug and you just stood there. What could I have done differently?\" The answer was simple: receive the love. And that is the invitation of the gospel.\n\nSome of you this morning may be a brick wall, perhaps because of hurts from love in your past. Our history with love is complicated, and some of us carry wounds that make it hard to receive love. But God is pursuing you this morning. The message of Christmas is that he stepped out of heaven and entered our world so that you could be loved. Some of you are standing there like a brick wall, and he is inviting you to receive that love.\n\nThe starting point of experiencing God's love is faith. But notice that it continues. It doesn't just stop there. John describes the Christian life as both knowing the love of God—and this is experiential knowledge, not merely intellectual—and relying on it. Some of you this morning know the intellectual truth of Christmas: that God sent his Son into the world, that he came for you. You know that. And maybe it's been years since you've been living with that intellectual knowledge. But this morning you're having trouble believing it in your heart. You're struggling to trust that God loves you in the midst of your mess, in the midst of your brokenness.\n\nThere is an invitation to rely on the love that God has for us. Charles Spurgeon, the great preacher, describes it like this: \"Faith goes up the stairs that love has built and looks out the windows which hope has opened.\" The invitation to you is by faith to go up the stairs that love has built and look out the windows that hope has opened. See this morning that you are loved. And that is what Jesus decisively entered our world to say: God is here. When you ask the question, \"Where am I?\" the answer is you are loved. God is here. That insatiable desire that God has placed in each of us to be loved is answered in Christ.\n\nWe know and rely on the love that God has for us. God is love. Notice these words: \"Whoever lives in love lives in God and God in them.\" Here's what happens when our lives start to be filled with the love of God: it starts to transform us. Paul describes it in 2 Corinthians 5 this way: we are gripped and compelled by the love of Christ. It takes hold of us in such a way that it transforms how we live. We start to see people differently. We start to see our world differently. We start to operate in and out of the love of God. That's what he's describing when he says, \"Whoever lives in love lives in God and God in them.\"\n\nWhen our lives start to look like a life of love, what does that suggest to the world? That God is here. That is the message of 1 John 4. He goes on to say, \"Let us love one another as Christ has loved us.\" I want to suggest this for East Point Church: that our prayer is this—that the love that flows out of the place of being loved by God would suggest that God is here in East Point, that he's still on the move, that he's still changing lives. The brokenness that we see in our community is not the end of the story. And the brokenness that you feel within yourself is not the end of your story either, because God is here. Emmanuel. God with us.\n\nSome of you this morning need to receive this message for the first time. You need to hear these words: you are loved by God. He sent his Son to be an atoning sacrifice for your sins so that you could live and find life as it was meant to be lived. I invite you by faith to turn your eyes to Jesus.\n\nSome of you this morning need the reminder that you are loved. I picked up a little liturgy from a book called Habits of the Household that I do with my son Elijah, who is four years old. Today's his birthday. For probably a year and a half, I've been doing this with him on and off. I tell him, \"Elijah, do you know that I love you no matter what good things you do?\" He says, \"Yeah.\" I say, \"Elijah, do you know that I love you no matter what bad things you do?\" He says, \"Yeah.\" I say, \"Who else loves you like that?\" He says, \"Jesus.\"\n\nAbout a month ago, he made an unwise decision, and we were talking through it. He looked up at me and said, \"Dad, do you love me no matter what bad things I do?\" The beauty of that moment was that he knew what I was going to say. He just needed to hear it. Some of you need to hear this this morning. You are loved. You are loved. And that is the good news of Jesus for us this morning.\n\nPaul says in Ephesians 3, \"I pray that you would know the height and depth and width and length of God's love. This surpasses understanding.\" I want to suggest that the invitation of Jesus for you is to take one more step in the direction of Jesus's love, because there is a limitless supply for you to experience. As John says, we know it and we rely on it. That's the invitation for us this morning.","url":"https://www.youtube.com/watch?v=kwdfasiR4Z4"},{"id":"wvppHJFAPdg","date":"2025-12-22","title":"Joy in the Midst of Sorrow","scripture":"John 16:16–24","preacher":"Peter Frey","series":"John","desc":"In John 16, Jesus promises a joy that rises even through sorrow. Join Pastor Peter Frey as he shares how Christ transforms grief into lasting joy. Experience real hope for real life this Advent at Eastpoint Church in Durham, NC.","transcript":"# The Paradox of Joy in a Weary World\n\nGood morning, East Point. It is great having you worshipping with us. There are many paradoxes of life. A paradox is when two realities that appear to be contradictory are put together, but when you peer beneath the surface, you find a depth of meaning in those two realities coexisting. For example, the more connected we get, the more isolated we feel—a paradox of our culture today. Or consider the famous buttered cat paradox: cats always land on their feet, but buttered bread always lands butter side down. So the question becomes, if you strap buttered bread to the back of a cat, what would happen?\n\nMy wife Erin and I have a hairless cat that's creepy-looking, and he is always cold. We've always known we have to be really careful about the dryer because he would want to crawl in it. Whenever we have people house-sitting, we put a note on the dryer: \"Check for Harry.\" We do a Harry check anytime we start the dryer. Guys, we've had this cat for six years. Last week I started the dryer with Harry in it. Thankfully, I did a Harry check and found him in the dryer. He's fine. Let's not put this online.\n\nHere's another paradox: the only constant is change. In many ways, the Christmas season feels like a paradox. We've got songs like \"It's the most wonderful time of the year,\" and we wear sweaters sporting the words \"merry and bright.\" Yet this week in our calendar year marks the shortest days of the year. Sunlight is limited. Your schedules are probably slammed. Expectations are high. For many, the season feels frazzled and dark rather than merry and bright.\n\nThe temptation for all of us is to run from the paradox, to hide the tension we feel beneath the tinsel and toys, to turn up the music a little louder so that the weight we carry might feel lighter. However, the season of Advent is an invitation not to run from paradox, but to embrace it. During this season we pause to ponder the great paradox—the greatest paradox of all of history—the moment when God became a man, fully divine and fully man. It is here, as we reflect on the incarnation when God took on flesh, that we hear the words of the angels ring out: \"Do not be afraid. I bring you good news that will cause great joy for all people. Today in the town of David a savior has been born to you. He is the Messiah, the Lord.\" These iconic words mark the coming of Christ and declare good news of great joy, ringing out in the night with a sentiment of paradox.\n\nIf the coming of Jesus is good news of great joy, why do I feel so much sorrow? In a world still full of sorrow and sighing, darkness and depression, grief and gloom, the question I have for us this morning is: how do we experience the joy that the coming of Jesus brings?\n\nI imagine that Jesus knew his disciples would be wrestling with this as he was headed to the cross. In John chapter fourteen, verse seventeen, we have what's called the farewell discourse—a moment when Jesus sits down with his followers and gives them a last encouragement before he heads to his crucifixion. Essentially, John chapters fourteen through seventeen are Jesus' encouragement and prayers for his followers as his time on earth is coming to a close. Jesus knows that there are plenty of things in this weary world that will trouble our hearts. So how do we experience joy in a weary world becomes part of Jesus' theme in these chapters.\n\nThree times in these chapters, we see Jesus point us to joy as one of the purposes of his coming. In John fifteen, verse eleven, he says, \"I have told you this so that my joy may be in you and that your joy may be complete.\" In chapter sixteen, the passage we just read, he says, \"So with you, now is your time of grief, but I will see you again and you will rejoice and no one will take away your joy.\" And a couple verses later: \"And your joy will be complete.\" Jump to chapter seventeen, verse thirteen: \"I'm coming to you now, but I say these things while I am still in the world so that they may have the full measure of my joy within them.\"\n\nIt is clear in Jesus' farewell discourse with his followers that Jesus wants you and me to experience joy—not just a little joy tossed in the Christmas season, but comprehensive, complete, and full joy. When we consider the overarching purpose of the book of John, which we see clearly in chapter twenty, verse thirty-one, it says, \"These are written so that you may believe that Jesus is the Messiah, the Son of God, and that by believing you may have life in his name.\" If we take the purpose of the Gospel of John—that you may have life, real life, abundant and full life—and if we take Jesus' words in the farewell discourse that he wants you to have complete and full joy, I think we can make a connection: the life found in Jesus is meant to lead us to joy in the midst of sorrow. There is a connection between these two things.\n\nLet us explore that here in John chapter sixteen. Focus on verse twenty-two: \"So with you. Now is your time of grief, but I will see you again and you will rejoice. And no one will take away your joy.\" Let these words sink in. When it comes to the Christmas season, there is a lot of joy that has a shelf life. I was talking with my family the other night about what we're giving our boys for Christmas, and I was doing what I call joy math in my head—how long is that going to last? When is that going to end up in the corner as we look for the next thing? We know what joy with a shelf life looks like, but Jesus is describing something categorically different. A joy that nothing and no one can steal. That is enticing to me, and yet it feels like a paradox. How can that exist in a weary, sorrowful, dark, and gloomy world?\n\nHere is what I want us to grasp this morning as we reflect on these verses: the coming of Jesus turns anguish into a joy that is not stolen by sorrow. The coming of Jesus turns anguish into a joy that is not stolen by sorrow. Notice in the verses leading up to this that the disciples are confused about what Jesus is talking about. He says that right now you are experiencing grief, but in a little while you are going to experience joy. Right now the world is rejoicing, but they don't realize Jesus is talking about what is about to happen. Jesus is about to go to the cross, the moment when the world rejoices.\n\nWhy does the world rejoice? Well, John says that Jesus was the light that entered the darkness. What does darkness feel about light? It exposes it. There is something convicting about that. What we find in the gospel narratives is that what took Jesus to the cross was that the world rejoices in self-sufficiency rather than the light that came to bring real and abundant life. So Jesus is describing the moment when he will go to the cross and the world rejoices. But he says, \"Your anguish will turn to joy. Your grief will turn to joy.\"\n\nNotice how Jesus describes this in verse twenty: \"I tell you you will weep and mourn while the world rejoices. You will grieve, but your grief will turn to joy.\" Then he gives an illustration: \"A woman giving birth to a child has pains because her time has come, but when her baby is born, she forgets the anguish because of her joy that a child is born into the world.\" The coming of Jesus is a coming that turns anguish into joy. It is a joy that does not diminish or ignore the pain, but finds delight that far outweighs all of it. This is what Jesus holds out to his disciples—a gladness, a deep gladness of the heart that cannot be taken by circumstances. He is describing a gladness of heart that is only found in the coming of the one who was able to rob the grave.\n\nHear this: the joy of Jesus cannot be robbed from you because Jesus has robbed the grave. Our greatest enemy in life—death itself—Jesus went to take that upon himself so that you and I could experience life to the full, so that we could experience joy. His death is a moment of sorrow and grief for his disciples, but joy is coming. Why? Because three days later he rose from the dead, and we find the glorious truth that the resurrection anchors our hope and secures our joy. He describes a joy that is coming, a joy that has come, and we sit here this morning in the tension between the two.\n\nIsaiah chapter thirty-five describes a day when sorrow and sighing will flee. Every time I read those verses, I say, \"Come, Lord Jesus.\" We live between the now of what is and what is to come when Jesus will make all things new. There is a joy coming that is free from sorrow, but what Jesus came to bring and has brought and offers to you this morning is a joy in the midst of the sorrow—a joy that cannot be stolen by sorrow. There is a joy coming when sorrow and sighing will flee, but that hope produces a joy in the midst of the sorrow and sighing. This is the message of Advent.\n\nWhen God took on flesh, when he stepped into our messy world, the God of all joy, the God of eternal joy, experienced our sorrows so that in our sorrows, we would experience lasting joy. This is the message of Christmas. The God of eternal joy, who in and of his own existence is delight and joy, experienced our sorrows. He became the man of sorrows so that in our sorrows, we would experience lasting joy—something that cannot be stolen from you.\n\nThe invitation of this passage is that there is joy not in spite of, but in the midst of what you are carrying this morning. Some of you are counting down the days to Christmas and feeling the weight of busyness and the pressures of family expectations. Some of you are sensing conflict that is impending. Jesus invites you into something that can coexist with the tears, that can coexist with the sorrow, that can meet you in the midst of what you are walking through. Why? Because he has been there. Just a few chapters before this, we find him at the funeral of Lazarus, and we find those famous words: \"Jesus wept.\" Then he turns to Mary and Martha and says, \"I am the resurrection and the life. Because I live, you also will live.\" Because he lives, we have a joy that cannot be robbed by the sorrows of this world.\n\nC.S. Lewis described joy as an unsatisfied desire which itself is more desirable than any other satisfaction. Let that sink in. That unsatisfied desire—that longing for something greater than our present experience of reality—that unsatisfied desire which in itself, grounded in the hope of the resurrection, is more desirable than any other satisfaction. That is true and lasting joy. We have a hope that anchors us and a joy that gives us stability in the midst of what is.\n\nJohn Piper describes this in his Advent book, *The Dawning of Indestructible Joy*: \"The meaning of Christmas is that what is good and precious in your life need never be lost, and what is evil and undesirable in your life can be changed. The fears that a few good things that make you happy are slipping through your fingers, and the frustrations that the bad things you hate about yourself and your situation can't be changed—these fears and frustrations are what Christmas came to destroy.\" It is God's message of hope this Advent that what is good need never be lost and what is bad can be changed. Jesus said your sorrow I will turn to joy. There will be a day when sorrow and sighing will flee.\n\nPaul describes in Second Corinthians chapter six, verse ten: \"Sorrowful, yet always rejoicing. Poor, yet making many rich. Having nothing, yet possessing everything.\" I think embedded in that description of life is the key to joy in the midst of sorrow—possessing nothing and yet having everything. That is what Jesus offers to us. Those things that have a shelf life will come and go.\n\n# Sermon on Advent Joy\n\nThose hopes and expectations you have for the next two weeks—the things you hope will work out—they will eventually fade away. Those joys are temporary. Did you know a Twinkie only has a shelf life of twenty-six days? It's a misnomer that it could survive a nuclear bombing. A Twinkie will expire. The joys of Christmas as our world knows it will fade away. But Jesus also offers us a joy that will last.\n\nJesus uses the illustration of a woman in labor. Several years ago, Mary started studying to become a doula, to come alongside women in labor and birth and help them through that process. She would come home from meetings with couples and talk about how her job is to help these women know that they can get through this and that joy is on the other side. She often describes that bliss right after the baby arrives, where the anguish of the moment dissipates. Is she still in pain? Yes. But the child has arrived. The joy has come.\n\nAs a church in the season of Advent, we sit in the paradox of joy. We sit in the paradox that there is pain, that there is sorrow, that there is injustice, that there is a weary world that we walk through. And there is joy. The delight of what has come in Christ far outweighs our present suffering. As it says in 2 Corinthians chapter 4, these light momentary afflictions are preparing for us an eternal weight of glory beyond all comparison. We look not to what we see, but to what we do not see, for what is seen is transient, but what is unseen is eternal.\n\nThe incarnation—God taking on flesh—is the tangible embodiment of the gospel reality that sorrow and joy can coexist. So Advent invites us to peer into the crude accommodations of Christ's birth, to hear the cries of agony from a teenage mother, to imagine the tears pouring down her cheeks, to feel the tension of chaos as moans of delivery were drowned out by the blaring bellows of cattle. It's here that we find, lying in the stench of a stable, the God of eternal joy. Advent reminds us of the hope that joy is coming and sorrows and sighing will one day flee. But until that day, we return to the manger to remember that joy entered our sorrow so that in our sorrow we may have joy. This is the invitation of the gospel.\n\nIf you're here this morning and you don't even know what that kind of joy is, Jesus is holding out an invitation of faith. At the heart of all of this, Jesus is saying: you want to experience delight and gladness in your heart that isn't dependent upon circumstances? You have to step out and trust me. I am the resurrection and the life. I am the one your soul is created for. The invitation of Jesus to you today is to trust him. Say, \"I don't want to trust in myself because that has a shelf life. But I want to put my trust in the one who overcame the grave, who is eternal, and whose joy will outlast any sorrow.\"","url":"https://www.youtube.com/watch?v=wvppHJFAPdg"},{"id":"OjegW5OPfq8","date":"2025-12-10","title":"Peace in the Midst of Chaos","scripture":"John 14:25–31","preacher":"Peter Frey","series":"John","desc":"In John 14, Jesus promises His followers a peace the world cannot give. Join Pastor Peter Frey as he shares how we can find calm in the midst of chaos through Christ. Experience real hope for real life this Advent at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: Peace in the Midst of Chaos\n\nPlease remain standing as you are able for the reading of God's word from the Gospel of John, chapters 14, verses 25-31.\n\n\"All this I have spoken while still with you. But the advocate, the Holy Spirit, whom the Father will send in my name, will teach you all things and will remind you of everything I have said to you. Peace I leave with you. My peace I give to you. I do not give to you as the world gives. Do not let your hearts be troubled and do not be afraid. You heard me say, 'I am going away and I am coming back to you.' If you loved me, you would be glad that I am going to the Father, for the Father is greater than I. I have told you now before it happens, so that when it does happen, you will believe. I will not say much more to you, for the prince of this world is coming. He has no hold over me, but he comes so that the world may learn that I love the Father and do exactly what my father has commanded me. Come now, let us leave.\" This is the word of the Lord.\n\nGood morning, East Point Church. I want to dismiss the older adventurer kids to their class at this time. Thanks for hanging with us at the beginning of the service as we celebrate this second week in Advent. I want to encourage each of you. There are postcards on the hightop table in the lobby as you came in, and they're a great way to invite a friend or neighbor—someone who might be interested in joining us on the 21st, especially as we have a special Christmas celebration service. Then on the 24th, Christmas Eve, we'll have a service here at Oak Grove at 4:00 p.m., celebrating what we just sang: Emmanuel, which means \"God with us.\"\n\nI have prided myself as someone who loves Christmas. Mary and I celebrate early and celebrate long. We've created a tradition where we start celebrating on November 1st—putting up the tree, decking the halls. I love Christmas. I've always been a little cynical of people who are cynical about it. There are those who say you can't start singing Christmas songs until after Thanksgiving. I understand that perspective, but I've also been cynical of those who despise the Christmas season. You probably know someone like that, the Scrooge who comes December and says \"Bah, humbug\"—which literally means \"I don't buy it. I don't buy all the hype, all the excitement.\"\n\nHere's my confession to you this morning: as someone who has been cynical of people who are cynical about Christmas, I have to admit that as I get older, that cynicism is starting to sink in. The cynicism of this season's sentimentality is growing on me. Mary and I used to pride ourselves on watching as many Christmas movies as possible. But this year, I just don't have that desire. I think it's the sentimentality of them all—everything wrapped up in a perfect bow. The person off in New York City comes home to their hometown, falls in love, and it all works out perfectly in a Hallmark story. I don't buy it. The older I get, the more years I walk this earth, the more I see that the sentimentality of Christmas is an escapism from the brokenness in our world.\n\nWe all feel the darkness that we read last week in Isaiah chapter 2—the people walking in darkness, that doom, that gloom. But it also says they have seen a great light. I want to lay my cards on the table: I still love Christmas. But it's more the advent of Christmas—the coming of Jesus into the darkness. The people walking in darkness, as it says in Isaiah 9:2, have seen a great light. So I still love decking the halls with Christmas lights. But Scrooge said \"Bah, humbug\" because he had seen too much life to believe in Christmas anymore. He had been disappointed enough, hurt enough, worn down enough to decide this was all pretend. Peace is a fairy tale.\n\nWe live in a world louder than Scrooge ever did, but we're no less skeptical. We scroll through war zones. We carry worry. We live with inner noise aching for quiet. So when Advent arrives talking about peace on earth, it rings out with a feeling of sentimentality—not too different from the fleeting feeling of empty words printed inside a fortune cookie: \"Good things are coming your way.\" When we talk about Christmas being peace on earth, if you're like me, you might not say it out loud, but I think we all feel a little bit of \"Bah, humbug. I don't buy it.\"\n\nBut Advent invites us into something different. Advent was never meant to be sentimental. It's defiant. It declares peace not in the absence of chaos and darkness, but in the midst of it.\n\nDuring this Advent season, we're walking through a series we've called \"A Weary World Rejoices.\" We all feel the weariness of the world we walk through—the darkness, the chaos. What I want to suggest that we celebrate as Christians in the season of Advent is that we do not celebrate the absence of darkness. We celebrate the themes of Advent in the midst of it. Last week we considered hope in the midst of darkness. This week we come to the theme of peace in the midst of chaos.\n\nOur culture longs for peace. This is one of the themes of Advent that perhaps appeals to our culture. If you walk through the four themes of Advent—hope, peace, joy, and love—everybody on the street is longing for these things. But the question that surrounds Advent is: Where do we get them? Where do we find hope? Where do we find peace? Where do we find joy? And where do we find love in the midst of a broken world?\n\nIn one of the Peanuts cartoons, Lucy says to Charlie Brown, \"I hate everything. I hate everybody. I hate the whole wide world.\" Charlie says, \"But I thought you had inner peace.\" Lucy replies, \"I do have inner peace, but I still have outer obnoxiousness.\" Our culture has an obsession with the idea of inner peace. There are all kinds of life hacks and pathways to trying to produce inner peace. But what we celebrate this morning—and I want you to hear this clearly—what we celebrate in Advent is that peace is not something we produce. It is a person. And his name is Jesus.\n\nWe come this morning to John chapter 14, where Jesus is just a day before he is about to head to the cross, and he's talking with his disciples. Scholars call this section of chapters 14 through 17 \"the last discourse\"—these final words that Jesus has with his disciples. Jesus knows that his disciples are looking at what's ahead. He's saying \"I'm going to have to die,\" and they are feeling troubled. Jesus knows it, and so John 14 begins with the words \"Let not your heart be troubled.\" Then later in this passage, we come to Jesus's beautiful words where he says, \"Peace I leave with you.\"\n\nPeace is something that not only our culture longs for, but all of time we have longed for peace. Let's define peace as wholeness, because I think this is the biblical vision of peace. Peace is not just the absence of conflict but the wholeness that you and I long for—where we feel complete, where we feel whole. This longing is embedded in the Old Testament expectations of the kingdom of God. If we trace this throughout the scriptures, we find in the book of Numbers this prayer that I pray over my kids every night: \"The Lord bless you and keep you. The Lord make his face shine upon you and be gracious to you. The Lord turn his face toward you and give you peace.\"\n\nIn Psalm 29:11, it says, \"The Lord gives strength to his people. The Lord blesses his people with peace.\" In Isaiah 52, there's an expectation of coming peace with the kingdom of God: \"How beautiful on the mountains are the feet of those who bring good news, who proclaim peace, who bring good tidings, who proclaim salvation, who say to Zion, 'Your God reigns.'\" And just a couple chapters later, Isaiah says, \"All your children will be taught by the Lord, and great will be their peace.\"\n\nThere is this expectation woven throughout the scriptures. In Isaiah 57:19, it says, \"Peace, peace to those who are far and near, says the Lord, and I will heal them.\" The promise in Ezekiel 37 is, \"I will make a covenant of peace with them. It will be an everlasting covenant. I will establish them and increase their numbers and I will put my sanctuary among them forever.\" In Haggai 2:9 it says, \"The glory of this present house will be greater than the glory of the former house, says the Lord Almighty. And in this place I will grant peace, declares the Lord Almighty.\"\n\nSo when we come to the words that we read in Isaiah 9:6—\"For to us a child is born, to us a son is given and the government will be upon his shoulders and he will be called wonderful counselor, mighty God, everlasting Father, Prince of Peace\"—this isn't a sentimental term. This is a term loaded with longing and expectation of the people of Israel. It is a word that is loaded with longing and expectation in each of us this Advent season.\n\nIf you look at the world around you, if you look at your season, how many of you describe December as chaotic? It often feels that way. But it's not just our schedules and our busyness. It's the brokenness. It's the conflict. It's the injustice and pain that we see all around us. And in the midst of a world walking in darkness, a light has dawned. Jesus says, \"My peace I leave with you.\"\n\nThis is the message of the angels in the fields that night when Jesus was born. They say, \"Glory to God in the highest and on earth peace to those on whom his favor rests.\" These words of peace are embedded in all of our Christmas carols: \"Peace on earth, goodwill toward men.\"\n\nIn John 14:26-27 we read, \"But the advocate, the Holy Spirit, whom the Father will send in my name, will teach you all things and remind you of everything I have said to you. Peace I leave with you. My peace I give to you. I do not give to you as the world gives. Do not let your hearts be troubled and do not be afraid.\"\n\nI want to highlight three things about the peace that Jesus came to bring. They're a person, a place, and a thing. Should be easy to remember: a person, a place, and a thing.\n\nThe first is that Jesus wants us to see here in John 14 that peace is a person and not circumstances. Jesus says, \"I know that trouble is coming. I know that your hearts are troubled. I know that there is chaos and confusion, that there is darkness and brokenness.\" And he says, \"Peace I leave with you.\" What is he talking about? He's talking about his Spirit. This is what we have to understand when we think about peace. Peace is not something we look within ourselves to find. It is something found in the presence of Jesus. Jesus gives us this promise when he leaves his disciples. When he goes to the cross, he rises from the dead, and he says, \"It's better that I go away. Why? Because I'm sending my helper, and you will be in the presence of this living God who raised Jesus from the dead. I will dwell within you. I will make my home in you.\" This is the promise of Advent: peace is not found in the absence of conflict. Peace is found in the presence of Jesus. Peace is not found in circumstances. Peace is found in Christ.\n\nThe invitation of Christmas, the invitation of Advent, is that amidst the chaos, the confusion, the darkness, the pain, the brokenness that we feel, Jesus says, \"I will be with you.\" Why that makes a difference is what Jesus says a few verses later in verse 30. He says, \"The prince of this world is coming. He has no hold over me.\" Jesus says that there is a war. There is a conflict at play. There is a prince of this world—he's talking about Satan's scheme to bring darkness and pain and break the relationship between you and me and the Creator who loves us and made us for relationship with him.\n\nThe prince of this world is coming. He has no claim on me. Why the presence of Jesus matters, why the presence of Jesus brings peace in the midst of chaos, is that he is victorious. He went to the grave and he rose from the dead so that anyone who puts their trust in him can say the same is true of me: the prince of this world has no hold on me. Jesus invites us to trust that his presence with us means that we can face the darkness and chaos of this world, knowing that he has already overcome it.\n\n# The Peace of Christ\n\nHave confidence. Have any of you done those crazy ninja warrior or Spartan races? Tony has. Imagine entering an epic obstacle course with twists and turns, mud patches, and things to climb. Now imagine doing it for the first time, alone. But then imagine the scenario where you have somebody who's already done it—someone who knows the twists and turns, who knows the hardships, who knows what to look out for.\n\nJesus says to his disciples in John 16:33, \"I've told you these things, so that in me you may have peace. In this world you will have trouble, but take heart. I have overcome the world.\" This is what I mean when I say peace is found in a person, and his name is Jesus. He is a wonderful counselor, mighty God, everlasting father, the prince of peace. We celebrate that he has come. As John tells us in John 14, Jesus is coming into this world. By his spirit indwelling his church, he gives peace in the midst of a broken world.\n\nBut that is not the end of the story. What we celebrate in Advent is that Jesus has promised he will come again. When he comes, he will bring perfect peace. He will bring conflict to an end. The brokenness will be made whole. Justice will reign. This is our hope: there is a promise of peace, and it is found in a person whose name is Jesus.\n\n**Peace is found in a place.** Look at what he says just a few verses before this in John 14:18. \"I will not leave you as orphans; I will come to you. Before long, the world will not see me anymore, but you will see me. Because I live, you also will live. On that day, you will realize that I am in the Father and you are in me and I am in you.\"\n\nWhat is Jesus saying here? He's saying that in Christ you have a place, and that produces peace. He says, \"I'm not leaving you as orphans. You are not on your own. I am adopting you as a child.\" Notice how all of Advent goes back to Isaiah 9:6. He is a wonderful counselor. He is the mighty God. That is who he is. But what does he do? He is your everlasting father. He is the one who cares for you. He says, \"I do not leave you alone as orphans, but I will be with you, and you have a place in the triune community of God.\"\n\nNotice what he says in verse 20. \"On that day when he comes, you will realize...\" I want to suggest that Advent is this realization that we don't even have the full picture yet of what true peace, what truly having a place looks like. On that day when he comes, we will realize that Jesus is in the Father, we are in Jesus, and Jesus is in us. The promise is that you have a place in God and God has a place in you. That realization produces peace.\n\nNotice what Jesus says the Spirit will do in the lives of his believers in this passage in John 14. He says the Spirit \"will cause you to remember everything I have taught you.\" What does it look like to walk in peace? The Spirit of God wants to call to remembrance your place in Christ. When you are overwhelmed, when darkness, when brokenness seems too great, the Spirit of God wants to call to remembrance who you are in Christ—that you have a place and that peace is found in a person.\n\n**Peace becomes our thing.** When Jesus becomes our peace and we realize we have a place in Jesus, peace becomes our thing. Mary and Elijah are in a stage where they've decided their thing is exotic fruits. They decided their thing is they want to pursue this together and it's really cute. But what is your thing? What wakes you up in the morning?\n\nI want to suggest that when Jesus becomes our peace, when we really let this sink in that we have a place in the family of God and that is a place of peace, the invitation of the gospel is that peace becomes our thing. It says in 2 Corinthians 5 that if you've been reconciled to God, you have a ministry of reconciliation. Your part in this world becomes that we are a people of peace. We want to pursue the peace of our city.\n\nSo while we have peace in the midst of chaos, and that peace exists even amongst conflict, we are a people who pursue peace in the midst of that conflict. Not just inner peace, but peace that extends into the nooks and crannies of our society. This is who we are as East Point Church. We tell the story of real hope—that there is both brokenness and there is peace, and we long to see peace enter that brokenness. We want to be part of that. We want to make that our thing.\n\nIt says in Colossians 3:15, \"Let the peace of Christ rule in your hearts. As members of one body you were called to peace.\" Notice the calling of followers of Jesus: you were called to peace. What does this look like? We want to be a church that pursues peace at the cost of the cross. We want to be a church that pursues peace that extends beyond racial, economic, and social boundaries. We want to be a people of reconciliation, bringing people together. Why? Because Jesus is our peace and he has given us a place in his family.\n\nSo who we are as a church is we say there is a place for you here. That is the invitation of the gospel, and that is the invitation of East Point Church: there is a place for you here—not only as a guest but as family. That is who we are. The peace of God becomes our thing.\n\nPeace is a person. It's found not in the absence of chaos, but in the presence of Jesus. Peace is a place. It is having a place in the family of God. Jesus does not leave us as orphans. He leaves us as sons and daughters of the king. We believe that our king has come and he is coming again, and peace becomes our thing.\n\nIn Ephesians 2, after the glorious truth of the gospel that you were dead in your trespasses and sins—this is who we are apart from Jesus—he says, \"But God, verse 4, made us alive together with Christ. By grace you have been saved. This is not of yourselves, so that no one can boast. You are God's workmanship, created in Christ Jesus for good works.\" Then comes the first command, halfway through the book of Ephesians: \"Remember, remember that you were once far away and you have been brought near.\" And then he says, \"He himself is our peace, making the two one.\"\n\nHe's talking about the radical racial division between Jews and Gentiles. The two become one. Because you have peace in Christ, you become a people of peace. This is our calling. The invitation of Advent is to remember this, to repent. We so often look to the peace that the world gives. We look to peace in things, in people, in circumstances, and we so easily forget that we have the Spirit that raised Jesus from the dead dwelling with us.\n\nIf you're not a follower of Jesus, the invitation of the gospel is that for anyone who puts their trust in him, he gives the right to become a child of God. You have a place in the family of God. As we repent of our sin and turn to Christ, the invitation is to let Christ reign. Colossians 3 says, \"Let the peace of Christ reign in your hearts.\" This is the calling of the gospel. This is the invitation of Advent.\n\nHenry Wadsworth Longfellow wrote during a season when peace felt impossible. He had buried his wife. His son was wounded in war and the country was tearing itself apart. When he heard the bells on Christmas Day singing \"Peace on earth, goodwill to men,\" he admitted what we so often feel:\n\n\"In despair I bowed my head. There is no peace on earth, I said. For hate is strong and mocks the song of peace on earth, goodwill toward men.\"\n\nThat's honest. It's honest faith in the midst of a broken world. But the poem doesn't end there. It doesn't end with a dismissal of faith:\n\n\"Then pealed the bells more loud and deep. God is not dead, nor doth he sleep. The wrong shall fail, the right prevail, with peace on earth, goodwill to men.\"\n\nThe night before Jesus goes to the cross, he looks at his fearful disciples and says, \"Peace I leave with you. My peace I give to you. Not as the world gives do I give to you. Let not your hearts be troubled, neither let them be afraid.\" Jesus does not promise a peaceful world. He promises his peace in a broken one. He promises that one day he will make all things new.\n\nAdvent is not about pretending everything is fine. It's about trusting that the prince of peace has come. He has given us his spirit of peace, and one day he will return to establish his reign of peace. This morning we do not deny the war. We do not ignore the anxiety, and we do not dismiss the ache. In fact, I think the invitation of Advent is to stir the ache a little more.\n\nBut we refuse to believe the lie that God is absent. Jesus says, \"I am with you. I will not leave you. My peace is yours.\" So we leave differently than we came in. We don't go out saying there is no hope. We go out listening for the bells and believing the voice behind them. The wrong will fail, the right will prevail. May the peace of Christ by his spirit reign in our hearts, in our homes, in East Durham, and around the world.\n\n**Our Response**\n\nWe will respond in three ways this morning. We will sing together because Jesus is our peace. We will pray together. There will be a couple of people on the edges of the room with green lanyards. If you want somebody to pray with you this morning, I invite you to take advantage of this space of being the family of God together. And we will come to the table this morning.\n\nWhen we come to the table, we remember that if you are a follower of Jesus, you have a place. You have a place in God's family. Jesus, on the night he was betrayed, took the bread and broke it and gave it to his disciples. He said, \"This is my body which is
