<script>
var DATA = [{"id":"G_hglZrVoBg","date":"2026-08-11","title":"Praying for Immeasurably More","scripture":"Ephesians 3:14–21","preacher":"Peter Frey","series":"Prayer","desc":"In Ephesians 3:14–21, Paul prays for believers to know the depth of Christ’s love and experience the fullness of God. Join Pastor Peter Frey as he explores what it means to pray boldly and trust God to do immeasurably more. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"","url":"https://www.youtube.com/watch?v=G_hglZrVoBg"},{"id":"FvqNu3DbLV0","date":"2026-08-06","title":"Fasting: Hunger for God","scripture":"John 6:25–35","preacher":"Peter Frey","series":"John","desc":"In John 6:25–35, Jesus reveals that He is the Bread of Life who alone can satisfy our deepest hunger. Join Pastor Peter Frey as he explores the purpose of fasting and how it helps us turn our hunger toward God. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"","url":"https://www.youtube.com/watch?v=FvqNu3DbLV0"},{"id":"HC0VyuzQYak","date":"2026-07-28","title":"Prayer for Deliverance","scripture":"Matthew 6:13","preacher":"Peter Frey","series":"Prayer","desc":"In Matthew 6:13, Jesus teaches us to pray for God's protection and deliverance from temptation and the evil one. Join Pastor Peter Frey as he explores how we can trust God's power to strengthen, guide, and guard us each day. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"","url":"https://www.youtube.com/watch?v=HC0VyuzQYak"},{"id":"otozY9l_3d8","date":"2026-07-22","title":"Prayer of Confession","scripture":"Daniel 9:1–19","preacher":"Ben Uthe","series":"Prayer","desc":"In Daniel 9:1–19, Daniel models a heartfelt prayer of confession, repentance, and dependence on God's mercy. Join guest preacher Ben Uthe as he explores how honest repentance restores our relationship with God and points us to His unfailing grace. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"","url":"https://www.youtube.com/watch?v=otozY9l_3d8"},{"id":"hoGKa4fLuME","date":"2026-07-16","title":"Examine & Confession","scripture":"Psalm 139:23–24","preacher":"Peter Frey","series":"Psalms","desc":"In Psalm 139:23–24, David invites God to search his heart and reveal anything that hinders his relationship with Him. Join Pastor Peter Frey as he explores the power of self-examination, confession, and God's transforming grace. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"","url":"https://www.youtube.com/watch?v=hoGKa4fLuME"},{"id":"ggPAwBTAMOk","date":"2026-07-08","title":"Prayer of Dependence","scripture":"Matthew 6:9–11","preacher":"Peter Frey","series":"Prayer","desc":"In Matthew 6:9–11, Jesus teaches us to depend daily on our Heavenly Father for every need. Join Pastor Peter Frey as he explores how the Lord’s Prayer cultivates trust, contentment, and a life of dependence on God. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"","url":"https://www.youtube.com/watch?v=ggPAwBTAMOk"},{"id":"xw-mwzYmyAM","date":"2026-06-30","title":"Praying with Kingdom Priorities","scripture":"Matthew 6:9–10","preacher":"Peter Frey","series":"Prayer","desc":"In Matthew 6, Jesus teaches us to pray with God's kingdom and His will at the center of our lives. Join Pastor Peter Frey as he explores how the Lord’s Prayer reshapes our priorities and draws us into deeper trust and obedience. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"","url":"https://www.youtube.com/watch?v=xw-mwzYmyAM"},{"id":"Mjg0nhzWjB8","date":"2026-06-24","title":"Embracing Mystery in Prayer","scripture":"Luke 8:40–56","preacher":"Peter Frey","series":"Prayer","desc":"In Luke 8:40–56, Jesus responds to faith in unexpected ways, reminding us that God is present even when His timing and purposes are beyond our understanding. Join Pastor Peter Frey as he explores how we can trust God and embrace the mystery of prayer. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: The Mystery of Prayer\n\nGood morning, church. My name is Peter, and I have the joy of serving as lead pastor here. We are walking through a summer sermon series focusing on the theme of prayer. I want to make a quick note that the Adventures are joining us in our service this morning. We're grateful for you joining us, and I want to take a moment to pray for this time in the word and also pray for our kids because we are so grateful that we are a church where we are able to invest in and celebrate the next generation.\n\nOne of the things that we believe here at Eastpoint is our first core value: celebrate the image of God in every person. That includes kids. We also believe that when kids put their faith in Jesus, God doesn't give a junior varsity Holy Spirit. He gives the real deal to kids. We want to celebrate that and invest in it. Let me pray for us. God, we thank you for our kids and for the Adventures. We're grateful for some of our older kids as well. I want to acknowledge that in this summer emphasis on prayer, I think all of us adults have a lot to learn from the kids. Lord, I know that you long for us to have a childlike faith. God, I pray that you would continue to grow Eastpoint into a church that raises the next generation to seek your face and to seek your kingdom here on earth as it is in heaven. I'm grateful for the work that you are already doing and that we have the joy of being part of that. We pray this in Jesus' name. Amen.\n\nSeveral years ago, Mary and I introduced smart home devices into our home. We went with the Google route and got some Google Homes. I am just amazed at how offended I am anytime I have to use a light switch now. I've become lazy in the sense that I rely on these things to turn lights on and off. About ten years ago when Google Homes first came out, there was an Italian grandmother that went viral on the internet when her grandkids gave her a Google Home. She struggled with saying the activation words correctly, kept calling it \"Coo-coo\" instead of \"Google,\" and became frustrated trying to understand all the rules and formulas for getting it to work.\n\nWe laugh at that story. But have you ever felt that way about prayer? You ever felt like, \"Am I saying the wrong words? Am I pronouncing this right? God, do you hear me? Is there a different order I need to do this in? Is there a different formula for making this work?\" This morning I want us to think about why prayer seems so mysterious. The mystery of prayer is our theme for this morning. I want us to sit in the question of what does a prayer of faith look like in a world that is broken, a God that is unseen, a God that is often mysterious.\n\nWe've come back again and again to A.W. Tozer's quote: whatever comes to your mind when you think of God is probably the most important thing about you. This morning as we think about prayer, I want us to look at the face of Jesus. Because I think the moment that opens our reading in Luke chapter 8 gives us a glimpse into the mystery of prayer. If you have a Bible or smartphone, it might be helpful to follow along with me this morning in Luke chapter 8 as we imagine this story together.\n\nImagine the scene with me. By the beginning of verse 40, word about Jesus had spread across the western shore of Galilee. Jesus had gone across the lake and is coming back, and masses of individuals are there waiting for him when he returns. Jesus was becoming a celebrity of sorts, and paparazzi came with the fame. A whole crowd had gathered to welcome Jesus and his disciples as they arrived on the shore. In a crowd of this size, the concerns and issues on the hearts of these people would be too great to list. The pains, the desires, the things that kept people up at night. I imagine that each of these followers fought for their position in the pecking order, hoping they would be next to have their concern heard by this great teacher.\n\nWe read in verse 41: \"Then a man named Jairus, a synagogue leader, came and fell at Jesus' feet, pleading with him to come to his house because his only daughter, a girl about twelve, was dying.\" A man emerges from the crowd, driven by desperation. He's an important man—the main elder in the local synagogue. He would have been the guy who puts together the worship services and oversees them. He was the kind of guy that people looked up to. But Jairus' heart is distressed because his twelve-year-old daughter, his only daughter, was seriously ill. Daddy's little girl was dying. He falls at Jesus' feet. The approach is bold but respectful. Jesus can't move forward without acknowledging the man who, I imagine, was an emotional train wreck now laying at Jesus' feet.\n\nJairus, the man who people looked up to, was now on his knees looking up to Jesus. The desperate state of his daughter led him to desperate measures. The text tells us his request was persistent. I wonder if Jesus' response seemed uncertain to him. He begged Jesus, \"Come to my house.\" I imagine that as Jesus accepted his request, Jairus got up from his knees with a sense of hope. Maybe this man Jesus could do something for his daughter, and not only could he, but he said that he would. I can see Jairus urgently and frantically pushing his way through the crowds of people in order to take Jesus to his house. He knew there was no time to waste. But the journey through the crowd was easier said than done. The people pressed around Jesus. His movement was constrained by the crowd's curiosity. They pushed and shoved to gain proximity to Jesus, to perhaps be seen by him, or if they were lucky, to maybe touch him.\n\nI can see Jesus squeezing his way through the thronging masses as Jairus frantically tries to clear the way. At this point in the story, the narrative's interrupted. Luke introduces us to another individual hidden among the crowds. She too has a pressing concern that she wants to bring to Jesus. I've noticed that each of the gospel narratives tells the story of Jesus in a unique way because it's a unique person's perspective. Sometimes the gospel narratives aren't chronological; sometimes they're telling the story in order to reveal who Jesus is. I've often wondered about this passage. Why doesn't Luke just separate these two? He's telling two stories about Jesus. He could have just told the story of Jairus and then the story of this woman who interrupts the narrative. But I think it's intentional. I think Luke wants us to see these two stories intertwined.\n\nWe read in verse 43: \"And a woman was there who had been subject to bleeding for twelve years, but no one could heal her.\" This woman remains hidden among the multitude of faces in the crowd that surrounded Jesus. We aren't told her name. Unlike others in the crowd, she does not want to be noticed. She's embarrassed. She's ashamed. And more than that, she's desperate for healing. Her affliction was physical, but the effects didn't stop there. That medical condition would have given her the ceremonial status of unclean, the social status of outcast, and the economic status of bankrupt.\n\nIn fact, in the NIV translation, there is a footnote that says many manuscripts note that \"she spent everything she had on physicians.\" I want to say a quick note about that because some of you may wonder what that means. We have such a reliable text of scripture as the church has compiled it through history that we have thousands of manuscripts that reveal the inspired message of God. Anytime there's a footnote like this, it doesn't change the meaning of the text. Some manuscripts had it, some don't. Some translations, the NIV chooses not to put that in there; the ESV puts it in there. I want you to see that we have reliable scripture. When there are questions like these, it adds a little detail to the story but doesn't change it at all.\n\nIt highlights the desperate nature of this woman's condition. By stating she had spent everything she had on seeking healing from physicians, but no one could help her. For twelve years, she has carried this affliction and pain, separated from society, and told that she is a nobody. As she makes her way through the crowd toward Jesus, I believe that she is certain that Jesus has the power to heal what every physician had labeled hopeless. But she is uncertain of his concern for somebody like her. After all, she knew where Jesus was headed. She had just overheard the interaction of Jairus' desperate request for his little daughter. Surely this church leader had priority over her. Surely Jesus had more important, more spiritual, more acceptable people with whom he was concerned.\n\nBut regardless of his concern, she believes in his power. As Jairus continued to guide Jesus through the masses of people, the woman approaches Jesus unnoticed from behind. She desperately reaches out her hand to merely touch the fringe of Jesus's garment. It was only for a moment that the fabric of his garment flowed across this woman's fingertips, fully extended in faith. And immediately, the woman's discharge of blood had stopped. She had been healed. As she slipped away, hiding herself among the multitude of faces in the crowd, Jesus stopped. I imagine this woman frozen in fear as she heard Jesus's voice silence the murmurs of the crowd as he asked, \"Who touched me?\"\n\nThe people closest to him all stepped back a little bit, denying that they had touched him. \"Did you touch him? I didn't touch him. Did you touch him?\" Peter, one of Jesus's disciples, speaks up as the voice of reason in the inquisitive standoff, saying, \"Master, the crowds surround you and are pressing in on you. Why are you asking who touched you? Everyone is touching you.\" But Jesus clarifies in verse 46: \"Someone touched me. I know that power has gone out from me.\"\n\nNotice what Jesus is doing. Jesus is distinguishing the touch of someone from the touch of everyone. He differentiates the touch of faith from the touch of his fans. Jesus does not ask because he does not know who experienced his power. He asked because he wants her to know that he cares. This woman realizes\n\n# Sermon Transcript\n\nShe's no longer anonymous. Trembling in fear, she comes out from her hiding place and falls at Jesus's feet, letting it all out. There in front of everyone, she tells them about the bleeding and how she had heard that Jesus had the power to heal. She had simply reached out her hand and touched Jesus's garment. I imagine that with each phrase of this woman's testimony, she became bolder and bolder until she finally declared, \"I was healed immediately.\"\n\nJesus had stopped to let this nobody—who reached out her hand in faith—know that she was a somebody, and not just anybody. He says to her in verse 48: \"Daughter, your faith has healed you. Go in peace.\" This is the only place in all of Scripture that Jesus uses the word \"daughter.\" He says it to this woman right here in the midst of the crowd. Not \"woman,\" not \"sister,\" not \"friend\"—but \"daughter.\" Jesus's term for this woman is affectionate. It's intimate. Jesus wants this woman to know that faith is not mechanical. It's personal. And he cares. For the first time in twelve years, this woman hears the words, \"Go in peace.\"\n\nWhile Jesus is calling this so-called nobody his daughter, I imagine that Jairus is beginning to wonder if Jesus has forgotten about his own daughter. While Jesus is still speaking, a messenger from Jairus's house arrives and says to him, \"Your daughter is dead. Don't bother the teacher anymore.\" I cannot begin to understand what kind of emotions must have overwhelmed Jairus as he received the news that his only daughter had passed away. I cannot even start to imagine the immense pain he felt in that moment—not just the pain, but the disappointment, the disbelief, the anger that he may have felt because Jesus didn't do anything about it.\n\nIt would be foolish for me to think that some of you have not been there as well. The pain. The discouragement. The disappointment of unanswered prayers that have left you doubtful that God really cares. The advice of the messenger seems appropriate: it's not worth it; it's beyond him; don't trouble the teacher anymore. But what the messenger doesn't realize is that Jesus is more than a teacher. Jesus says this in verse 50: \"Don't be afraid. Just believe and she will be healed.\"\n\nIf Jesus were just a teacher, his condolence would have seemed heartless. If Jesus were just a teacher, his command to only believe would seem like an empty and trite response, inadequate to change this man's hopeless situation. But Jesus is more than a teacher. He's the maker and sustainer of every living thing.\n\nAs Jesus arrives at Jairus's house, he allows no one to enter the little girl's room except Peter, James, Jairus, and his wife. The house is filled with weeping and mourning over the loss of Jairus's little girl. Jesus turns to them and says, \"Stop wailing. She's not dead but asleep.\" We read in verse 53 that they laughed at him, knowing that she was dead. Jesus's statement would have been laughable if he were just a teacher. But Jesus is more than a teacher.\n\nIn verse 54, Jesus took the little girl by the hand and said, \"My child, get up.\" Verse 55 tells us her spirit returned and at once she stood up. Then Jesus told them to give her something to eat. Jesus did what seemed impossible, even when the mourners said it was laughable. And this act proved that faith is practical. He told them to make some dinner. Not only was it practical, but it was also personal. Jesus tells the little girl's parents—Jairus and his wife—not to tell anyone. This was no public showing of Jesus's power. This was a personal experience of Jesus's power and love for the sake of Jairus's faith.\n\nAnd what Jesus had commanded of a woman who seemed like a nobody, he commanded of a man who was known as a somebody. And that's faith. Faith is hard. That's what makes prayer so hard. Because faith, by definition, is believing what you do not see. And when we pray, we pray to a God that we do not see.\n\nThis morning, I want us to hear this story. I think the Gospel of Luke interweaves these two narratives because we're seeing two different things happening at the same time, and we need both of them in order for us to lean into the mystery of faith. I want to describe it like this with a triangle. When we're praying with faith, one thing we see in this story is that God's power has no limits. Throughout Scripture, prayer is held out to us like this: believe that God's power has no limits. He can change circumstances. We believe that our God not only died for our forgiveness but rose from the dead. That is mind-boggling, history-changing, and I want to suggest it is life-changing for our prayer life. Because we believe that God's power has no limits.\n\nBut we also believe—and I think we see it clearly in this text—that God's care for you has no constraints. No matter what society has told you, what your history has told you, what emotions you bring to the table in prayer, his care for you has no constraints.\n\nFor many of us, these two things are hard to hold together. We believe in theory that God's power has no limits and his care has no constraints. So if he can do something and he cares about what I'm feeling, why do I not get an answer to this prayer? I think the Gospel of Luke interweaves these two narratives because he wants us to see that his plan has no mistakes. I think Jairus knew that the moment where Jesus calls this woman \"daughter\" and then the messenger arrives and says \"Your daughter is dead\"—Jesus knew that would be jarring. I don't understand how these three things fit together.\n\nBut here's what I want to hold out to us: I fully believe all three of these things, and I think Scripture holds them out to us. And this is mystery. God's power has no limits. He can change this. His care has no constraints. He cares about it. And his plan has no mistakes. So when I cannot see his purposes, I rest in the mystery of God's sovereignty. And it's hard.\n\nWhat I want to suggest is that each person in this room, probably because of experiences and personality, leans in one direction of this triangle. Some of you maybe have had chronic illness all your life and have had to reconcile with that. Maybe you lean into the reality that God's care for you is real, that he wants to meet you in the midst of that pain. And maybe at times it's hard to believe that his power has no limits. I also want to suggest that maybe some of you—sometimes the church tradition leans in the direction of God's power has no limits. Let's believe that. Let's claim it. And when we lean in that direction, then sometimes, when the healing doesn't come or the timing isn't what we expect, we struggle with his plan, and then we doubt his care.\n\nBut here's what the prayer of faith does: it says, I believe in God's ability. I trust in God's care, even when I can't see his purpose. Jesus invites us continually. Over the next few weeks, we're going to start to lean into what bold prayer of intercession looks like. In fact, on Friday night, we had a worship and prayer night, and you'll see on the cross we put some bold prayers there. We're going to continue to pray into that this morning. But I want us to be a church that embraces the mystery of God, that prays persistently, that prays boldly, and believes that God is able, he does care, and even when I can't see his purposes, I'm going to trust his plan. He invites us by the mystery of his goodness as a Father to be part of what he's doing in our world through prayer.\n\nSome of you have been carrying concerns, pains, and struggles that have left you wondering if God even hears your prayers. Maybe it's a family member who you've been praying to come home back to Jesus. Maybe it's a situation of relational strife that you want to see reconciliation in. I believe that God is good, that he cares, that he is able. And I also believe that his timing and his ways are higher than mine. So the invitation of prayer is to reach out our hand in faith, to reach out our hand and say even in the midst of situations where I cannot see, I'm going to trust.\n\nJesus is calling you to believe that his power has no limits. There will be people who tell you it's not worth it, who tell you not to trouble the teacher anymore. Why are you still praying for that? But faith believes that Jesus cares for our every concern. There will be people who laugh at you when you walk through the cold realities of this life by faith and turn to prayer. But faith trusts that God's plan has no mistakes, even when we cannot see his purposes. Faith is not holding all the answers in your hand. It is reaching your hand out to the one who holds all the answers.\n\nLet's pray together. Jesus, we thank you that you care. God, I acknowledge that here on a day like Father's Day, there may be emotions and pains that some of us carry into this space where it may be hard to trust you. God, I pray that just as we continue in worship, you would show us more of yourself, of your love and your care that has no constraints. God, help us to believe that your power has no limits. God, that situation that I've given up on praying—God, I pray that you would help us to dig it out from the junk drawer and bring it back to your throne of grace. We're going to do that now as we respond. God, I want to bring prayers that I've given up on praying. Lord, I sense that you just want to speak over us this morning: \"Daughter. Son. I love you. And I care. And I can. And I invite you to trust me.\" So God, we want to do just that. In Jesus's name, Amen.","url":"https://www.youtube.com/watch?v=Mjg0nhzWjB8"},{"id":"DCu1e0_vQRo","date":"2026-06-16","title":"Hearing From God","scripture":"James 1:5–7","preacher":"Chris Hankins","series":"Prayer","desc":"In James 1, believers are encouraged to ask God for wisdom with faith and confidence. Join guest preacher Chris Hankins as he explores how we can hear from God, trust His guidance, and walk in His wisdom. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Hearing from God\n\nJoin me in reading aloud this prayer for illumination. The words will be on the screen. God, source of all light, by your word you give light to the soul. Pour out on us the spirit of wisdom and understanding that our hearts and minds may be open to know your truth and your way. Amen.\n\nPlease remain standing as you are able for the reading of God's word from the book of James, chapter 1, verses 5 through 7. \"If any of you lacks wisdom, you should ask God, who gives generously to all without finding fault, and it will be given to you. But when you ask, you must believe and not doubt, because the one who doubts is like a wave of the sea blown and tossed by the wind. That person should not expect to receive anything from the Lord.\" This is the word of the Lord. Thanks be to God. Please be seated.\n\nAt this time, we will dismiss the kids to the Adventurers class. Well, welcome. It's good to see you again. It's been a long time since we've gotten to talk. I want to show you a picture of my family since I'll be sharing some stories. This is my wife Jen. We've been married twenty years this December, along with our three kids. That's my daughter Addison, who graduated from high school yesterday, so yes, I'm glad you're excited, because I'm super sad. She's going to be attending Liberty this fall. My middle child is Avery, who—when we named him, we thought that was a boy's name, and then everybody named their girls Avery. So, pray for him. He'll be a freshman at Apex High School next year. Our youngest son is Andrew, whom we adopted when he was five years old. I'll share a bit about that story as well. Together, we're the A team: Addison, Avery, and Andrew. This is our family at Easter at Point Church.\n\nI'm so excited to continue our series \"Teach Us to Pray.\" Today we're going to study a passage and discuss an idea that I truly believe can be life-changing. It's something that has transformed my own life. Here's my encouragement: if you have a pen and paper, take notes. If you don't, use the notes app on your phone. Just avoid checking Facebook and Instagram. It's worth your full attention because I want you to write down what God might be revealing to you. At the end, we'll have dedicated moments of prayer where we ask God to speak to you and help you respond to what He says.\n\nLet me pray as we open God's word. Our heavenly Father, we pray that your word would be clear to us today. Open our eyes and minds. Speak to us so that your word is living and active. Let your Holy Spirit penetrate our souls and show us the way to go. Teach us how to have an interactive, dynamic, powerful relationship with you, the God of the universe and our Father. It's in Jesus' name we pray. Amen.\n\nLet me ask you some questions to start. When you pray, what do you expect to happen? Do you expect to have the opportunity to speak to God? Hopefully yes—that's good. Do you expect to feel a sense of peace when you pray? That's good too. How about this: do you expect to feel close to God, to sense His presence when you pray? Yes, also good. Those are probably the three most common reasons I hear when Christians tell me why they pray. But let me pose a bigger question: What if prayer is meant to be so much more? What if when you pray, you're not only expected to speak to God, feel peace, and feel close to Him, but what if you actually expected God to talk back? What if you actually expected God to speak?\n\nThe title of today's message is \"Hearing from God.\" Here's what I've discovered: I've talked with Christians over the years and noticed something shocking. I would say ninety percent of Christians—Bible-believing, Jesus-loving, actively seeking to follow Him, reading their Bibles—ninety percent of them cannot give a clear answer to the simple question, \"How do you hear from God?\"\n\nMy prayer is that by the end of this sermon, as we study Scripture together, one hundred percent of you here at Eastpoint Church today will be able to say, \"I know how to hear from God, and when I pray, I expect God to answer.\" If that becomes true for you, I will be so excited because I truly believe it will be life-changing.\n\nLet's look at our passage for today: James chapter 1, starting in verse 5. This is one of my favorite passages in the Bible. It says, \"If any of you lacks wisdom, you should ask God, who gives generously to all without finding fault, and it will be given to you.\" If you have a highlighter or pen, underline or circle that word \"will.\" That's a promise. It doesn't say \"might\" or \"maybe\"—it says \"will be given to you.\"\n\nOne reason this is my favorite passage is because of who it's directed to. It's directed to anyone who lacks wisdom. I'm sure of that. Anyone who lacks wisdom fits the bill. There are many times in life when I don't know whether to go left or right, whether to stop or keep going, whether to take an opportunity or let it pass, whether to speak or stay silent. I have assurance that I'm not alone in this. None of us can see the future. If we could, we'd all be multimillionaires. We don't know the future, but God does. When we find ourselves in situations where we don't know the right answer, where we don't know the way to go—when we lack wisdom—what do we do? James 1:5 tells us: \"You should ask God.\"\n\nIn order for us to hear from God, I believe first we must believe that we need to hear from God. If you don't think you need to hear from God, then you probably won't hear from Him very often. We must believe we need to hear from God.\n\nLet me ask some reflection questions. Really think about your life and your prayer practice. How often do you actually pray when you lack wisdom? How quick are you to ask God for direction when you don't know what to do? When you lack wisdom, do you ask God first, or do you try to figure it out yourself? Do you ask other people for wisdom before you ask God? Do you worry about what to do for days and days before you finally ask God? I'm guessing we've all found ourselves in at least one of those situations.\n\nMy grandmother paid me one hundred dollars to memorize Proverbs chapter 3 when I was about ten years old—which seemed like a lot of money at the time. This is why: Proverbs 3:5-6 says, \"Trust in the Lord with all your heart, and lean not on your own understanding. In all your ways, submit to Him, and He will make your path straight.\"\n\nWhy don't we ask God for wisdom right away when we don't know what to do? Why is asking God for wisdom often our last resort instead of our first resort? If I'm being honest, I believe most Christians don't actually expect God to answer when they pray. Just think about it: if we actually expected God to answer, wouldn't we be praying all the time? Without ceasing? Every time something came up and we didn't know what to do, we'd immediately say, \"Heavenly Father, here's the situation. I need direction. What should I do?\" But most of us don't actually expect God to answer. We don't expect Him to speak back.\n\nI have good news, though. My goal is to help you recognize the problem and where there's a lack of understanding. More importantly, let's turn to how we can change that in our lives in a way that develops a dynamic, powerful relationship with God where we're guided by the all-powerful, all-knowing, all-present God who loves us—who is a good, good Father and loves to give good gifts to His children. How can we be guided day by day, decision by decision, by that God so that we prosper in all that we do, as Psalm 1 promises?\n\nHere's what we need to know if we're going to hear from God: First, we must believe we need to hear from God. Second, we must believe God will speak to us. The all-knowing, all-powerful God of the universe promises to give you wisdom when you ask for it. However, there's one thing required of us: faith. We must have faith when we pray.\n\nVerse 6 continues: \"But when you ask, you must believe and not doubt, because the one who doubts is like a wave of the sea blown and tossed by the wind. That person should not expect to receive anything from the Lord.\" I don't think this passage is saying you need perfect faith. Hebrews 11:6 puts it this way: \"Without faith, it is impossible to please God because anyone who comes to Him must believe that He exists and that He rewards those who earnestly seek Him.\"\n\nSo if we're going to hear from God, we must believe we need to hear from God, we must believe God will speak to us, and we must believe with great expectation. Here's why this matters: God promises He will answer, but we must bring our faith to the equation. If you have low expectations that God will answer when you pray, then logically, you will pray differently. You will pray infrequently. You will pray with doubt. You will pray out of duty—simply because it's what we're supposed to do. Maybe because we're Christians trying to be good people, we should pray before we eat or before we start the service, or before dinner, or before we put our kids to bed, because that's what good Christians do.\n\nHowever, if we actually believe God will answer when we pray, that will also logically change our prayer life. We will pray with faith. We'll pray with confidence. We'll pray with frequency. If we really believe God is going to answer, the frequency of our prayer life will skyrocket. So should we be surprised that when we pray seldomly, with doubt, out of duty, our prayer life is ineffective? And should we be surprised that when we pray in faith, frequently, with expectation, our prayer life is transformed?\n\n# Sermon Transcript\n\nBecomes more effective? I want to make this super practical this morning. I'm trying to put the cookies on the bottom shelf. Here's one thing that holds a lot of Christians back: how do I hear from God? How do I know when God is speaking to me? I think one thing that keeps us from hearing from God when we pray is that we don't know how to recognize his voice. When we pray with expectation, God promises he's going to speak. If any of you lacks wisdom, ask God and he will give it to you generously. But how do we know if it's God speaking or if it's bad fish tacos? How do we know if it's God speaking or me just wanting something to happen? How do we know if it's God speaking or just an opportunity that I want?\n\nI'm going to go over the five most common ways that I have seen God speak in my life. I'm going to be super practical and give you a lot of examples so that hopefully you can begin to recognize these patterns as you pray. You're praying frequently with faith because God promises he's going to answer. He promises he'll give you wisdom in whatever situation you're in. Well, then when he answers, how do you know it's him answering versus something else? These are not all the ways God can speak—there are lots of ways in the Bible. We're not putting God in a box. I'm just saying these are the most common ones.\n\n**Number one is Holy Spirit impressions.** Let me describe what this means. I have personally never heard God speak to me in an audible voice. Apostle Paul had that experience on the road—God appeared and spoke audibly: \"Saul, Saul, why do you persecute me?\" That's never happened to me. But what I have experienced is when I'm praying and asking God for wisdom, God will impress thoughts into my mind that I know did not come from me. Let me give you an example.\n\nWhen I was 24 years old, 20 years ago, I was dating a girl named Jen—you saw a picture of her a moment ago. I was praying, \"God, is this the girl that I'm supposed to marry?\" It's kind of a big decision. I'd had a few false starts, so I didn't want to mess this one up. I went to a dock in Beaufort, North Carolina, and I said, \"We're going to sit and pray, and God, I need to hear from you. I don't want to keep dating this girl if this is not the one.\" So I'm praying, and as I'm praying, I felt this thought impressed onto my mind: \"Yes, and in three months.\"\n\nNow, I promise you, that thought was nowhere in my plans or in my heart, but it was so clear in my mind. I went home, bought a ring, brought her back to that dock, got down on one knee, and asked her to marry me. She said yes. When I asked when we should get married, she said, \"I don't know, three months?\" We got engaged on September 2nd and married on December 2nd. December 2nd was a Saturday. God just worked it out in such a miraculous, amazing way.\n\n**Number two is peace.** Have you ever heard a Christian say, or maybe you've said it yourself, \"I still have a peace about it\"? You're thinking about a decision and you either feel that peace or it just doesn't sit right with you. There's something you've been praying about, and you do have peace. Maybe some of you felt that way about being part of this church plant. You're praying about it and you think, \"Man, I just have a peace that this is what God wants for us.\"\n\nLet me rewind the clock maybe a year before I was dating a girl—a false start. I went into a jewelry store to look at rings, and I had the biggest sense of turmoil in my spirit that I have ever had. I don't know if the Holy Spirit has ever actually physically kicked me, but it felt like it in my soul. There was this sense of dread that came over me from the Lord, and I could not get out of there fast enough. It was like the Lord saying, \"No,\" the absolute opposite of peace.\n\nLet me give you a less dramatic example. My middle son, he's about 6'2\" now and taller than both of us, started playing basketball. We decided to try out this AAU thing—never again. We were looking at two different teams. One team was about 15 minutes away from our house. He tried out and made the team, and I just felt such a peace about it. Then there was a second AAU team—the coach of his high school team. The guy played on the national championship team for a local university, and they were going to practice at a gym that was three minutes from our house. Everything logically said he should be on the second team. He made both teams, but I didn't feel peace about the second one. I felt such a peace about the first team he tried out for, but his middle school coach said, \"Man, if you want him to get better, he needs to play on this team.\" So I went against what I had a peace about and put him on the other team. It was one of the worst experiences of our life. Everything that could go wrong went wrong. It was horrible.\n\nHere's my point: I've never had an experience in my life where I felt a peace from the Lord and I listened to it that I regretted. I've never had a time where I felt a check in my spirit and I stopped and said, \"Hold on, let's reevaluate,\" that I regretted. I've had plenty of times where I ignored that sense of peace, and pretty much every time I regretted it.\n\n**Number three is people.** Here's a novel idea: you are not the only person with the Holy Spirit. God will often use other people to speak to you. I was going to lunch with a former pastor at our church. Kind of out of nowhere, he said, \"You know, I think you're more suited and designed to lead a nonprofit than you are to be a lead pastor.\" In my spirit, I wanted to punch him in the throat. I was the lead pastor of our church at that time. But as we left lunch, I just smiled and said, \"Hmm, okay. Thanks for sharing that.\" I may have wanted to block him on my phone, but the Holy Spirit wouldn't let it go. The Holy Spirit wouldn't let it go. Now I am the president of Carolina Movement and I'm no longer the lead pastor of our church. The whole point was he said something to me and the Holy Spirit made it clear: \"You need to listen to what he's saying right now.\" And it was the opposite of what I wanted to hear.\n\n**Number four is God's Word.** The Holy Spirit will never lead you to do something that is contrary to God's Word. But I want to go further than that. When I'm praying and seeking God's will, a couple of things often happen. Either I'm reading the scriptures and the Holy Spirit will make a verse, phrase, or passage jump out to me, and I'll have a sense that this is for me in this moment in this situation. Or I'll be praying and the Lord will bring a verse to my mind that he wants me to apply.\n\nA few years ago I was in a situation where I felt like somebody had really wronged me. I didn't know what to do. Is this a situation where I should stand up for myself and our church, or is this a situation where God's calling me to be a peacemaker and let it go? I was praying about it and God brought this verse to my mind: 1 Corinthians 6:7. Just to be clear, we weren't about to have a lawsuit. The verse says, \"The very fact that you have lawsuits among you means you have been completely defeated already. Why not rather be wronged? Why not rather be cheated?\" God brought that verse to my mind and I just knew in that moment God was saying, \"Let it go.\" And I'm so thankful that I did. It was the right decision.\n\n**The last one is doors.** One final way that God often speaks to me when I'm praying for wisdom is through open and closed doors. I'll be praying for God's will and he will supernaturally open a door or supernaturally close a door. Now, you have to be careful. Not every open door is a door for you to walk through, and not every closed door is God saying no. Let me give you a couple of examples.\n\nIn 2020, we had adopted our son and with COVID keeping everyone at home, our space was very crowded. We were wondering if we should move. God just opened some crazy doors for us to move right down the street to a house that has been a great fit and a blessing to our family. Then last year we had that same question—should we move? We looked at several places and God just closed door after door after door, and we got this sense of, \"No, God has us where he wants us. Let's stop looking. Let's continue to put down roots where we're at in this community with these people.\"\n\nThe next spring, our next-door neighbor—we're best friends, he goes to our church, he leads a small group, and my son and his son are best friends—tragically passed away from a heart attack at 48. It became very clear that God had us in this neighborhood with this family, with these dear friends, for such a time as this. If we'd have moved, we would not have been there for our friends.\n\nWhen you're thinking about hearing from God in these different ways, remember that not every person you should listen to. You can read the Bible and take it out of context. So how do you know? As you're seeking to hear from God and you think, \"Man, I think this is God speaking,\" how do you know it's from God? Let me share something that has been super helpful for me as I'm seeking to discern God's voice. It's called confirmation. Everybody say confirmation. I think a lot of times when we hear from God, we feel guilty for asking God to confirm what we think he's doing. I think we need to change our mindset on that.\n\n# Cleaned Transcript\n\nAnd closed doors. What I find is when God is speaking to me, God's not trying to hide his will from you. He wants you to know his will. What I find is these things start to line up. All of a sudden, people that I know, love, and trust—people I'm confident are for us and have the Holy Spirit—God's word, Holy Spirit impressions, a sense of peace, these open and closed doors, they'll start to line up, and I'll have this sense of confirmation.\n\nSo as you're praying, as you're seeking to hear from God, it's okay to ask God for confirmation if you're not quite certain. Gideon threw out the fleece two times, and God didn't strike him dead. Ask God for confirmation. As you continue to pray and ask God for wisdom and discern his voice, it will get easier and easier. How many of you have somebody in your life such that if they yelled from across a store, you would instantly know who they are without even seeing them? My wife, my mom, our kids—if I heard their voice and didn't even know they were in the store, I would recognize it instantly.\n\nWhy is that? Why would I recognize their voice and not others? It's because we've spent so much time together, we've had so many conversations, that their voice is so familiar I can pick it out among all the others. The same is true for God. The more time you spend talking with him, listening to him, hearing his voice, you will find that you are more and more quickly and accurately able to discern his voice from all the others. This is why it's so important. Let me say another word about confirmation that I meant to mention. First John 4:1 says, \"Do not believe every spirit, but test the spirits to see whether they are from God.\" Not everything that you hear, not everything that you read, not everything that other people say are from the Lord. That's why it's so important to make sure that you're going through that process to say, \"Is this from the Lord?\"\n\nNow, those are not all the ways we hear from God. God speaks through visions and audible voices. My wife and I have never had a vision from God, but my wife, before we adopted our son Andrew, was the preschool director at a church. She had two vivid dreams about this little boy that we were supposed to adopt—what he was wearing, the situation—and it came true exactly like that. It happened twice. Adoption is not always sunshine and roses. We needed that confirmation so that in the difficult times we knew this was not our idea, this is from the Lord, and if God called us to it, he was going to see us through it.\n\nSo here's what I want to do as we wrap this up. My goal is never to teach for information but for transformation. My prayer is that as we talk about teaching us to pray, your prayer life would be different moving forward. I want to challenge you to think about one area in your life where you need wisdom. What is one area where you need wisdom? The worship team's going to play, and we're going to have a time of response. For the first couple of minutes, I just want you to sit and think and pray and ask God for that wisdom.\n\nHere's what I want you to do. This is my prayer journal. I write down specific things that I'm praying for and I date them. Then I write a little \"A\" underneath and leave room for the answer. Later, I go back and write it in. If you were to look through my journal right now, there are lots of prayers that are answered and lots of prayers that are not yet answered. But I know in faith God will answer. God doesn't promise he's going to answer this moment, this hour, today, or this month. Sometimes we have to learn to wait upon the Lord. But he promises he will answer. So as a way to increase your faith, I would challenge you to start writing down those prayers for wisdom. Start writing down those things that you're praying for and then leave space. Thank God in advance. \"God, thank you in advance that you're going to give me wisdom. Thank you in advance that you're going to show me the way, that you're going to guide me and get me through this.\" Then pray and pray and pray. Wait upon the Lord. Don't move. Wait until God shows you what to do. Lean not on your own understanding. In all your ways, trust in him and he will make your path straight.\n\nHeavenly Father, we pray for every person in this room. I pray your Holy Spirit will be moving, speaking, guiding, showing the way. I pray that in this next song, during this time of response, you would bring to our minds Holy Spirit impressions of things and areas we need to be bringing to you instead of figuring out on our own or going to other people. God, would you speak to us? And Father, would you help us to develop that reflex that anytime we lack wisdom, we would expectantly pray because we know that you are going to answer. In Jesus' name we pray. Amen.","url":"https://www.youtube.com/watch?v=DCu1e0_vQRo"},{"id":"AZ8mjzSWIGE","date":"2026-06-09","title":"Start with Stillness","scripture":"Psalm 131:1–3","preacher":"Peter Frey","series":"Psalms","desc":"In Psalm 131, we are invited to quiet our anxious hearts and rest in God's presence with childlike trust. Join Pastor Peter Frey as he explores how stillness before God shapes our prayer life and helps us find real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript\n\nGood morning. My name is Nathan Clinton, and I'm here to lead us through this next section of scripture for today. Would you join me in reading aloud this prayer for illumination? The words will be up on the screen.\n\nHoly Spirit, breathe on us as we hear scripture. Fill us with your presence, wisdom, and peace, so that we may be transformed by your truth. Amen.\n\nNow, please remain standing as you're able for the reading of God's word from Psalm 131: \"My heart is not proud, Lord. My eyes are not haughty. I do not concern myself with great matters or things that are too wonderful for me. But I have calmed and quieted myself. I am like a weaned child with its mother. Like a weaned child, I am content. Israel, put your hope in the Lord both now and forevermore.\" This is the word of the Lord.\n\nYou can be seated. At this time, we will dismiss our little ones to their adventure class. You can follow Miss Jen in the back. East Point kids, we love you. Have fun in class.\n\n---\n\nGood morning, East Point Church. My name is Peter, and I have the joy of serving as lead pastor here at East Point. We're so glad that you are worshiping with us. Before we jump into the message, I want to mention that on June 19th, a Friday evening at 7:00 p.m., we will be here in this space from 7 to 9 for a night of worship and prayer. We want to invite you to join us.\n\nWe're taking these summer months—90 days—to sit with a question that the disciples asked Jesus: \"Lord, would you teach us how to pray?\" As a church, we're asking ourselves, what does it look like to be a praying people? I mentioned last week that prayer often feels intimidating to many of us. We hear people who pray eloquently and feel intimidated by that. It's like being a kid with a secret playhouse that requires a magic password. We think prayer is like that—we need the secret words to enter. But the picture of prayer throughout the scriptures is radically different.\n\nI sense that in exploring this question the disciples asked Jesus, we're being invited into something new. The picture Jesus gives us of prayer is most often related to children with their father. Now, for some of us, that image is confusing. Maybe we had an absent father or one who caused us hurt. We have to untangle some of that image to truly ask: if God is a good father who is present, and he invites us to come to him as his children, what is this invitation into prayer? What do we need to lay aside?\n\nIn Matthew chapter 18, the disciples come to Jesus and ask, \"Who then is the greatest in the kingdom of heaven?\" It's a good question. All of us ask it, whether in our work, in parenting, or in our classes. We want to know the path to greatness. Jesus's response is striking. He called a little child to him, placed the child among them, and said, \"Truly I tell you, unless you change and become like little children, you will never enter the kingdom of heaven. Whoever takes the lowly position of this child is the greatest in the kingdom of heaven.\"\n\nI want us to hear this morning the invitation of Jesus. The change he speaks of is not something we pull ourselves up by the bootstraps to achieve. Wes pointed us to this so beautifully. It is an invitation into being who God has made us to be—that we are children adopted into his family. The invitation of prayer is to settle into our identity as children. Some of that means laying aside the picture of eloquence you have of prayer. Some of that means laying aside the picture of it being a practice we master. These 90 days we're spending thinking about prayer—I don't want you to think of this as an opportunity to master a technique. This is an invitation into a relationship.\n\nLater today, Mary and I are traveling to Maryland. We're taking a week to visit both of our families who live there. I've found that there are different types of road trip people with different preferences for long drives. If you're my wife, you have a playlist queued up and music ready to blare. If you're like me, I turn off the radio, put on the iPad for the kids, and enjoy a little bit of silence. There are different personalities, and this morning we're exploring what I want to call the starting point of prayer: stillness.\n\nWe live in a world full of noise, and all of us deal with that differently. Some of us turn the noise up louder. Some of us try to escape. But I want to suggest that regardless of your personality, the noise we're flooded with daily is one of the most harmful things to our souls. Richard Foster said it like this: \"In contemporary society, our adversary majors in three things: noise, hurry, and crowds. If he can keep us engaged in muchness and manyness, he will rest satisfied.\" That's an acute description of what the noise in our world is doing to our souls.\n\nWhen was the last time you went to the grocery store without checking your phone? It's an instinct—to pull out that phone and fill the space with noise. Another reel, another scroll. Statistics show that most of us check our phones about 200 times a day. Some sociologists equate that to two and a half months of your year spent on your phone. Now, I'm not here to bemoan the impact of the iPhone on our society. We all know it. We all feel it. It's present. But what I want to ask this morning is: what do we do about the noise? What do we do about the clutter and hurry that we're confronted with daily, weekly, and regularly?\n\nThe more connected we become to constant stimulation, the less comfortable many of us seem to be with silence, waiting, and stillness. Here's what I want to suggest: Richard Foster said that the enemy majors in three things—noise, hurry, and crowds. I want to say that Jesus is inviting us into three things: silence, stillness, and waiting.\n\nPsalm 131 is one of the shortest psalms in scripture. You probably thought the scripture reading was over when Nathan finished it. But it's one of the shortest psalms to take traction in our lives. Psalm 131 is an invitation into stillness.\n\nPsalm 131, verse 1: \"My heart is not proud, Lord. My eyes are not haughty. I do not concern myself with great matters or things too wonderful for me.\" I want to say that verse one is an invitation into stillness, and I want to suggest that the first thing it does is confront our control. We like to feel in control. Life happens so quickly, and we have so many resources at our disposal, especially today. I can have groceries on my front steps in a few hours. That's the illusion of control our society has given us. Psalm 131 is an invitation into stillness that confronts our control.\n\nHe says, \"My heart is not proud, Lord. My eyes are not haughty. I do not concern myself with great matters or things too wonderful for me.\" What is he saying? There's a lot in this world that I do not understand.\n\nI remember being a senior in high school. One morning in physics class, there was an announcement over the intercom that three of our classmates had died in a house fire the night before. I'll never forget that moment—one of the first times in my life when the pain and brokenness of this world felt so jarring. How do I make sense of this? Many of you have probably asked the same question: if God is good and all-powerful, how do we have moments like that? I think it's a good question to ask.\n\nThe psalmist of Psalm 131 isn't saying to bury your head in the sand and not think about these things. No. Psalm 131, verse 1 is an invitation to step off the throne and recognize that God, in his greatness, sovereignty, love, and goodness, is somewhat mysterious. I don't have all the answers.\n\nMy physics teacher was a believer in Jesus. He knew I was too, and after that announcement, he said to the class, \"A lot of you are asking a lot of questions right now. I can't talk to you much about how my faith answers those questions, but Peter can.\" I remember the second wave of feeling overwhelmed—not just how do I make sense of it, but how do I talk to people about this?\n\nBut stillness—the practice of stillness, which Psalm 131 invites us into—is titled \"Start with Stillness.\" This is the invitation of prayer. To start with stillness is an invitation not to ignore those hard questions, but to acknowledge that we aren't God. Psalm 46:10 says, \"Be still and know that I am God.\"\n\nStillness and silence confront our control. Dallas Willard says this: \"Silence is one of the deepest disciplines of the spirit simply because it puts the stopper on all the ways we have of getting control.\" Here's the reality: most of us, when we think about prayer, think about what happens after \"Dear God\" and the words we say. But I want to invite you into a practice that throughout the ages has been called contemplative prayer, silent prayer. It's the practice of starting without words. It's hard because I like to be in control, and one way I have control is through the words that come out of my mouth. I don't like silence. I do this, and some of you probably experience it on Sunday mornings—we're in conversation and there's a dead space, and my instinct is to fill it with words.\n\nBut you know what happens in relationships as time goes on? Mary and I have been married for 15 years. We have two little kids, a three-year-old and four-year-old. There's a lot of noise in our life. When we get a moment to go on a date or get away after the kids go to bed, you know what happens? We sit in silence. Neither of us feels an obligation to fill this space. Why? Because there's relational depth. There's time. There's an understanding of shared experience.\n\nI mentioned this quote a while back, but Oswald Chambers says, \"What comes to your mind when you think about God is probably the most important thing about you.\" Most of us have to untangle the view that the words we say to God somehow affect how he views us. But I want you to see that we have a good father who delights in sitting with you in stillness. There's relational depth—whether you realize it or not—that he's been with you through that hard thing. He knows the questions that keep you awake at night.\n\nStillness confronts our control because it forces us to acknowledge that it isn't the words I say to God that change how he views me. It isn't my words that change this relational dynamic of prayer. Prayer is not a magical formula. It's not a technique. It's not something we're called to master. It's a relationship to enter into. God wants to sit with you. Stillness confronts our control.\n\nAnd then it recalibrates our contentment. Notice verse two: \"But I have calmed and quieted myself. I am like a weaned child with its mother. Like a weaned child, I am content.\"\n\n# Stillness and the Presence of God\n\n\"Stillness is the quiet space where God migrates from the periphery back to the center.\" Notice the picture that the psalmist used: a weaned child. This is not a weaning child—we're on the other side of a process that comes in a child's development. A weaned child no longer approaches their mother as a transactional person, seeking only nourishment. This is a painful process for both mother and child, but it marks a moment when the relationship shifts from the product that the mother offers to the presence that she offers. This is the comfort, contentment, and satisfaction found in the presence of God.\n\nThe psalmist says, \"I have calmed and quieted myself. I'm like a weaned child with its mother.\" In other words, the psalmist is choosing to be held in the arms of a good, good father. And that is enough. We don't have to have all the answers. We don't have to have the perfect explanation of God's goodness, sovereignty, or justice. We can come into God's presence and believe that he is enough. This is the invitation of stillness.\n\nStillness recalibrates our contentment because most of us are still in the milk phase of our spirituality, longing for what God can give us—longing for answers and solutions. But as Isaiah 55 says, \"My ways are higher than your ways. My thoughts are not your thoughts.\" Deuteronomy 29 tells us, \"The secret things belong to the Lord our God, but the things revealed belong to us and our children forever that we may follow all the words of this law.\" In other words, God doesn't always give us all the answers, but he gives us himself. The invitation of Psalm 131 is to be still. Don't jump to the words. Don't jump to the request. Just start with stillness and realize that the presence of God is enough.\n\nPhilippians 4 describes it this way: \"Don't be anxious about anything but in everything by prayer and petition make your requests known to God and the peace of God which transcends all understanding will guard your hearts and minds in Christ Jesus.\" Here is the picture in Psalm 131 of a child that is weaned and content in his mother's arms.\n\nHaving two young kids, I've realized something profound. When something happens and they get hurt, they don't want a logical explanation of why they're hurt. They want my presence. They want my embrace. That's what God is inviting us into in the practice of stillness. When my son Elijah gets hurt—and inevitably he does—he comes into our arms seeking not answers but presence. This is what God is inviting us into through the practice of stillness.\n\nOver the course of the summer, we're journeying through a prayer resource called Sacred Prayer, a prayer journal that walks through ninety days using an acronym for prayer. There's nothing formulaic about prayer. The first piece of this acronym is stillness. Start with stillness. I want to invite you this week into the practice of stillness. Take five minutes and carve out five minutes in your day to sit with God. Here's something that's been helpful for me: sometimes faith and prayer are hard for me to wrap my head around. So I literally go into my room and set up a chair with an empty chair in front of me, just to envision that God is here with me. I know I can't see him, but that chair becomes a tangible picture that he's here with me. I'm going to start with stillness and say, \"God, I am going to confront my desire for control. I'm going to acknowledge that you are God and I'm not. And I want to sit with you.\"\n\nSome of you are getting really uncomfortable about how long I just paused. Here's what I want to illustrate: it's going to feel uncomfortable because most of us would have pulled out our phone by now and filled the dead space. This invitation into stillness and prayer is something our withered souls are longing for, but it's a practice. It's not going to be easy. It's not going to be immediate. Most of you are going to walk away and pull out your phone and watch a few reels because that is what your soul is instinctually trained to do. But here's the invitation: as we practice stillness, it recalibrates our contentment. Our contentment isn't in the answers or the circumstances, but in the presence of God, who is a good, good father who loves you, who delights in you, and wants to be with you.\n\nNotice what happens next in the psalm. Stillness confronts our control. \"My eyes are not lifted up. My eyes are not proud.\" I don't concern myself with things too marvelous for me. I'm going to release my desire to be in control of all the answers, of all the details of my life, and I'm going to sit and let it recalibrate my contentment. And then what it does is cultivate hope. Verse three says, \"Israel, put your hope in the Lord both now and forevermore.\"\n\nWe talk about hope a lot here at East Point because it's the core of who we are as a people of God. We believe that God is not a distant God. He stepped into our world. He took on flesh. He knows the brokenness, the pain, and the questions. He knows what it's like for our souls to be troubled. He took all of that pain and brokenness upon himself. He went to the cross where he died in our place to take the sin, the brokenness, and the consequences upon himself so that he could rise three days later and say, \"Because I rose, you can rise too.\"\n\nThe same spirit that raised Jesus from the dead promises that everyone who puts their faith in him has that spirit dwelling within them. And here's the invitation of prayer: we get to be still and acknowledge that God knows our every weakness. Hebrews 4 says it like this: \"We don't have a great high priest who's unable to sympathize with our weaknesses, but one who is tempted and tried just like we were.\" Sometimes our picture of God is so removed, like a parent we had where we have to earn their approval, say the right words, and do the right things before we feel that love. But the love of the Father says, \"Even when you were an enemy of me, I died for you.\" That categorically changes how we pray. We're not praying to unlock the gates of heaven. We're praying because heaven came to us. We have the great high priest who is not unable to sympathize with our weaknesses but was tempted and tried like we were. The invitation of Hebrews 4 is this: \"So then let us come boldly before his presence.\"\n\nStillness cultivates our hope. And here's what hope is: hope is not having all the answers. It's choosing to be held by the one who does. This is the Christian faith. There are questions that I get asked as a pastor about the how and why of God's character and his purposes. I've got categories and trains of thought, but at the end of the day, it is my job as a pastor to tell you we do not have all the answers. But I know the one who holds them all. And I simply want to be held by him. I want him to hold me in the midst of it. I'm going to relinquish my desire for control and acknowledge that hope isn't holding all the answers. It's choosing to be held by the one who does.\n\nMost of us are still inclined toward control. So you hear this invitation into stillness and think, \"All right, I'm going to do this thing. I'm going to set a timer. I'm going to put it on my calendar.\" Which is a great idea. But here's the thing: our hope is not in stillness. Your hope is not in stillness. But in stillness, we find our hope. Don't put your hope in this practice, but let this practice cultivate hope in you. The key to holding on to hope is making space to be held by the one who is our hope. We do not have hope because we practice stillness. We practice stillness because we have hope.\n\nThere's a famous interview with Mother Teresa where an interviewer asked her, \"When you pray, what do you say to God?\" She responded, \"I don't say anything. I listen.\" The interviewer said, \"Well then, what does God say to you?\" She said, \"He doesn't say anything. He listens.\" The interviewer was uncomfortable, and Mother Teresa added, \"If you don't understand that, I can't explain it to you.\"\n\nHere's the reality: prayer is mysterious. We believe in a God who is greater than our eyes can see, than our hearts can comprehend, and he's nearer than we realize. He invites us into relationship with him. I'm not going to hold out to you this morning like I have all the answers of how all this works. I don't know. I just know he wants to meet with you and I know that his presence is enough. Eugene Peterson says, \"Waiting in prayer is a disciplined refusal to act before God acts.\"\n\nSo would you join me this week? Carve out five minutes before you start your day or before you lay your head on your pillow or before you go on your lunch break. I don't care when it is. Set aside some time. Set a chair. Light a candle. Do something tangible to remind you that God is there to meet with you. Pause to be still.\n\nWe don't practice stillness just to quiet the chaos. Our culture could hear this message and say, \"Yes, I need to quiet my soul.\" But here's the thing: we aren't quieting our soul to quiet the chaos. We're quieting our soul to be held by our father who loves us, who delights in us, and who gave himself for us. He rose so that we can have new life. So that even in the places where we don't have all the answers, we can choose to be held by the one who does.\n\nPsalm 62 verse one says, \"For God alone my soul waits in silence.\" That line right there is the invitation in stillness. For God alone. I want you to enter this space. We're going to practice this here for a moment. I'm going to invite you into the practice of stillness before we go into singing. A great way to practice stillness is to start with a psalm like this. Maybe each day this week, come to Psalm 62 verse one and just say those words: \"For God alone my soul waits in silence.\"\n\nHere's the thing: you're going to have thoughts come into your head. That's how our brains work. That's how our hearts work. We are flooded with thoughts. Some of you are going to feel discouraged by that. You're going to think about lunch or what you have to do this week or the hard questions that were surfaced in this sermon. I don't want you to view that as a negative thing. This isn't a technique to master. It's a relationship to enter into. And he cares about those things that come to your mind. So the practice of stillness is this: as those things come to mind, lay them at the feet of the one who said he would carry them.\n\n\"Come to me all you who are weary and heavy laden, and I will give you rest. Take my yoke upon you and learn from me, for my yoke is easy and my burden is light, and you will find rest for your souls.\n\nAs those thoughts come in, I want you to view prayer as a returning in every moment. Thomas Keaton said it like this: those thousands of thoughts that flood your mind are an opportunity to return. They're an opportunity to return to the one who is with you, who is for you, who gave his life for you.\n\nLet's pause this morning and, like weaned children, sit in silence before a good father.\"","url":"https://www.youtube.com/watch?v=AZ8mjzSWIGE"},{"id":"K47oghFvamI","date":"2026-06-05","title":"Teach Us to Pray","scripture":"Luke 11:1–4","preacher":"Peter Frey","series":"Prayer","desc":"In Luke 11, Jesus teaches His disciples how to pray and invites us into a deeper relationship with our Heavenly Father. Join Pastor Peter Frey as he explores the Lord’s Prayer and how prayer shapes our faith, dependence, and daily lives. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: The Starting Point of Prayer\n\nFrom the Gospel of Luke, chapter 11, verses 1 through 4: \"One day, Jesus was praying in a certain place. When he finished, one of his disciples said to him, 'Lord, teach us to pray, just as John taught his disciples.' He said to them, 'When you pray, say, Father, hallowed be your name. Your kingdom come. Give us each day our daily bread. Forgive us our sins, for we also forgive everyone who sins against us. And lead us not into temptation.'\" This is the word of the Lord. Please be seated.\n\nDuring my summers in high school and college, I worked at a small Christian camp in Pennsylvania—the very place where I came to faith. I started as a camp counselor and eventually moved into a leadership role helping oversee the counselors during the summer. One thing about summer camp that makes me laugh when I look back is how it was structured. Campers would come for a week, and we'd do typical camp activities: capture the flag, eat mediocre food in the dining hall, swim in the pool. But in the afternoons, there were always electives where campers could choose what they wanted to do—archery, rock climbing, baking, various sports, and other activities.\n\nAs counselors, we were assigned to help lead these electives. The problem was that I had no experience in pretty much any of them. I distinctly remember the week I was teaching archery, trying to instruct kids how to shoot an arrow at a target when I myself had no idea how to do that. Another time, I led the survival elective for a high school camp week. You'd think learning to set up a tent and start a fire would be basic, but this boy had never been camping in his childhood. I didn't have these skills, yet there I was, leading the whole thing.\n\nI tell you all this because I feel a little bit like that campy counselor starting a series on prayer. Don't get me wrong—I love prayer and integrate it into my daily life. But I often find myself fumbling through it. If you're like me, when you hear we're doing a summer-long series on prayer, some of you are excited. Others of you are thinking, \"How are we going to talk about this for three months?\" That sense of unease is real. C.S. Lewis once described prayer as one of the most irksome of all spiritual disciplines, and I feel that deeply in my soul. Why? Because prayer, by nature, is something otherworldly. It's talking to someone we cannot see. It feels hard. And here I am, a camp counselor saying, \"Let's learn something that I myself am still learning.\"\n\nIn Luke 11, one of the disciples comes to Jesus and says, \"Lord, teach us to pray.\" This is remarkable. In all the gospel narratives, we have only one moment where the disciples stop Jesus and ask him to teach them something. Not how to heal the sick, not how to cast out demons, not how to perform miracles—but how to pray. That moment is right here in Luke 11. The goal of this series is not to master prayer. It's not to add one more thing to your spiritual to-do list. The goal is to sit with the disciples at the feet of Jesus and say, \"Lord, would you teach us to pray?\" We aren't trying to give a comprehensive definition of prayer. Each week, we'll sit with a passage of scripture that explores one dimension of prayer, and we want to sit in the mystery and wonder of something God invites us into.\n\nThis is the only moment in the gospel narratives when the disciples are bold enough to ask Jesus for a tutorial. As a parent, I've watched the curiosity of my four-year-old son, Elijah, as he observes his world. He wants to learn about everything. Usually, in the blessed quiet of a car ride, incessant questions come from the backseat: \"Dad, can you teach me about mountain goats? Can you teach me about football? Can you teach me about speed limits?\" Don't even get me started on speed limits—he wants to know absolutely everything about them. But the real questions are things like, \"Dad, can you teach me how to mow the lawn?\" This was an actual conversation a couple weeks ago. Out of the blue on a random Tuesday, he asked this question that seemed to have no context. So I asked him, \"What made you think about lawn mowing?\" He said, \"Last week, you were mowing the lawn and I was watching you. Can you teach me how to mow the lawn?\" He saw me do something and it prompted the question.\n\nThe same thing happens here with Jesus' disciples. Before we get to their request for a tutorial, we find them watching Jesus pray. Verse 1 says, \"One day Jesus was praying in a certain place. And when he finished, one of his disciples said to him, 'Lord, teach us to pray.'\" But this isn't the first time in the Gospel of Luke that we find Jesus praying. In Luke chapter 3, verse 21, it says, \"When all the people were being baptized, Jesus was baptized, too. And as he was praying, heaven was opened.\" Two chapters later, Luke chapter 5, verse 15, it says, \"Yet the news about him spread all the more, so that crowds of people came to hear him and to be healed of their sicknesses, but Jesus often withdrew to lonely places and prayed.\" In Luke chapter 6, Jesus went out on a mountainside to pray and spent the night praying to God. In Luke chapter 9, we read, \"Once when Jesus was praying in private and his disciples were with him.\" Just a few verses later, it says, \"About eight days after this, he took Peter, John, and James with him and went up on a mountain to pray.\"\n\nSo here in Luke chapter 11, verse 1, it's not the first time and it's not the last time that the disciples would observe Jesus praying. I wonder if, before they asked how to pray, they ever asked Jesus why. Why did Jesus pray? Jesus is fully God—the powerful Creator of the universe, the Sustainer of all things. Colossians 1:17 tells us, \"He is before all things and in him all things hold together.\" If that is true, if Jesus is God—which he is—did he have to pray? It's a classic theological question that we cannot help but ask. But I want to suggest that the reason we ask that question is rooted in a misguided understanding of what prayer actually is.\n\nBy asking, \"Did Jesus have to pray?\" we're suggesting that prayer is simply a means to an end. By asking, \"Is it necessary?\" we're implying that its worth lies in its results. We're spending this entire summer series exploring what prayer is, why we do it, and how we do it. Here's what I want for you: Some of you automatically feel guilt when we start talking about prayer. Many of us feel this acutely—\"I don't pray like I should. I don't have the words. I don't have the time. I don't have the discipline. I fall asleep when I'm praying.\" And let me say this right from the start: what better way to fall asleep than in the presence of God? I want you to hear this as an invitation from Jesus into something wonderful and mysterious, something really, really good for your soul.\
