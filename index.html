 EastPoint, and you can see those on the screen. As we respond, we want our lives to be a response to the generosity of the gospel. Each week we come back to this core reminder of what we believe as followers of Jesus: that Jesus gave himself for us. And that is what this table is all about.\n\nEach week we come to the table to remember that on the night Jesus was betrayed, he took bread and broke it with his disciples. He said, \"This is my body, which is broken for you.\" He said, \"This cup is the new covenant in my blood. As often as you eat this bread and drink this cup, you proclaim the Lord's death until he comes.\"\n\nAs we sing these next three songs, if you're a follower of Jesus, we invite you at any time to come to the table, to take a piece of bread, to dip it in the cup, and remember the good news of Jesus. It is not because of your works or because of your failures, but it is because of Jesus' death and resurrection that we have hope. That is what we remember when we come to the table.\n\nI invite you to stand with me, and let's sing as we praise the King of Kings.","url":"https://www.youtube.com/watch?v=jB_pE3e_gBk"},{"id":"4qDemTHgzBU","date":"2026-03-24","title":"Christ in Community","scripture":"Colossians 4:7–18","preacher":"Kevin Bigelow","series":"Colossians","desc":"In Colossians 4:7–18, we see how the gospel is lived out through authentic Christian community. Join Kevin Bigelow as he shares how Christ works through relationships to encourage, strengthen, and build His church. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: Colossians 4:7-18\n\nGood morning, East Point Church. My name is Arleth Carneo. Join me in reading aloud this prayer for illumination. The words will be on the screen.\n\nGracious God, help our hearts to hear and understand your holy word with all diligence and faith so that we might rightly know your gracious will, cherish it, and live by it to praise and honor through our Lord Jesus Christ. Amen.\n\nPlease remain standing as you're able for the reading of God's word from the book of Colossians 4:7-18.\n\nTychicus will tell you all about my activities. He is a beloved brother and faithful minister and fellow servant in the Lord. I have sent him to you for this very purpose, that you may know how we are and that he may encourage your hearts. With him is Onesimus, our faithful and beloved brother who is one of you. They will tell you of everything that has taken place here. Aristarchus, my fellow prisoner, greets you, and Mark, the cousin of Barnabas, concerning whom you have received instructions. If he comes to you, welcome him. And Jesus, who is called Justus. These are the only men of the circumcision among my fellow workers for the kingdom of God, and they have been a comfort to me. Epaphras, who is one of you, a servant of Christ Jesus, greets you, always struggling on your behalf in his prayers, that you may stand mature and fully assured in all the will of God. For I bear him witness that he has worked hard for you and for those in Laodicea and in Hierapolis. Luke, the beloved physician, greets you, as does Demas. Give my greetings to the brothers at Laodicea and to Nympha and the church in her house. And when this letter has been read among you, have it also read in the church of the Laodiceans. And see that you also read the letter from Laodicea. And say to Archippus, \"See that you fulfill the ministry that you have received in the Lord.\" I, Paul, write this greeting with my own hand. Remember my chains. Grace be with you.\n\nThis is the word of the Lord. Thanks be to God.\n\n---\n\nAt this time, we will dismiss the kids in the adventures class. I am here at East Point Church, one of our support churches. They pray for us. They financially support us as a church plant. And I have the joy of preaching for them this morning. You guys have a special treat—Kevin Bigalow is going to bring the word, and I'm excited for you to be blessed by his preaching. But before he comes up, I want you to know that across the triangle there is a church where three services are happening this morning. God's doing some cool things here at the Point Church, and they believe in what God is doing at East Point. I just want to show you that there are a group of people praying for you and cheering for you this morning.\n\n---\n\nGood morning, everyone. My name is Kevin Bigalow. I am a member here at East Point and, along with my wife, I lead a community group. We have three kids. Before we jump into the sermon, I wanted to take a minute and brag on the insane generosity of Jesus. Paul talks about it in other places—the Lord's faithful, patient preparation of vessels of mercy. I have known Peter for probably twenty-five years now, and I've watched Jesus slowly and faithfully pursue both Peter and Mary, cultivating in them this insanely deep love for himself. So you guys really have this incredible privilege in Peter and Mary, given to East Point from Jesus, and that should be an encouragement to you. Here's why: Jesus knew about all of you twenty-five years ago when he started preparing Peter and Mary and orchestrating the story they would walk through to get them ready for today.\n\nAll right, without further ado, this morning we're looking at the end of Colossians 4. As we do that, on the front end we're going to take a quick overview of where we've been throughout the book of Colossians, since we're coming to the very end of both the series and the letter that Paul is writing. Then we'll dive specifically into verses 7 through 18.\n\nBefore I do that, can I pray for us?\n\nOur Lord, you are good and kind. You're the one who invites us the first morning of every week back to yourself as we gather for worship. We confess that we come with hearts that are wandering, with hearts that are distracted, with hearts that have had pain or confusion or frustration attached to them throughout the week. Yet knowing where we are, you invite us to bring that to you. You invite us to come to yourself. So this morning as we come to your word, we pray that by your spirit, you would capture the parts of our hearts that are wandering, that you would show us Jesus risen, that you would show us him reigning, and that you would create in our hearts a deep longing for his return. We pray all this in your name, Jesus. Amen.\n\n---\n\nSo as I said, we're going to start briefly with a quick overview of where we've been in Colossians. What I want you to see in Colossians 1 through 3 is essentially this: Christ is the one who gives life to the cosmos. Then in his resurrection, he gives us his resurrection life and invites us to walk in it. Let me show you that from the text.\n\nIf you go to Colossians 1:16, Paul says, \"For by him—that's Jesus—all things were created. That 'all things' means all things, everything. All things were created in heaven and on earth, visible and invisible, whether thrones or dominions or rulers or authorities. All things were created through him and for him.\" He then goes on to say, \"And he is before all things, and in him all things hold together.\" In other words, right at the beginning of Colossians, Paul lays out that the whole of creation gets its life from Jesus and is held together by him.\n\nBut then Paul walks that forward in chapter 2. If you jump to chapter 2, verse 13, he brings that closer to home. He says, \"And you—that's us—who were dead in your trespasses and the uncircumcision of your flesh, God made alive together with him.\" In other words, one of the ways Jesus demonstrates his life-giving authority is he steps down into our death, joins us in that death, and then commands life out of it. He climbs back up out of death, back up out of the grave, and does that so he can join us to his resurrection life. That's the sweep of the story Paul is telling: you were dead, but now because of Christ, you're alive.\n\nThen he walks that forward one more time in chapter 3, verse 1. He says, \"If then you have been raised with Christ, seek the things that are above, where Christ is seated at the right hand of God. Set your minds on things that are above, not on things that are on earth.\" In other words, Christ is the one who gives life. He joined you in your death, then joined you in his resurrection life. He didn't just take you away, but he left you here and invites you to walk in that life.\n\nThis is the sweep of the argument Paul's been building. It's a little like this: if you've ever worked in corporate America—I do, I work for a tech company here in the Triangle—you walk down any corridor of any building and what's always on the wall? An AED, a defibrillator. What a defibrillator does is if somebody's heart stops, in other words, they're dead, somebody rushes and grabs the defibrillator, hooks them up to it, pushes the button. The machine senses what's going on and then hits them with energy that raises them to life. You know why we have them in every corner of our building? Dead hearts don't start themselves. Dead hearts need to be hit with energy in order to raise to life.\n\nThat's the picture Paul is painting here. Not physically, but spiritually—which is more true than physically—we're dead. Apart from Christ, we don't have the capacity to worship God because we love other things rather than the beauty of Jesus. But then Jesus comes along by his spirit, reveals himself to us, and we wake up to the beauty that orients the cosmos. We're raised to new life, to a new nature, to new affections.\n\nBut here's the last thing about this: when somebody's heart gets restarted, you know what happens? If someone's heart has stopped, their blood withdraws and they go cold. You can see the life actually withdraw from their members. But then the heart starts, and what happens? The life doesn't just stop at the heart. It actually makes its way back out into the whole entire body. So that's what we're seeing here.\n\nThe question I want us to answer this morning as we look specifically at chapter 4:7-18 is this: what does the resurrection life of Jesus look like in us? We're going to see that in a couple of ways. We'll see that the resurrection of Christ transforms our relationship with our people—your family, your friends. It transforms our relationship with our purpose in the world. And then we'll also see how it transforms our relationship with ourselves.\n\n---\n\nFirst, let's look at how the resurrection of Christ transforms our relationship with other people. If you're old enough and walk through the world long enough, here are a couple of things you already know: life is stupidly hard, and the world is broken. That means you carry around hurt. You get hurt as a five-year-old, then a fifteen-year-old, then a twenty-five-year-old. Those don't go away—they stack up on top of each other.\n\nOne of the things that happens as we carry that hurt is that embedded in us is the image of God. What it means to be human is that you bear God's own image, and with that comes dignity. But because of the pain and sin you experience, you end up walking through life asking the question: do I matter? You feel inside like you matter, but the pain you experience and the story you live in the world leaves you questioning whether you have the dignity that your insides tell you that you have.\n\nAs a consequence of that, you know what happens? Really sharp disagreements. Those really sharp disagreements with other people who think they matter while you think you matter turn into fractures—really sharp fractures where people who've been close for a while now keep their distance because of the potential for pain. And then after that, you eventually have a total rupture in the relationship, and very best friends become very worst enemies. If you think through your own life, I don't know that all of you have exactly that experience, but you can think through relationships that at least aren't exactly the way you wish they were.\n\nHere's why I'm bringing this up. Check out chapter 4, verse 10:\n\n\"Aristarchus, my fellow prisoner, greets you, and Mark, the cousin of Barnabas, concerning whom you have received instructions. If he comes to you, welcome him. These are the only men of the circumcision among my fellow workers for the kingdom of God, and they have been a comfort to me.\"\n\nIf you're familiar with the Bible, some of you already know who Mark, Barnabas's cousin, is. But if you're not, it's really helpful to rewind ten years from here. Right in this letter, Paul is in prison in Rome, writing to a little church that, honestly, East Point is probably bigger than the church in Colossae. It's probably thirty to a hundred people. As he's writing, one of the men with him is Mark. But ten years before this, in Acts 15 beginning in verse 36, Paul and Barnabas are on their mission. Paul says, \"After some days, Paul said to Barnabas, 'Let us return and visit the brothers in every city where we proclaim the word of the Lord and see how they are.' Now Barnabas wanted to take with them John called Mark. But Paul thought best not to take with them one who had withdrawn from them in Pamphylia and had not gone with them to the work. And there arose a sharp disagreement, so that they separated from each other. Barnabas took Mark.\"\n\n# Sermon Transcript - Clean Version\n\nHim sailed away to Cyprus and Paul chose Silas and departed, having been commended by the brothers to the grace of the Lord. What you see ten years before this letter is a big enough disagreement, a big enough fracture, that Barnabas and Mark and Paul and eventually Silas go their separate ways. Now you might think, okay, just another relationship conflict—who cares? But do you know that when Paul came to Christ, there was no one who would engage with him except Barnabas? Barnabas was the one who took Paul to Jerusalem and gave testimony so that the apostles would accept him. Paul's role in the mission of the church has a lot to do with, or a lot owed to, Barnabas. This disagreement was big enough that it broke up the man who discipled him from the disciple. But now walk that forward ten years later. We're on the other side of this dispute, and now we're in what Paul's saying in Colossians.\n\nLet me just read that to you again. \"Mark the cousin of Barnabas is my fellow prisoner Aristarchus... Mark the cousin of Barnabas... These are the only men of the circumcision among my fellow workers for the kingdom of God and they have been a comfort to me.\" Think about that broken relationship. What would it look like? Is it even possible that ten years from now you could say partner and comfort in that relationship? But it gets better. Five years from now, Paul's going to write another letter and Mark's going to come up again. It's in Second Timothy 4, except the stakes are way higher. Paul's imprisonment is really getting sideways. He's literally on what we know now, on this side of history, is his way to his martyrdom. This is the last bit. Things are going sideways. His mission for Christ is going to end up taking his life.\n\nAnd now listen to what he says in Second Timothy 4: \"Do your best to come to me soon. For Demas in love with this present world has deserted me and gone to Thessalonica. Crescens has gone to Galatia. Titus has gone to Dalmatia. You get that things are desperate for Paul, right? Everybody, either through providence or through ghosting, is gone. Luke alone is with me.\" Now listen to what he says to Timothy. Are you ready? \"Get Mark and bring him with you for he is very useful to me.\"\n\nHave you ever met somebody on their deathbed? I didn't plan this story, but my dad passed recently. In the days leading up to it, he really wanted me and my brothers. My oldest brother Doug wasn't there, so my dad regularly would ask for Doug. Paul knows it has gone sideways. Who does he ask for? He says, \"Get Mark and bring Mark.\" Here's my point: The relationship that you have today that is so shattered you couldn't imagine it getting put back together—the resurrection life of Jesus is able to take that from complete rupture all the way over to fellowship and comfort, to the point where intimacy is like calling for that guy on your deathbed. How does that happen?\n\nHere's what I want you to hear. The resurrection of Christ doesn't just change the way you relate to people. It transforms broken relationships—already broken ones. Let me give you a couple of examples of the way that Christ does that.\n\nThe first one is about the beauty of Christ. If your brother hurt you, you know what you're free to do in Christ? You don't have to gossip. You don't have to ignore them. You don't have to wonder whether they'll hurt you again. You just go to your brother and be like, \"Bro, you hurt me.\" And Lord willing, with the spirit dwelling there, he goes, \"Man, tell me more.\" The beauty is just like we walked through at the front end, as Paul has been laying out—you know what it means to be dead. And it's not a surprise to you that death is still at work among your brother. You're both sinners. It's not a surprise to you that he hurt you or you hurt him. And because of that, you have the freedom to simply go to them and invite them into intimacy in Christ.\n\nThe flip side is that somebody may come to you and say, \"Hey bro, you hurt me.\" That might be the other side of your broken relationship. But the beauty is you already believe that you're a sinner, and you already believe that your brother who's coming to you is a sinner. So it's not a surprise to you that you probably hurt them. And because they're a sinner and because they're hurt, they don't have to have the details exactly perfect in order for you to see that you have hurt them.\n\nThis isn't a moral thing. This isn't about trying harder at your relationships because Jesus tried hard with yours. This is saying that because of who Christ is, he has changed who you are. You are a sinner who was dead who's now made alive. And because of the change in your identity, it transforms the way you relate to each other.\n\nLet me give you one more. There are so many—I'm not going to talk about them all this morning—but there's Onesimus. You all should read about that. That's really interesting. And then Demas—that's a really interesting story. There are broken relationships all throughout this text. But the other way it transforms our relationships that I want you to see is this: as we struggle with dignity and ask whether we matter, two other questions pop up in our hearts: Am I loved and am I safe? Do I belong? And in that belonging, is it at threat or is it stable? Because of that, what we do is we think, \"Man, I don't really know where to belong.\" And so in our brokenness, we look for people who are like us. We try to identify sameness or similarity, and in that we try to create solidarity. Then what happens in the solidarity around your sameness is that the person who's not like you becomes bad, evil, harmful—whatever negative thing you want to say about them.\n\nLet me tell you a quick story. In the town we grew up in, you were either from Smithsburg or Boonsboro. I know nobody knows that. Jen should be laughing right now. Those weren't the only two towns in the county, but they were the ones that mattered. Hagerstown was like a thing, but it was off in the backdrop. And the rivalry between Smithsburg and Boonsboro was so intense it might get your football field set on fire. I'll tell you this: thirty years later, I can drive through Boonsboro and Smithburg and I can tell you with absolute certainty as somebody who grew up there—I don't know where one stops and the other one starts. There's really no difference between the two. Jen has two sisters. One married a guy from Boonsboro and the other married a guy from Smithsburg. We both get along great. And by the way, they're from Hagerstown. But this is happening throughout human history. You see it here in the first century. There's Jews and Greeks. There's Jews and Romans.\n\nIn our world, there's Democrats and Republicans. There's white, black, Asian—however it is that you identify the culture that you're rooted in. There's Durham and Raleigh. When I was moving to town and I said that to somebody, people from Raleigh were like, \"Durham,\" and people from Durham were like, \"Oh, Raleigh.\" Even in Durham there's Chapel Hill and Durham. I can tell you I do not know the difference between the two. There's Wolfpack fans, Tarheel fans, and Blue Devil fans.\n\nBut check this out. Verse 10 says Aristarchus, Mark, and Justice are all Jews. Epaphras, Luke, and Demas are all Gentiles. Epaphras and Onesimus and Archippus are from Colossae. Tychicus, Aristarchus, and Justice are not from Colossae. What you see is people with very, very significant differences who've been brought together collaborating as one community inside one mission.\n\nHow is the resurrection of Christ able to do that? Do you know your identity in Christ because of his resurrection is so massive that it can dwarf the differences between you and other people without needing to erase them? You know what the consequence of that is? Two things. First, Christ is glorified. The resurrection of Christ is big enough to raise Democrats to life. The resurrection of Christ is big enough to raise Republicans to life—pack fans, heel fans, devil fans. The point of maintaining our distinctions and yet superseding them is that Jesus is big enough to give life no matter where you're coming from.\n\nThe second part is that as he does that, he doesn't whitewash us. He doesn't wipe away the differences. As a consequence, the diversity—what used to be division—now becomes beautiful.\n\nSo what you see is that the resurrection of Christ transforms the way we relate to each other in a couple of ways. It resurrects broken relationships, and it also tears down the walls that divide us without us needing to become the same. Because Christ got out of the grave, that ugly way of relating or that broken relationship that you're thinking about—you can expect God to change lives. The resurrection is able to change those realities.\n\nSecond, let's take a look at how the resurrection of Christ transforms their relationship with purpose. There's this really interesting study—I actually bumped into it this morning—from 2006 to 2010 where they tracked 71,000 people between the ages of 51 and 61. At the start, they measured whether they felt like they had a very clear purpose or not. The people who felt like they didn't have a clear purpose in life were twice as likely to die in those four years as the people who said they did.\n\nI'm not going to turn this into a health lecture about how to keep yourself alive. That's not the point. The reason I brought up that study is that who you are as a human is hardwired to worry about and think about purpose. And there's a reason—a theological and historical reason for that. Do you know the very first words that God ever spoke to a human were a purpose? We're mandated creatures. He said, \"Be fruitful and multiply.\" Because of how you're made, you're made to reflect a God who is an insanely purposeful God.\n\nThe consequences of that are we live through a world that is pretty out of control. We live in a world where we're focused on ourselves, and because we cannot wipe away our mandatedness, we can't wipe away our concern for purpose, three things happen. We collapse either into ambition—thinking, \"I am going to do everything possible to set myself up as the object that everything circles around.\" Or we collapse the other way and think, \"I'm worthless,\" and collapse into despair, or we find ourselves in the middle in disillusionment—thinking, \"I don't even know about this whole entire thing.\" Apart from Christ, what death looks like is it produces ambition, disillusionment, and despair.\n\nAnd yet, what do we see here? Check this out. At least twelve different names from three or four different churches, all meaningfully engaged in the same mission. Each person has a different role. Epaphras is praying. Tychicus is going. Luke is writing. Mark is comforting. Everybody's doing something different, but they're all alive and engaged. And here's the thing: it doesn't matter what their circumstances are. They're all in very different circumstances, or what their capacities are. They have a purpose. So the question is, how does the resurrection do that? Why is it able to do that?\n\nYou know what Paul's saying in the backdrop of Colossians 1 through 3? Christ gives life, but you're dead. So he stepped down into death to join you there and to give you life. But nobody made him do that. He's a missional God. He operates with purpose, and today he is operating with purpose. But as Colossians 2 says, he made you alive—not in yourself, but together with him. What that means is that Jesus has invited you up into his own mission.\n\nWhat's the mission that he invites us into? It's seeing dead things come to life. It's seeing unfathomably broken, end-of-story, done things come into indestructible life. Side note: when the Bible talks about eternity, it's not just talking about forever in terms of amount of time. It's talking about indestructibility. It's talking about a life that cannot be rivaled or overwhelmed. That's what you're seeing here—that Christ, because of his resurrection, invites us into that same mission.\n\n# Cleaned Sermon Transcript\n\nNot just transforms the way we relate, but he also transforms our relationship with purpose because the resurrected Christ will raise dead people. And he invites you into that. One of the values here is we expect God to change lives.\n\nI want to say one more thing about mission, and that will actually bring us to our third point. It is easy for us to hear mission and think, \"Boy, I liked what you were saying, but there goes the preacher telling me what I have to do for Jesus.\" That's not at all what Paul is saying, and it's not at all what I'm about to say. The mission that Christ invites you into doesn't mean packing up your stuff and going around the world. It doesn't mean leaving your friends and isolating. It doesn't mean you have to go do miracles and see crazy stuff happen. Ambition drives us to that. Despair makes us afraid of it. Disillusionment says, \"Whatever, I'll move on.\" But the mission of Christ invites you into a y'all.\n\nOne of the things I was saving until now is the end of chapter 3, verses 16 and 17. Paul says, \"Let the word of Christ dwell in you richly, teaching and admonishing one another in all wisdom, singing psalms and hymns and spiritual songs with thankfulness in your hearts to God. And whatever you do in word or deed, do everything in the name of the Lord Jesus, giving thanks to God the Father through him.\" You've probably heard that verse used to say, \"Man, you better get super serious about everything that you do. You got to do everything toward Jesus. Everything in the name of the Lord.\" But do you know every single verb in chapter 3, and I'm pretty sure in the majority of Colossians, is second person plural, not singular? It's a y'all. So he says, \"Let the word of Christ dwell in y'all richly, teaching and admonishing one another in all wisdom. And whatever y'all do in word or deed, do everything in the name of the Lord Jesus, giving thanks to God the Father through him.\"\n\nHere's what I want you to see. The third point is that the resurrection of Christ doesn't just transform our relationships with people or transform our purpose. It also transforms the way we relate to ourselves. If you grew up in the US like most of us did, there are two significant ways we pursue trying to make meaning. One is through individuality—just pop open Instagram. And the other is exceptionalism. We're convinced that if I can create an incredible distinction between me and other people, then I matter. I'll be safe and I have a place in the world. But what you see here is that as Christ raises us to new life, he doesn't just raise us into new relationships and into new purpose. He raises us into a y'all. The mission unfolds as a community, not as individuals.\n\nFor the last several minutes, I want to walk through what that looks like, because that's probably the heart of this text. The reason Paul lists twelve different people is that there are twelve different things going on. I want to give you four. The first one: what it means to live in the y'all of the resurrected Christ is together. That's what we're doing this morning. But take a look at verse 15: \"Give my greetings to the brothers at Laodicea and to Nympha and the church in her house.\" There is no way to meaningfully walk with Christ and experience the resurrection life that you do individually. Now, there are seasons where you have to walk through isolation and seasons of loneliness, but at the end of the day, we're meant to experience Christ in a community.\n\nOne of the ways we do that is obviously gathering for worship on Sunday morning. But one of the things Jay mentioned earlier today is a second gospel rhythm that we commit ourselves to: community groups. Community groups are a place where you gather, share your hearts with one another, talk through the gospel and the text and the way Christ shows up in the text. Have you ever heard the term interpersonal synchrony? If you lay a baby on a mother's chest, their breathing rate comes into alignment. Their nervous system comes into alignment. Their heartbeat comes into alignment. That's part of what happens in community group—your spiritual life, your spiritual heart comes into a type of synchrony with the gospel people around you. You come back into a normal rhythm. If you're not connected with a community group and you'd like to find out more about them and how to connect, find Peter or Tony or come find me. I'd love to help you. Just come find any of our community group leaders. We'd love to help get you connected.\n\nThe second thing is: what should we do when we're there? When we gather, what's the purpose of being together and what's our role in it? I think it's really interesting what Paul says about Tychicus in verse 8. He says, \"I have sent him to you for this very purpose, that you may know how we are and that he may encourage your hearts.\" Paul is writing assuming that the Colossians don't have everything they need to plow through life without help. They're not rooted and settled enough in Christ yet to go it alone. They need reminded. They need encouraged.\n\nThe Greek words Paul uses here are periklēs, which come from the verb pericleo, or more accurately, from the noun paraklētos. If you've been around the church or Bible studies, you may have heard that term. Parakletos is the word Jesus uses in John 16 to describe the Holy Spirit—the advocate or the helper who will come and lead you into all truth. And periklēs means to encourage your heart. Your heart, as Peter said a couple of weeks ago, is the deciding factor of your life. It's the seat where your life decides which way it should go.\n\nWhat you do when you gather with other gospel people is you accept the fact that your heart is wandering, and you come anticipating that the other person's heart is wandering too. Instead of packing your bags and going to Asia, or even getting up the courage to walk across the street to your neighbor, you look across the living room or across the kitchen counter to the other person, and you hear their struggle with pain and sin and dignity. And what do you do? With the power of the Spirit of Christ, you lead them into all truth. You remind them of the risen and reigning Christ who is working out all the details. That means the reason we gather together isn't just to show God that he matters to us. It's actually a service to us. It brings our heart back into courage.\n\nAs we share those things with each other, it can feel a little weird or spun out there, but Paul drops this little phrase at the end of verse 18: \"Remember my chains.\" Paul had the anticipation that if the Colossians knew about his circumstances, their connectedness would mean they would remember it and carry it with them. He uses similar language to talk about Epaphras. He says, \"Man, Epaphras is from you. He started the church in Colossae, but now he's here with us. Listen, every single time we get up to pray as a group, that dude will not forget you guys. He always remembers to pray for you.\" That's one of the things you see working out in the y'all of the resurrected Christ: as we share our hearts with one another, we also remember.\n\nToday that looks like you may just flip a text to the person and be like, \"Hey, I know you had that appointment today. How did it go?\" And they tell you. And then you remind them of Christ. Or you may be on the receiving end of the text where they're like, \"Hey, bro, I knew this thing was going on. What's up with that?\" You say, \"Man, blah blah blah,\" and they're like, \"Christ is reigning,\" and they pray for you.\n\nLast but not least, I don't want to miss the fact that mission does at times mean going. It doesn't never mean going. I just wanted you to see this morning it doesn't primarily mean going. It means gathering. It means engaging. What you're going to see is that in verse 7, Paul says, \"Tychicus will tell you all about my activities.\" And then in verse 8, it says, \"I have sent him to you.\" But Tychicus didn't just wake up and think, \"Hey, I think I'll check out the church in Colossae tomorrow.\" And Paul didn't wake up thinking, \"Man, something's going on in Colossae. I got to get there.\" There was a collaboration between Tychicus and Paul. Meaning that as we go, the Lord sets opportunities before the community and then we figure out how to go together.\n\nWhat I wanted you to see this morning is that prior to Christ and apart from Christ, we're dead. But the resurrection shows that Christ has the authority to give life. And in that, he joins you to his resurrection. What that resurrection does is it transforms your relationships with people. It transforms your purpose. And then ultimately it transforms the way you relate to yourself, sweeping you up into a resurrection y'all.\n\nJesus, thank you for your grace. Thank you for your word. Thank you for your church and the mission you've given her this morning. As we continue to sing, we pray that you'd remind our hearts of your resurrection, of your reigning. Pray that you would sweep us up into rest in you. We pray all this in your name, Jesus. Amen.","url":"https://www.youtube.com/watch?v=4qDemTHgzBU"},{"id":"3ahl-C-sBk0","date":"2026-03-16","title":"Living in Light of the Gospel","scripture":"Colossians 4:2–6","preacher":"Peter Frey","series":"Colossians","desc":"In Colossians 4:2–6, Paul calls believers to live with prayerful dependence and gracious witness in the world. Join Pastor Peter Frey as he shares how the gospel shapes our words, actions, and mission. Discover real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript: Colossians 4:2-6\n\nI'm Nadine Parker. Will you join me in reading aloud this prayer for illumination? The words will be on the screen. \"Oh, make your word a swift word, passing from the ear to the heart, from the heart to the lip in conversation, that as the rain returns not empty, so neither may your word but accomplish that for which it is given. Amen.\"\n\nPlease remain standing as you are able for the reading of God's word from the book of Colossians, chapter 4, verses 2 through 6. \"Devote yourselves to prayer, being watchful and thankful. And pray for us, too, that God may open the door for our message, so that we may proclaim the mystery of Christ, for which I am in chains. Pray that I may proclaim it clearly as I should. Be wise in the way you act toward outsiders, making the most of every opportunity. Let your conversation be always full of grace, seasoned with salt, so that you may know how to answer everyone.\" This is the word of God. Thanks be to God.\n\nI'm going to dismiss our adventurers—kids up through fifth grade—with our Eastpoint Kids volunteers in the back. As a side note, we have an Eastpoint Kids volunteer training coming up on March 22nd at 9:00 before the service. If you're interested in serving in that way, we'd love to chat with you about that. Thanks, Eastpoint Kids. Have fun.\n\nI want to point us as a church to something I mentioned last week and will keep talking about because this is a big moment in the life of our church. This is our first Easter celebrating together. Coming up on April 5th is Easter Sunday, and here's what that morning will look like. We'll have a worship service that's a little extra special because the resurrection of Jesus from the dead is at the core of who we are as followers of Jesus and as Eastpoint Church. We're going to celebrate that reality with baptisms that day and celebrate the hope that is ours through the empty tomb. After the service, we're ordering pizzas and having fun for the kids, so we hope you can stick around. When you came in, you'll see postcards on the coffee tables—they're a great opportunity to invite people to join us. Many people have spiritual sensitivity around Christmas and Easter, wondering what hope is all about, and this is a great opportunity to introduce people to that hope. I encourage you to be prayerfully thinking about inviting people as we lead up to Easter Sunday.\n\nAs we come to the last chapter in Colossians this morning, we've been working through a series called \"First Things First,\" walking through the book of Colossians—a letter that Paul wrote to a church figuring out what it means to follow Jesus amidst a world with all kinds of voices and influences competing for their attention. At the heart of Colossians is this idea: Jesus is everything. Other things that try to make their way into the equation of our lives—where we find meaning, purpose, and security—are competing for what is meant to be first.\n\nThere's a famous book by Stephen Covey called *First Things First*, and one idea in that book really captures the heart of what we're studying: \"The main thing is keeping the main thing the main thing.\" That phrase has probably become part of your vocabulary, but you may not have known where it came from. As we've journeyed through Colossians, which is really about finding your security, worth, and meaning in Jesus himself rather than in what you do or what you compensate for, the question becomes: How do we keep that the main thing? What is the regular, habitual activity that keeps us grounded in that truth?\n\nI think what Paul holds out to us as he closes his letter to the Colossians is the habit and practice of prayer. Look at what he says in Colossians chapter 4, verse 2: \"Devote yourselves to prayer, being watchful and thankful.\" The word *devote* occurs ten times in the New Testament and is almost always connected to prayer. We see it in Acts when Jesus leaves the church with a mission and says, \"Go and wait for my spirit.\" In Acts chapter 1, verse 14, it says they all joined together constantly in prayer. That phrase \"joined together constantly\" is this word *devote yourselves*. Some of your translations might translate it \"continue steadfastly.\" It's the picture of letting this be a governing habit or practice in your life.\n\nWhat's interesting about this word is that Paul uses it connected with prayer throughout Scripture, almost ten times. In secular ancient Greek literature, it's almost always connected to vocation—like \"devote yourself to the practice of plumbing\" if you're a plumber, or \"devote yourself to the practice of writing\" if you're a writer. I think it's significant that Paul takes this worldly word from secular language and applies it to our lives as followers of Jesus. He's saying the central practice of the Christian life is this: devote yourself to prayer.\n\nStephen Covey, in his book about productivity, says the main thing is keeping the main thing the main thing. But when I think about how we keep the main thing the main thing in the Christian life, Paul points us to something that my productive tendency tends to resist. Prayer often feels clumsy. It feels inefficient. It feels hard at times. C.S. Lewis called prayer one of the most irksome of all spiritual disciplines. It's a practice of relinquishing control, and all of us feel that on a heart level. We like control, and the message of Colossians is really confronting the tendency of the church to add something to Jesus—to add religious rules or philosophy or life hacks that promise, \"If you just do these seven steps, you will have a better life.\" It's so easy to latch onto that because it gives us a sense of control. If we do these things, then we will have a successful, meaningful, or purposeful life.\n\nBut Paul invites us into a practice that adamantly opposes that posture. It invites us to a posture of dependence. He says, \"Devote yourself to a practice that will feel inefficient, that will sometimes feel unproductive.\" But why? Because we believe that God changes lives. We believe that God is at work in our world today. Jesus didn't come, live a perfect life, die a death that we owed, rise from the dead, and say, \"All right, peace out. I'm coming back one day.\" He said, \"No, I'm going to send my spirit, and I'm going to be at work in our world. I'm going to invite a ragtag group of imperfect people to be part of what I'm doing in the world.\" And how does he invite us to be part of that? He invites us into this categorically new thing called the church, and he invites the church to devote themselves to prayer.\n\nSo what does this practice of prayer look like? Paul describes two postures. One is pray with your eyes open, and two, pray with your hearts full. He says, \"Be watchful.\" The word is also translated as \"awake\" in the New Testament—it's the idea of being sober-minded. It means let your senses be fully aware. Pray with your eyes open. Most of us have been taught to pray with our eyes closed, and that's a good practice. It frees us from some of the distractions around us and allows us to focus on what we don't see. But I think Paul is also inviting us into praying with our eyes open, praying with an awareness of what is around us.\n\nI had a mentor in high school who wanted to train me in having awareness of what was happening around me. He'd do these quizzes where he'd say, \"Close your eyes. Tell me what color was the sign in the back of the room?\" And I'd have no idea. We would do these practices, and he was trying to train me to have awareness of what's happening in the room around me. I think that as Paul invites us into prayer, it's an invitation to having our eyes open to what's happening in the world around us.\n\nHere's why I think that's important. In Colossians chapter 3, verse 1, it says, \"If you've been raised with Christ, set your eyes on things above, not on earthly things, because that's where Christ is.\" We, if we put our faith in Jesus, are united with Christ. That's where our life is found. But sometimes the Christian life has been interpreted as a kind of escapism—escaping from the realities of this world, closing our eyes to what's happening around us, and just focusing on positive things. Christianity has at times been wrongly distorted into spiritual optimism rather than what Paul invites us into: spiritual realism that's grounded in spiritual realities you don't see. He wants us to pray watchfully with eyes open and with hearts that are full.\n\nWhy does Paul continually come back to thanksgiving? Part of it is that gratitude is the gauge of the gospel taking root in our lives. When our hearts are full of gratitude, it combats that feeling of entitlement. I think this is important as we think about prayer. Some of us come to prayer thinking, \"God, would you give me this? I've got this problem in my life that I'd like you to solve.\" It's easy to have that posture of \"God, why don't you just fix this?\" But gratitude combats entitlement by inviting us into a posture of coming to God with a full heart because of what we've experienced in Jesus. I didn't deserve the life, death, and resurrection of Jesus changing my life like it has. And when I think about how Peter puts it in 1 Peter 2—\"once without mercy, but now I have received mercy\"—that produces in me a posture of gratitude.\n\nSo here's the practice and posture that Paul invites us into, and then he gives us the content of this prayer. Look at verse 3. He says, \"And pray for us, too.\" Paul is writing this letter to the church. He's been imprisoned because of his evangelistic ministry. He's a missionary planting churches, and he's been persecuted for his faith. He says, \"Pray that God may open a door for our message, so that we may proclaim the mystery of Christ for which I am in chains. Pray that I may proclaim it clearly as I should.\"\n\nPaul invites the church, invites you and me into the practice of prayer with eyes that are open and hearts that are full—praying that God would open doors. All of us have the concept in our minds of what that metaphor means. We use it in everyday language, and the ancient Greek world did too. It's a picture—we know what a closed door looks like. In fact, I went to Habitat for Humanity this week and asked how much their doors cost. They showed me the doors and gave me pricing, and I said, \"Here's the deal. I need this for a sermon illustration. What's your cheapest door?\" Sweet Nancy said, \"You need it for a sermon illustration? You can have this one for free.\" Shout-out to Nancy at Habitat for Humanity. We know the image of a closed door because we use it all the time in our language.\n\n# Cleaned Sermon Transcript\n\nA closed door to this opportunity—Paul is imprisoned, which in many ways feels like a closed door to what he was called to do: plant churches and lead people to Jesus. And he says, \"Church, I want you to pray that God would open doors. That God would open doors.\" As I think about this, we have a core value here at Eastpoint Church. You see it in the hallway every week when you go to the bathroom. It says, \"We expect God to change lives.\" That's our core value as a church. We want to lean into this kind of expectation that we expect God to change lives.\n\nAs Paul is praying from prison, he says, \"Pray that I'm going to have an opportunity to see doors opened for me to proclaim Jesus.\" How does he describe it? He describes it as the mystery of Christ, which is that Christ wants to come and indwell his people. He loves you so much that no matter what you've done or where you're from or what you think you bring to the table—you don't measure up to him—and he says, \"I love you anyways, and I want to come in and indwell you and give you new meaning and life and purpose.\" This is the mystery of Christ. He's like, \"Pray that even in my chains, there would be doors opened.\"\n\nAnd this is where I think prayer starts to change us. When we devote ourselves to the practice of dependence upon God, we start to see even the hard things in our lives not just as a hard thing, but as a door that we want to see God open. A circumstance that we want to see God redeem. In some ways, it's like there are moments in our lives where we feel like we're walking through hell, and we're like, \"We want to see heaven break into hell. We want to see the kingdom of God,\" as Jesus taught us to pray, \"on earth as it is in heaven.\" And as we do that, we pray, \"God, would you open doors?\"\n\nSo here's my first encouragement for us this morning: would we pray that God would open doors? I wonder what circumstances in your life come to mind that feel like a closed door to God's plan and purposes. Maybe it's a relationship where you long for them to experience Jesus. Maybe it's unexplainable suffering in your life. Paul invites us: would we pray that God would open the door of what seems like a roadblock to God's plan? God, would you work? Will we be a church that has a life shaped by prayer, that has an expectation that God is a God who opens doors?\n\nAnd here's what Paul points us to. When we pray like that with that kind of expectation, we start to live like the doors have been opened. Look at how the passage continues in verse 5: \"Be wise in the way you act toward outsiders. Make the most of every opportunity. Let your conversation be always full of grace, seasoned with salt, so that you may know how to answer everyone.\"\n\nPaul points us to a way of living that lives as if the doors have been opened. To view our lives as gospel opportunities. There are people in our lives who feel like they are a closed door to Jesus' work. But the reality is, yes, that may be true, and we need to pray for God to open that door. But the reality is our lives are an open door to what Jesus can and has done. So I want us to view our lives as a place where God opens doors. Live like the doors have been opened.\n\nBe wise in the way you act toward outsiders. Make the most of every opportunity. As we think about the spheres in our lives where God has put us, each of you have different stories. Maybe it's the family that you stay home with. Maybe it's the people that you're surrounded with, whether on a Zoom call or in an office. Maybe it's the neighbors that God has put around you or the circle of friends that you have accumulated over years. Paul says this: make the most of every opportunity. It goes back to that watchfulness—praying with your eyes open. Look for ways that God might be inviting you to be the open door. To be the answer to that prayer. Yes, we pray that God would open closed doors, but we live like he does.\n\nThis is at the heart of this passage, our core value: we expect God to change lives. What does that look like in everyday life? We want to be a church that is radically dependent upon God in prayer. We expect God to change lives. Live accordingly. What does that look like? We're going to pray that God's going to open doors in this term for people to experience the life-giving and transforming work of Jesus. We're going to pray for the closed doors here in this elementary school of families that feel pretty isolated. That God would open doors for them to experience the love of Jesus. For them to experience the hands and feet of Jesus.\n\nNot only do we view our circumstances as opportunities, but we think about how we talk. We talk in a way that others can taste the goodness of the gospel. He says, \"Let your conversation always be full of grace, seasoned with salt, so that you may know how to answer everyone.\" Notice that he doesn't say, \"Let your conversation always come back to the Bible. Let your conversation always come back to the theology of what Jesus has done on the cross.\" No, he says, \"Let your conversation always be full of grace.\"\n\nWhat does it look like for your words this week to be full of grace? Sometimes I think about my conversations, and I try to make a regular practice—kind of like we did this morning in a prayer of confession—to reflect on my heart and take inventory of the conversations I've had. And I'm sometimes really convicted by the way that my conversations are often just conversations where I try to keep up. I try to keep up with whatever someone is talking about, or basically just not make people think I'm weird as a pastor. That is what shapes a lot of my conversations.\n\nBut what if I longed for something more than that? That my words would be a place where people are like, \"Man, that was really gracious the way Peter talked to me today.\" We have this word in the church called evangelism, and it's like a big scary word. We have this picture of going and knocking on people's doors and grabbing them like, \"Say Jesus. Say Jesus.\" That is not what Paul is holding out to the church. He says, \"Pray that God would open doors.\" At the heart of that is that we believe God moves, not us. And then he says, \"Look at where you are.\" What if your conversations could be full of something more than keeping up with the Joneses? What if they were about deeper things?\n\nI was actually struck by this when Tony and I came and served lunch to the teachers and staff here at Oak Grove a couple weeks ago. It was a sweet thank you for your generosity and to bless the teachers and staff here. But as I engaged in conversations, there were so many conversations. Sometimes I was just kind of in the corner of the room listening to some of the teachers and staff. They were all talking about what they're going to do on their break from school, which makes sense—that's something they're looking forward to. They're talking about vacations they're going to go on and things like that.\n\nWhat if in our everyday conversations with people, where that's kind of our culture—where we look forward to the next thing as our hope—what if I could just graciously and seasoned with salt be like, \"You know what I'm looking forward to? Man, I'm looking forward to Easter Sunday at Eastpoint Church. I'm just really looking forward to it. Why? Because I really believe that the hope of Jesus changes my life.\"\n\nI was really struck by this a couple years ago. I was convicted. It was Easter Sunday. I had come home. I was serving at another church. I came home exhausted because I'd been serving all morning and I saw my neighbor—someone who doesn't know Jesus. He said, \"How's your weekend?\" I was exhausted, ready to go inside and go to bed, and I described what I did over the weekend. But I didn't mention the celebration that I just had on Easter morning. I went and laid down in bed because I was exhausted, and I was so convicted. I was like, \"This is the most exciting thing in my life and I didn't talk about it.\" I think that's what Paul is pointing us to. If you've been raised with Christ, let that fill your conversation sometimes. This is our hope. Let this season our lives. Let us talk in such a way that others taste the goodness of who Jesus is and what he's done in our lives.\n\nSo we pray with eyes open and hearts full. And I think that leads us to pray with expectation that God does change lives. It invites us into a place of transformation. Tyler Staton has written a couple books on prayer. One is called *Praying Like Monks, Living Like Fools*. He leads a movement called 24/7 Prayer, and some of his resources have been really helpful for me in prayer. One time I heard him say something that I think is something I long to continue to grow into. He said, \"Becoming a person of prayer is a process of becoming less and less concerned with what happens between 'Dear God' and 'amen' and more concerned about what happens after amen.\"\n\nI think that's what God is inviting us into as a church. We want to be a people of prayer, but that's less about the words that we say to God and more about the posture of our hearts of expectation and faith. We believe that God changes lives and that he invites us to be part of that. So we want to say, \"God, would you transform us in such a way that our conversation would be so gracious, so seasoned with salt, that we would know how to answer everyone?\" Implicit in that statement is that people are asking about it. He's talking about a way of life that just begs people to ask, \"Hey, what's different? What's different?\"\n\nFor me, the conversations that Jesus invites me to think about are really the conversations of where the brokenness of the world and my own heart and life meet the hope of Jesus. So often, I think my conversations being gracious and seasoned with salt is when I'm talking shop with my neighbor and we're talking about what's hard in our lives, and I can say, \"You know what? I'm really anxious about this. Mary's health's been rough the last couple of weeks and it weighs on me. But you know what? If it weren't for the hope of Jesus, if it weren't for the fact that I've seen and tasted that he is good—yeah, this whole church planting thing isn't easy. I would give up. But that sustains me.\"\n\nDietrich Bonhoeffer, in his book of lectures to his students on preaching, talks about how you help people taste and see the goodness of Jesus. He gives an illustration: if you want somebody to have an apple, you don't give them a scientific explanation of that apple. If I were to tell you this morning what an apple is, I could tell you it's an edible fruit produced by the deciduous tree species *Malus domestica*. Scientifically, the apple is classified as a pome. Did you know that? I didn't know it. I don't even know what a pome is. But it's a type of accessory fruit in which the fleshy edible portion develops primarily from the floral receptacle rather than the ovary alone. Did you know that? And an apple has a spherical, slightly oblong shape with a diameter of about five to ten centimeters. It's got an exocarp—the skin—which is a thin outer layer containing pigments such as anthocyanins and carotenoids.\n\n# Cleaned Sermon Transcript\n\nThe mesocarp is the flesh—the edible fleshy tissue composed largely of water, simple syrups, sugars, and cellulose. And then there's the endocarp, which is a cartilaginous structure containing five carpels, each potentially holding one or two seeds. Dietrich Bonhoeffer says that's not how you get somebody to eat an apple. You take a bite, and you say, \"This is really good. You want to try it?\"\n\nI think in the church sometimes we have this idea that to offer Jesus to people is to give them a theological treatise explaining why his life, death, and resurrection matter. We present them with penal substitution and justification and all these things. But what Paul is holding out to us is something different: believe that God changes lives and pray that he would, then let your speech be colored by what you've tasted.\n\nJust be honest. Say, \"I've tasted that Jesus is good. I don't have all the answers. I can't make sense of all the brokenness in our world today, but I believe. I'm holding on because I have hope beyond the brokenness I see.\" Or say, \"I do get really anxious, but Jesus talked about how he leaves us with peace, and I've tasted that peace. I don't always understand it—actually, the Bible says it's a peace that transcends understanding.\"\n\nThat is what we have to offer to a hurting world. Yes, the theology and the academic side of things are good. We can talk shop whenever we want. We can read books. I want us to grow in the knowledge of Christ. But when Paul says in Colossians chapter 2, \"Just as you received Christ, continue to walk in him, letting your roots go down and be established in him, overflowing with thanksgiving,\" I think he has in mind that we would be people who say, \"We've tasted and seen that Jesus is good.\"\n\nAs I read the stories of the early church, I see a ragtag group of people who witnessed a resurrected Savior. They didn't have some big strategy. They devoted themselves to prayer and told people Jesus rose from the dead. Two thousand years later, we're still here this morning celebrating that reality. We stand on the shoulders of giants who believed that God changes lives, and we want to join them in that.","url":"https://www.youtube.com/watch?v=3ahl-C-sBk0"},{"id":"0tKAGTKbHqU","date":"2026-03-09","title":"How the Gospel Changes My Relationships","scripture":"Colossians 3:15–4:1","preacher":"Peter Frey","series":"Colossians","desc":"In Colossians 3:15–4:1, Paul shows how the gospel reshapes our relationships at home, at work, and in the church. Join Pastor Peter Frey as he shares how Christ-centered living brings peace, humility, and real hope for real life at Eastpoint Church in Durham, NC.","transcript":"# Sermon Transcript\n\nGood morning, everyone. My name is Rachel, and I have the privilege of reading Scripture today. Please join me in reading aloud this prayer for illumination. The words will be on the screen.\n\nLiving God, help us to hear your word that we may truly understand. That in understanding, we may believe, and believing, we may follow your way in all faithfulness. We seek your honor and glory in all that we do. Amen.\n\nPlease remain standing as you are able for the reading of God's word from the book of Colossians, chapter 3, verses 15 through chapter 4, verse 1.\n\nLet the peace of Christ rule in your hearts, since as members of one body, you were called to peace, and be thankful. Let the message of Christ dwell among you richly, as you teach and admonish one another with all wisdom through psalms, hymns, and songs from the spirit, singing to God with gratitude in your hearts. And whatever you do, whether in word or deed, do it all in the name of the Lord Jesus, giving thanks to God the Father through him.\n\nWives, submit yourselves to your husbands as is fitting in the Lord. Husbands, love your wives and do not be harsh with them. Children, obey your parents in everything, for this pleases the Lord. Fathers, do not embitter your children, or they will become discouraged. Slaves, obey your earthly masters in everything, and do it not only when their eye is on you and to curry your favor, but with sincerity of heart and reverence for the Lord. Whatever you do, work at it with all your heart as working for the Lord, not for human masters, since you know that you will receive an inheritance from the Lord as a reward. It is the Lord Christ you are serving. Anyone who does wrong will be repaid for their wrongs, and there is no favoritism. Masters, provide your slaves with what is right and fair, because you know that you also have a master in heaven.\n\nThis is the word of the Lord. At this time, we will dismiss the kids in the Adventurers class. Have fun in Eastpoint Kids.\n\n---\n\nGood morning, Eastpoint Church. It's great to be worshipping with you this morning. It feels a bit like spring or summer—it is warm in here. Thank you for bearing with the humidity in this gymnasium this morning. There are some things out of our control, and isn't that faith? Learning to relinquish control.\n\nThis morning, I want to say first that I'm so glad you're worshipping with us if you're visiting. What a sweet morning already of hearing the story of hope and proclaiming that we follow and worship a God of real hope. That is what we're all about.\n\nI want to point you to something coming up in just a month: Easter weekend. Easter comes early this year—it's on April 5th. I'm going to talk about this a little toward the end of my sermon, but I want to encourage you as we look forward to our first Easter as Eastpoint Church. There's something about Easter Sunday that is especially special for Christians. As followers of Jesus, Easter is the Super Bowl of who we are. It is the moment we celebrate what our hope is built on. It's especially special for us as Eastpoint Church because our mission is to point a hurting world to hope in Jesus. The hope that we have to offer is grounded in the resurrection of Jesus from the dead. I'm pumped for Easter Sunday and our first Easter as Eastpoint Church.\n\nFollowing last Easter, there were reports across the nation of all-time highs in Easter attendance compared to previous years. As a church, we're realizing there is a spiritual sensitivity, especially among the younger generation, about what this life is all about. I think much of it is grounded in the reality that our world is broken, and we need hope. People are longing for that. So I want to encourage you: Easter's coming on April 5th, and there are a couple of things happening that weekend.\n\nOn Good Friday, which is the Friday before, we're going to have a service right here in Oak Grove. It will be about 45 minutes long and will be an opportunity to reflect on the significance of the cross of Jesus. We cannot celebrate the significance of the empty tomb until we reflect on the significance of why Jesus had to die on our behalf. That is at the heart of who we are as a church. Good Friday is April 3rd at 6:30 p.m., and then Easter Sunday is a 10:00 a.m. celebration service.\n\nWe plan to have baptisms on Easter Sunday. If you are a follower of Jesus, or perhaps Jesus is moving in your heart, baptism is that first step as a follower of Jesus to identify with him and his story becoming our own. Jesus died, was buried, and was raised to newness of life—that is the story Jesus offers each of us. If you have never been baptized or would love to talk about being baptized, I would love to meet with you. Come find me after the service, or let's set up a time to connect and talk about what baptism could look like for you.\n\nI wanted to cast a little vision for what's ahead in just a month. Now let's turn our attention to God's word. Let me pray for us one more time.\n\nGod, in the midst of a broken and chaotic world, in the midst of an hour or less sleep, in the midst of whatever we brought into this space this morning, we turn our eyes to you because we need a word from you. In these brief moments, meet us. Speak to us through your word. Allow me to communicate clearly who you are. We want to see you. We pray in Jesus' name. Amen.\n\n---\n\nA couple of years ago, I took my son Elijah to his first Durham Bulls baseball game. He was just over two years old, and I thought we would last about three innings. For some reason, he was glued to the game. We stayed all nine innings, and from that day developed an obsession with a sport that I just do not get. If you asked me to rank the sports I would like my son to play, baseball would have been down here. But I'm slowly becoming a baseball dad. Elijah started his first baseball practice this week—he had two practices.\n\nThere's something about Elijah that I adore in him: he is all or nothing. From the moment he saw the Durham Bulls play, it became his heart's desire to do a wall catch. What he means by that is we saw the Durham Bulls catch a ball that was about to be a home run. The player jumped, hit the wall, and caught it. Elijah's dream is to do a wall catch. So he asks, \"Dad, can we go out in the yard and practice wall catches?\" He literally runs into the fence trying to catch the ball.\n\nI tell you this because I think I do the same thing in my spiritual life. I read Colossians, and in the passage we walked through last week, it gave this picture: \"Church, put to death what is of your old self, and put on these qualities of Christ.\" This is what it says in Colossians 3:12: \"Therefore, as God's chosen people, holy and dearly loved, clothe yourselves with compassion, kindness, humility, gentleness, and patience. Bear with each other, and forgive one another. If any of you has a grievance against someone, forgive as the Lord forgave you. And over all these virtues, put on love, which binds them all together in perfect unity.\"\n\nI hear that, and I'm like, \"Yeah, let's do a wall catch.\" What I'm communicating here is that sometimes when we think about what it looks like to grow into who we are in Jesus, we want to jump to the end of being Jesus. What's in front of us is the next step in that process—the next step in being transformed by Jesus.\n\nOne of the messages of Colossians throughout the scope of this book is grounded in Colossians chapter 2, verse 6, which says this: \"So then, just as you received Christ Jesus as Lord, continue to live your lives in him, rooted and built up in him, strengthened in the faith as you were taught and overflowing with thankfulness.\"\n\nIt's important for us, as we jump into the text we're going to look at this morning, to see that the Christian life is a walk. It is putting one foot in front of the other. The word Paul uses here in Colossians 2, verse 6—\"continue to live your lives in him\"—is the word \"walk in him.\" So just as you received Christ as the Lord of your life, take the next step of walking in him. Let your roots grow down into him. Let him transform and strengthen your faith and let it overflow with thankfulness. This is the picture of what the Christian life is.\n\nSo as we think about what it looks like to be transformed by the good news of Jesus—what that looks like in our lives to be clothed with these things—I want us to set our eyes on who Jesus is and who we are in him. That's what Colossians 3 told us: \"Since then, you have been raised with Christ. Set your hearts on things above where Christ is seated at the right hand of God.\" And then he says, \"You have died and your life is hidden with Christ in God.\" In other words, when you are in Christ, you are doing wall catches because Jesus is your life.\n\nThe process of realizing who we are in Christ, allowing that to take root in us—we described a few weeks ago what Christian maturity is. What does it look like to grow up into Jesus? We said this: it is realizing, it is growing into and letting it sink in the reality of Christ in you and you in Christ. When that happens, I think this is what we have a picture of in this passage beginning at verse 15.\n\nIt says this: \"Let the peace of Christ rule in your hearts, since as members of one body, you were called to peace.\" Paul is giving us a description here—clothe yourself in the wardrobe that's been provided to you in Christ. Then he tells us this: \"Let the peace of Christ rule in your hearts.\"\n\nIf you take inventory of what's in your heart this morning, maybe there are some anxieties about what's ahead this week. Maybe there's weightiness or burden from what happened the week before. Maybe there's stress about details, fears about your future, about your kids' future, about decisions that have to be made. The invitation of Jesus to you this morning is, \"Let the peace of Christ rule.\"\n\nThis word \"rule\"—it literally means to let it be the deciding factor in your heart. In other words, when you come to face a situation, what is the deciding factor of how you respond? For followers of Jesus, the deciding factor is to let the peace of Christ rule. It's not a peace that you produce. It is a peace that is purchased for you. Let the peace of Christ rule in your heart, since as members of one body, you were called to peace. And notice this word: \"And be thankful.\"\n\nWe're going to walk through these verses, and I'm going to highlight some big picture themes because this passage can be easy to get lost in the trees and lose sight of the forest. In verse 15, notice this word \"thankful.\" If I go to the next verse: \"Let the message of Christ dwell among you richly as you teach and admonish one another with all wisdom through psalms, hymns, and spiritual songs from the spirit, singing with gratitude in your hearts.\" So the first command here is \"let the peace of Christ rule,\" and notice he gives this tag on here: \"And be thankful.\" Next, he says, \"Let the message of Christ dwell among you richly.\" Then at the end of this, he says, \"With gratitude in your hearts.\"\n\nIf I go to the next verse, it says, \"And whatever you do, whether word or deed, do it all in the name of the Lord Jesus, giving thanks.\" This is something I want you to see. When you see something repeated in Scripture, we have to ask the question: \"What is the emphasis here?\" This is what I think Paul is saying. When the gospel starts to take root in our hearts and lives, gratitude will be the gauge. When the gospel starts to take root in your heart and mind, when the good news of who you are in Jesus isn't about what you accomplished for him or what you have done to fail him, but the good news of Jesus is that he is our\n\n# Sermon Transcript\n\nRighteousness. His life, his death is our death, our life. When that starts to sink in, our response is gratitude. I want us to see this theme throughout Paul's letters. Gratitude feels a bit like salt and pepper—he sprinkles it in everywhere. He gives a list of things to do and then says, \"And be thankful.\"\n\nNotice the key verse of Colossians, chapter 2, verse 6: \"Just as you received Christ as Lord, continue to live your lives in him, strengthened, rooted and built up in him, strengthened in the faith as you were taught.\" This is Paul's thesis—this is what you are to do. And then he says, \"And overflowing with thanksgiving.\" I want to hold this out to you: I don't think it's the overarching main idea of this passage, but I don't want us to miss it. Gratitude is the gauge of the gospel transforming your heart. When we start to see envy or dissatisfaction or frustration or the idolatry of \"if I just had this,\" we're missing something. Gratitude is the response of \"I have everything I need, and I'm thankful.\" As we think about the gospel transforming us, gratitude is the gauge of gospel transformation.\n\nIn verses 15 through 17, Paul holds this out to us: The peace of Christ has to rule in our lives. The presence of Christ—which is the message of Christ, the word of Christ—is what we see in John chapter 1: \"The word became flesh and dwelt among us.\" When Paul says, \"Let the word of Christ dwell in you,\" it's a picture of Jesus saturating your life. The word means to abide or reside. So the picture is the peace of Christ becoming the overarching reign of our lives. The word of Christ, the presence of who Jesus is, becomes the saturating presence of Jesus in our lives. How does that happen? It happens in community.\n\nWe have five core values as a church. First, we celebrate the image of God in every person. Second, we grow by prioritizing gospel community. What does that look like? When Paul said earlier, \"Clothe yourselves as holy and beloved children of God,\" the qualities he lists—compassion, kindness, humility, gentleness, and patience—are qualities that require relationships. Do you need these when you're sitting by yourself? No. You need them when you're in gospel community. Gospel community is a community that has as its foundation not that we like the same things or look the same way or come from the same place or talk the same way, but that we believe Jesus changes everything. When that becomes the core of what brings us together, you better believe we need to clothe ourselves with compassion, patience, kindness, and humility. The person sitting next to you is a sinner in need of Jesus's transformation, just like we are. When we have people in our lives who are broken, just like we are, Jesus wants to produce in us the qualities of Jesus through gospel community.\n\nThis is how we grow: we let Christ saturate our lives. For Christ to saturate your life, to dwell in you, there has to be some friction—some ways in which you need Jesus to produce kindness, gentleness, and patience. That is in some ways an encouragement to me this morning. When I take inventory of my heart and ask, \"Is the peace of Christ reigning in my heart?\" I have to answer honestly: sometimes frustration is reigning. Sometimes impatience with my kids is reigning. Sometimes lack of compassion for my spouse when we're disagreeing is reigning. Here's the progression of this passage: when the peace of Christ reigns and the presence of Christ begins to dwell in us, to saturate our lives, we start to live life differently.\n\nVerse 17 says, \"Whatever you do, whatever.\" Consider how retailers try to rope us in with deals. They say, \"If you purchase this, you get a hundred dollars in store credit, good for anything.\" But then they add, \"Exclusions apply.\" You have in your mind a hundred dollars to spend on anything, but the moment you take something to the register, it's one of the exclusions. We do this with Jesus. We say, \"Jesus, we want you to reign in our lives, but I got this area of my life that I'm not sure is included in the deal.\" What Paul wants us to see is that when Christ reigns in our lives, there's nothing off limits to his gospel transforming. There is no relationship beyond what the reign of Christ wants to reach.\n\nYou're probably wondering, \"Peter, when are you going to get to those verses about husbands and wives and slaves and masters?\" Before we get there, I want us to see what Paul is showing us: when Christ reigns in our lives, there's no relationship beyond the reach of the gospel. When his presence saturates our lives, when we start to live with a new purpose—\"Do it all in the name of the Lord Jesus, giving thanks to God the Father through him\"—everything changes. When your life is saturated with the peace and presence of Jesus, your life will be driven to make Jesus first in everything. But what about when the rubber meets the road of my everyday relationships? That's exactly where Paul goes. He addresses the everyday relationship of wives and husbands.\n\nNotice this: \"Wives, submit yourselves to your husbands, as is fitting in the Lord.\" He's showing us how the gospel, the reign of Jesus, transforms the home relationship of husbands and wives—grounded in a relationship to Jesus. Then he addresses children: \"Children, obey your parents in everything, for this pleases the Lord. Fathers, do not embitter your children, or they will become discouraged.\" This relationship is grounded in what it looks like in light of Jesus being Lord of your life. Then he addresses slaves and masters: \"Slaves, obey your earthly masters in everything and do it not only when their eye is on you to curry their favor, but with sincerity of heart and reverence for the Lord.\"\n\nI'll say this now: Paul is speaking into the cultural situation of his day. The Bible never condones slavery. In fact, these very verses, if we follow the flow of thought, confront slavery and systems of oppression. As we look at the cultural context of first-century slavery, I think the best application for us today is to recognize that we impose our American tragic history of slavery into the biblical text. The first-century slavery-master relationship is something the gospel speaks into and starts to transform as we see the story of the church unfold. But don't miss what Paul is doing: he is communicating that there is no part of society that the gospel does not reach into and want to transform. As we look at our past, not only in America but throughout history and cultures, the gospel confronts oppression.\n\nNotice what he says next: \"Whatever you do, work at it with all your heart as working for the Lord, not for human masters, since you know that you will receive an inheritance from the Lord as a reward. It is the Lord Christ you are serving. Anyone who does wrong will be repaid for their wrongdoing, and there is no favoritism. Masters, provide your slaves with what is right and fair, because you know that you have a master in heaven.\" In every one of these verses, Paul makes a connection between how our earthly relationships play out and our relationship with Jesus as the Lord of our lives.\n\nThere is no relationship that the reign of Christ does not reach. There is no place in your life that the gospel does not transform. This is what Paul is holding out to us when he says, \"Whatever you do, in word or deed, do it all in the name of the Lord Jesus, giving thanks to God the Father through him.\" Going back to the Kohl's frustration: there is no exclusion to where the gospel of Christ wants to transform in your life. The invitation here is this: if you want the peace of Christ to reign in your life, if you want to experience the peace of Christ as it is offered to you—not as it is earned, for we don't earn the peace of Christ—you must let it reign in every aspect of your lives. It is ours in Christ Jesus through faith in his life-giving work through his death and resurrection.\n\nThe question this prompts us to ask this morning is: where in my own heart am I holding back? Where is there a relationship where I'm like, \"Yeah,
