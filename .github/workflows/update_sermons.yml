name: Update Sermon Archive

on:
  schedule:
    # Hourly, off the top of the hour: GitHub delays or drops many ':00' runs.
    - cron: '23 * * * *'
  workflow_run:           # right after an upload (captions may take an hour or two;
    workflows: ["Upload Sermons to YouTube"]   # the hourly run picks them up then)
    types: [completed]
  workflow_dispatch:      # Also allows manual run from GitHub Actions tab

permissions:
  contents: write  # Needed to commit index.html and sermons.json

concurrency:              # the upload trigger and the hourly run must not overlap
  group: update-sermons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build sermon archive
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_YOUTUBE_REFRESH_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_REFRESH_TOKEN }}
          CHANNEL_ID: UCu5frCUoNL0rOGCAClqHBFA
        run: python build_site.py

      - name: Create Drive docs for new sermons
        if: hashFiles('new_sermons.json') != ''
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python create_drive_docs.py

      - name: Write YouTube descriptions from transcripts
        # Replaces the plain planning-doc description written at upload time with
        # one based on what the sermon actually says. Updates the snippet only,
        # so a private draft stays private.
        if: hashFiles('new_sermons.json') != ''
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_YOUTUBE_REFRESH_TOKEN: ${{ secrets.GOOGLE_YOUTUBE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python enrich_descriptions.py

      - name: Commit updated site
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html sermons.json private_sermons.json
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "Update sermon archive $(date +'%Y-%m-%d')" &&
            git push
          )
